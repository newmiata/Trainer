права — це основоположні керівні положення, які визначають зміст адміністративно-правового регулювання, діяльність публічної адміністрації та захист прав приватних осіб.</p>\n<p><strong>Основні ознаки принципів:</strong></p>\n<ul>\n<li><p>спрямовані на забезпечення прав і свобод людини;</p></li>\n<li><p>визначають основні правила діяльності публічної адміністрації;</p></li>\n<li><p>забезпечують нормальне функціонування держави та суспільства;</p></li>\n<li><p>визначають напрямки розвитку адміністративного права;</p></li>\n<li><p>мають загальний, стабільний і керівний характер.</p></li>\n</ul>\n<p>Значення принципів: вони є основою для створення законодавства, застосовуються органами влади під час здійснення повноважень, судами під час вирішення спорів та приватними особами для захисту своїх прав.</p>\n<p><strong>Фундаментальні концепції адміністративного права</strong></p>\n<p>1. Концепція верховенства права — діяльність держави обмежена правом, а органи влади повинні діяти законно, обґрунтовано, без свавілля та з дотриманням прав людини.</p>\n<p>2. Концепція належного адміністрування (Good Administration) — публічна адміністрація повинна діяти законно, справедливо, неупереджено, прозоро, ефективно та в розумні строки.</p>\n<p>3. Концепція людиноцентризму — людина, її права, свободи та законні інтереси перебувають у центрі діяльності публічної адміністрації.</p>\n<p>4. Концепція європеїзації адміністративного права — перехід від традиційної владно-управлінської моделі до сучасної правозахисної моделі, орієнтованої на європейські стандарти публічного адміністрування.</p>\n<p>Концепції можна поділити на ті, що впливають на всі галузі права (наприклад, верховенство права), та ті, що насамперед визначають розвиток адміністративного права (наприклад, належне адміністрування).</p>\n<p><strong>Класифікація принципів адміністративного права</strong></p>\n<p>1. Залежно від сфери використання:</p>\n<ul>\n<li><p>Загальноправові — діють у всіх галузях права (законність).</p></li>\n<li><p>Галузеві — характерні для адміністративного права (захист особи від неправомірних дій адміністрації).</p></li>\n<li><p>Підгалузеві та інституційні — стосуються окремих інститутів (право бути вислуханим в адміністративній процедурі).</p></li>\n</ul>\n<p>2. Залежно від джерела закріплення:</p>\n<ul>\n<li><p>Доктринальні — сформовані наукою, але формально не закріплені в законодавстві (субсидіарність).</p></li>\n<li><p>Конституційні — закріплені в Конституції України (рівність, заборона дискримінації).</p></li>\n<li><p>Законодавчі — закріплені в законах (професіоналізм державної служби).</p></li>\n</ul>\n<p>3. Залежно від виду адміністративно-правових норм:</p>\n<ul>\n<li><p>Організаційні — визначають побудову та взаємодію органів публічної адміністрації.</p></li>\n<li><p>Матеріальні — визначають права й обов’язки суб’єктів.</p></li>\n<li><p>Процедурні — визначають порядок реалізації прав та обов’язків.</p></li>\n</ul>\n<p><strong>Розмежування принципів</strong></p>\n<ul>\n<li><p>Принципи адміністративного права — визначають загальні засади всієї сфери публічного адміністрування.</p></li>\n<li><p>Принципи адміністративної процедури — визначають порядок розгляду адміністративних справ адміністративними органами.</p></li>\n<li><p>Принципи адміністративного судочинства — визначають засади діяльності адміністративних судів та учасників судового процесу.</p></li>\n</ul>\n<p>Стаття 4 Закону України «Про адміністративну процедуру» закріплює 13 принципів, зокрема: верховенство права, рівність перед законом, обґрунтованість, безсторонність, добросовісність, пропорційність, відкритість, своєчасність і розумний строк, ефективність, презумпцію правомірності дій та вимог особи, офіційність, гарантування права особи на участь в адміністративному провадженні та ефективний засіб правового захисту.</p>"}, {"n": 8, "t": "Основоположні для адміністративного права концепції rule of law (верховенства права, правовладдя) і rechtsstaat (правової, правної держави)", "h": "<p>Верховенство права (Rule of Law) та правова держава (Rechtsstaat) — це фундаментальні концепції, які визначають межі діяльності публічної влади, забезпечують захист прав людини та не допускають свавільного використання владних повноважень.</p>\n<p>Їхня спільна ідея полягає в тому, що держава не стоїть над правом, а сама зобов’язана діяти відповідно до нього.</p>\n<p>- Верховенство права (Rule of Law) — англо-американська та загальноєвропейська концепція, за якою всі суб’єкти, включно з державою, підпорядковані праву. Вона охоплює законність, юридичну визначеність, заборону свавілля, рівність перед законом, захист прав людини та доступ до правосуддя. Закріплена у ст. 8 Конституції України. КСУ визначає верховенство права як панування права в суспільстві.</p>\n<p>- Правова держава (Rechtsstaat) — континентально-європейська, зокрема німецька, концепція, відповідно до якої держава повинна бути організована та діяти на основі права. Її основними складовими є поділ влади, законність, гарантованість прав людини, юридична визначеність та судовий контроль. Закріплена у ст. 1 Конституції України, яка проголошує Україну правовою державою.</p>\n<p>Значення для адміністративного права:</p>\n<p>Стаття 19 Конституції України встановлює, що органи державної влади та місцевого самоврядування повинні діяти лише на підставі, у межах повноважень та у спосіб, визначені Конституцією і законами України.</p>\n<p>Особливе значення має Закон України «Про адміністративну процедуру», ст. 4 якого закріплює 13 принципів адміністративної процедури, зокрема законність, юридичну визначеність, рівність, обґрунтованість, безсторонність, добросовісність, пропорційність, відкритість, своєчасність та право особи на участь у провадженні.</p>\n<p>Окремо слід розуміти дискреційні повноваження — це право адміністративного органу в установлених законом межах обирати один із декількох правомірних варіантів рішення. Дискреція не означає свавілля: рішення повинно бути законним, обґрунтованим і пропорційним.</p>"}, {"n": 9, "t": "Концепція доброго адміністрування (good administration) та її елементи.", "h": "<p><strong>Належне адміністрування (Good Administration)</strong> — це концепція, відповідно до якої адміністративні органи повинні здійснювати свої повноваження законно, справедливо, неупереджено, прозоро, своєчасно, ефективно та з повагою до прав і законних інтересів людини.</p>\n<p>Її головна ідея полягає в тому, що недостатньо просто формально виконувати закон — необхідно робити це якісно, добросовісно, обґрунтовано та з орієнтацією на людину.</p>\n<p><strong>Основні вимоги належного адміністрування:</strong></p>\n<ul>\n<li><p>законність та правова визначеність;</p></li>\n<li><p>рівність і неупередженість;</p></li>\n<li><p>добросовісність та обґрунтованість;</p></li>\n<li><p>пропорційність;</p></li>\n<li><p>прозорість і відкритість;</p></li>\n<li><p>своєчасність та дотримання розумних строків;</p></li>\n<li><p>ефективність діяльності;</p></li>\n<li><p>повага до прав людини та можливість особи бути почутою.</p></li>\n</ul>\n<p><strong>Правове забезпечення концепції:</strong></p>\n<p>1. <strong>Рекомендація CM/Rec(2007)7 Комітету Міністрів Ради Європи</strong> «Про належне адміністрування» — один із основних міжнародних документів, який визначає стандарти належної діяльності адміністративних органів.</p>\n<p>2. <strong>Угода про асоціацію між Україною та ЄС</strong>, ст. 3, закріплює добре врядування та верховенство права як важливі принципи співробітництва.</p>\n<p>3. <strong>Конституція України</strong> — зокрема статті 1, 3, 8, 19, 24, 40, 55, які закріплюють правову державу, права людини, законність діяльності влади, рівність, право на звернення та судовий захист.</p>\n<p>4. <strong>Закон України «Про адміністративну процедуру»</strong> — закріплює конкретні принципи та процедурні гарантії належного адміністрування у діяльності адміністративних органів.</p>\n<p><strong>Співвідношення належного врядування та належного адміністрування:</strong></p>\n<ul>\n<li><p><strong>Належне врядування (Good Governance)</strong> — ширше поняття, яке стосується загальної організації та здійснення публічної влади, взаємодії держави, суспільства й громадян.</p></li>\n<li><p><strong>Належне адміністрування (Good Administration)</strong> — вужче поняття, яке стосується безпосередньої діяльності адміністративних органів, насамперед у відносинах із приватними особами.</p></li>\n</ul>"}, {"n": 10, "t": "Класифікації принципів адміністративного права", "h": "<p><strong>Принципи адміністративного права</strong> — це основоположні положення, які визначають зміст, спрямованість і межі публічного адміністрування, порядок взаємодії адміністративних органів із приватними особами та гарантії захисту прав людини.</p>\n<p>Їхнє основне призначення — забезпечити законну діяльність публічної адміністрації, захист прав людини та запобігти свавільному використанню владних повноважень.</p>\n<p>Єдиного переліку класифікацій немає. Основні класифікації:</p>\n<p><strong>1. За сферою застосування:</strong></p>\n<ul>\n<li><p><strong>Загальноправові</strong> — діють у всіх галузях права: верховенство права, законність, рівність, справедливість.</p></li>\n<li><p><strong>Міжгалузеві</strong> — застосовуються в декількох галузях, особливо публічного права: пропорційність, відкритість, доступ до правосуддя.</p></li>\n<li><p><strong>Галузеві</strong> — характерні саме для адміністративного права: пріоритет прав людини, належне адміністрування, відповідальність адміністративних органів.</p></li>\n</ul>\n<p><strong>2. За формою вираження:</strong></p>\n<ul>\n<li><p><strong>Нормативно-правові</strong> — закріплені в Конституції та законах України.</p></li>\n<li><p><strong>Доктринальні</strong> — сформовані юридичною наукою, судовою практикою та правовими позиціями, але не обов’язково прямо закріплені в законодавстві.</p></li>\n</ul>\n<p><strong>3. За функціональним призначенням:</strong></p>\n<ul>\n<li><p><strong>Організаційні</strong> — визначають побудову та функціонування публічної адміністрації.</p></li>\n<li><p><strong>Матеріальні</strong> — визначають зміст рішень адміністрації та межі її втручання у права особи.</p></li>\n<li><p><strong>Процедурні</strong> — визначають порядок розгляду адміністративних справ і прийняття рішень.</p></li>\n</ul>\n<p>Важливе нормативне значення має ст. 4 Закону України «Про адміністративну процедуру», яка закріплює 13 принципів адміністративної процедури, зокрема верховенство права, рівність, обґрунтованість, безсторонність, пропорційність, відкритість, своєчасність, ефективність, право особи на участь та ефективний правовий захи</p>"}, {"n": 11, "t": "Організаційні принципи (принципи побудови публічної адміністрації)", "h": "<p>Організаційні принципи — це основоположні засади, які визначають побудову, структуру, взаємодію та функціонування системи публічної адміністрації.</p>\n<p>Вони відповідають на питання: як має бути побудована публічна адміністрація, як розподіляються повноваження та взаємодіють органи?</p>\n<p>Основні організаційні принципи:</p>\n<p>- Ієрархічності (субординації) — передбачає систему підпорядкування, підзвітності та контролю між органами різних рівнів. Наприклад, нижчі органи виконавчої влади підпорядковуються вищим.</p>\n<p>- Розмежування політики та адміністрування — одні органи формують державну політику, а інші забезпечують її практичну реалізацію. Наприклад, міністерства переважно формують політику, а служби та інспекції здійснюють відповідне адміністрування.</p>\n<p>- Деконцентрації — передбачає передачу частини повноважень від центральних органів їхнім територіальним підрозділам для ефективнішого управління на місцях.</p>\n<p>- Децентралізації — передбачає розподіл повноважень між різними рівнями публічної влади, зокрема передачу частини повноважень від держави органам місцевого самоврядування.</p>\n<p>- Субсидіарності — означає, що публічні завдання повинні виконуватися на найближчому до людини рівні влади, який здатний ефективно їх реалізувати.</p>"}, {"n": 12, "t": "Матеріальні принципи (принципи відносин між публічною адміністрацією та приватними особами)", "h": "<p>Матеріальні принципи — це основоположні засади, які визначають зміст владних рішень адміністративних органів та допустимі межі їхнього втручання у права, свободи й законні інтереси приватних осіб.</p>\n<p>Вони відповідають на питання: яким має бути рішення адміністративного органу та наскільки допустиме втручання держави у права людини?</p>\n<p>Основні матеріальні принципи:</p>\n<p>- Законності — адміністративний орган діє виключно на підставі, у межах повноважень та у спосіб, визначені законом.</p>\n<p>- Відповідності законній меті — владні повноваження повинні використовуватися лише для тієї мети, заради якої вони були надані.</p>\n<p>- Рівності — особи в однакових юридично значущих обставинах повинні мати рівне ставлення з боку адміністрації, без дискримінації.</p>\n<p>- Об’єктивності та безсторонності — рішення повинні ґрунтуватися на фактичних обставинах справи, без особистої зацікавленості чи упередженості посадових осіб.</p>\n<p>- Пропорційності — втручання у права людини повинно бути необхідним і співмірним із метою, якої прагне досягти адміністрація.</p>\n<p>- Юридичної визначеності — правові норми та рішення повинні бути чіткими, передбачуваними й послідовними.</p>\n<p>- Поваги до приватності та захисту персональних даних — адміністрація повинна забезпечувати належний захист особистої інформації.</p>\n<p>- Прозорості — діяльність адміністративних органів має бути відкритою, а особи повинні мати доступ до інформації про їхню діяльність та рішення.</p>\n<p>- Відповідальності держави за завдану шкоду — особа має право на відшкодування шкоди, заподіяної незаконними рішеннями, діями чи бездіяльністю органів влади.</p>\n<p>Отже, матеріальні принципи встановлюють межі владного впливу адміністрації та забезпечують баланс між публічним інтересом і правами людини.</p>"}, {"n": 13, "t": "Процедурні принципи (принципи, яких визначають порядок прийняття рішень та вчинення дій публічною адміністрацією)", "h": "<p>Процедурні принципи — це основоположні засади, які визначають порядок, послідовність і спосіб розгляду адміністративних справ, прийняття адміністративних актів та участі приватних осіб у процедурі.</p>\n<p>Вони відповідають на питання: як саме адміністративний орган повинен розглядати справу та приймати рішення?</p>\n<p>Відповідно до Закону України «Про адміністративну процедуру», адміністративна процедура — це визначений законом порядок розгляду та вирішення адміністративної справи.</p>\n<p>Основні процедурні принципи:</p>\n<p>- Доступності публічної адміністрації — особа повинна мати можливість звернутися до адміністративного органу, отримати необхідну інформацію та реалізувати свої права.</p>\n<p>- Участі особи в адміністративному провадженні — особі повинна бути надана можливість висловити свою позицію до прийняття рішення, яке впливає на її права чи інтереси (право бути почутою).</p>\n<p>- Права на представництво — особа може користуватися допомогою представника, зокрема адвоката.</p>\n<p>- Розумного строку — адміністративна справа повинна розглядатися без невиправданих затримок.</p>\n<p>- Справедливості та виправданості плати — плата за адміністративну послугу не повинна бути надмірною.</p>\n<p>- Простоти та зрозумілості рішення — адміністративний акт повинен бути викладений чітко й доступно для особи.</p>\n<p>- Обґрунтованості рішення — орган повинен врахувати обставини справи та пояснити підстави прийнятого рішення.</p>\n<p>- Повідомлення про рішення — особа повинна бути належним чином поінформована про прийняте рішення та його зміст.</p>\n<p>- Належного виконання адміністративних рішень — адміністративний орган повинен забезпечити виконання власних рішень.</p>\n<p>- Обмеження зміни та скасування рішень — зміна або скасування адміністративного акта повинні враховувати законність, публічний інтерес і права особи.</p>\n<p>- Права на адміністративне та судове оскарження — особа повинна мати можливість захистити свої права від неправомірних рішень, дій чи бездіяльності адміністрації.</p>\n<p>Послідовність адміністративного провадження:</p>\n<p>Початок провадження.</p>\n<p>Повідомлення та залучення заінтересованої особи.</p>\n<p>Встановлення обставин справи та дослідження доказів.</p>\n<p>Оцінка обставин.</p>\n<p>Прийняття та обґрунтування адміністративного рішення.</p>\n<p>Повідомлення особи про рішення.</p>\n<p>Можливість його оскарження.</p>\n<p>Отже, процедурні принципи гарантують справедливий і зрозумілий порядок діяльності адміністративних органів, забезпечують участь особи в розгляді її справи та захищають її від необґрунтованих рішень.</p>"}, {"n": 14, "t": "Поняття джерел адміністративного права та їх класифікація", "h": "<p><strong>Джерела адміністративного права</strong> — це зовнішні форми закріплення адміністративно-правових норм, які регулюють відносини у сфері публічного управління.</p>\n<p><strong>Основні ознаки:</strong></p>\n<ul>\n<li><p>нормативність — містять загальні правила поведінки;</p></li>\n<li><p>загальнообов’язковість — обов’язкові для виконання;</p></li>\n<li><p>офіційність — приймаються компетентними суб’єктами;</p></li>\n<li><p>формальна визначеність — мають установлену юридичну форму;</p></li>\n<li><p>юридична сила — займають певне місце в правовій ієрархії.</p></li>\n</ul>\n<p><strong>Класифікація джерел:</strong></p>\n<ol>\n<li><p>Національні — Конституція України, закони, підзаконні акти.</p></li>\n<li><p>Міжнародні — міжнародні договори, акти Ради Європи та ЄС.</p></li>\n<li><p>Судові — рішення Конституційного Суду, Верховного Суду та практика ЄСПЛ.</p></li>\n</ol>\n<p>Основним джерелом адміністративного права в Україні є нормативно-правовий акт.</p>"}, {"n": 15, "t": "Конституція України у системі джерел адміністративного права", "h": "<p><strong>Конституція України</strong> — Основний Закон держави, який має найвищу юридичну силу та є основою адміністративного права.</p>\n<p>Її значення полягає в тому, що вона:</p>\n<ul>\n<li><p>закріплює права, свободи та обов’язки людини;</p></li>\n<li><p>визначає систему й повноваження органів публічної влади;</p></li>\n<li><p>встановлює основи діяльності виконавчої влади;</p></li>\n<li><p>визначає принципи законності та верховенства права.</p></li>\n</ul>\n<p><strong>Основні статті:</strong></p>\n<ul>\n<li><p>Ст. 3 — людина, її життя, здоров’я, честь і гідність є найвищою соціальною цінністю.</p></li>\n<li><p>Ст. 8 — принцип верховенства права.</p></li>\n<li><p>Ст. 19 — органи влади повинні діяти лише на підставі, у межах повноважень та у спосіб, визначені Конституцією і законами.</p></li>\n<li><p>Ст. 9 — міжнародні договори є частиною національного законодавства України.</p></li>\n</ul>\n<p>Отже, усі нормативно-правові акти повинні відповідати Конституції України.</p>"}, {"n": 16, "t": "Міжнародні договори України, акти Ради Європи та Європейського Союзу як джерела адміністративного права", "h": "<p><strong>Міжнародні договори</strong> — це угоди України з іншими державами або міжнародними організаціями, які встановлюють правила регулювання суспільних відносин.</p>\n<p>Відповідно до ст. 9 Конституції України, чинні міжнародні договори, згода на обов’язковість яких надана Верховною Радою, є частиною національного законодавства.</p>\n<p><strong>Основні міжнародні джерела:</strong></p>\n<ul>\n<li><p>Конвенція про захист прав людини і основоположних свобод 1950 року.</p></li>\n<li><p>Європейська хартія місцевого самоврядування.</p></li>\n<li><p>Міжнародні договори щодо боротьби з корупцією, міграції та захисту прав людини.</p></li>\n</ul>\n<p><strong>Рада Європи</strong> займається захистом прав людини, демократії та верховенства права. Особливе значення має практика ЄСПЛ.</p>\n<p><strong>Європейський Союз</strong> впливає на українське законодавство через процес європейської інтеграції та адаптації законодавства.</p>\n<p>До актів права ЄС належать:</p>\n<ul>\n<li><p>регламенти;</p></li>\n<li><p>директиви;</p></li>\n<li><p>рішення.</p></li>\n</ul>\n<p>Важливо: акти ЄС не діють в Україні автоматично, але Україна зобов’язується наближати до них своє законодавство.</p>"}, {"n": 17, "t": "Закони України у системі джерел адміністративного права. Кодифіковані акти як регулятори адміністративно-правових відносин", "h": "<p><strong>Закон</strong> — це нормативно-правовий акт, прийнятий Верховною Радою України, який регулює найважливіші суспільні відносини та має вищу юридичну силу порівняно з підзаконними актами.</p>\n<p><strong>Основні ознаки законів:</strong></p>\n<ul>\n<li><p>приймаються Верховною Радою України;</p></li>\n<li><p>мають високу юридичну силу;</p></li>\n<li><p>є загальнообов’язковими;</p></li>\n<li><p>встановлюють правила поведінки;</p></li>\n<li><p>підзаконні акти повинні їм відповідати.</p></li>\n</ul>\n<p><strong>Приклади законів:</strong></p>\n<ul>\n<li><p>«Про Кабінет Міністрів України»;</p></li>\n<li><p>«Про місцеве самоврядування в Україні»;</p></li>\n<li><p>«Про адміністративну процедуру»;</p></li>\n<li><p>«Про місцеві державні адміністрації».</p></li>\n</ul>\n<p><strong>Кодифікація</strong> — це систематизація та об’єднання правових норм в один нормативно-правовий акт — кодекс.</p>\n<p>Основні кодифіковані акти адміністративного права:</p>\n<ol>\n<li><p><strong>КУпАП</strong> — регулює питання адміністративних правопорушень і відповідальності.</p></li>\n<li><p><strong>КАС України</strong> — визначає порядок розгляду адміністративних справ у судах.</p></li>\n</ol>\n<p>Єдиного Кодексу адміністративного права України не існує.</p>"}, {"n": 18, "t": "Підзаконні нормативні акти як джерела адміністративного права", "h": "<p><strong>Підзаконний нормативно-правовий акт</strong> — це акт компетентного органу влади, який приймається на основі та на виконання закону.</p>\n<p>Він має нижчу юридичну силу, ніж закон, і не може йому суперечити.</p>\n<p><strong>Основні види підзаконних актів:</strong></p>\n<ol>\n<li><p>Укази та розпорядження Президента України.</p></li>\n<li><p>Постанови та розпорядження Кабінету Міністрів України.</p></li>\n<li><p>Накази, інструкції та положення міністерств.</p></li>\n<li><p>Розпорядження місцевих державних адміністрацій.</p></li>\n<li><p>Рішення органів місцевого самоврядування.</p></li>\n</ol>\n<p><strong>Основне призначення:</strong> конкретизувати закони, визначати порядок їх виконання та забезпечувати практичну діяльність органів публічної влади.</p>\n<p>Головна вимога — підзаконні акти повинні відповідати Конституції та законам України.</p>"}, {"n": 19, "t": "Судові рішення у системі джерел адміністративного права: акти Конституційного Суду, Верховного Суду, адміністративних судів. Практика ЄСПЛ як джерело адміністративного права", "h": "<p>Судові рішення мають важливе значення для адміністративного права, оскільки забезпечують правильне застосування законодавства, захист прав людини та контроль за діяльністю органів влади.</p>\n<p>Основні види судових рішень:</p>\n<p>1. Рішення Конституційного Суду України — визначають відповідність законів Конституції. Рішення є обов’язковими. Акти або їх положення, визнані неконституційними, втрачають чинність.</p>\n<p>2. Рішення Верховного Суду — містять правові висновки щодо застосування норм права та забезпечують єдність судової практики.</p>\n<p>3. Рішення адміністративних судів — захищають права осіб від незаконних рішень, дій чи бездіяльності органів влади.</p>\n<p>4. Практика ЄСПЛ — застосовується українськими судами як джерело права відповідно до ст. 17 Закону України «Про виконання рішень та застосування практики Європейського суду з прав людини».</p>\n<p>Значення практики ЄСПЛ:</p>\n<p>захист прав і свобод людини;</p>\n<p>забезпечення справедливого судочинства;</p>\n<p>контроль за дотриманням державою Конвенції;</p>\n<p>формування європейських стандартів діяльності публічної адміністрації.</p>"}, {"n": 20, "t": "Вплив адміністративно-територіального устрою на організацію публічної адміністрації", "h": "<p>Адміністративно-територіальний устрій — це поділ території держави на адміністративно-територіальні одиниці для організації державної влади та місцевого самоврядування.</p>\n<p>В Україні його основи визначені статтями 132–133 Конституції України. До системи адміністративно-територіального устрою належать АР Крим, області, райони, міста, райони в містах, селища та села.</p>\n<p>Вплив на публічну адміністрацію:</p>\n<p>визначає територіальні межі діяльності органів влади;</p>\n<p>розмежовує повноваження між державними органами та місцевим самоврядуванням;</p>\n<p>визначає рівні управління: громада, район, область;</p>\n<p>впливає на формування місцевих бюджетів;</p>\n<p>забезпечує організацію та доступність публічних послуг.</p>\n<p>Важливе значення мають два принципи:</p>\n<p>Децентралізація — передача повноважень і ресурсів від держави до місцевого самоврядування.</p>\n<p>Субсидіарність — вирішення питань на найближчому до громадянина рівні, де це можливо ефективно.</p>\n<p>Отже, адміністративно-територіальний устрій є основою організації публічної влади та ефективного управління територіями.</p>\n<p>21. Децентралізація як основний принцип удосконалення адміністративно-територіального устрою в Україні. Реалізація інших організаційних принципів</p>\n<p>Децентралізація — це передача частини повноважень, відповідальності та ресурсів від центральної влади до органів місцевого самоврядування.</p>\n<p>Основою реформи стало розпорядження Кабінету Міністрів України від 1 квітня 2014 року № 333-р, яким затверджено Концепцію реформування місцевого самоврядування.</p>\n<p>Основні результати децентралізації:</p>\n<p>створено 1469 територіальних громад;</p>\n<p>замість 490 районів утворено 136;</p>\n<p>розширено повноваження місцевого самоврядування;</p>\n<p>посилено фінансову самостійність громад;</p>\n<p>покращено умови надання публічних послуг.</p>\n<p>Інші організаційні принципи:</p>\n<p>Субсидіарність — вирішення питань на найближчому до населення рівні.</p>\n<p>Деконцентрація — передача повноважень від центральних органів виконавчої влади їх територіальним органам.</p>\n<p>Самостійність — право громад самостійно вирішувати питання місцевого значення.</p>\n<p>Фінансова забезпеченість — відповідність ресурсів покладеним повноваженням.</p>\n<p>Єдність держави — збереження територіальної цілісності та єдиного правового простору.</p>\n<p>Демократичність — участь населення в управлінні місцевими справами.</p>\n<p>Отже, децентралізація спрямована на посилення громад, підвищення ефективності управління та наближення влади до населення.</p>\n<p>22. Зміни адміністративно-територіального устрою у 2014–2021 рр. та їх правове забезпечення</p>\n<p>У 2014–2021 роках в Україні відбулася масштабна реформа децентралізації, метою якої було створення спроможних територіальних громад, покращення публічних послуг та оптимізація системи управління.</p>\n<p>Основні етапи реформи:</p>\n<p>1. 2014 рік — затверджено Концепцію реформування місцевого самоврядування та територіальної організації влади (розпорядження КМУ № 333-р).</p>\n<p>2. 2014 рік — прийнято Закон «Про співробітництво територіальних громад», який дозволив громадам спільно реалізовувати повноваження.</p>\n<p>3. 2015 рік — прийнято Закон «Про добровільне об’єднання територіальних громад», який створив механізм формування об’єднаних громад.</p>\n<p>4. 2015–2019 роки — відбувалося добровільне об’єднання громад та зміцнення їх фінансової спроможності.</p>\n<p>5. 2020 рік — сформовано 1469 територіальних громад, які охопили територію України.</p>\n<p>6. 17 липня 2020 року — постановою Верховної Ради № 807-IX замість 490 районів утворено 136 нових районів.</p>\n<p>7. 2020–2021 роки — проведено місцеві вибори на новій територіальній основі та розпочато функціонування оновленої системи управління.</p>\n<p>Основні результати реформи:</p>\n<p>укрупнення територіальних громад і районів;</p>\n<p>передача повноважень на місцевий рівень;</p>\n<p>посилення фінансової самостійності громад;</p>\n<p>покращення доступності адміністративних послуг;</p>\n<p>удосконалення територіальної організації влади.</p>\n<p>Отже, реформа 2014–2021 років змінила територіальну основу місцевого самоврядування та посилила роль територіальних громад.</p>\n<p>23. Закон України «Про порядок вирішення окремих питань адміністративно-територіального устрою України»: загальна характеристика</p>\n<p>Закон України «Про порядок вирішення окремих питань адміністративно-територіального устрою України» № 3285-IX прийнятий 28 липня 2023 року та набрав чинності 26 січня 2024 року.</p>\n<p>Мета закону — встановити сучасний порядок утворення, ліквідації та зміни меж адміністративно-територіальних одиниць і населених пунктів.</p>\n<p>Основні положення закону:</p>\n<p>1. Визначає три категорії населених пунктів:</p>\n<p>місто — від 10 тисяч жителів;</p>\n<p>селище — від 5 тисяч жителів;</p>\n<p>село — менше 5 тисяч жителів.</p>\n<p>2. Скасовує категорію «селище міського типу».</p>\n<p>3. Визначає порядок утворення та ліквідації населених пунктів.</p>\n<p>4. Встановлює порядок зміни меж адміністративно-територіальних одиниць.</p>\n<p>5. Розмежовує повноваження органів влади:</p>\n<p>Верховна Рада України — утворення та ліквідація районів;</p>\n<p>Кабінет Міністрів України — вирішення визначених законом питань щодо населених пунктів;</p>\n<p>місцеві ради — вирішення питань у межах їхньої компетенції.</p>\n<p>6. Передбачає громадське обговорення відповідних територіальних змін, загальний строк якого становить не менше 30 календарних днів.</p>\n<p>7. Запроваджує ведення Кодифікатора адміністративно-територіальних одиниць та територій територіальних громад.</p>\n<p>Значення закону:</p>\n<p>усуває застаріле законодавче регулювання;</p>\n<p>встановлює єдині процедури територіальних змін;</p>\n<p>забезпечує впорядкування адміністративно-територіального устрою;</p>\n<p>сприяє ефективній організації місцевого самоврядування.</p>\n<p>Отже, Закон № 3285-IX є основним спеціальним актом, який регулює порядок вирішення питань адміністративно-територіального устрою України.</p>"}, {"n": 21, "t": "Децентралізація як основний принцип удосконалення адміністративно-територіального устрою в Україні. Реалізація інших організаційних принципів на сучасному етапі", "h": "<p><strong>Децентралізація</strong> — це передача частини повноважень, відповідальності та ресурсів від центральної влади до органів місцевого самоврядування.</p>\n<p>Основою реформи стало розпорядження Кабінету Міністрів України від 1 квітня 2014 року № 333-р, яким затверджено Концепцію реформування місцевого самоврядування.</p>\n<p><strong>Основні результати децентралізації:</strong></p>\n<ul>\n<li><p>створено 1469 територіальних громад;</p></li>\n<li><p>замість 490 районів утворено 136;</p></li>\n<li><p>розширено повноваження місцевого самоврядування;</p></li>\n<li><p>посилено фінансову самостійність громад;</p></li>\n<li><p>покращено умови надання публічних послуг.</p></li>\n</ul>\n<p><strong>Інші організаційні принципи:</strong></p>\n<ol>\n<li><p><strong>Субсидіарність</strong> — вирішення питань на найближчому до населення рівні.</p></li>\n<li><p><strong>Деконцентрація</strong> — передача повноважень від центральних органів виконавчої влади їх територіальним органам.</p></li>\n<li><p><strong>Самостійність</strong> — право громад самостійно вирішувати питання місцевого значення.</p></li>\n<li><p><strong>Фінансова забезпеченість</strong> — відповідність ресурсів покладеним повноваженням.</p></li>\n<li><p><strong>Єдність держави</strong> — збереження територіальної цілісності та єдиного правового простору.</p></li>\n<li><p><strong>Демократичність</strong> — участь населення в управлінні місцевими справами.</p></li>\n</ol>\n<p>Отже, децентралізація спрямована на посилення громад, підвищення ефективності управління та наближення влади до населення.</p>"}, {"n": 22, "t": "Зміни адміністративно-територіального устрою у 2014-2021 р.р. та їх правове забезпечення.", "h": "<p>У 2014–2021 роках в Україні відбулася масштабна реформа децентралізації, метою якої було створення спроможних територіальних громад, покращення публічних послуг та оптимізація системи управління.</p>\n<p>Основні етапи реформи:</p>\n<p>1. 2014 рік — затверджено Концепцію реформування місцевого самоврядування та територіальної організації влади (розпорядження КМУ № 333-р).</p>\n<p>2. 2014 рік — прийнято Закон «Про співробітництво територіальних громад», який дозволив громадам спільно реалізовувати повноваження.</p>\n<p>3. 2015 рік — прийнято Закон «Про добровільне об’єднання територіальних громад», який створив механізм формування об’єднаних громад.</p>\n<p>4. 2015–2019 роки — відбувалося добровільне об’єднання громад та зміцнення їх фінансової спроможності.</p>\n<p>5. 2020 рік — сформовано 1469 територіальних громад, які охопили територію України.</p>\n<p>6. 17 липня 2020 року — постановою Верховної Ради № 807-IX замість 490 районів утворено 136 нових районів.</p>\n<p>7. 2020–2021 роки — проведено місцеві вибори на новій територіальній основі та розпочато функціонування оновленої системи управління.</p>\n<p>Основні результати реформи:</p>\n<p>укрупнення територіальних громад і районів;</p>\n<p>передача повноважень на місцевий рівень;</p>\n<p>посилення фінансової самостійності громад;</p>\n<p>покращення доступності адміністративних послуг;</p>\n<p>удосконалення територіальної організації влади.</p>\n<p>Отже, реформа 2014–2021 років змінила територіальну основу місцевого самоврядування та посилила роль територіальних громад.</p>"}, {"n": 23, "t": "Порядок вирішення питань адміністративно-територіального устрою України» загальна характеристика", "h": "<p>Закон України «Про порядок вирішення окремих питань адміністративно-територіального устрою України» № 3285-IX прийнятий 28 липня 2023 року та набрав чинності 26 січня 2024 року.</p>\n<p><strong>Мета закону</strong> — встановити сучасний порядок утворення, ліквідації та зміни меж адміністративно-територіальних одиниць і населених пунктів.</p>\n<p><strong>Основні положення закону:</strong></p>\n<p>1. Визначає три категорії населених пунктів:</p>\n<ul>\n<li><p>місто — від 10 тисяч жителів;</p></li>\n<li><p>селище — від 5 тисяч жителів;</p></li>\n<li><p>село — менше 5 тисяч жителів.</p></li>\n</ul>\n<p>2. Скасовує категорію «селище міського типу».</p>\n<p>3. Визначає порядок утворення та ліквідації населених пунктів.</p>\n<p>4. Встановлює порядок зміни меж адміністративно-територіальних одиниць.</p>\n<p>5. Розмежовує повноваження органів влади:</p>\n<ul>\n<li><p>Верховна Рада України — утворення та ліквідація районів;</p></li>\n<li><p>Кабінет Міністрів України — вирішення визначених законом питань щодо населених пунктів;</p></li>\n<li><p>місцеві ради — вирішення питань у межах їхньої компетенції.</p></li>\n</ul>\n<p>6. Передбачає громадське обговорення відповідних територіальних змін, загальний строк якого становить не менше 30 календарних днів.</p>\n<p>7. Запроваджує ведення Кодифікатора адміністративно-територіальних одиниць та територій територіальних громад.</p>\n<p><strong>Значення закону:</strong></p>\n<ul>\n<li><p>усуває застаріле законодавче регулювання;</p></li>\n<li><p>встановлює єдині процедури територіальних змін;</p></li>\n<li><p>забезпечує впорядкування адміністративно-територіального устрою;</p></li>\n<li><p>сприяє ефективній організації місцевого самоврядування.</p></li>\n</ul>\n<p>Отже, Закон № 3285-IX є основним спеціальним актом, який регулює порядок вирішення питань адміністративно-територіального устрою України.</p>"}, {"n": 24, "t": "Система та структура публічної адміністрації", "h": "<p>Публічна адміністрація — це система органів публічної влади, установ та посадових осіб, які здійснюють публічне управління, реалізують державну політику, виконують закони та забезпечують задоволення суспільних потреб.</p>\n<p>До системи публічної адміністрації належать:</p>\n<p>органи виконавчої влади (Кабінет Міністрів, міністерства, інші центральні та місцеві органи);</p>\n<p>органи місцевого самоврядування в частині здійснення публічних функцій;</p>\n<p>інші суб’єкти, яким законом делеговано владні управлінські повноваження.</p>\n<p>Основними ознаками публічної адміністрації є законність, підзаконний характер діяльності, спрямованість на суспільний інтерес, підконтрольність і відповідальність перед суспільством.</p>"}, {"n": 25, "t": "Поняття адміністративного органу. Функціональні адміністративні органи", "h": "<p><strong>Адміністративний орган</strong> — це орган державної влади, орган місцевого самоврядування або інший уповноважений законом суб’єкт, який здійснює публічно-владні управлінські функції, зокрема приймає адміністративні акти та надає адміністративні послуги.</p>\n<p>Основні ознаки адміністративного органу:</p>\n<ul>\n<li><p>діє на підставі та в межах закону;</p></li>\n<li><p>має визначену компетенцію;</p></li>\n<li><p>приймає обов’язкові рішення у межах своїх повноважень;</p></li>\n<li><p>забезпечує реалізацію прав та законних інтересів фізичних і юридичних осіб.</p></li>\n</ul>\n<p><strong>Функціональні адміністративні органи</strong> — це органи, які створюються або наділяються повноваженнями для виконання конкретних управлінських функцій незалежно від загальної галузевої структури управління.</p>\n<p>Вони можуть здійснювати контрольні, наглядові, регуляторні, дозвільні та інші адміністративні функції.</p>"}, {"n": 26, "t": "Сфера діяльності та компетенція адміністративних органів: предметна та територіальні компетенція", "h": "<p><strong>Компетенція адміністративного органу</strong> — це встановлена законодавством сукупність його завдань, функцій, прав та обов’язків, необхідних для здійснення публічного управління.</p>\n<p>Компетенція поділяється на:</p>\n<ul>\n<li><p><strong>Предметну компетенцію</strong> — визначає коло питань і сфер суспільних відносин, якими уповноважений займатися відповідний орган. Наприклад, Міністерство освіти і науки України відповідає за формування та реалізацію державної політики у сфері освіти й науки.</p></li>\n<li><p><strong>Територіальну компетенцію</strong> — визначає територіальні межі, у яких орган має право здійснювати свої повноваження.</p></li>\n</ul>\n<p>За територіальним принципом органи можуть мати загальнодержавну, регіональну або місцеву компетенцію.</p>\n<p>Отже, предметна компетенція визначає, <em>які питання вирішує орган</em>, а територіальна — <em>де він має право їх вирішувати</em>.</p>"}, {"n": 27, "t": "Адміністративний розсуд – як спосіб реалізації дискреційних повноважень", "h": "<p><strong>Адміністративний розсуд</strong> — це можливість адміністративного органу самостійно обирати один із декількох законних варіантів рішення з урахуванням обставин конкретної справи.</p>\n<p><strong>Дискреційні повноваження</strong> — це повноваження, які надають органу певну свободу вибору щодо змісту, способу або форми прийняття адміністративного рішення.</p>\n<p>Наприклад, закон може передбачати можливість застосування одного з кількох заходів адміністративного реагування залежно від обставин справи.</p>\n<p>Адміністративний розсуд повинен здійснюватися:</p>\n<ul>\n<li><p>у межах закону;</p></li>\n<li><p>з дотриманням мети наданих повноважень;</p></li>\n<li><p>обґрунтовано та неупереджено;</p></li>\n<li><p>з урахуванням обставин конкретної справи;</p></li>\n<li><p>із дотриманням принципу пропорційності.</p></li>\n</ul>\n<p>Отже, адміністративний розсуд не означає свавілля, а є обмеженою законом свободою вибору управлінського рішення.</p>"}, {"n": 28, "t": "Вимоги законності щодо реалізації дискреційних повноважень", "h": "<p>Реалізація дискреційних повноважень адміністративними органами повинна відповідати принципу верховенства права та вимогам законності.</p>\n<p>Основні вимоги:</p>\n<ol>\n<li><p><strong>Законність</strong> — орган діє виключно на підставі, у межах повноважень та у спосіб, передбачені Конституцією і законами України.</p></li>\n<li><p><strong>Обґрунтованість</strong> — рішення повинно враховувати всі важливі обставини справи.</p></li>\n<li><p><strong>Неупередженість</strong> — забороняється приймати рішення під впливом особистих інтересів.</p></li>\n<li><p><strong>Пропорційність</strong> — обраний захід має відповідати меті та не створювати надмірних обмежень прав особи.</p></li>\n<li><p><strong>Добросовісність і розсудливість</strong> — орган повинен діяти чесно, послідовно та логічно.</p></li>\n<li><p><strong>Рівність перед законом</strong> — однакові ситуації повинні розглядатися за однаковими критеріями.</p></li>\n<li><p><strong>Правова визначеність</strong> — рішення має бути зрозумілим, передбачуваним і належно мотивованим.</p></li>\n</ol>\n<p>Дотримання цих вимог забезпечує захист прав людини та запобігає зловживанню владою.</p>"}, {"n": 29, "t": "Система органів виконавчої влади та основні засади їх структурної побудови", "h": "<p><strong>Виконавча влада</strong> — це самостійна гілка державної влади, яка забезпечує виконання Конституції, законів України та реалізацію державної політики.</p>\n<p>Система органів виконавчої влади має ієрархічну побудову та складається з трьох основних рівнів:</p>\n<ol>\n<li><p><strong>Вищий орган</strong> — Кабінет Міністрів України, який відповідно до статті 113 Конституції України є вищим органом у системі виконавчої влади.</p></li>\n<li><p><strong>Центральні органи</strong> — міністерства та інші центральні органи виконавчої влади. Міністерства формують і реалізують державну політику, інші центральні органи виконують окремі функції з її реалізації.</p></li>\n<li><p><strong>Місцеві органи</strong> — місцеві державні адміністрації, які здійснюють виконавчу владу в областях, районах, містах Києві та Севастополі.</p></li>\n</ol>\n<p>Основні засади побудови системи:</p>\n<ul>\n<li><p>законність;</p></li>\n<li><p>ієрархічність та підпорядкованість;</p></li>\n<li><p>розмежування компетенції;</p></li>\n<li><p>єдність системи виконавчої влади;</p></li>\n<li><p>відповідальність органів за результати діяльності;</p></li>\n<li><p>взаємодія та координація між органами.</p></li>\n</ul>"}, {"n": 30, "t": "Повноваження Президента України у сфері виконавчої влади", "h": "<p>Президент України як глава держави має окремі конституційні повноваження у сфері виконавчої влади, проте не входить до системи її органів.</p>\n<p>Основні повноваження визначені статтею 106 Конституції України:</p>\n<ul>\n<li><p>бере участь у формуванні Кабінету Міністрів: вносить до Верховної Ради кандидатуру Прем’єр-міністра за конституційною процедурою;</p></li>\n<li><p>вносить подання про призначення Міністрів оборони та закордонних справ;</p></li>\n<li><p>вносить пропозицію щодо розгляду питання про відповідальність Кабінету Міністрів;</p></li>\n<li><p>призначає та звільняє голів місцевих державних адміністрацій за поданням Кабінету Міністрів;</p></li>\n<li><p>зупиняє дію актів Кабінету Міністрів з мотивів їх невідповідності Конституції з одночасним зверненням до Конституційного Суду;</p></li>\n<li><p>скасовує акти Ради міністрів Автономної Республіки Крим;</p></li>\n<li><p>видає укази й розпорядження в межах своїх конституційних повноважень;</p></li>\n<li><p>утворює допоміжні та консультативно-дорадчі органи.</p></li>\n</ul>\n<p>Важливо, що Президент не може перебирати на себе повноваження Кабінету Міністрів, оскільки відповідно до статті 113 Конституції саме Уряд є вищим органом у системі виконавчої влади.</p>"}, {"n": 31, "t": "Кабінет Міністрів України як вищий орган виконавчої влади.", "h": "<p>Відповідно до статті 113 Конституції України, <strong>Кабінет Міністрів України є вищим органом у системі органів виконавчої влади</strong>.</p>\n<p>Він є колегіальним органом, який здійснює виконавчу владу безпосередньо та через міністерства, інші центральні органи виконавчої влади й місцеві державні адміністрації.</p>\n<p>Основні функції Кабінету Міністрів:</p>\n<ul>\n<li><p>забезпечення виконання Конституції та законів України;</p></li>\n<li><p>реалізація внутрішньої та зовнішньої політики держави;</p></li>\n<li><p>забезпечення прав і свобод людини;</p></li>\n<li><p>проведення фінансової, економічної, соціальної та інших напрямів державної політики;</p></li>\n<li><p>координація діяльності органів виконавчої влади;</p></li>\n<li><p>забезпечення обороноздатності та національної безпеки держави.</p></li>\n</ul>\n<p>До складу Кабінету Міністрів входять Прем’єр-міністр України, Перший віце-прем’єр-міністр, віце-прем’єр-міністри та міністри.</p>\n<p>Основною організаційною формою діяльності Уряду є засідання, на яких приймаються колегіальні рішення.</p>\n<p>Кабінет Міністрів відповідальний перед Президентом України та Верховною Радою України, а також підконтрольний і підзвітний Верховній Раді в межах Конституції.</p>"}, {"n": 32, "t": "Повноваження Кабінету Міністрів України. Акти Кабінету Міністрів України", "h": "<p>Основні повноваження Кабінету Міністрів визначені статтею 116 Конституції України та статтею 20 Закону України «Про Кабінет Міністрів України».</p>\n<p>До них належать:</p>\n<ul>\n<li><p>забезпечення державного суверенітету та економічної самостійності України;</p></li>\n<li><p>забезпечення проведення внутрішньої та зовнішньої політики;</p></li>\n<li><p>забезпечення прав і свобод людини та громадянина;</p></li>\n<li><p>проведення фінансової, податкової, соціальної, освітньої та інших напрямів державної політики;</p></li>\n<li><p>розроблення загальнодержавних програм розвитку;</p></li>\n<li><p>розроблення проєкту Державного бюджету та забезпечення його виконання;</p></li>\n<li><p>забезпечення обороноздатності й національної безпеки;</p></li>\n<li><p>спрямування та координація діяльності міністерств та інших органів виконавчої влади;</p></li>\n<li><p>утворення, реорганізація та ліквідація центральних органів виконавчої влади відповідно до закону.</p></li>\n</ul>\n<p><strong>Акти Кабінету Міністрів України</strong> — це офіційні рішення Уряду, за допомогою яких він реалізує свої повноваження.</p>\n<p>Відповідно до статті 117 Конституції України, Кабінет Міністрів у межах своєї компетенції видає два основні види актів:</p>\n<p>1. <strong>Постанови</strong> — нормативно-правові акти, які приймаються з питань нормативного характеру та встановлюють загальні правила поведінки. Наприклад, постанови про затвердження порядків, правил і положень.</p>\n<p>2. <strong>Розпорядження</strong> — акти, які приймаються з організаційно-розпорядчих та інших поточних питань. Вони спрямовані на вирішення конкретних управлінських завдань, затвердження планів заходів та організацію діяльності органів виконавчої влади.</p>\n<p>Основні ознаки актів Кабінету Міністрів:</p>\n<ul>\n<li><p>приймаються в межах компетенції Уряду;</p></li>\n<li><p>повинні відповідати Конституції та законам України;</p></li>\n<li><p>є обов’язковими до виконання;</p></li>\n<li><p>підписуються Прем’єр-міністром України;</p></li>\n<li><p>нормативно-правові акти підлягають державній реєстрації у встановлених законом випадках.</p></li>\n</ul>\n<p>Порядок набрання чинності урядовими актами визначається статтею 52 Закону України «Про Кабінет Міністрів України».</p>\n<p>Отже, постанови та розпорядження є основними правовими інструментами, за допомогою яких Кабінет Міністрів забезпечує виконання законодавства та здійснює державне управління.</p>"}, {"n": 33, "t": "Міністерства та їх місце в системі публічної адміністрації", "h": "<p>Міністерства України — це центральні органи виконавчої влади, які забезпечують формування та реалізацію державної політики в одній або декількох сферах суспільного життя.</p>\n<p>Міністерство очолює міністр України, який одночасно є членом Кабінету Міністрів України та здійснює політичне керівництво міністерством.</p>\n<p><strong>Основні завдання міністерств (ст. 7 Закону України «Про центральні органи виконавчої влади»):</strong></p>\n<ul>\n<li><p>забезпечення нормативно-правового регулювання;</p></li>\n<li><p>визначення пріоритетних напрямів розвитку відповідної сфери;</p></li>\n<li><p>інформування та надання роз’яснень щодо державної політики;</p></li>\n<li><p>узагальнення практики застосування законодавства та підготовка пропозицій щодо його вдосконалення;</p></li>\n<li><p>забезпечення соціального діалогу на галузевому рівні.</p></li>\n</ul>\n<p><strong>Основні функції міністерств:</strong></p>\n<ol>\n<li><p>Формування державної політики та визначення пріоритетів її розвитку.</p></li>\n<li><p>Реалізація державної політики через організацію виконання законів і державних програм.</p></li>\n<li><p>Нормативно-правове регулювання шляхом видання наказів у межах компетенції.</p></li>\n<li><p>Організаційно-управлінська діяльність та координація роботи підпорядкованих органів у передбачених законом випадках.</p></li>\n<li><p>Забезпечення прав людини та організація надання адміністративних послуг у межах компетенції.</p></li>\n</ol>\n<p><strong>Організаційна структура міністерства</strong> включає міністра, першого заступника та заступників міністра, державного секретаря, структурні підрозділи апарату та територіальні органи (за наявності).</p>\n<p>Кабінет Міністрів України утворює, реорганізовує та ліквідовує міністерства. Отже, міністерства посідають важливе місце в системі публічної адміністрації, оскільки забезпечують формування державної політики та її практичне втілення.</p>"}, {"n": 34, "t": "Центральні органи виконавчої влади: державні агентства, служби, інспекції, комісії, бюро та особливості їх правового статусу та компетенції", "h": "<p>Центральні органи виконавчої влади (ЦОВВ) — це державні органи, які здійснюють виконавчо-розпорядчу діяльність на території України та виконують окремі функції з реалізації державної політики.</p>\n<p>Відповідно до ст. 17 Закону України «Про центральні органи виконавчої влади», їхні основні завдання:</p>\n<p>надання адміністративних послуг;</p>\n<p>здійснення державного нагляду та контролю;</p>\n<p>управління об’єктами державної власності;</p>\n<p>внесення пропозицій щодо формування державної політики;</p>\n<p>виконання інших завдань, визначених законом.</p>\n<p>Основні види ЦОВВ:</p>\n<p>1. Державні служби — переважно надають адміністративні послуги фізичним та юридичним особам. Наприклад, Державна податкова служба України.</p>\n<p>2. Державні агентства — переважно здійснюють управління об’єктами державної власності та державними ресурсами.</p>\n<p>3. Державні інспекції — виконують контрольно-наглядові функції, перевіряють дотримання законодавства та застосовують передбачені законом заходи реагування.</p>\n<p>4. Комісії — виконують спеціалізовані завдання, можуть приймати рішення, розглядати заяви, організовувати конкурси та здійснювати регуляторні функції відповідно до закону.</p>\n<p>5. Бюро — утворюються, якщо більшість функцій органу становлять оперативно-розшукова діяльність та досудове розслідування кримінальних правопорушень. Наприклад, Державне бюро розслідувань має спеціальний законодавчий статус.</p>\n<p>Правовий статус ЦОВВ визначається законодавством і включає їхні завдання, функції, компетенцію, структуру, підпорядкованість та відповідальність.</p>\n<p>Їхня діяльність ґрунтується на принципах законності, верховенства права, відкритості, прозорості, відповідальності та забезпечення прав людини.</p>\n<p>Отже, основна відмінність між цими органами полягає у спеціалізації їхньої діяльності: служби надають послуги, агентства управляють державним майном, інспекції контролюють, комісії виконують спеціальні регуляторні завдання, а бюро здійснюють визначені законом правоохоронні функції.</p>"}, {"n": 35, "t": "Центральні органи виконавчої влади зі спеціальним статусом", "h": "<p>Центральні органи виконавчої влади (ЦОВВ) — це державні органи, які здійснюють виконавчо-розпорядчу діяльність на території України та виконують окремі функції з реалізації державної політики.</p>\n<p>Відповідно до ст. 17 Закону України «Про центральні органи виконавчої влади», їхні основні завдання:</p>\n<p>надання адміністративних послуг;</p>\n<p>здійснення державного нагляду та контролю;</p>\n<p>управління об’єктами державної власності;</p>\n<p>внесення пропозицій щодо формування державної політики;</p>\n<p>виконання інших завдань, визначених законом.</p>\n<p>Основні види ЦОВВ:</p>\n<p>1. Державні служби — переважно надають адміністративні послуги фізичним та юридичним особам. Наприклад, Державна податкова служба України.</p>\n<p>2. Державні агентства — переважно здійснюють управління об’єктами державної власності та державними ресурсами.</p>\n<p>3. Державні інспекції — виконують контрольно-наглядові функції, перевіряють дотримання законодавства та застосовують передбачені законом заходи реагування.</p>\n<p>4. Комісії — виконують спеціалізовані завдання, можуть приймати рішення, розглядати заяви, організовувати конкурси та здійснювати регуляторні функції відповідно до закону.</p>\n<p>5. Бюро — утворюються, якщо більшість функцій органу становлять оперативно-розшукова діяльність та досудове розслідування кримінальних правопорушень. Наприклад, Державне бюро розслідувань має спеціальний законодавчий статус.</p>\n<p>Правовий статус ЦОВВ визначається законодавством і включає їхні завдання, функції, компетенцію, структуру, підпорядкованість та відповідальність.</p>\n<p>Їхня діяльність ґрунтується на принципах законності, верховенства права, відкритості, прозорості, відповідальності та забезпечення прав людини.</p>\n<p>Отже, основна відмінність між цими органами полягає у спеціалізації їхньої діяльності: служби надають послуги, агентства управляють державним майном, інспекції контролюють, комісії виконують спеціальні регуляторні завдання, а бюро здійснюють визначені законом правоохоронні функції.</p>"}, {"n": 36, "t": "Територіальні органи центральних органів виконавчої влади", "h": "<p>Територіальні органи центральних органів виконавчої влади — це органи, які створюються для реалізації повноважень відповідного міністерства або іншого ЦОВВ на певній території України.</p>\n<p>Їхнє основне призначення — забезпечення виконання державної політики на місцях, наближення адміністративних послуг до громадян та здійснення контрольних функцій у межах компетенції.</p>\n<p><strong>Відповідно до ст. 13 Закону України «Про центральні органи виконавчої влади»:</strong></p>\n<ul>\n<li><p>територіальні органи міністерств можуть утворюватися як юридичні особи публічного права або як структурні підрозділи апарату без статусу юридичної особи;</p></li>\n<li><p>вони створюються, реорганізовуються та ліквідовуються у встановленому законом порядку;</p></li>\n<li><p>діють на підставі положень, затверджених міністром;</p></li>\n<li><p>мають визначену структуру та територію діяльності.</p></li>\n</ul>\n<p><strong>Основні види територіальних органів:</strong></p>\n<ol>\n<li><p>Обласні — діють у межах відповідної області.</p></li>\n<li><p>Районні — здійснюють повноваження на рівні району.</p></li>\n<li><p>Міжрегіональні — охоплюють декілька адміністративно-територіальних одиниць.</p></li>\n<li><p>Міські — діють у містах або районах у містах, якщо це передбачено законодавством.</p></li>\n</ol>\n<p><strong>Основні функції територіальних органів:</strong></p>\n<ul>\n<li><p>реалізація державної політики на місцях;</p></li>\n<li><p>здійснення державного контролю та нагляду;</p></li>\n<li><p>надання адміністративних послуг;</p></li>\n<li><p>розгляд звернень громадян і прийняття адміністративних актів;</p></li>\n<li><p>збір та узагальнення інформації для центрального органу.</p></li>\n</ul>\n<p>Територіальні органи підпорядковуються відповідному центральному органу виконавчої влади та не формують самостійно державну політику, а забезпечують її практичну реалізацію.</p>\n<p>Важливо розрізняти територіальні органи ЦОВВ і місцеві державні адміністрації: перші виконують функції конкретного центрального органу у визначеній сфері, а другі здійснюють виконавчу владу в областях і районах та мають ширше коло повноважень</p>"}, {"n": 37, "t": "Місцеві органи виконавчої влади", "h": "<p>Місцеві органи виконавчої влади — це державні органи, які діють на відповідній території України та забезпечують реалізацію державної політики, виконання Конституції і законів України, актів Президента та Кабінету Міністрів України.</p>\n<p>Відповідно до статті 118 Конституції України, виконавчу владу в областях і районах, а також у містах Києві та Севастополі здійснюють <strong>місцеві державні адміністрації</strong>.</p>\n<p>До них належать:</p>\n<ul>\n<li><p>обласні державні адміністрації;</p></li>\n<li><p>районні державні адміністрації;</p></li>\n<li><p>Київська та Севастопольська міські державні адміністрації.</p></li>\n</ul>\n<p>Основні завдання місцевих державних адміністрацій:</p>\n<ol>\n<li><p>Забезпечення виконання Конституції та законів України.</p></li>\n<li><p>Забезпечення законності, правопорядку, охорони прав і свобод громадян.</p></li>\n<li><p>Реалізація державної політики соціально-економічного та культурного розвитку територій.</p></li>\n<li><p>Участь у формуванні та виконанні місцевих бюджетів.</p></li>\n<li><p>Реалізація державної політики у сферах освіти, охорони здоров’я, соціального захисту, культури, транспорту та інших галузях.</p></li>\n<li><p>Взаємодія з органами місцевого самоврядування та територіальними органами центральних органів виконавчої влади.</p></li>\n</ol>\n<p>Голови місцевих державних адміністрацій призначаються на посаду та звільняються з посади Президентом України за поданням Кабінету Міністрів України.</p>\n<p>Діяльність адміністрацій ґрунтується на принципах законності, відповідальності, пріоритету прав людини та поєднання загальнодержавних і місцевих інтересів.</p>\n<p>Важливо відрізняти місцеві державні адміністрації від органів місцевого самоврядування: перші представляють державну виконавчу владу, а другі представляють територіальні громади.</p>\n<p>В умовах воєнного стану можуть утворюватися військові адміністрації — тимчасові державні органи, які забезпечують оборону, громадську безпеку та здійснення заходів правового режиму воєнного стану.</p>"}, {"n": 38, "t": "Органи місцевого самоврядування та їх виконавчі органи", "h": "<p>Місцеве самоврядування — це гарантоване державою право територіальної громади самостійно вирішувати питання місцевого значення в межах Конституції та законів України.</p>\n<p>Відповідно до статті 7 Конституції України, в Україні визнається і гарантується місцеве самоврядування. Основним нормативним актом є Закон України «Про місцеве самоврядування в Україні».</p>\n<p>Згідно зі статтею 5 цього Закону, система місцевого самоврядування включає:</p>\n<ul>\n<li><p>територіальну громаду;</p></li>\n<li><p>сільські, селищні та міські ради;</p></li>\n<li><p>сільського, селищного та міського голову;</p></li>\n<li><p>виконавчі органи відповідних рад;</p></li>\n<li><p>районні та обласні ради;</p></li>\n<li><p>органи самоорганізації населення.</p></li>\n</ul>\n<p>Основні принципи місцевого самоврядування:</p>\n<ol>\n<li><p>Народовладдя.</p></li>\n<li><p>Законність.</p></li>\n<li><p>Організаційна самостійність.</p></li>\n<li><p>Виборність.</p></li>\n<li><p>Матеріальна та фінансова самостійність.</p></li>\n<li><p>Підзвітність і відповідальність.</p></li>\n<li><p>Судовий захист прав місцевого самоврядування.</p></li>\n</ol>\n<p><strong>Основні органи та їхні повноваження:</strong></p>\n<ul>\n<li><p><strong>Територіальна громада</strong> — первинний суб’єкт місцевого самоврядування, який самостійно визначає місцеві потреби та бере участь у вирішенні питань громади.</p></li>\n<li><p><strong>Сільські, селищні та міські ради</strong> — представницькі органи, які затверджують місцеві бюджети, програми розвитку, вирішують питання комунальної власності та земельних відносин.</p></li>\n<li><p><strong>Районні та обласні ради</strong> — представляють спільні інтереси територіальних громад.</p></li>\n<li><p><strong>Сільський, селищний, міський голова</strong> — головна посадова особа громади, організовує роботу ради та її виконавчого комітету.</p></li>\n<li><p><strong>Органи самоорганізації населення</strong> — будинкові, вуличні, квартальні комітети та інші органи, які створюються жителями для вирішення місцевих питань.</p></li>\n</ul>\n<p><strong>Виконавчі органи місцевого самоврядування</strong></p>\n<p>Відповідно до статті 11 Закону України «Про місцеве самоврядування в Україні», до виконавчих органів належать:</p>\n<ul>\n<li><p>виконавчі комітети;</p></li>\n<li><p>відділи;</p></li>\n<li><p>управління;</p></li>\n<li><p>інші виконавчі органи, створені відповідними радами.</p></li>\n</ul>\n<p>Виконавчий комітет є колегіальним органом, який утворюється радою для забезпечення виконання її рішень та здійснення виконавчих функцій.</p>\n<p>Виконавчі органи підзвітні та підконтрольні відповідним радам, а з питань здійснення делегованих повноважень — також відповідним органам виконавчої влади.</p>\n<p>До основних повноважень місцевого самоврядування належать формування виконавчих органів, управління комунальним майном, формування місцевих бюджетів, планування розвитку громади та надання адміністративних послуг.</p>"}, {"n": 39, "t": "Суб’єкти делегованих повноважень", "h": "<p>Делеговані повноваження — це визначені законом повноваження органів виконавчої влади, які надаються органам місцевого самоврядування для здійснення.</p>\n<p>Відповідно до частини третьої статті 143 Конституції України, органам місцевого самоврядування можуть надаватися законом окремі повноваження органів виконавчої влади. Їх здійснення фінансується державою, а з питань виконання цих повноважень органи місцевого самоврядування підконтрольні відповідним органам виконавчої влади.</p>\n<p><strong>Основними суб’єктами делегованих повноважень є:</strong></p>\n<p>1. <strong>Органи державної влади, які визначають і надають повноваження:</strong> Кабінет Міністрів України, міністерства, інші центральні органи виконавчої влади та місцеві державні адміністрації.</p>\n<p>2. <strong>Органи місцевого самоврядування, які здійснюють делеговані повноваження:</strong> виконавчі комітети, відділи, управління та інші виконавчі органи сільських, селищних і міських рад.</p>\n<p>3. <strong>Районні та обласні ради й місцеві державні адміністрації:</strong> районні та обласні ради можуть делегувати місцевим державним адміністраціям окремі свої повноваження, виконання яких забезпечують відповідні адміністрації.</p>\n<p>Основні принципи здійснення делегованих повноважень:</p>\n<ul>\n<li><p>законність;</p></li>\n<li><p>фінансове забезпечення;</p></li>\n<li><p>підконтрольність;</p></li>\n<li><p>відповідальність;</p></li>\n<li><p>дотримання прав людини.</p></li>\n</ul>\n<p>Контроль за виконанням делегованих повноважень здійснюється шляхом перевірки дотримання законодавства, аналізу виконання державних програм, отримання звітів та перевірки законності прийнятих актів.</p>\n<p>Водночас контроль не повинен перетворюватися на втручання у здійснення органами місцевого самоврядування їхніх власних повноважень.</p>\n<p>За неналежне виконання делегованих повноважень може наставати дисциплінарна, адміністративна, цивільно-правова або кримінальна відповідальність.</p>"}, {"n": 40, "t": "Адміністративне правонаступництво", "h": "<p>Адміністративне правонаступництво — це повний або частковий перехід компетенції (функцій, повноважень та відповідальності) від одного адміністративного органу до іншого.</p>\n<p>Його основна мета — забезпечення безперервності діяльності публічної адміністрації під час реорганізації, ліквідації органів або передачі їхніх функцій іншим органам.</p>\n<p>Правова основа — стаття 25 Закону України «Про адміністративну процедуру».</p>\n<p><strong>Основні ознаки адміністративного правонаступництва:</strong></p>\n<ul>\n<li><p>нормативна визначеність;</p></li>\n<li><p>публічно-правовий характер;</p></li>\n<li><p>можливість повного або часткового переходу компетенції;</p></li>\n<li><p>безперервність адміністративної діяльності;</p></li>\n<li><p>збереження правових наслідків попередньої діяльності;</p></li>\n<li><p>гарантування прав громадян.</p></li>\n</ul>\n<p><strong>Види адміністративного правонаступництва:</strong></p>\n<p>1. <strong>Фактичне (компетенційне)</strong> — перехід повністю або частково компетенції від одного адміністративного органу до іншого. Виникає внаслідок ліквідації, реорганізації органу або передачі його функцій іншому органу.</p>\n<p>2. <strong>Процесуальне</strong> — заміна учасника судового процесу його правонаступником у разі переходу відповідних прав та обов’язків. Регулюється статтею 52 Кодексу адміністративного судочинства України.</p>\n<p>За обсягом переданої компетенції правонаступництво поділяється на:</p>\n<ul>\n<li><p><strong>повне</strong> — перехід усієї компетенції попереднього органу;</p></li>\n<li><p><strong>часткове</strong> — перехід лише окремих функцій, повноважень або обов’язків.</p></li>\n</ul>\n<p>Відповідно до статті 25 Закону України «Про адміністративну процедуру» правонаступник зобов’язаний:</p>\n<ul>\n<li><p>виконати всі обов’язки попереднього органу перед учасниками адміністративного провадження;</p></li>\n<li><p>дотримуватися рішень і дій попереднього органу, які залишаються обов’язковими;</p></li>\n<li><p>забезпечити продовження розгляду адміністративних справ;</p></li>\n<li><p>повідомити учасників провадження про отримання матеріалів їхніх справ.</p></li>\n</ul>\n<p><strong>Приклад:</strong> громадянин подав заяву до адміністративного органу, але під час її розгляду орган було реорганізовано, а його повноваження передано іншому органу. У такому випадку правонаступник повинен продовжити розгляд заяви, врахувати попередні матеріали та виконати обов’язки перед заявником.</p>\n<p>Отже, адміністративне правонаступництво забезпечує безперервність державного управління та захист прав громадян незалежно від організаційних змін у системі публічної влади.</p>"}, {"n": 41, "t": "Поняття, завдання і види публічної служби", "h": "<p><strong>Публічна служба</strong> — це діяльність осіб у системі публічної влади, спрямована на виконання завдань і функцій держави та територіальних громад.</p>\n<p>Відповідно до п. 17 ч. 1 ст. 4 КАС України, публічна служба охоплює діяльність на державних політичних посадах, професійну діяльність суддів і прокурорів, військову та альтернативну службу, іншу державну службу, патронатну службу, службу в органах влади АРК та органах місцевого самоврядування.</p>\n<p><strong>Основні ознаки публічної служби:</strong></p>\n<ul>\n<li><p>публічний характер діяльності;</p></li>\n<li><p>особливий порядок вступу на службу;</p></li>\n<li><p>спеціальний правовий статус службовців;</p></li>\n<li><p>підвищені вимоги до доброчесності;</p></li>\n<li><p>професійність і політична неупередженість;</p></li>\n<li><p>особливі підстави юридичної відповідальності та припинення служби.</p></li>\n</ul>\n<p><strong>Основні завдання публічної служби:</strong></p>\n<ol>\n<li><p>Реалізація державної політики.</p></li>\n<li><p>Забезпечення прав і свобод людини.</p></li>\n<li><p>Забезпечення законності та правопорядку.</p></li>\n<li><p>Управління суспільними справами.</p></li>\n<li><p>Забезпечення місцевого розвитку.</p></li>\n<li><p>Ефективне використання публічних ресурсів.</p></li>\n<li><p>Запобігання корупції та забезпечення доброчесності.</p></li>\n<li><p>Забезпечення стабільності публічного управління.</p></li>\n</ol>\n<p><strong>Види публічної служби:</strong></p>\n<ul>\n<li><p>державна служба;</p></li>\n<li><p>служба в органах місцевого самоврядування;</p></li>\n<li><p>військова служба;</p></li>\n<li><p>дипломатична служба;</p></li>\n<li><p>служба в правоохоронних органах;</p></li>\n<li><p>патронатна служба;</p></li>\n<li><p>професійна діяльність суддів і прокурорів;</p></li>\n<li><p>інші види діяльності, віднесені законом до публічної служби.</p></li>\n</ul>\n<p><strong>Державна служба</strong> — відповідно до ст. 1 Закону України «Про державну службу», це публічна, професійна, політично неупереджена діяльність із практичного виконання завдань і функцій держави.</p>\n<p><strong>Служба в органах місцевого самоврядування</strong> — професійна діяльність, спрямована на реалізацію права територіальної громади на місцеве самоврядування та виконання повноважень відповідних органів.</p>"}, {"n": 42, "t": "Поняття та види принципів публічної служби", "h": "<p><strong>Принципи публічної служби</strong> — це основоположні правові ідеї та вимоги, які визначають організацію, функціонування і діяльність публічних службовців.</p>\n<p>Основою правового регулювання є Конституція України та спеціальне законодавство, зокрема ст. 4 Закону України «Про державну службу».</p>\n<p><strong>Основні принципи державної служби (ст. 4 Закону):</strong></p>\n<ol>\n<li><p><strong>Верховенство права</strong> — пріоритет прав і свобод людини.</p></li>\n<li><p><strong>Законність</strong> — діяльність лише на підставі, у межах повноважень та у спосіб, визначені законом.</p></li>\n<li><p><strong>Професіоналізм</strong> — компетентне, об’єктивне й неупереджене виконання обов’язків.</p></li>\n<li><p><strong>Патріотизм</strong> — відданість і вірне служіння Українському народові.</p></li>\n<li><p><strong>Доброчесність</strong> — захист публічних інтересів і недопущення переважання приватного інтересу.</p></li>\n<li><p><strong>Ефективність</strong> — раціональне використання ресурсів.</p></li>\n<li><p><strong>Рівний доступ до державної служби</strong> — відсутність дискримінації та необґрунтованих переваг.</p></li>\n<li><p><strong>Політична неупередженість</strong> — незалежність службових рішень від політичних поглядів.</p></li>\n<li><p><strong>Прозорість</strong> — відкритість інформації про діяльність службовців.</p></li>\n<li><p><strong>Стабільність</strong> — незалежність державної служби від зміни політичного керівництва.</p></li>\n</ol>\n<p><strong>За характером можна виділити три групи принципів:</strong></p>\n<ul>\n<li><p><strong>Загальноправові:</strong> верховенство права, законність, рівність і відповідальність.</p></li>\n<li><p><strong>Організаційні:</strong> професіоналізм, стабільність, рівний доступ до служби.</p></li>\n<li><p><strong>Функціональні:</strong> ефективність, доброчесність, політична неупередженість, патріотизм і прозорість.</p></li>\n</ul>\n<p>Конституційну основу принципів становлять, зокрема, статті 3, 8, 19, 24, 38 і 55 Конституції України.</p>"}, {"n": 43, "t": "Посади публічної служби, їх види. Рівнозначна посада, вакантна посада", "h": "<p><strong>Посада публічної служби</strong> — це визначене законодавством місце в системі публічної влади, з яким пов’язане виконання відповідних повноважень, службових завдань та наявність установленого правового статусу.</p>\n<p><strong>Основні види посад публічної служби:</strong></p>\n<p>1. <strong>Посади державної служби.</strong> Відповідно до ст. 6 Закону України «Про державну службу», поділяються на три категорії:</p>\n<ul>\n<li><p>категорія «А» — вищий корпус державної служби;</p></li>\n<li><p>категорія «Б» — керівники та заступники керівників структурних підрозділів та інші визначені законом посади;</p></li>\n<li><p>категорія «В» — інші посади державної служби.</p></li>\n</ul>\n<p>2. <strong>Посади служби в органах місцевого самоврядування.</strong> Пов’язані з виконанням повноважень територіальних громад, місцевих рад та їхніх виконавчих органів.</p>\n<p>3. <strong>Державні політичні посади.</strong> Передбачають політичне керівництво та формування державної політики. Наприклад, посади Прем’єр-міністра України та міністрів.</p>\n<p>4. <strong>Посади патронатної служби.</strong> Забезпечують організаційну, інформаційну та консультативну підтримку відповідних посадових осіб.</p>\n<p>5. <strong>Інші посади публічної служби.</strong> Військова, дипломатична, правоохоронна та інші спеціальні види служби.</p>\n<p><strong>Рівнозначна посада</strong> — відповідно до п. 6 ч. 1 ст. 2 Закону «Про державну службу», посада державної служби, що належить до однієї підкатегорії посад державної служби з урахуванням рівнів державних органів.</p>\n<p>Її значення полягає в можливості переведення державного службовця на іншу рівнозначну посаду за умов, передбачених ст. 41 Закону.</p>\n<p><strong>Вакантна посада</strong> — посада, передбачена структурою та штатним розписом державного органу, яка на відповідний момент не зайнята державним службовцем.</p>\n<p>Відповідно до ст. 22 Закону «Про державну службу», для зайняття вакантної посади проводиться конкурс у встановленому законом порядку.</p>\n<p>Важливо: посада тимчасово відсутнього працівника не стає вакантною, якщо за ним зберігається місце роботи.</p>"}, {"n": 44, "t": "Відмінність посади державної служби від політичної посади", "h": "<p><strong>Посада державної служби</strong> — це професійна посада в державному органі, пов’язана з практичним виконанням завдань і функцій держави. Державні службовці забезпечують стабільну роботу державного апарату незалежно від зміни політичного керівництва.</p>\n<p><strong>Політична посада</strong> — це посада, пов’язана зі здійсненням політичного керівництва, формуванням і реалізацією державної політики та прийняттям політичних рішень.</p>\n<p>Основні відмінності:</p>\n<div class=\"tw\"><table>\n<colgroup>\n<col style=\"width: 22%\" />\n<col style=\"width: 40%\" />\n<col style=\"width: 36%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Критерій</strong></th>\n<th><strong>Державна служба</strong></th>\n<th><strong>Політична посада</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>Характер діяльності</td>\n<td>Професійна</td>\n<td>Політична</td>\n</tr>\n<tr class=\"even\">\n<td>Основна мета</td>\n<td>Виконання завдань держави</td>\n<td>Формування державної політики</td>\n</tr>\n<tr class=\"odd\">\n<td>Призначення</td>\n<td>За конкурсом або в іншому встановленому законом порядку</td>\n<td>За конституційними та спеціальними процедурами</td>\n</tr>\n<tr class=\"even\">\n<td>Політична неупередженість</td>\n<td>Обов’язкова</td>\n<td>Не є основною вимогою</td>\n</tr>\n<tr class=\"odd\">\n<td>Стабільність</td>\n<td>Забезпечується законом</td>\n<td>Залежить від політичних процедур</td>\n</tr>\n<tr class=\"even\">\n<td>Відповідальність</td>\n<td>Юридична та дисциплінарна</td>\n<td>Політична та юридична</td>\n</tr>\n<tr class=\"odd\">\n<td>Приклади</td>\n<td>Державні секретарі, спеціалісти державних органів</td>\n<td>Прем’єр-міністр, міністри</td>\n</tr>\n</tbody>\n</table></div>\n<p>Правове регулювання державної служби здійснюється Законом України «Про державну службу», а політичних посад — Конституцією України та спеціальним законодавством.</p>\n<p>Наприклад, статті 113–115 Конституції України визначають засади діяльності Кабінету Міністрів України, порядок формування та підстави припинення його повноважень.</p>\n<p><strong>Головна відмінність:</strong> державний службовець професійно реалізує державну політику, а політична посадова особа визначає її основні напрями та здійснює політичне керівництво</p>"}, {"n": 45, "t": "Поняття та види державних службовців. Поняття і види службовців місцевого самоврядування. Посадові особи та їх види", "h": "<p><strong>Державний службовець</strong> — відповідно до п. 2 ч. 1 ст. 2 Закону України «Про державну службу», громадянин України, який займає посаду державної служби в державному органі, отримує заробітну плату за рахунок державного бюджету та здійснює повноваження, пов’язані з виконанням завдань і функцій державного органу.</p>\n<p><strong>Основні ознаки державного службовця:</strong></p>\n<ul>\n<li><p>громадянство України;</p></li>\n<li><p>зайняття посади державної служби;</p></li>\n<li><p>професійний характер діяльності;</p></li>\n<li><p>оплата праці з державного бюджету;</p></li>\n<li><p>виконання функцій держави;</p></li>\n<li><p>дотримання спеціального правового статусу.</p></li>\n</ul>\n<p><strong>Види державних службовців:</strong></p>\n<p>1. За категоріями посад:</p>\n<ul>\n<li><p>категорія «А»;</p></li>\n<li><p>категорія «Б»;</p></li>\n<li><p>категорія «В».</p></li>\n</ul>\n<p>2. За характером повноважень:</p>\n<ul>\n<li><p>керівники, які здійснюють організаційно-розпорядчі функції;</p></li>\n<li><p>службовці, які виконують адміністративні, аналітичні та експертні завдання;</p></li>\n<li><p>службовці, які виконують контрольні, фінансові та регуляторні функції.</p></li>\n</ul>\n<p>3. За органом проходження служби:</p>\n<ul>\n<li><p>службовці міністерств;</p></li>\n<li><p>службовці центральних органів виконавчої влади;</p></li>\n<li><p>службовці місцевих державних адміністрацій;</p></li>\n<li><p>службовці інших державних органів.</p></li>\n</ul>\n<p><strong>Служба в органах місцевого самоврядування</strong> — професійна діяльність громадян України, спрямована на реалізацію права територіальних громад на місцеве самоврядування та виконання відповідних повноважень.</p>\n<p>За чинним Законом України «Про службу в органах місцевого самоврядування» № 2493-III центральною категорією є посадова особа місцевого самоврядування.</p>\n<p><strong>Види осіб, які проходять службу в органах місцевого самоврядування:</strong></p>\n<ol>\n<li><p>Особи, які займають виборні посади (сільський, селищний, міський голова).</p></li>\n<li><p>Особи, які обираються або затверджуються відповідною радою (секретар ради).</p></li>\n<li><p>Особи, які призначаються на посади в органах місцевого самоврядування (керівники структурних підрозділів, спеціалісти та інші працівники).</p></li>\n</ol>\n<p><strong>Посадова особа</strong> — це особа, яка займає посаду в державному органі або органі місцевого самоврядування та наділена відповідними владними, організаційно-розпорядчими чи адміністративно-господарськими повноваженнями.</p>\n<p><strong>Види посадових осіб:</strong></p>\n<p>1. За належністю до системи влади:</p>\n<ul>\n<li><p>посадові особи державних органів;</p></li>\n<li><p>посадові особи місцевого самоврядування.</p></li>\n</ul>\n<p>2. За характером повноважень:</p>\n<ul>\n<li><p>організаційно-розпорядчі;</p></li>\n<li><p>адміністративно-господарські;</p></li>\n<li><p>контрольні;</p></li>\n<li><p>консультативно-дорадчі.</p></li>\n</ul>\n<p>3. За порядком набуття повноважень:</p>\n<ul>\n<li><p>виборні;</p></li>\n<li><p>призначені;</p></li>\n<li><p>обрані або затверджені колегіальним органом.</p></li>\n</ul>\n<p>4. За правовим статусом:</p>\n<ul>\n<li><p>державні службовці, які обіймають керівні посади;</p></li>\n<li><p>державні службовці без керівних функцій;</p></li>\n<li><p>посадові особи місцевого самоврядування;</p></li>\n<li><p>виборні посадові особи.</p></li>\n</ul>\n<p><strong>Приклади посадових осіб місцевого самоврядування:</strong></p>\n<ul>\n<li><p>сільський, селищний, міський голова;</p></li>\n<li><p>секретар ради;</p></li>\n<li><p>керуючий справами виконавчого комітету;</p></li>\n<li><p>керівники виконавчих органів та структурних підрозділів ради.</p></li>\n</ul>\n<p>Посадові особи несуть юридичну відповідальність за неналежне виконання своїх повноважень. Основні види відповідальності: дисциплінарна, адміністративна, кримінальна та цивільно-правова.</p>"}, {"n": 46, "t": "Правовий статус публічного службовця, основні права і обов’язки", "h": "<p><strong>Публічний службовець</strong> — це особа, яка на професійній основі здійснює діяльність із виконання завдань і функцій держави або місцевого самоврядування.</p>\n<p>Правовий статус державного службовця визначається Законом України «Про державну службу» та включає права, обов’язки, гарантії, обмеження, відповідальність і порядок проходження служби.</p>\n<p><strong>Основні права державного службовця (ст. 7 Закону):</strong></p>\n<ul>\n<li><p>повага до своєї особистості, честі та гідності;</p></li>\n<li><p>належні умови для проходження державної служби;</p></li>\n<li><p>оплата праці залежно від посади, результатів службової діяльності та стажу;</p></li>\n<li><p>відпустки, соціальне та пенсійне забезпечення;</p></li>\n<li><p>професійне навчання і підвищення кваліфікації;</p></li>\n<li><p>просування по службі з урахуванням професійної компетентності;</p></li>\n<li><p>участь у професійних спілках;</p></li>\n<li><p>оскарження рішень, дій чи бездіяльності керівників;</p></li>\n<li><p>захист від незаконного втручання у службову діяльність.</p></li>\n</ul>\n<p><strong>Основні обов’язки (ст. 8 Закону):</strong></p>\n<ul>\n<li><p>дотримуватися Конституції та законів України;</p></li>\n<li><p>діяти на підставі, у межах повноважень та у спосіб, передбачені законодавством;</p></li>\n<li><p>дотримуватися принципів державної служби;</p></li>\n<li>
