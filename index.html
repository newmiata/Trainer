<p>забезпечувати ефективне виконання завдань і доручень;</p></li>\n<li><p>поважати права, свободи та законні інтереси людини;</p></li>\n<li><p>сумлінно виконувати посадові обов’язки;</p></li>\n<li><p>дотримуватися правил етичної поведінки;</p></li>\n<li><p>запобігати корупції та конфлікту інтересів;</p></li>\n<li><p>постійно підвищувати професійну компетентніст</p></li>\n</ul>"}, {"n": 47, "t": "Умови та обмеження при вступі на посаду", "h": "<p>Умови вступу на державну службу встановлені Законом України «Про державну службу».</p>\n<p><strong>Основні вимоги до кандидата:</strong></p>\n<ul>\n<li><p>бути громадянином України;</p></li>\n<li><p>володіти державною мовою відповідно до встановлених законом вимог;</p></li>\n<li><p>мати відповідний освітній рівень;</p></li>\n<li><p>відповідати вимогам до професійної компетентності;</p></li>\n<li><p>відповідати загальним і спеціальним вимогам конкретної посади.</p></li>\n</ul>\n<p>Для посад державної служби категорій:</p>\n<ul>\n<li><p><strong>«А»</strong> — вища освіта не нижче магістерського рівня, загальний стаж роботи не менше семи років, досвід роботи на посадах державної служби категорій «А» чи «Б» або на керівних посадах не менше трьох років;</p></li>\n<li><p><strong>«Б»</strong> — вища освіта не нижче ступеня бакалавра або молодшого бакалавра та досвід роботи відповідно до вимог закону;</p></li>\n<li><p><strong>«В»</strong> — вища освіта не нижче ступеня молодшого бакалавра.</p></li>\n</ul>\n<p><strong>Обмеження щодо вступу на державну службу:</strong></p>\n<p>Не може бути призначена особа, яка:</p>\n<ul>\n<li><p>визнана судом недієздатною або обмежено дієздатною;</p></li>\n<li><p>має непогашену або незняту судимість за вчинення умисного кримінального правопорушення, якщо це є законною перешкодою;</p></li>\n<li><p>позбавлена права обіймати відповідні посади;</p></li>\n<li><p>підпадає під заборони, встановлені Законом України «Про очищення влади»;</p></li>\n<li><p>не відповідає вимогам щодо громадянства, освіти або професійної компетентності;</p></li>\n<li><p>не пройшла спеціальну перевірку у випадках, передбачених законодавством.</p></li>\n</ul>\n<p>Окремі обмеження встановлює антикорупційне законодавство, зокрема щодо близьких осіб та конфлікту інтересів.</p>\n<p><strong>Важливо:</strong> вступ на державну службу, як правило, здійснюється за результатами конкурсу, крім передбачених законом винятків.</p>"}, {"n": 48, "t": "Конкурс на зайняття посади публічної служби і види конкурсних комісій. Процедура проведення конкурсу", "h": "<p><strong>Конкурс</strong> — це встановлена законом процедура добору осіб на посади державної служби з метою забезпечення рівного доступу громадян до державної служби, об’єктивного оцінювання їхніх професійних якостей та визначення найбільш компетентного кандидата.</p>\n<p>Правова основа — ст. 21–28 Закону України «Про державну службу» та Порядок проведення конкурсу, затверджений постановою КМУ № 246 від 25.03.2016.</p>\n<p><strong>Види конкурсних комісій:</strong></p>\n<ol>\n<li><p>Конкурсна комісія на посади категорії «А» — утворюється відповідно до вимог Закону для проведення конкурсу на вищі посади державної служби.</p></li>\n<li><p>Конкурсні комісії на посади категорій «Б» і «В» — утворюються суб’єктом призначення або керівником державної служби у відповідному державному органі.</p></li>\n</ol>\n<p><strong>Основні етапи проведення конкурсу:</strong></p>\n<ol>\n<li><p>Прийняття рішення про оголошення конкурсу.</p></li>\n<li><p>Оприлюднення оголошення про конкурс на офіційному вебсайті та Єдиному порталі вакансій державної служби.</p></li>\n<li><p>Подання кандидатами необхідних документів в електронній формі.</p></li>\n<li><p>Перевірка документів та допуск кандидатів до конкурсу.</p></li>\n<li><p>Проведення тестування на знання законодавства, загальних і спеціальних професійних знань.</p></li>\n<li><p>Виконання ситуаційних завдань (за передбачених процедурою умов).</p></li>\n<li><p>Проведення співбесіди та оцінювання професійної компетентності.</p></li>\n<li><p>Визначення переможця конкурсу та оприлюднення результатів.</p></li>\n</ol>\n<p>За результатами конкурсу суб’єкт призначення приймає рішення про призначення переможця на посаду.</p>\n<p>Конкурс має забезпечувати принципи законності, прозорості, рівності, об’єктивності та неупередженості.</p>\n<p>В умовах воєнного стану законодавство передбачає спеціальні правила призначення на окремі посади, зокрема можливість призначення без конкурсу у визначених законом випадках.</p>"}, {"n": 49, "t": "Призначення на посаду і присяга публічного службовця", "h": "<p><strong>Призначення на посаду</strong> — це юридичний акт суб’єкта призначення, яким особа набуває статусу державного службовця та відповідних службових прав і обов’язків.</p>\n<p>Відповідно до ст. 31 Закону України «Про державну службу», призначення здійснюється суб’єктом призначення на підставі результатів конкурсу або в інших передбачених законом випадках.</p>\n<p>Основні етапи:</p>\n<ul>\n<li><p>визначення переможця конкурсу;</p></li>\n<li><p>прийняття рішення про призначення;</p></li>\n<li><p>видання наказу або розпорядження;</p></li>\n<li><p>ознайомлення особи з посадовими обов’язками;</p></li>\n<li><p>оформлення документів про вступ на державну службу;</p></li>\n<li><p>складення Присяги державного службовця.</p></li>\n</ul>\n<p><strong>Присяга державного службовця</strong> — це урочисте зобов’язання сумлінно виконувати обов’язки, дотримуватися Конституції та законів України, захищати права і свободи людини, служити Українському народові.</p>\n<p>Текст Присяги передбачений ст. 36 Закону України «Про державну службу».</p>\n<p>Особа, яка вперше вступає на державну службу, складає Присягу під час призначення на посаду. Вона підписує текст Присяги, який зберігається в її особовій справі.</p>\n<p>Складення Присяги має важливе юридичне та морально-етичне значення, оскільки засвідчує прийняття особою публічно-службових обов’язків.</p>"}, {"n": 50, "t": "Службова кар’єра публічного службовця. Ранги службовців і порядок їх присвоєння", "h": "<p><strong>Службова кар’єра</strong> — це професійне просування державного службовця, яке передбачає розвиток його компетентності, набуття досвіду, підвищення кваліфікації та можливість зайняття вищих посад.</p>\n<p>Основними формами службової кар’єри є:</p>\n<ul>\n<li><p>горизонтальне просування — розвиток професійних компетентностей без обов’язкового переходу на вищу посаду;</p></li>\n<li><p>вертикальне просування — призначення на вищу посаду;</p></li>\n<li><p>професійний розвиток — навчання, стажування та підвищення кваліфікації.</p></li>\n</ul>\n<p>Просування здійснюється з урахуванням професійної компетентності, результатів службової діяльності та вимог законодавства.</p>\n<p><strong>Ранги державних службовців</strong></p>\n<p>Відповідно до ст. 39 Закону України «Про державну службу», встановлено дев’ять рангів державних службовців.</p>\n<div class=\"tw\"><table>\n<colgroup>\n<col style=\"width: 64%\" />\n<col style=\"width: 35%\" />\n</colgroup>\n<thead>\n<tr class=\"header\">\n<th><strong>Категорія посади</strong></th>\n<th><strong>Ранги</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr class=\"odd\">\n<td>«А»</td>\n<td>1, 2, 3</td>\n</tr>\n<tr class=\"even\">\n<td>«Б»</td>\n<td>3, 4, 5, 6</td>\n</tr>\n<tr class=\"odd\">\n<td>«В»</td>\n<td>6, 7, 8, 9</td>\n</tr>\n</tbody>\n</table></div>\n<p>Ранг є спеціальним званням державного службовця, що характеризує його службове становище.</p>\n<p><strong>Порядок присвоєння рангів:</strong></p>\n<ul>\n<li><p>ранг присвоюється одночасно з призначенням на посаду державної служби;</p></li>\n<li><p>державному службовцю присвоюється найнижчий ранг у межах відповідної категорії посад;</p></li>\n<li><p>черговий ранг присвоюється з урахуванням результатів службової діяльності та строку перебування в попередньому ранзі;</p></li>\n<li><p>присвоєння рангів оформлюється відповідним актом суб’єкта призначення;</p></li>\n<li><p>за особливі досягнення можливе дострокове присвоєння чергового рангу у встановленому законом порядку.</p></li>\n</ul>\n<p>Ранги зберігаються за державним службовцем у разі переходу на іншу посаду державної служби, крім випадків, передбачених законом.</p>"}, {"n": 51, "t": "Антикорупційні обмеження при проходженні публічної служби", "h": "<p>Антикорупційні обмеження — це встановлені законом заборони та вимоги, спрямовані на запобігання корупції, зловживанню службовим становищем і використанню публічних повноважень у приватних інтересах.</p>\n<p>Основним нормативним актом є Закон України «Про запобігання корупції».</p>\n<p><strong>Основні обмеження:</strong></p>\n<p>1. <strong>Обмеження щодо використання службових повноважень (ст. 22).</strong> Забороняється використовувати службові повноваження або пов’язану з ними інформацію з метою одержання неправомірної вигоди.</p>\n<p>2. <strong>Обмеження щодо одержання подарунків (ст. 23–24).</strong> Забороняється одержувати подарунки у зв’язку зі здійсненням службової діяльності, крім випадків та в межах, прямо дозволених законом.</p>\n<p>3. <strong>Обмеження щодо сумісництва та суміщення (ст. 25).</strong> Забороняється займатися іншою оплачуваною або підприємницькою діяльністю, крім визначених законом винятків, зокрема викладацької, наукової, творчої діяльності, медичної практики та інструкторської і суддівської практики зі спорту.</p>\n<p>4. <strong>Обмеження після припинення діяльності (ст. 26).</strong> Встановлюються заборони щодо використання службової інформації та взаємодії з колишнім органом з метою впливу на його рішення.</p>\n<p>5. <strong>Обмеження спільної роботи близьких осіб (ст. 27).</strong> Забороняється безпосереднє підпорядкування близьких осіб у випадках, визначених законом.</p>\n<p>6. <strong>Запобігання та врегулювання конфлікту інтересів (ст. 28).</strong> Службовець зобов’язаний повідомляти про реальний або потенційний конфлікт інтересів і не допускати прийняття рішень в умовах такого конфлікту без його належного врегулювання.</p>\n<p>7. <strong>Фінансовий контроль (ст. 45–52).</strong> Передбачає подання декларацій, повідомлень про суттєві зміни в майновому стані та повідомлень про відкриття валютного рахунку в банку-нерезиденті у випадках, установлених законом.</p>\n<p>За порушення антикорупційних обмежень передбачена дисциплінарна, адміністративна або кримінальна відповідальність залежно від характеру правопорушення.</p>"}, {"n": 52, "t": "Дисциплінарна відповідальність публічних службовців. Підстави та види дисциплінарних стягнень", "h": "<p><strong>Дисциплінарна відповідальність державного службовця</strong> — це вид юридичної відповідальності, що настає за вчинення дисциплінарного проступку та полягає у застосуванні до службовця передбачених законом дисциплінарних стягнень.</p>\n<p>Правова основа — Закон України «Про державну службу», зокрема ст. 64–78.</p>\n<p><strong>Підставою дисциплінарної відповідальності</strong> є вчинення дисциплінарного проступку, тобто винного протиправного невиконання або неналежного виконання державним службовцем своїх службових обов’язків.</p>\n<p>До основних дисциплінарних проступків належать:</p>\n<ul>\n<li><p>порушення Присяги державного службовця;</p></li>\n<li><p>порушення правил етичної поведінки;</p></li>\n<li><p>вияв неповаги до держави, державних символів України, Українського народу;</p></li>\n<li><p>дії, що шкодять авторитету державної служби;</p></li>\n<li><p>невиконання або неналежне виконання посадових обов’язків;</p></li>\n<li><p>перевищення службових повноважень;</p></li>\n<li><p>порушення правил внутрішнього службового розпорядку;</p></li>\n<li><p>недотримання правил охорони праці та пожежної безпеки;</p></li>\n<li><p>прийняття необґрунтованих рішень;</p></li>\n<li><p>порушення вимог антикорупційного законодавства, якщо воно становить дисциплінарний проступок.</p></li>\n</ul>\n<p><strong>Види дисциплінарних стягнень (ст. 66 Закону):</strong></p>\n<ol>\n<li><p><strong>Зауваження</strong> — найм’якше дисциплінарне стягнення, яке застосовується за менш значні порушення.</p></li>\n<li><p><strong>Догана</strong> — застосовується за порушення службової дисципліни, передбачені законом.</p></li>\n<li><p><strong>Попередження про неповну службову відповідність</strong> — застосовується за більш серйозні або повторні дисциплінарні проступки.</p></li>\n<li><p><strong>Звільнення з посади державної служби</strong> — найсуворіше дисциплінарне стягнення, що застосовується за передбачені законом проступки.</p></li>\n</ol>\n<p><strong>Порядок притягнення до дисциплінарної відповідальності:</strong></p>\n<ul>\n<li><p>встановлення факту можливого дисциплінарного проступку;</p></li>\n<li><p>утворення дисциплінарної комісії у передбачених законом випадках;</p></li>\n<li><p>проведення дисциплінарного провадження;</p></li>\n<li><p>отримання пояснень державного службовця;</p></li>\n<li><p>встановлення вини, обставин та тяжкості проступку;</p></li>\n<li><p>прийняття рішення суб’єктом призначення;</p></li>\n<li><p>видання наказу про застосування дисциплінарного стягнення.</p></li>\n</ul>\n<p>Під час вибору стягнення враховуються тяжкість проступку, обставини його вчинення, ступінь вини, попередня поведінка службовця та результати його службової діяльності.</p>\n<p>Державний службовець має право оскаржити рішення про застосування дисциплінарного стягнення в установленому законом порядку, зокрема до адміністративного суду.</p>"}, {"n": 53, "t": "Підстави та види припинення публічної служби. Антикорупційні обмеження після припинення публічної служби", "h": "<p><strong>Припинення державної служби</strong> — це припинення службово-правових відносин між державним службовцем і державним органом на підставах, передбачених законодавством.</p>\n<p>Правове регулювання здійснюється розділом IX Закону України «Про державну службу» (ст. 83–91).</p>\n<p><strong>Основні підстави припинення державної служби:</strong></p>\n<ol>\n<li><p><strong>За угодою сторін</strong> — за взаємною згодою державного службовця та суб’єкта призначення.</p></li>\n<li><p><strong>За ініціативою державного службовця</strong> — подання заяви про звільнення.</p></li>\n<li><p><strong>За ініціативою суб’єкта призначення</strong> — у випадках, передбачених законом, зокрема скорочення посади, дисциплінарного звільнення або невідповідності встановленим вимогам.</p></li>\n<li><p><strong>У зв’язку із закінченням строку призначення</strong> — якщо особу призначено на строкову посаду.</p></li>\n<li><p><strong>У зв’язку з обставинами, що не залежать від волі сторін</strong> — наприклад, призов або вступ на військову службу у випадках, передбачених законом, смерть державного службовця.</p></li>\n<li><p><strong>У зв’язку з втратою права на державну службу або його обмеженням</strong> — за наявності встановлених законом підстав.</p></li>\n<li><p><strong>У зв’язку з досягненням граничного віку перебування на державній службі</strong> — з урахуванням законодавчих винятків.</p></li>\n</ol>\n<p>Припинення державної служби оформлюється відповідним наказом або розпорядженням суб’єкта призначення.</p>\n<p><strong>Антикорупційні обмеження після припинення публічної служби</strong></p>\n<p>Відповідно до ст. 26 Закону України «Про запобігання корупції», для колишніх державних службовців установлюються спеціальні обмеження.</p>\n<p>Протягом одного року після припинення діяльності, пов’язаної з виконанням функцій держави або місцевого самоврядування, особі забороняється:</p>\n<ul>\n<li><p>укладати трудові договори або вчиняти правочини у сфері підприємницької діяльності з юридичними особами приватного права або фізичними особами-підприємцями, щодо яких вона протягом останнього року перебування на службі здійснювала контроль, нагляд або підготовку чи прийняття відповідних рішень;</p></li>\n<li><p>розголошувати або використовувати у своїх інтересах інформацію, яка стала відома у зв’язку з виконанням службових повноважень, крім випадків, установлених законом;</p></li>\n<li><p>представляти інтереси будь-якої особи у справах, у яких іншою стороною є державний орган або орган місцевого самоврядування, в якому колишній службовець працював на момент припинення діяльності, крім випадків, установлених законом.</p></li>\n</ul>\n<p>Метою цих обмежень є запобігання використанню колишнім службовцем службових зв’язків, інформації та впливу для отримання неправомірної вигоди.</p>\n<p>За порушення зазначених обмежень передбачена відповідальність відповідно до законодавства.</p>"}];
let KA={};try{KA=JSON.parse(localStorage.getItem("ka")||"{}")}catch(e){}

function admLayout(){const n=document.getElementById("anav"),w=document.querySelector("#adm .w");if(!n||document.getElementById("adm").style.display==="none")return;
 w.style.paddingBottom=(n.offsetHeight+16)+"px";
 if(amode===0){aapp.style.display="flex";aapp.style.flexDirection="column";aapp.style.justifyContent=aflip?"flex-start":"center";aapp.style.minHeight="0px";const top=aapp.getBoundingClientRect().top+scrollY;aapp.style.minHeight=Math.max(0,innerHeight-top-n.offsetHeight-16)+"px"}
 else{aapp.style.display="";aapp.style.flexDirection="";aapp.style.justifyContent="";aapp.style.minHeight=""}}
new MutationObserver(admLayout).observe(aapp,{childList:true});addEventListener("resize",admLayout);

$("#at1").onclick=()=>{amode=0;admStart()};$("#at2").onclick=()=>{amode=1;admStart()};

function admCards(reset){if(reset){adeck=shuf(ADM.filter(d=>KA[d.n]!==1));ai=0;aflip=false}
 if(!adeck.length){aapp.innerHTML='<p class="info">Усі картки вже вивчено. Щоб почати заново, зітріть результат.</p><div class="row"><button id="aall" class="rs">Стерти результат</button></div>';$("#aall").onclick=()=>{$("#cf").style.display="flex"};return}
 const d=adeck[ai],kn=Object.values(KA).filter(v=>v===1).length;

 $("#ac").onclick=()=>{aflip=!aflip;admCards()};
 const nx=v=>{if(v!=null){KA[d.n]=v;svA();PF.cards++;spf()}if(ai<adeck.length-1){ai++;aflip=false;admCards()}else{aapp.innerHTML='<p class="info">Коло завершено. Вивчено: '+Object.values(KA).filter(x=>x===1).length+' з '+ADM.length+'.</p><div class="row"><button id="aag" class="p">Ще раз</button></div>';$("#aag").onclick=()=>admCards(true)}};
 $("#aok").onclick=()=>nx(1);$("#ano").onclick=()=>nx(0);
 $("#apv").onclick=()=>{if(ai>0){ai--;aflip=false;admCards()}};$("#ash").onclick=()=>admCards(true)}

 const rx=ws.length?new RegExp("("+ws.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").replace(/[ʼ'`’]/g,"[ʼ'`’]")).join("|")+")","gi"):null;
 const L=ADM.filter(d=>!ws.length||ws.every(w=>anz(d.t+" "+d.h.replace(/<[^>]+>/g," ")).includes(anz(w))));
 const hlh=x=>rx?x.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,txt)=>tag?tag:txt.replace(rx,"<mark>$1</mark>")):x;
 $("#asr").innerHTML=(ws.length?'<p class="info">Знайдено питань: '+L.length+'</p>':'')+(L.length?L.map(d=>'<details class="ad"'+(ws.length?' open':'')+'><summary>'+d.n+'. '+hlh(esc(d.t))+'</summary><div class="ahtml">'+hlh(d.h)+'</div></details>').join(""):'<p class="info">Нічого не знайдено</p>')}
