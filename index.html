чину під впливом обману?:", "a": "Відшкодування потерпілій стороні збитків та моральної шкоди (ст. 230 ч. 2) — на додаток до реституції.", "o": ["Відшкодування збитків і моральної шкоди потерпілій стороні", "Конфіскація", "Лише реституція", "Штраф до бюджету"]}, {"id": 165, "q": "Який спеціальний правовий наслідок правочину, вчиненого у результаті зловмисної домовленості представника однієї сторони з другою стороною?:", "a": "Правочин визнається судом недійсним за позовом потерпілої сторони (ст. 232 ч. 1); потерпіла сторона має право на відшкодування збитків і моральної шкоди, які вона зазнала внаслідок зловмисної домовленості представника однієї сторони з другою стороною (ч. 2).", "o": ["Недійсний судом; збитки та моральна шкода потерпілій стороні", "Нікчемний", "Дійсний", "Фіктивний"]}, {"id": 166, "q": "Які правові наслідки фіктивного правочину?:", "a": "Фіктивний правочин визнається судом недійсним (ст. 234), застосовується двостороння реституція (ст. 216).", "o": ["Визнається судом недійсним; двостороння реституція", "Нікчемний, наслідків немає", "Дійсний", "Перекваліфіковується в удаваний"]}, {"id": 167, "q": "З якого моменту настає недійсність правочину?:", "a": "З моменту його вчинення (ст. 236 ч. 1). Якщо за правочином, недійсним з певних підстав, його недійсність настає з моменту визнання судом, — це прямо вказується в законі.", "o": ["З моменту його вчинення", "З моменту визнання судом", "З моменту виконання", "З моменту набрання чинності рішенням"]}, {"id": 168, "q": "Який орган (органи) може (можуть) визнати правочин недійсним?:", "a": "Суд (ст. 215 ч. 3). Недійсність нікчемних правочинів встановлена самим законом.", "o": ["Суд", "Нотаріус", "Орган опіки", "Державний реєстратор"]}, {"id": 169, "q": "Який правовий наслідок правочину, який порушує публічний порядок?:", "a": "Правочин, що порушує публічний порядок, є нікчемним (ст. 228 ч. 1). Якщо обидві сторони діяли умисно, усе одержане ними в дохід держави; якщо умисел лише в однієї сторони — друга сторона повертає своє, а одержане від неї — в дохід держави (ст. 228 ч. 3).", "o": ["Нікчемний; при умислі обох сторін усе одержане — в дохід держави", "Оспорюваний", "Дійсний", "Нікчемний без наслідків"]}, {"id": 170, "q": "Які із наведених правочинів є нікчемними?:", "a": "Нікчемні правочини (недійсні за законом): що обмежують правоздатність фізичної особи (ст. 27 ч. 1); без нотаріального посвідчення (ст. 219–220); вчинені малолітньою особою за межами дієздатності (ст. 221 ч. 1); без дозволу органу опіки та піклування (ст. 224 ч. 1); вчинені недієздатною фізичною особою (ст. 226 ч. 1); що порушують публічний порядок (ст. 228).", "o": ["Малолітньої за межами дієздатності; недієздатної; без дозволу опіки; без нотаріальної форми", "Неповнолітньої за межами дієздатності", "Під впливом обману", "Під впливом помилки"]}, {"id": 171, "q": "Які із наведених правочинів є нікчемними?:", "a": "Нікчемні правочини (недійсні за законом): що обмежують правоздатність фізичної особи (ст. 27 ч. 1); без нотаріального посвідчення (ст. 219–220); вчинені малолітньою особою за межами дієздатності (ст. 221 ч. 1); без дозволу органу опіки та піклування (ст. 224 ч. 1); вчинені недієздатною фізичною особою (ст. 226 ч. 1); що порушують публічний порядок (ст. 228).", "o": ["Малолітньої за межами дієздатності; недієздатної; без дозволу опіки; без нотаріальної форми", "Неповнолітньої за межами дієздатності", "Під впливом обману", "Під впливом помилки"]}, {"id": 172, "q": "Які із наведених правочинів є нікчемними?:", "a": "Нікчемні правочини (недійсні за законом): що обмежують правоздатність фізичної особи (ст. 27 ч. 1); без нотаріального посвідчення (ст. 219–220); вчинені малолітньою особою за межами дієздатності (ст. 221 ч. 1); без дозволу органу опіки та піклування (ст. 224 ч. 1); вчинені недієздатною фізичною особою (ст. 226 ч. 1); що порушують публічний порядок (ст. 228).", "o": ["Малолітньої за межами дієздатності; недієздатної; без дозволу опіки; без нотаріальної форми", "Неповнолітньої за межами дієздатності", "Під впливом обману", "Під впливом помилки"]}, {"id": 173, "q": "Які із наведених правочинів є оспорюваними?:", "a": "Оспорювані правочини (визнаються судом недійсними): вчинені неповнолітньою особою за межами її дієздатності (ст. 222), особою з обмеженою дієздатністю (ст. 223), дієздатною особою, яка не усвідомлювала значення своїх дій (ст. 225), юридичною особою без ліцензії (ст. 227), під впливом помилки (ст. 229), обману (ст. 230), насильства (ст. 231), зловмисної домовленості представника (ст. 232), тяжких обставин (ст. 233), фіктивні (ст. 234).", "o": ["Помилка, обман, насильство, зловмисна домовленість, тяжкі обставини", "Нотаріальна форма, публічний порядок", "Малолітня особа, недієздатна", "Без дозволу опіки"]}, {"id": 174, "q": "Які із наведених правочинів є оспорюваними?:", "a": "Оспорювані правочини (визнаються судом недійсними): вчинені неповнолітньою особою за межами її дієздатності (ст. 222), особою з обмеженою дієздатністю (ст. 223), дієздатною особою, яка не усвідомлювала значення своїх дій (ст. 225), юридичною особою без ліцензії (ст. 227), під впливом помилки (ст. 229), обману (ст. 230), насильства (ст. 231), зловмисної домовленості представника (ст. 232), тяжких обставин (ст. 233), фіктивні (ст. 234).", "o": ["Помилка, обман, насильство, зловмисна домовленість, тяжкі обставини", "Нотаріальна форма, публічний порядок", "Малолітня особа, недієздатна", "Без дозволу опіки"]}, {"id": 175, "q": "Які із наведених правочинів є оспорюваними?:", "a": "Оспорювані правочини (визнаються судом недійсними): вчинені неповнолітньою особою за межами її дієздатності (ст. 222), особою з обмеженою дієздатністю (ст. 223), дієздатною особою, яка не усвідомлювала значення своїх дій (ст. 225), юридичною особою без ліцензії (ст. 227), під впливом помилки (ст. 229), обману (ст. 230), насильства (ст. 231), зловмисної домовленості представника (ст. 232), тяжких обставин (ст. 233), фіктивні (ст. 234).", "o": ["Помилка, обман, насильство, зловмисна домовленість, тяжкі обставини", "Нотаріальна форма, публічний порядок", "Малолітня особа, недієздатна", "Без дозволу опіки"]}, {"id": 176, "q": "Що із наведеного належить до загальних правових наслідків недійсності правочину?:", "a": "Двостороння реституція: кожна сторона зобов’язана повернути другій у натурі все, що отримала за правочином, а якщо це неможливо — відшкодувати вартість за цінами на момент відшкодування (ст. 216 ч. 1–2). Також відшкодування збитків і моральної шкоди винною стороною (ч. 3). Недійсний правочин не створює юридичних наслідків, крім пов’язаних із його недійсністю.", "o": ["Двостороння реституція, збитки і моральна шкода", "Лише повернення речі", "Лише відшкодування збитків", "Конфіскація"]}, {"id": 177, "q": "Які правочини НЕ вважаються такими, що порушують публічний порядок?:", "a": "Правочин порушує публічний порядок, якщо він спрямований на порушення конституційних прав і свобод людини і громадянина, знищення, пошкодження майна фізичної чи юридичної особи, держави, територіальної громади або незаконне заволодіння ним (ст. 228 ч. 1). Не порушують — звичайні цивільні правочини, що таких цілей не мають (купівля-продаж, оренда тощо).", "o": ["Порушення конституційних прав, знищення чи пошкодження майна, незаконне заволодіння", "Ухилення від податків", "Невиконання договору", "Недотримання форми"]}, {"id": 178, "q": "Яка помилка може бути підставою для визнання вчиненого під її впливом правочину недійсним?:", "a": "Істотна помилка: щодо природи правочину, прав та обов’язків сторін, властивостей або якостей предмета, які значно знижують його цінність або можливість використання за призначенням (ст. 229 ч. 1–2). Помилка щодо мотивів правочину істотного значення не має, крім випадків, встановлених законом (ч. 3).", "o": ["Помилка щодо природи правочину, прав та обов’язків, властивостей речі", "Помилка щодо мотивів", "Помилка щодо вартості", "Помилка щодо наміру іншої сторони"]}, {"id": 179, "q": "Виберіть правильні положення що правових наслідків правочину, вчиненого з недодержанням письмової форми, встановленої законом:", "a": "Недодержання письмової форми не робить правочин недійсним, якщо закон прямо цього не встановлює; у разі спору сторони не мають права посилатися на свідчення свідків для підтвердження правочину та його умов, але можуть наводити письмові та інші докази (ст. 218).", "o": ["Не має наслідком недійсність; у спорі не можна посилатися на свідків", "Правочин нікчемний", "Правочин оспорюваний", "Правочин не вважається вчиненим"]}, {"id": 180, "q": "Хто може звернутися до суду зі позовом про визнання недійсним правочину, вчиненого дієздатною фізичною особою, яка в момент його вчинення не усвідомлювала значення своїх дій та/або не могла керувати ними?:", "a": "Позов про визнання недійсним правочину, вчиненого дієздатною особою, яка не усвідомлювала значення своїх дій та (або) не могла керувати ними, може подати ця особа, а в разі її смерті — інші особи, чиї цивільні права чи інтереси порушені (ст. 225 ч. 1).", "o": ["Ця особа, а після її смерті — інші особи, чиї права порушені", "Лише орган опіки", "Лише спадкоємці", "Лише прокурор"]}, {"id": 181, "q": "Виберіть правильні положення щодо фіктивного правочину:", "a": "Фіктивним є правочин, вчинений без наміру створення правових наслідків, обумовлених ним; визнається судом недійсним (ст. 234); наслідок — двостороння реституція (ст. 216). Намір сторін формально оформити правочин без реальних наслідків — його ознака.", "o": ["Вчинений без наміру створення правових наслідків; недійсний судом", "Вчинений для приховання іншого", "Вчинений під тиском", "Без нотаріуса"]}, {"id": 182, "q": "Виберіть правильні положення щодо удаваного правочину:", "a": "Удаваним є правочин, вчинений сторонами для приховання іншого правочину, який вони насправді вчинили (ст. 235 ч. 1). Він недійсний; до відносин сторін застосовуються правила того правочину, який вони насправді вчинили (ч. 2), якщо той не суперечить закону.", "o": ["Вчинений для приховання іншого; діють правила щодо прихованого правочину", "Вчинений без наміру створення наслідків", "Нікчемний без наслідків", "Оспорюваний без прихованого правочину"]}, {"id": 183, "q": "Виберіть правильні твердження щодо правочину, вчиненого під впливом обману:", "a": "Обман — умисне введення в оману щодо обставин, які мають істотне значення (ст. 230 ч. 1); умисним обманом є й замовчування обставин, про які сторона повинна була повідомити. Правочин визнається судом недійсним за позовом потерпілої сторони; вона має право на відшкодування збитків і моральної шкоди (ч. 2). Обман з боку третьої особи теж може бути підставою.", "o": ["Умисне введення в оману щодо істотних обставин", "Помилка однієї сторони", "Тиск з боку третьої особи", "Невідомі обставини"]}, {"id": 184, "q": "Як називається правовідношення, в якому одна сторона зобов’язана або має право вчинити правочин від імені другої сторони, яку вона представляє?", "a": "Представництво — правовідношення, в якому одна сторона (представник) зобов’язана або має право вчинити правочин від імені другої сторони, яку вона представляє (ст. 237 ч. 1).", "o": ["Правовідношення, де представник вчиняє правочин від імені представленого", "Дія особи від свого імені в чужих інтересах", "Передача повноважень", "Договір доручення"]}, {"id": 185, "q": "Як називається особа, яка постійно та самостійно виступає представником підприємців при укладенні ними договорів у сфері підприємницької діяльності?", "a": "Комерційний представник — особа, яка постійно та самостійно представляє підприємців при укладенні ними договорів у сфері підприємницької діяльності (ст. 243 ч. 1).", "o": ["Особа, що постійно та самостійно представляє підприємців при укладенні договорів", "Особа, що представляє фізичних осіб", "Особа, що діє від свого імені", "Посередник без повноважень"]}, {"id": 186, "q": "Які є підстави виникнення представництва?", "a": "Договір, закон, акт органу юридичної особи, акт органу державної влади чи місцевого самоврядування; також інші підстави (ст. 237 ч. 2).", "o": ["Договір, закон, акт органу юридичної особи, акт органу влади", "Лише договір", "Лише закон", "Договір і рішення суду"]}, {"id": 187, "q": "Які правові наслідки вчинення правочину представником?", "a": "Правочин, вчинений представником, створює, змінює, припиняє цивільні права та обов’язки для особи, яку він представляє (довірителя), а не для самого представника (ст. 237 ч. 1).", "o": ["У особи, яку представляють", "У представника", "У третьої особи", "Не виникають"]}, {"id": 188, "q": "Фізична особа А. уклала договір з ТзОВ «Б», згідно якого Фізична особа А. зобов’язувалася вести переговори з партнерами ТзОВ «Б» про укладення в майбутньому договору підряду. Який правовий статус Фізичної особи А.?", "a": "Вона не є представником: особа, яка лише веде переговори про можливі в майбутньому правочини і не уповноважена вчиняти правочин від імені ТОВ «Б», представником не вважається (ст. 237 ч. 3). Її статус — особа, що виконує посередницькі (організаційні) дії за договором, без повноважень укладати договір підряду.", "o": ["Не є представником: лише веде переговори без повноважень на правочин", "Є комерційним представником", "Є законним представником", "Є представником за довіреністю"]}, {"id": 189, "q": "Як називається документ, що видається однією особою іншій особі для представництва перед третіми особами?", "a": "Довіреність — письмовий документ, що видається однією особою іншій особі для представництва перед третіми особами (ст. 244 ч. 1).", "o": ["Письмовий документ для представництва перед третіми особами", "Договір доручення", "Нотаріальний акт", "Усне уповноваження"]}, {"id": 190, "q": "У довіреності, яка була видана юридичною особою на представництво в державних органах, НЕ були вказані строк довіреності та дата її видачі, а також не було відбитку печатки юридичної особи. Які правові наслідки видачі такої довіреності?", "a": "Довіреність без вказаної дати є нікчемною (ст. 247). Відсутність строку не є підставою недійсності — довіреність зберігає чинність до припинення її дії (ст. 247 ч. 1). Відсутність печатки на довіреності від юридичної особи сама по собі підставою недійсності не є; довіреність видає орган або особа, уповноважена установчими документами (ст. 246). ⚠️ Звіряйте номер частини ст. 247 з чинним текстом.", "o": ["Нікчемна через відсутність дати", "Дійсна, строк — один рік", "Оспорювана", "Дійсна без обмежень"]}, {"id": 191, "q": "Які правові наслідки видачі довіреності, строк якої не встановлений?", "a": "Довіреність зберігає чинність до припинення її дії (ст. 247 ч. 1), тобто діє безстроково, доки не припиниться з підстав ст. 248 або не буде скасована.", "o": ["Діє до припинення", "Діє один рік", "Діє три роки", "Нікчемна"]}, {"id": 192, "q": "Фізична особа «М» уповноважила Фізичну особу «Ф» на укладення договору купівлі-продажу квартири (згідно ЦК України договір купівлі-продажу нерухомого майна потребує нотаріального посвідчення). Яким вимогам має відповідати довіреність?", "a": "Довіреність на укладення договору купівлі-продажу квартири має відповідати формі самого правочину (ст. 245 ч. 1), тобто бути нотаріально посвідченою. Вона має бути письмовою, містити дату, відомості про довірителя та представника, обсяг повноважень.", "o": ["Нотаріальна форма", "Проста письмова", "Усна", "Посвідчена керівником"]}, {"id": 193, "q": "Дружина військовослужбовця вирішила видати довіреність на укладення договору купівлі-продажу, перебуваючи на лікуванні в санаторії. До кого їй слід звернутися для посвідчення?", "a": "До нотаріуса. Довіреність на розпорядження нерухомим майном (купівля-продаж квартири) має бути нотаріально посвідчена; довіреності, прирівняні до нотаріальних, які посвідчує головний лікар закладу охорони здоров’я чи санаторію, на такі правочини не видаються (ст. 245 ч. 3–4). ⚠️ Якщо йдеться про правочин, що не потребує нотаріальної форми, довіреність може посвідчити головний лікар, його заступник з медичної частини або черговий лікар.", "o": ["До нотаріуса", "До головного лікаря санаторію", "До сільського голови", "До командира частини"]}, {"id": 194, "q": "Фізична особа Р., яка є представником Фізичної особи Д., через тяжку хворобу не мала можливості укласти договір на виконання своїх повноважень. Тоді Р. видала довіреність у порядку передоручення без згоди та наступного повідомлення Д. Фізичній особі З. Остання уклала договір з перевищенням повноважень. Хто буде суб’єктом відповідальності?", "a": "За ст. 240: представник Р. передала повноваження без згоди довірителя та не повідомила його, тому відповідає за дії заступника (З.) як за свої (хоча передоручення могло бути вимушене обставинами). Оскільки З. перевищила повноваження, правочин створює права та обов’язки для Д. лише в разі наступного схвалення (ст. 241); без схвалення — для самої З. Отже, суб’єкти відповідальності: З. (перед контрагентом) та Р. (перед Д.) ⚠️ Звіряйте з варіантами.", "o": ["Р. відповідає за З. як за себе; для Д. правочин створює права лише після схвалення", "Лише З.", "Лише Д.", "Нікому"]}, {"id": 195, "q": "Фізична особа «Л» видала довіреність Фізичній особі «З» 02.01.2020 р., строком на 5 років, однак без поважних причин скасувала власною заявою від 10.02.2021 р. Яке має правове значення довіреність за даних обставин?", "a": "Довірителю надано право скасувати довіреність у будь-який час, незалежно від причин (ст. 249 ч. 1). Тому довіреність втратила чинність з моменту скасування (повідомлення представника та відомих третіх осіб, ч. 2–3); вказаний у ній строк (5 років) на цей момент уже не має значення. Правочини, вчинені до того, як представник і треті особи дізналися про скасування, зберігають силу.", "o": ["Припинилася з моменту скасування", "Діє до 5 років", "Діє, поки не повернуто", "Недійсна"]}, {"id": 196, "q": "Які правові наслідки у випадку вчинення представником правочину з перевищенням повноважень?", "a": "Правочин створює, змінює, припиняє права та обов’язки особи, яку представляють, лише в разі її наступного схвалення (ст. 241). Без схвалення права та обов’язки виникають у самого представника (особи, яка перевищила повноваження).", "o": ["Створює права для довірителя лише після схвалення; інакше для представника", "Нікчемний", "Дійсний для довірителя без схвалення", "Оспорюваний"]}, {"id": 197, "q": "Хто може бути законним представником фізичної особи, яка досягла 16 років та позбавлена батьківського піклування (батьки позбавлені батьківських прав)?", "a": "Піклувальник, призначений судом або органом опіки та піклування (неповнолітня особа, позбавлена батьківського піклування, — ст. 60 ч. 4, ст. 61, 63; законне представництво — ст. 242).", "o": ["Піклувальник", "Опікун", "Батьки", "Орган опіки"]}, {"id": 198, "q": "За якої умови допускається представництво одночасно кількох сторін правочину?", "a": "Це допускається лише у випадках комерційного представництва та в інших випадках, прямо встановлених законом (ст. 238 ч. 3 — заборона для представника вчиняти правочини щодо особи, представником якої він одночасно є; ст. 243 — комерційний представник може представляти кількох сторін за їхньою згодою). ⚠️ Звіряйте номери частин із чинним текстом.", "o": ["Лише комерційне представництво та випадки закону", "Завжди за згодою", "Завжди заборонено", "За рішенням суду"]}, {"id": 199, "q": "Яке правове значення має умова договору про відмову від права на скасування довіреності?", "a": "Така умова є нікчемною (ст. 249 ч. 1). Довіритель може скасувати довіреність у будь-який час, за винятком безвідкличної довіреності.", "o": ["Нікчемна", "Дійсна", "Оспорювана", "Умовна"]}, {"id": 200, "q": "Що є ознакою представництва?", "a": "Ознака представництва: представник діє від імені довірителя, в його інтересах і в межах повноважень; правові наслідки виникають у довірителя (ст. 237).", "o": ["Діє від імені довірителя в межах повноважень; наслідки для довірителя", "Діє від свого імені в чужих інтересах", "Діє на свою користь", "Діє без повноважень"]}, {"id": 201, "q": "До якого виду представництва слід відносити комерційне представництво?", "a": "До договірного (добровільного) представництва: комерційне представництво ґрунтується на договорі з підприємцем та довіреності (ст. 243).", "o": ["До договірного", "До законного", "До примусового", "До судового"]}, {"id": 202, "q": "Які довіреності НЕ прирівнюються до нотаріально посвідчених?", "a": "Не прирівнюються до нотаріально посвідчених довіреності на розпорядження нерухомістю й іншим майном, що підлягає нотаріальній формі; на управління та розпорядження корпоративними правами; на користування та розпорядження транспортними засобами; довіреності, посвідчені особами, не названими в ст. 245 ч. 3 (ст. 245). ⚠️ Звіряйте з варіантами.", "o": ["Довіреності на нерухомість, корпоративні права, транспортні засоби", "Довіреності на отримання пенсії", "Довіреності військовослужбовців", "Довіреності від лікаря"]}, {"id": 203, "q": "Представництво - це:", "a": "Представництво — правовідношення, в якому одна особа (представник) вчиняє правочин від імені та в інтересах іншої особи (ст. 237 ч. 1).", "o": ["Правовідношення, де представник діє від імені довірителя", "Договір зі свого імені", "Передача прав", "Односторонній правочин"]}, {"id": 204, "q": "Представником є особа, яка:", "a": "Представником є особа, яка вчиняє правочин від імені іншої особи (довірителя) та в її інтересах на підставі наданих повноважень — договору, закону, акта органу (ст. 237).", "o": ["Особа, що вчиняє правочин від імені іншої на підставі повноважень", "Особа, що діє від свого імені", "Той, хто веде переговори", "Посередник"]}, {"id": 205, "q": "НЕ є представником особа, яка:", "a": "Не є представником особа: що вчиняє правочин від свого імені, хоча й в інтересах іншої особи; що не уповноважена вчиняти правочини, а лише веде переговори про можливі в майбутньому правочини; посередник (ст. 237 ч. 3).", "o": ["Діє від свого імені; лише веде переговори; посередник", "Діє за довіреністю", "Законні представники", "Комерційний агент"]}, {"id": 206, "q": "НЕ є представником особа, яка:", "a": "Не є представником особа: що вчиняє правочин від свого імені, хоча й в інтересах іншої особи; що не уповноважена вчиняти правочини, а лише веде переговори про можливі в майбутньому правочини; посередник (ст. 237 ч. 3).", "o": ["Діє від свого імені; лише веде переговори; посередник", "Діє за довіреністю", "Законні представники", "Комерційний агент"]}, {"id": 207, "q": "НЕ є представником особа, яка:", "a": "Не є представником особа: що вчиняє правочин від свого імені, хоча й в інтересах іншої особи; що не уповноважена вчиняти правочини, а лише веде переговори про можливі в майбутньому правочини; посередник (ст. 237 ч. 3).", "o": ["Діє від свого імені; лише веде переговори; посередник", "Діє за довіреністю", "Законні представники", "Комерційний агент"]}, {"id": 208, "q": "На вчинення яких правочинів може бути уповноважений представник?:", "a": "Будь-яких правочинів, які особа вправі вчиняти сама, крім тих, що за змістом можуть бути вчинені лише особисто (наприклад, складення заповіту), та з урахуванням заборон ст. 238.", "o": ["Будь-які, крім тих, що вчиняються лише особисто", "Лише письмові", "Лише безоплатні", "Лише договори"]}, {"id": 209, "q": "Представник НЕ може вчиняти такі правочини:", "a": "Правочини, що за своїм змістом можуть вчинятися лише особисто (заповіт, шлюб); правочин від імені довірителя щодо себе особисто; правочини щодо іншої особи, представником якої він одночасно є (крім комерційного представництва та випадків, встановлених законом) (ст. 238).", "o": ["Лише особисто (заповіт); щодо себе; щодо іншої особи, яку одночасно представляє", "Купівля-продаж", "Оренда", "Дарування"]}, {"id": 210, "q": "Представництво виникає на підставі:", "a": "Договору, закону, акта органу юридичної особи, акта органу державної влади чи місцевого самоврядування, інших підстав (ст. 237 ч. 2).", "o": ["Договір, закон, акт органу юридичної особи, акт органу влади", "Лише договір", "Лише закон", "Договір і рішення суду"]}, {"id": 211, "q": "Представництво виникає на підставі:", "a": "Договору, закону, акта органу юридичної особи, акта органу державної влади чи місцевого самоврядування, інших підстав (ст. 237 ч. 2).", "o": ["Договір, закон, акт органу юридичної особи, акт органу влади", "Лише договір", "Лише закон", "Договір і рішення суду"]}, {"id": 212, "q": "Представництво виникає на підставі:", "a": "Договору, закону, акта органу юридичної особи, акта органу державної влади чи місцевого самоврядування, інших підстав (ст. 237 ч. 2).", "o": ["Договір, закон, акт органу юридичної особи, акт органу влади", "Лише договір", "Лише закон", "Договір і рішення суду"]}, {"id": 213, "q": "Правовим наслідком вчинення правочину представником є:", "a": "Виникнення, зміна, припинення прав та обов’язків для особи, яку представляють (довірителя) (ст. 237 ч. 1).", "o": ["Права й обов’язки для довірителя", "Лише для представника", "Для третіх осіб", "Нікчемність"]}, {"id": 214, "q": "Довіреність, у якій не вказана дата її вчинення, є:", "a": "Нікчемною (ст. 247).", "o": ["Нікчемна", "Дійсна", "Оспорювана", "Умовна"]}, {"id": 215, "q": "Оберіть правильне законодавче положення щодо строку довіреності, виданої в порядку передоручення:", "a": "Строк довіреності, виданої в порядку передоручення, не може перевищувати строку довіреності, на підставі якої вона видана (ст. 247 ч. 3).", "o": ["Не довший за основну довіреність", "Не більше одного року", "Не більше трьох років", "Не обмежений"]}, {"id": 216, "q": "Законним представником є:", "a": "Законними представниками є батьки (усиновлювачі), опікуни, піклувальники та інші особи, визначені законом (ст. 242): за законом батьки представляють малолітніх, опікуни — підопічних, піклувальники надають згоду неповнолітнім та особам з обмеженою дієздатністю.", "o": ["Батьки, усиновлювачі, опікуни, піклувальники", "Лише батьки", "Лише опікуни", "Орган опіки"]}, {"id": 217, "q": "Законним представником є:", "a": "Законними представниками є батьки (усиновлювачі), опікуни, піклувальники та інші особи, визначені законом (ст. 242): за законом батьки представляють малолітніх, опікуни — підопічних, піклувальники надають згоду неповнолітнім та особам з обмеженою дієздатністю.", "o": ["Батьки, усиновлювачі, опікуни, піклувальники", "Лише батьки", "Лише опікуни", "Орган опіки"]}, {"id": 218, "q": "Законним представником є:", "a": "Законними представниками є батьки (усиновлювачі), опікуни, піклувальники та інші особи, визначені законом (ст. 242): за законом батьки представляють малолітніх, опікуни — підопічних, піклувальники надають згоду неповнолітнім та особам з обмеженою дієздатністю.", "o": ["Батьки, усиновлювачі, опікуни, піклувальники", "Лише батьки", "Лише опікуни", "Орган опіки"]}, {"id": 219, "q": "Довіреність - це:", "a": "Довіреність — письмовий документ, що видається однією особою іншій особі для представництва перед третіми особами (ст. 244 ч. 1).", "o": ["Письмовий документ для представництва перед третіми особами", "Договір доручення", "Нотаріальний акт", "Усне уповноваження"]}, {"id": 220, "q": "Довіреність, що видається у порядку передоручення:", "a": "Довіреність, що видається у порядку передоручення, підлягає нотаріальному посвідченню (ст. 245 ч. 2), крім випадків, встановлених ч. 4 цієї статті. Її строк не може перевищувати строку основної довіреності (ст. 247 ч. 3). Передоручення допустиме за умов ст. 240.", "o": ["Нотаріально посвідчується (ст. 245 ч. 2)", "Простою письмовою формою", "Усно", "Не потребує посвідчення"]}, {"id": 221, "q": "За яких умов представник може передати своє повноваження частково або в повному обсязі іншій особі?", "a": "Якщо це встановлено договором або законом, або якщо представник був вимушений до цього силою обставин для охорони інтересів довірителя (ст. 240 ч. 1).", "o": ["Якщо встановлено договором чи законом або вимушений обставинами", "Завжди без обмежень", "Лише за згодою суду", "Ніколи"]}, {"id": 222, "q": "Що є підставами припинення представництва за довіреністю?", "a": "Підстави припинення представництва за довіреністю (ст. 248): 1) закінчення строку; 2) скасування довіреності особою, яка її видала; 3) відмова представника; 4) припинення юридичної особи, яка видала довіреність; 5) припинення юридичної особи, якій видано довіреність; 6) смерть, оголошення померлою, визнання недієздатною, безвісно відсутньою або обмеження дієздатності особи, яка видала довіреність; 7) те саме щодо представника.", "o": ["Закінчення строку, скасування, відмова, припинення чи смерть сторін", "Лише закінчення строку", "Лише скасування", "Лише смерть довірителя"]}, {"id": 223, "q": "Хто може бути законним представником фізичної особи, яка досягла 13 років?", "a": "Піклувальник (ст. 59, 63, 242) — особа, призначена судом чи органом опіки та піклування; для особи віком від 14 до 18 років, яка не має повної дієздатності, законними представниками, що дають згоду на правочини, є батьки (усиновлювачі) або піклувальник (ст. 32).", "o": ["Піклувальник", "Опікун", "Батьки", "Орган опіки"]}, {"id": 224, "q": "Які довіреності НЕ можуть бути посвідчені уповноваженою особою органу місцевого самоврядування?", "a": "Довіреності на розпорядження нерухомим майном (правочини, що підлягають нотаріальному посвідченню), на управління та розпорядження корпоративними правами, на користування та розпорядження транспортними засобами (ст. 245). ⚠️ Звіряйте з варіантами.", "o": ["Довіреності на нерухомість, корпоративні права, транспортні засоби", "Довіреність на пенсію", "Довіреність військовослужбовця", "Довіреність пацієнта"]}, {"id": 225, "q": "Які правочини НЕ може вчиняти представник?", "a": "Правочини, що за своїм змістом можуть вчинятися лише особисто (заповіт, шлюб); правочин від імені довірителя щодо себе особисто; правочини щодо іншої особи, представником якої він одночасно є (крім комерційного представництва та випадків, встановлених законом) (ст. 238).", "o": ["Лише особисто (заповіт); щодо себе; щодо іншої особи, яку одночасно представляє", "Купівля-продаж", "Оренда", "Дарування"]}, {"id": 226, "q": "Що є підставами припинення представництва за довіреністю?", "a": "Підстави припинення представництва за довіреністю (ст. 248): 1) закінчення строку; 2) скасування довіреності особою, яка її видала; 3) відмова представника; 4) припинення юридичної особи, яка видала довіреність; 5) припинення юридичної особи, якій видано довіреність; 6) смерть, оголошення померлою, визнання недієздатною, безвісно відсутньою або обмеження дієздатності особи, яка видала довіреність; 7) те саме щодо представника.", "o": ["Закінчення строку, скасування, відмова, припинення чи смерть сторін", "Лише закінчення строку", "Лише скасування", "Лише смерть довірителя"]}, {"id": 227, "q": "Що НЕ є підставами припинення представництва за довіреністю", "a": "Не є підставою: усе, чого немає у переліку ст. 248 (наприклад, зміна місця проживання довірителя, його одруження, зміна керівника юридичної особи, реорганізація довірителя-юридичної особи, смерть третьої особи, за замовчуванням закінчення правочину). ⚠️ Дивіться перелік ст. 248 і виключайте варіанти, що в ньому є.", "o": ["Те, чого немає в переліку ст. 248", "Закінчення строку", "Скасування довірителем", "Відмова представника"]}, {"id": 228, "q": "Повноваження комерційного представника можуть бути підтверджені", "a": "Повноваження комерційного представника можуть підтверджуватися договором та (або) довіреністю (ст. 243 ч. 2). ⚠️ Звіряйте з варіантами.", "o": ["Договір та (або) довіреність", "Лише усна домовленість", "Рішення суду", "Лише довіреність"]}, {"id": 229, "q": "Якими посадовими особами може бути посвідчена довіреність?", "a": "За ст. 245 ч. 3 прирівнюються до нотаріально посвідчених довіреності, посвідчені: посадовими особами органів місцевого самоврядування (у населених пунктах без нотаріуса); головним лікарем, його заступником з медичної частини або черговим лікарем — для осіб, що перебувають на стаціонарному лікуванні; командиром військової частини — для військовослужбовців (а там, де немає нотаріуса, — також для працівників, членів їхніх сімей і членів сімей військовослужбовців); начальником установи виконання покарань чи СІЗО — для ув’язнених; керівником стаціонарного закладу соціального захисту — для осіб, що в ньому перебувають. Довіреність на отримання заробітної плати, пенсії, стипендії тощо посвідчується також організацією, де особа працює, навчається чи лікується, або житлово-експлуатаційною організацією за місцем проживання (ст. 245 ч. 4). ⚠️ Звіряйте перелік з чинним текстом статті.", "o": ["Нотаріус, органи місцевого самоврядування, лікар, командир, начальник установи", "Лише нотаріус", "Директор школи", "Голова ЖЕК для нерухомості"]}, {"id": 230, "q": "Які особливості комерційного представництва як різновиду договірного представництва?", "a": "Комерційний представник діє постійно та самостійно, представляє підприємців, діє на підставі договору та довіреності, може представляти кількох сторін за їх згодою, діє у сфері підприємницької діяльності, його повноваження підтверджуються договором чи довіреністю (ст. 243).", "o": ["Постійно та самостійно представляє підприємців; договір і довіреність", "Разова дія", "Лише для фізичних осіб", "Без договору"]}, {"id": 231, "q": "В яких випадках передбачена видача безвідкличної довіреності?", "a": "Безвідклична довіреність — лише у випадках, встановлених законом (ст. 249 ч. 4), наприклад щодо корпоративних прав чи розпорядження певним майном за законами про іпотеку, нотаріат тощо. ⚠️ Звіряйте з варіантами.", "o": ["Лише у випадках, встановлених законом", "Завжди", "Ніколи", "За рішенням суду"]}, {"id": 232, "q": "Які підстави припинення представництва за довіреністю?", "a": "Підстави припинення представництва за довіреністю (ст. 248): 1) закінчення строку; 2) скасування довіреності особою, яка її видала; 3) відмова представника; 4) припинення юридичної особи, яка видала довіреність; 5) припинення юридичної особи, якій видано довіреність; 6) смерть, оголошення померлою, визнання недієздатною, безвісно відсутньою або обмеження дієздатності особи, яка видала довіреність; 7) те саме щодо представника.", "o": ["Закінчення строку, скасування, відмова, припинення чи смерть сторін", "Лише закінчення строку", "Лише скасування", "Лише смерть довірителя"]}, {"id": 233, "q": "Які підстави припинення представництва за законом?", "a": "⚠️ ЦК не має окремої статті з вичерпним переліком. Представництво за законом припиняється у разі: досягнення підопічним повноліття; надання повної дієздатності; реєстрації шлюбу неповнолітньої особи; поновлення цивільної дієздатності; передання малолітньої особи батькам; досягнення підопічним 14 років (опікун стає піклувальником); звільнення опікуна чи піклувальника; смерті представника чи підопічного (ст. 75–77).", "o": ["Повноліття, надання дієздатності, шлюб, поновлення дієздатності, звільнення, смерть", "Лише смерть", "Лише повноліття", "Закінчення строку"]}, {"id": 234, "q": "Представник зобовʼязаний вчиняти правочин за наданими йому повноваженнями особисто, крім випадків:", "a": "Якщо це встановлено договором або законом, або якщо представник був вимушений до цього силою обставин для охорони інтересів довірителя (ст. 240 ч. 1).", "o": ["Якщо встановлено договором чи законом або вимушений обставинами", "Завжди без обмежень", "Лише за згодою суду", "Ніколи"]}, {"id": 235, "q": "Законними представниками є:", "a": "Законними представниками є батьки (усиновлювачі), опікуни, піклувальники та інші особи, визначені законом (ст. 242): за законом батьки представляють малолітніх, опікуни — підопічних, піклувальники надають згоду неповнолітнім та особам з обмеженою дієздатністю.", "o": ["Батьки, усиновлювачі, опікуни, піклувальники", "Лише батьки", "Лише опікуни", "Орган опіки"]}, {"id": 236, "q": "Довіреність від імені юридичної особи видається:", "a": "Довіреність від імені юридичної особи видається її органом або іншою особою, уповноваженою на це установчими документами (ст. 246 ч. 1).", "o": ["Орган юридичної особи або уповноважена особа", "Лише директор", "Лише нотаріус", "Засновник"]}, {"id": 237, "q": "Представництво виникає на підставі:", "a": "Договору, закону, акта органу юридичної особи, акта органу державної влади чи місцевого самоврядування, інших підстав (ст. 237 ч. 2).", "o": ["Договір, закон, акт органу юридичної особи, акт органу влади", "Лише договір", "Лише закон", "Договір і рішення суду"]}, {"id": 238, "q": "Представництво виникає на підставі:", "a": "Договору, закону, акта органу юридичної особи, акта органу державної влади чи місцевого самоврядування, інших підстав (ст. 237 ч. 2).", "o": ["Договір, закон, акт органу юридичної особи, акт органу влади", "Лише договір", "Лише закон", "Договір і рішення суду"]}, {"id": 239, "q": "Представництво за довіреністю припиняється у разі:", "a": "Підстави припинення представництва за довіреністю (ст. 248): 1) закінчення строку; 2) скасування довіреності особою, яка її видала; 3) відмова представника; 4) припинення юридичної особи, яка видала довіреність; 5) припинення юридичної особи, якій видано довіреність; 6) смерть, оголошення померлою, визнання недієздатною, безвісно відсутньою або обмеження дієздатності особи, яка видала довіреність; 7) те саме щодо представника.", "o": ["Закінчення строку, скасування, відмова, припинення чи смерть сторін", "Лише закінчення строку", "Лише скасування", "Лише смерть довірителя"]}, {"id": 240, "q": "Представництво за довіреністю припиняється у разі:", "a": "Підстави припинення представництва за довіреністю (ст. 248): 1) закінчення строку; 2) скасування довіреності особою, яка її видала; 3) відмова представника; 4) припинення юридичної особи, яка видала довіреність; 5) припинення юридичної особи, якій видано довіреність; 6) смерть, оголошення померлою, визнання недієздатною, безвісно відсутньою або обмеження дієздатності особи, яка видала довіреність; 7) те саме щодо представника.", "o": ["Закінчення строку, скасування, відмова, припинення чи смерть сторін", "Лише закінчення строку", "Лише скасування", "Лише смерть довірителя"]}, {"id": 241, "q": "Представництво за довіреністю припиняється у разі:", "a": "Підстави припинення представництва за довіреністю (ст. 248): 1) закінчення строку; 2) скасування довіреності особою, яка її видала; 3) відмова представника; 4) припинення юридичної особи, яка видала довіреність; 5) припинення юридичної особи, якій видано довіреність; 6) смерть, оголошення померлою, визнання недієздатною, безвісно відсутньою або обмеження дієздатності особи, яка видала довіреність; 7) те саме щодо представника.", "o": ["Закінчення строку, скасування, відмова, припинення чи смерть сторін", "Лише закінчення строку", "Лише скасування", "Лише смерть довірителя"]}, {"id": 242, "q": "Представництво за довіреністю припиняється у разі:", "a": "Підстави припинення представництва за довіреністю (ст. 248): 1) закінчення строку; 2) скасування довіреності особою, яка її видала; 3) відмова представника; 4) припинення юридичної особи, яка видала довіреність; 5) припинення юридичної особи, якій видано довіреність; 6) смерть, оголошення померлою, визнання недієздатною, безвісно відсутньою або обмеження дієздатності особи, яка видала довіреність; 7) те саме щодо представника.", "o": ["Закінчення строку, скасування, відмова, припинення чи смерть сторін", "Лише закінчення строку", "Лише скасування", "Лише смерть довірителя"]}];
