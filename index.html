const M={"1": ["<b>▸ Поняття та правоздатність</b> (ст. 24–25). Людина як учасник цивільних відносин вважається фізичною особою. Цивільну правоздатність мають усі фізичні особи; вона виникає у момент народження, у випадках, встановлених законом, охороняються інтереси зачатої, але ще не народженої дитини; здатність мати окремі права може пов’язуватися з досягненням відповідного віку; правоздатність припиняється у момент смерті.", "<b>▸ Обсяг правоздатності</b> (ст. 26–27). Усі фізичні особи рівні у здатності мати права та обов’язки; мають усі особисті немайнові права, встановлені Конституцією і ЦК; здатні мати усі майнові права, встановлені ЦК та законом; здатні мати інші права, що не встановлені, але не суперечать закону та моральним засадам; здатні мати обов’язки. Правочин, що обмежує можливість мати не заборонені законом права та обов’язки, є нікчемним; акти органів влади теж не можуть її обмежувати, крім випадків, передбачених Конституцією. <i>Приклад:</i> умова договору, за якою особа відмовляється назавжди від права мати нерухомість, нікчемна.", "<b>▸ Ім’я</b> (ст. 28). Фізична особа набуває прав та обов’язків і здійснює їх під своїм ім’ям. Ім’я громадянина України складається з прізвища, власного імені та по батькові, якщо інше не випливає із закону або звичаю національної меншини, до якої вона належить. За законом особа може використовувати псевдонім (вигадане ім’я) або діяти без зазначення імені. Ім’я надається відповідно до закону. <i>Приклад:</i> письменник видає книгу під псевдонімом.", "<b>▸ Місце проживання</b> (ст. 29). Це житло, в якому особа проживає постійно або тимчасово. З 14 років вона вільно обирає місце проживання, крім обмежень закону. Для віку 10–14 років це місце проживання батьків (усиновлювачів) або одного з них, з ким проживає, опікуна чи місцезнаходження навчального закладу або закладу охорони здоров’я, якщо інше не встановлено за згодою; у разі спору визначає орган опіки та піклування або суд. Для дитини до 10 років — місце проживання батьків, опікуна або закладу; для недієздатної — опікуна чи організації. Можна мати кілька місць проживання.", "<b>▸ Дієздатність</b> (ст. 30). Цивільну дієздатність має фізична особа, яка усвідомлює значення своїх дій та може керувати ними; це здатність своїми діями набувати й самостійно здійснювати права, створювати для себе обов’язки, виконувати їх і нести відповідальність за невиконання. Обсяг встановлюється ЦК і може бути обмежений лише у випадках і порядку, встановлених законом.", "<b>▸ Часткова дієздатність, до 14 років</b> (ст. 31). Малолітня особа вправі самостійно вчиняти дрібні побутові правочини (задовольняють побутові потреби, відповідають її фізичному, духовному чи соціальному розвитку, предмет невисокої вартості) і здійснювати особисті немайнові права на результати творчості. Інші правочини вчиняють батьки (усиновлювачі) спільно або один за згодою другого (при правочині щодо майна дитини вважається, що діє за згодою другого; той може звернутися до суду про недійсність, якщо правочин виходить за межі дрібного побутового). Правочини за ч. 2 ст. 177 СК — з дозволу органу опіки та піклування та за нотаріально посвідченою згодою другого з батьків. Безоплатне набуття майна — без дозволу. Малолітня особа за шкоду не відповідає. <i>Приклад:</i> 8-річна дитина купує зошит — чинно; продаж її квартири батьком — лише з дозволом органу опіки.", "<b>▸ Неповна дієздатність, 14–18 років</b> (ст. 32–33). Крім правочинів ст. 31, неповнолітня особа самостійно: розпоряджається заробітком, стипендією, доходами; здійснює права на результати творчості; бути учасником (засновником) юридичних осіб, якщо не заборонено; укладає договір банківського вкладу й розпоряджається вкладом; укладає договір про електронні довірчі послуги. Інші правочини — за згодою батьків (усиновлювачів) або піклувальника; для правочинів за ч. 2 ст. 177 СК потрібні нотаріальна згода й дозвіл органу опіки. Суд може обмежити або позбавити її права розпоряджатися заробітком. Відповідальність: за договір, укладений самостійно чи за згодою, — особисто (за недостатності майна додатково відповідають батьки чи піклувальник), за шкоду — за ст. 1179.", "<b>▸ Повна дієздатність</b> (ст. 34–35). Має особа з 18 років. Шлюб: особа, що не досягла повноліття, набуває повної дієздатності з моменту реєстрації шлюбу, і вона зберігається при припиненні шлюбу чи визнанні його недійсним з підстав, не пов’язаних з протиправною поведінкою неповнолітньої. <b>Надання</b> повної дієздатності: особі з 16 років, яка працює за трудовим договором, та неповнолітній, яка записана матір’ю чи батьком дитини; за рішенням органу опіки та піклування за заявою заінтересованої особи за письмовою згодою батьків (усиновлювачів) чи піклувальника, а без згоди — за рішенням суду. Також особі з 16 років, яка бажає займатися підприємництвом, за письмовою згодою батьків (усиновлювачів), піклувальника чи органу опіки; вона набуває повної дієздатності з моменту реєстрації як підприємця. Надана дієздатність поширюється на всі права та обов’язки й зберігається після припинення трудового договору чи підприємництва.", "<b>▸ Обмеження дієздатності</b> (ст. 36–38). Суд може обмежити дієздатність, якщо особа страждає на психічний розлад, що істотно впливає на здатність усвідомлювати значення дій та (або) керувати ними, або зловживає спиртними напоями, наркотичними засобами, токсичними речовинами, азартними іграми тощо і ставить себе, сім’ю чи осіб, яких зобов’язана утримувати, у скрутне матеріальне становище. Порядок — за ЦПК; дієздатність обмежена з моменту набрання законної сили рішенням суду. Наслідки: піклування; самостійно лише дрібні побутові правочини; розпорядження майном та інші — за згодою піклувальника (відмову можна оскаржити до органу опіки чи суду); заробіток і пенсію одержує піклувальник, який може письмово дозволити самостійно; особа сама відповідає за порушення договору, укладеного за згодою піклувальника, та за шкоду. Поновлення: суд поновлює дієздатність у разі видужання чи припинення зловживання; піклування припиняється рішенням суду. <i>Приклад:</i> гравець у казино може купити хліб, а продати авто — лише за згодою піклувальника.", "<b>▸ Недієздатність</b> (ст. 39–42). Особа може бути визнана судом недієздатною, якщо внаслідок хронічного, стійкого психічного розладу не здатна усвідомлювати значення дій та (або) керувати ними. Порядок — за ЦПК. Якщо в задоволенні заяви відмовлено і вона була подана недобросовісно, особа вправі вимагати відшкодування моральної шкоди (ч. 3 ст. 39). Недієздатною визнається з моменту набрання законної сили рішенням; для оскарження шлюбу чи правочину суд може визначити день, з якого особа недієздатна (ст. 40). Наслідки: опіка; особа не має права вчиняти жодного правочину; їх вчиняє опікун; за завдану шкоду відповідає опікун (ст. 1184). Поновлення — за заявою опікуна чи органу опіки, якщо відновилася здатність усвідомлювати та керувати діями (ст. 42).", "<b>▸ Хто подає заяву про обмеження чи недієздатність.</b> ЦК лише відсилає до ЦПК (ст. 36 ч. 3, ст. 39 ч. 2). За ЦПК це члени сім’ї, близькі родичі незалежно від спільного проживання, орган опіки та піклування, а щодо недієздатності ще й заклад з надання психіатричної допомоги. ⚠️ Це норма ЦПК, не ЦК; звіряйте за процесуальним кодексом.", "<b>▸ Безвісна відсутність</b> (ст. 43–45). Особа може бути визнана судом безвісно відсутньою, якщо протягом одного року в місці її постійного проживання немає відомостей про її перебування. Якщо день останніх відомостей встановити неможливо, початком вважається перше число наступного місяця, а за неможливості встановити місяць — 1 січня наступного року. <b>Опіка над майном</b> (ст. 44): на підставі рішення суду нотаріус вживає заходів для встановлення опіки над майном — проводить опис майна й призначає опікуна за останнім місцем проживання особи (за невідомості — за місцезнаходженням нерухомого майна чи його основної частини, а за відсутності нерухомого — основної частини рухомого). Опікун приймає виконання обов’язків на її користь, погашає борги за рахунок майна, управляє ним в її інтересах, а за заявою заінтересованої особи надає утримання тим, кого вона зобов’язана утримувати. Опіка припиняється при скасуванні рішення (ст. 45 — за заявою самої особи чи іншої заінтересованої особи).", "<b>▸ Оголошення померлою</b> (ст. 46–48). Підстави: відсутність відомостей три роки; шість місяців, якщо пропала за обставин, що загрожували смертю або дають підставу припускати загибель від нещасного випадку; один місяць після роботи спеціальної комісії при надзвичайних ситуаціях техногенного та природного характеру; при воєнних діях чи збройному конфлікті — після двох років від дня їх закінчення (суд може й раніше, але не раніше шести місяців). Померлою оголошується від дня набрання законної сили рішенням суду, а за зазначених обставин може бути — від дня вірогідної смерті. Наслідки прирівняні до смерті; спадкоємці не можуть відчужувати протягом п’яти років нерухоме майно, нотаріус накладає заборону відчуження (ст. 47). Якщо особа з’явилася, суд скасовує рішення; вона може вимагати повернення майна, що безоплатно перейшло до інших (крім набутого за давністю, грошей і цінних паперів на пред’явника); від добросовісного набувача за відплатним договором майно повертається лише якщо той знав, що особа жива (ст. 48).", "<b>▸ Фізична особа — підприємець</b> (ст. 50–54). Право на підприємницьку діяльність має особа з повною дієздатністю за умови державної реєстрації; відповідає за зобов’язаннями усім майном, крім того, на яке не можна звернути стягнення (для особи у шлюбі — усім особистим майном та часткою в спільній сумісній власності). Якщо підприємець визнаний безвісно відсутнім, недієздатним, з обмеженою дієздатністю чи власником майна стала мала або неповнолітня особа, орган опіки може призначити управителя майна.", "<b>▸ Опіка та піклування</b> (ст. 55–79). Мета — забезпечення особистих немайнових і майнових прав та інтересів малолітніх, неповнолітніх і повнолітніх осіб, що за станом здоров’я не можуть самостійно здійснювати права. Орган опіки та піклування — районні державні адміністрації в Києві та Севастополі, виконавчі комітети міських, селищних, сільських рад. Опіка — над малолітніми сиротами й позбавленими батьківського піклування та недієздатними; піклування — над неповнолітніми сиротами й позбавленими піклування та особами з обмеженою дієздатністю. Суд встановлює опіку/піклування за відповідними рішеннями про недієздатність, обмеження чи позбавлення піклування; в інших випадках — орган опіки. Опікуном може бути лише особа з повною дієздатністю за письмовою заявою; не може бути позбавлена батьківських прав чи особа, чиї інтереси суперечать інтересам підопічного. Опікун не може укладати з підопічним договорів (крім дарування чи позички йому), дарувати від імені підопічного та давати поруку. Правочини щодо майна підопічного (житлова нерухомість, земельна ділянка, відчуження нерухомого й цінного майна, відмова від прав) — з дозволу органу опіки, окрім безоплатного набуття майна дитиною (ст. 71). Звільнення — за заявою (розглядається протягом місяця) або за невиконання обов’язків. Опіка припиняється при передачі малолітнього батькам, у 14 років (опікун стає піклувальником) і при поновленні дієздатності; піклування — при повнолітті, шлюбі, наданні повної дієздатності, поновленні дієздатності. <b>Помічник</b> (ст. 78) — для дієздатної особи, яка за станом здоров’я не може самостійно здійснювати права; його ім’я реєструє орган опіки, він може отримувати пенсію, заробіток, вчиняти дрібні побутові правочини."], "2": ["<b>▸ Поняття та види</b> (ст. 80–83). Юридична особа — організація, створена і зареєстрована у встановленому законом порядку, наділена цивільною правоздатністю й дієздатністю, може бути позивачем і відповідачем. Створюється шляхом об’єднання осіб та (або) майна. За порядком створення: приватного права (на підставі установчих документів, ст. 87, або модельного статуту) і публічного права (розпорядчий акт Президента, органу державної влади, АР Крим чи місцевого самоврядування; можливе утворення примусовим поділом чи виділом у випадках закону). Форми: товариства, установи, інші форми, встановлені законом.", "<b>▸ Товариство та установа</b> (ст. 83). <b>Товариство</b> — організація, створена шляхом об’єднання осіб (учасників), які мають право участі в ньому; може бути створене однією особою, якщо інше не встановлено законом; поділяється на підприємницькі й непідприємницькі. <b>Установа</b> — організація, створена однією чи кількома особами (засновниками), які не беруть участі в управлінні, шляхом виділення майна для досягнення мети, визначеної засновниками, за рахунок цього майна.", "<b>▸ Підприємницькі та непідприємницькі товариства</b> (ст. 84–86). Підприємницькі діють з метою одержання прибутку та його розподілу між учасниками; створюються лише як господарські товариства (повне, командитне, з обмеженою або додатковою відповідальністю, акціонерне) або виробничі, сільськогосподарські кооперативи та сільськогосподарські кооперативні об’єднання, що діють з метою прибутку. Непідприємницьке — діяльність спрямована на економічні, соціальні та інші результати без мети розподілу прибутку; учасники не беруть участі в розподілі прибутку, виплата дивідендів забороняється. До них належать, зокрема, сільськогосподарські кооперативи й об’єднання без мети прибутку, інші кооперативи (крім виробничих), об’єднання громадян, державні та комунальні некомерційні товариства. Вони й установи можуть здійснювати підприємницьку діяльність, якщо вона відповідає меті створення та сприяє її досягненню.", "<b>▸ Створення юридичної особи</b> (ст. 87–89). Засновники розробляють установчі документи письмово, підписують усі учасники; можливий модельний статут, затверджений Кабінетом Міністрів (у випадках закону — НБУ), що після прийняття учасниками стає установчим документом. Установчий документ товариства — затверджений учасниками статут або засновницький договір, якщо інше не встановлено законом; товариство, створене однією особою, діє на підставі статуту. Установа створюється на підставі установчого акта засновника (засновників), який може міститися і в заповіті; до створення установи його можна скасувати. Юридична особа вважається створеною з дня державної реєстрації.", "<b>▸ Зміст установчих документів</b> (ст. 88). У статуті товариства вказуються найменування, органи управління, їх компетенція, порядок прийняття рішень, порядок вступу та виходу. У засновницькому договорі — зобов’язання учасників створити товариство, порядок спільної діяльності щодо створення, умови передання майна. В установчому акті установи — мета, майно, що передається, структура управління.", "<b>▸ Державна реєстрація</b> (ст. 89). Здійснюється в порядку, встановленому законом; дані вносяться до єдиного державного реєстру, відкритого для ознайомлення. Підстави відмови визначає закон, інші не допускаються; відмову та зволікання можна оскаржити до суду. У реєстр вносять організаційно-правову форму, найменування, місцезнаходження, органи управління, філії та представництва, мету установи. Зміни до установчих документів діють для третіх осіб з дня реєстрації. ⚠️ Хто реєструє і за який строк, ЦК не визначає; це Закон «Про державну реєстрацію юридичних осіб, фізичних осіб — підприємців та громадських формувань» (державний реєстратор; загальний строк — до 24 годин після надходження документів).", "<b>▸ Кількість засновників і установчі документи за видами.</b> Повне товариство — засновницький договір між учасниками (ст. 119–120); командитне — засновницький договір (ст. 133–134); акціонерне товариство, ТОВ і ТДВ — статут (спеціальні закони); виробничий кооператив — статут (ст. 164); установа — установчий акт (ст. 87 ч. 3). Одна особа може створити товариство, якщо закон не забороняє (ст. 83), а повне й командитне потребують принаймні двох учасників (договір між учасниками). ⚠️ Кількісні вимоги (напр., для ТОВ та АТ) — у спеціальних законах; статті 113–166 звіряйте з текстом.", "<b>▸ Найменування</b> (ст. 90). Містить організаційно-правову форму та назву; для установи — характер діяльності. Може бути повне і скорочене; підприємницьке товариство може мати комерційне (фірмове) найменування, яке реєструється за законом; найменування зазначається в установчих документах і вноситься до реєстру; не можна використовувати найменування іншої юридичної особи.", "<b>▸ Правоздатність і дієздатність</b> (ст. 91–92). Юридична особа здатна мати такі самі права та обов’язки, як і фізична, крім тих, що за природою належать лише людині; правоздатність може бути обмежена лише за рішенням суду; окремі види діяльності — після одержання ліцензії; правоздатність виникає з моменту створення й припиняється з дня внесення до реєстру запису про припинення. Дієздатність здійснюється через органи, що діють за установчими документами й законом (у випадках закону — через учасників). Особа, яка виступає від імені юридичної особи, зобов’язана діяти виключно в її інтересах, добросовісно й розумно, у межах повноважень, уникаючи конфлікту інтересів. Обмеження повноважень представництва не має юридичної сили для третіх осіб, якщо юридична особа не доведе, що вони знали чи не могли не знати про обмеження. Порушники відповідають солідарно за збитки.", "<b>▸ Місцезнаходження та особисті права</b> (ст. 93–94). Місцезнаходження — фактичне місце ведення діяльності чи розташування офісу, з якого проводиться щоденне керування (переважно знаходиться керівництво) та здійснення управління і обліку. Юридична особа має право на недоторканність ділової репутації, таємницю кореспонденції, інформацію.", "<b>▸ Філії та представництва</b> (ст. 95). Філія — відокремлений підрозділ поза місцезнаходженням, що здійснює всі або частину функцій; представництво — здійснює представництво й захист інтересів. Не є юридичними особами, наділяються майном, діють на підставі затвердженого положення; керівники — за довіреністю; підлягають державній реєстрації й вважаються створеними з дня реєстрації.", "<b>▸ Відповідальність</b> (ст. 96). Юридична особа самостійно відповідає за зобов’язаннями усім своїм майном. Учасник (засновник) не відповідає за її зобов’язаннями, а вона — за його, крім випадків, встановлених установчими документами й законом. Особи, які створюють юридичну особу, відповідають солідарно за зобов’язаннями до її реєстрації; вона відповідає за зобов’язання засновників, пов’язані зі створенням, лише після схвалення відповідним органом.", "<b>▸ Корпоративні права</b> (ст. 96-1): набуваються з моменту набуття права власності на частку (акцію, пай); учасник вправі брати участь в управлінні, розподілі прибутку (дивіденди), вийти з юридичної особи, відчужити частку, одержувати інформацію, одержати частину майна при ліквідації (ліквідаційна квота).", "<b>▸ Управління товариством</b> (ст. 97–99-1). Управління здійснюють органи або безпосередньо єдиний учасник — фізична особа (за його рішенням та після внесення до реєстру). Органи — загальні збори учасників і виконавчий орган, якщо інше не встановлено. Загальні збори мають право вирішувати будь-які питання діяльності, рішення приймаються простою більшістю, а про зміну установчих документів, відчуження майна на 50 % і більше та ліквідацію — не менш як 3/4 голосів. <b>Виконавчий орган</b> створюють загальні збори; він може складатися з однієї або кількох осіб: одноосібний (керівник, директор) чи колегіальний (правління, дирекція), що приймає рішення за порядком ст. 98 ч. 2. Повноваження члена можуть бути припинені в будь-який час. Посадові особи (керівник, голова й члени колегіального органу, наглядової ради, ліквідатор, голова комісії, головний бухгалтер, корпоративний секретар) мають фідуціарні обов’язки та відповідають за збитки, завдані з перевищенням повноважень, з порушенням порядку погодження, поданням недостовірної інформації, бездіяльністю або іншими винними діями.", "<b>▸ Вихід та виключення з товариства</b> (ст. 100). Учасники мають право вийти з товариства, якщо інше не випливає із закону; у випадках і порядку, встановлених законом, учасника можуть виключити. Деталі розрахунків — у спеціальних законах і установчих документах.", "<b>▸ Установа</b> (ст. 101–103). Засновники не беруть участі в управлінні; обов’язково створюється правління; нагляд здійснює наглядова рада. Майно, визначене в установчому акті, засновник (у разі смерті — зобов’язана особа) передає після державної реєстрації. Суд може змінити мету чи структуру управління, якщо досягнення мети стало неможливим або загрожує суспільним інтересам.", "<b>▸ Припинення</b> (ст. 104–105). Юридична особа припиняється в результаті реорганізації (злиття, приєднання, поділу, перетворення) або ліквідації; у разі реорганізації майно, права та обов’язки переходять до правонаступників. Особа, що не вправі розподіляти прибуток чи майно між учасниками, не може бути реорганізована, якщо серед правонаступників є особа, наділена таким правом (крім державних установ); у зворотному випадку потрібне одностайне рішення зборів. Установа не може бути перетворена, крім випадків закону. Припинена — з дня внесення до реєстру запису про припинення. Про рішення про припинення слід письмово повідомити реєстратора протягом трьох робочих днів; призначається комісія (ліквідатор) з переходом повноважень з управління; строк заявлення вимог кредиторами — не менш як два й не більш як шість місяців з дня оприлюднення; кожна вимога розглядається, рішення надсилається кредитору протягом 30 днів.", "<b>▸ Реорганізація</b> (ст. 106–109). Здійснюється за рішенням учасників чи уповноваженого органу, а за законом — суду чи органів влади. Кредитор може вимагати припинення, дострокового виконання чи забезпечення зобов’язання. Після строку вимог комісія складає передавальний акт (злиття, приєднання, перетворення) або розподільчий баланс (поділ), які затверджуються учасниками. Правонаступник при поділі несе субсидіарну відповідальність (за кількох — солідарно); якщо точно визначити правонаступника неможливо — солідарно. Перетворення — зміна організаційно-правової форми; усе майно, права та обов’язки переходять до нової особи. <b>Виділ</b> — перехід частини майна, прав та обов’язків до нових юридичних осіб за розподільчим балансом; відповідальність субсидіарна. <i>Приклад:</i> ТОВ перетворюється на АТ — новий статус, зобов’язання переходять.", "<b>▸ Ліквідація</b> (ст. 110–112). Підстави: рішення учасників, суб’єкта управління державної чи комунальної власності або органу, в т. ч. закінчення строку, досягнення мети; рішення суду через порушення при створенні, які не можна усунути (за позовом учасника чи органу влади); у інших випадках закону. Орган, що прийняв рішення, призначає ліквідаційну комісію (ліквідатора). Комісія після внесення запису до реєстру стягує дебіторську заборгованість, повідомляє боржників, інвентаризує майно, складає баланси та задовольняє вимоги за черговістю ст. 112: 1) шкода здоров’ю та життю й вимоги, забезпечені заставою; 2) оплата праці та виплати авторам; 3) податки й збори; 4) інші вимоги. Особливості банків — за спеціальним законом.", "<b>▸ Господарські товариства</b> (ст. 113–139, 152–162 ⚠️). Підприємницьке товариство, статутний (складений) капітал якого поділений на частки між учасниками; мета — прибуток. <b>Повне</b> (ст. 119–132): всі учасники діють від імені товариства (ведення справ), відповідають за зобов’язаннями усім майном солідарно; <i>приклад:</i> двоє підприємців створюють повне товариство і кожен відповідає своїм майном. <b>Командитне</b> (ст. 133–139): повні учасники відповідають усім майном, вкладники — у межах вкладів і не беруть участі в управлінні. <b>ТОВ</b> (мета — прибуток; відповідальність у межах вкладів) і <b>ТДВ</b> (у межах вкладів, а додатково — майном у кратному однаковому розмірі до вкладу) — за спеціальним законом. <b>Акціонерне товариство</b> (ст. 152–162): статутний капітал поділений на акції; учасники (акціонери) не відповідають за зобов’язання товариства і несуть ризик збитків у межах вартості акцій; органи — загальні збори, наглядова рада, виконавчий орган.", "<b>▸ Виробничий кооператив</b> (ст. 163–166 ⚠️). Добровільне об’єднання громадян для спільної виробничої або іншої господарської діяльності, що ґрунтується на особистій трудовій участі та поєднанні майнових пайових внесків; діє на підставі статуту; члени несуть додаткову (субсидіарну) відповідальність за зобов’язаннями у розмірі та порядку, встановлених статутом; припинення членства має наслідком виплату паю. <i>Приклад:</i> артіль для спільної переробки продукції."], "3": ["<b>▸ Види об’єктів</b> (ст. 177). До об’єктів належать речі, у тому числі гроші та цінні папери, інше майно, майнові права, результати робіт, послуги, результати інтелектуальної творчої діяльності, інформація, цифрові речі, особисті немайнові блага та інші матеріальні й нематеріальні блага. Файл: об’єкти — майнові та немайнові блага, з приводу яких виникають права та обов’язки.", "<b>▸ Оборотоздатність</b> (ст. 178). Вільні в обороті; обмежені (право власності набувається за певних умов, за переліком видів майна, затвердженим постановою ВРУ від 17.06.1992); вилучені (лише держава чи Український народ: надра, природні заповідники, землі оборони та інші за переліком). <i>Приклад:</i> мисливська зброя — обмежена в обороті; надра — вилучені.", "<b>▸ Річ</b> (ст. 179). Предмет матеріального світу, щодо якого можуть виникати цивільні права та обов’язки; основний об’єкт цивільних відносин. <b>Тварина</b> (ст. 180) — особливий об’єкт; поширюється режим речі, крім випадків закону; жорстоке поводження заборонене.", "<b>▸ Нерухомі та рухомі</b> (ст. 181–182). Нерухомі — земельні ділянки та об’єкти на них, переміщення яких неможливе без знецінення та зміни призначення; рухомі — ті, що можна переміщувати без пошкодження. Режим нерухомості може бути поширений на повітряні й морські судна, космічні об’єкти. Значення: правочини щодо нерухомості нотаріальні (у випадках закону), право власності підлягає державній реєстрації (ст. 182), для набуття права власності — давність, договір, новостворена річ.", "<b>▸ Класифікація речей</b> (ст. 183–189). <b>Подільні/неподільні</b> (ст. 183) — залежно від можливості ділити без втрати призначення. <b>Індивідуально/родово визначені</b> (ст. 184): індивідуальні мають ознаки, що вирізняють з-поміж однорідних (смартфон, квартира, земельна ділянка) — можуть передаватися у власність і користування, при втраті компенсується вартість, захищаються віндикацією; родові — вимірюються числом, вагою, мірою — передаються лише у власність, замінюються, повертаються кондикцією. <b>Споживні/неспоживні</b> (ст. 185). <b>Головна річ і приналежність</b> (ст. 186). <b>Складові частини</b> (ст. 187). <b>Складна річ</b> (ст. 188): кілька речей, що утворюють єдине ціле для використання за загальним призначенням; кожна може бути простою (приклад: підприємство). <b>Продукція, плоди, доходи</b> (ст. 189): продукція — результат виробничої діяльності, плоди — природне примноження, доходи — результати використання.", "<b>▸ Майно</b> (ст. 190–191): річ, сукупність речей, майнові права та обов’язки; ширше за «річ». Особливий вид — підприємство як єдиний майновий комплекс. <b>Цифрові речі</b> (ст. 179-1 ⚠️): благо, що існує виключно в цифровому середовищі й має майнову цінність; віртуальні активи (криптовалюта) та цифровий контент (дані в цифровій формі: програми, застосунки, відео-, аудіо-, музичні файли, ігри, книги) — за Законом про цифровий контент і цифрові послуги.", "<b>▸ Гроші та валютні цінності</b> (ст. 192–193). Гроші — самостійний об’єкт: готівка та безготівкові кошти (Закон «Про платіжні послуги»); грошові знаки — банкноти й монети; можлива емісія електронних і цифрових форм. Валютні цінності регулює Закон «Про валюту і валютні операції» 2018 р.: національна валюта, іноземна валюта, банківські (дорогоцінні) метали.", "<b>▸ Цінні папери: поняття</b> (ст. 194). Документи встановленої форми, що посвідчують грошове або інше майнове право та відносини між емітентом і держателем. Регулюються ЦК та Законом «Про ринки капіталу та організовані товарні ринки».", "<b>▸ Групи цінних паперів</b> (ст. 195): <b>пайові</b> — корпоративні права акціонерів АТ (у т. ч. корпоративного інвестиційного фонду), права на частку в доході (акції, сертифікати фонду операцій з нерухомістю, інвестиційні сертифікати); <b>боргові</b> — відносини позики (корпоративні та державні облігації, облігації місцевих позик, міжнародних фінансових організацій, казначейські зобов’язання, депозитні й ощадні сертифікати, векселі, фінансові аграрні ноти); <b>похідні</b> — права вимагати викупу чи продажу активу (опціонні сертифікати, фондові варанти, кредитні ноти, депозитарні розписки, державні деривативи); <b>товаророзпорядчі</b> — право розпоряджатися майном (коносамент, складські свідоцтва — прості й подвійні, товарні аграрні ноти). Закон додає п’яту — <b>іпотечні</b> (випуск забезпечений іпотечним покриттям).", "<b>▸ Інші поділи цінних паперів.</b> За розміщенням: <b>емісійні</b> (розміщуються випусками, в межах випуску однакові права; існують лише в електронній формі; емітент — юридична особа, держава, територіальна громада, АР Крим, міжнародні фінансові організації) і <b>неемісійні</b> (паперові: векселі, ощадні сертифікати). За формою існування: електронні (записи на рахунках у депозитарних установах) та паперові (бланки з реквізитами за законом). За формою випуску: <b>на пред’явника</b> (права належать фактичному держателю; передаються врученням), <b>іменні</b> (особі, названій у папері; передаються цесією), <b>ордерні</b> (названій особі чи тому, кого вона уповноважила передавальним написом — індосаментом).", "<b>▸ Нематеріальні блага</b> (ст. 199–201): результати інтелектуальної, творчої діяльності; інформація; особисті немайнові блага (здоров’я, життя, честь, гідність, ділова репутація, ім’я, авторство, особисте життя та інші)."], "4": ["<b>▸ Поняття та види</b> (ст. 202). Правочин — дія особи, спрямована на набуття, зміну або припинення цивільних прав та обов’язків. Односторонній — дія однієї сторони (може бути представлена кількома особами); створює обов’язки лише для особи, яка його вчинила, а для інших — лише у випадках закону або за домовленістю з ними. Дво- чи багатосторонній (договір) — погоджена дія двох або більше сторін. До правовідносин з односторонніх правочинів застосовуються загальні положення про зобов’язання та договори, якщо це не суперечить закону чи суті. <i>Приклади:</i> заповіт, довіреність — односторонні; купівля-продаж — двосторонній; договір простого товариства трьох осіб — багатосторонній.", "<b>▸ Загальні вимоги чинності</b> (ст. 203): зміст не суперечить ЦК, іншим актам цивільного законодавства, інтересам держави і суспільства, моральним засадам; особа має необхідний обсяг цивільної дієздатності; волевиявлення вільне й відповідає внутрішній волі; правочин спрямований на реальне настання правових наслідків; відповідає вимогам щодо форми; правочин батьків (усиновлювачів) не може суперечити правам та інтересам дітей. Презумпція правомірності (ст. 204): правочин правомірний, якщо недійсність не встановлена законом або судом. <i>Приклад:</i> договір, укладений особою у стані, коли вона не усвідомлювала значення дій, не відповідає вимозі щодо дієздатності.", "<b>▸ Форма та способи волевиявлення</b> (ст. 205–206). Правочин може вчинятися усно або письмово (електронно); сторони вільні обирати форму, якщо закон не встановлює іншого. Правочин, для якого письмова форма не обов’язкова, вважається вчиненим, якщо поведінка сторін засвідчує волю до настання правових наслідків (конклюдентні дії). Воля може виражатися мовчанням у випадках, встановлених договором чи законом. <b>Усно</b> можна вчиняти правочини, які повністю виконуються у момент вчинення, крім тих, що підлягають нотаріальному посвідченню та (або) державній реєстрації, та інші, крім правочинів, для яких встановлено письмову форму. <i>Приклад:</i> купівля хліба — усно.", "<b>▸ Письмова форма</b> (ст. 207–208). Правочин вважається письмовим, якщо зміст зафіксований в одному або кількох документах (у т. ч. електронних), у листах, телеграмах, якими обмінялися сторони, та підписаний особою (особами); підпис може бути електронним у передбачених законом випадках. Якщо особа через хворобу чи фізичну ваду не може підписати, за її дорученням підписує інша особа; її підпис посвідчує нотаріус або інша особа, що має право на нотаріальні дії, із зазначенням причин. <b>Обов’язково письмово</b> (ст. 208): правочини юридичних осіб між собою; між фізичною та юридичною особою (крім усних за ст. 206); між фізичними особами на суму понад двадцять неоподатковуваних мінімумів доходів громадян (крім тих, що виконуються у момент вчинення); інші за законом. <i>Приклад:</i> договір оренди між двома ТОВ — письмово.", "<b>▸ Нотаріальне посвідчення</b> (ст. 209). Правочин у письмовій формі підлягає нотаріальному посвідченню лише у випадках, встановлених законом або домовленістю сторін; власник нерухомого майна має право встановити (скасувати) обов’язкове нотаріальне посвідчення щодо свого майна; посвідчує нотаріус або інша уповноважена посадова особа через посвідчувальний напис; за бажанням особи нотаріально посвідчується будь-який правочин. <i>Приклад:</i> договір купівлі-продажу квартири.", "<b>▸ Державна реєстрація правочину</b> (ст. 210). Правочин підлягає реєстрації лише у випадках, встановлених законом; такий правочин є вчиненим з моменту державної реєстрації; органи, які реєструють, визначає закон. <b>Місце вчинення</b> (ст. 211), якщо не вказане: для одностороннього правочину — місце вираження волі сторони; для дво- та багатосторонніх — за правилами про місце укладення договору (ст. 647).", "<b>▸ Умовні правочини</b> (ст. 212). Особи мають право обумовити настання чи зміну прав та обов’язків обставиною, щодо якої невідомо, настане вона чи ні: <b>відкладальною</b> (права виникають з її настанням) або <b>скасувальною</b> (права припиняються). Якщо настанню обставини недобросовісно сприяла вигідна їй сторона, вважається, що вона не настала; закон може встановлювати особливості таких правочинів. <i>Приклад:</i> оренда квартири на умови вступу сина до вишу — відкладальна; договір припиняється, якщо особа залишить роботу — скасувальна.", "<b>▸ Тлумачення змісту</b> (ст. 213). Зміст може бути витлумачений стороною (сторонами); на вимогу однієї або обох суд може постановити рішення про тлумачення; беруть до уваги однакове значення слів і понять, загальноприйняте значення термінів, порівнюють з іншими умовами та змістом правочину в цілому, намірами сторін, метою, практикою відносин, звичаями. <i>Приклад:</i> спір, чи слово «ремонт» у договорі охоплює заміну вікон.", "<b>▸ Відмова від правочину</b> (ст. 214). Особа, що вчинила односторонній правочин, вправі відмовитися, якщо закон не забороняє; якщо цим порушено права іншої особи, вони підлягають захисту. Від дво- чи багатостороннього — за взаємною згодою або у випадках закону, навіть якщо виконано. Відмова вчиняється у тій самій формі, що й правочин; наслідки — за законом чи домовленістю. <i>Приклад:</i> скасування заповіту; сторони за згодою відмовляються від договору дарування.", "<b>▸ Недійсність</b> (ст. 215). Підставою є недодержання в момент вчинення вимог ч. 1–3, 5, 6 ст. 203. <b>Нікчемний</b> — недійсність встановлена законом, визнання судом не потрібне; <b>оспорюваний</b> — недійсний, якщо визнаний судом. Недійсний правочин не створює юридичних наслідків, крім пов’язаних з недійсністю; недійсною може бути й окрема частина (ст. 217), якщо правочин був би вчинений і без неї. Недійсний з моменту вчинення (ст. 236); якщо права та обов’язки передбачалися лише на майбутнє, він може бути недійсним лише на майбутнє.", "<b>▸ Наслідки недодержання форми.</b> <b>Письмова</b> (ст. 218): не робить правочин недійсним, крім випадків закону; у спорі не можна посилатися на свідків для підтвердження правочину та умов, але можна на письмові й інші докази. <b>Нотаріальна форма</b>: одностороннього правочину (ст. 219) — нікчемний, але суд може визнати дійсним, якщо він відповідав справжній волі особи; договору (ст. 220) — нікчемний, а суд може визнати дійсним, якщо сторони домовилися щодо істотних умов (підтверджено письмово), одна повністю чи частково виконала, а інша ухилилася від посвідчення; повторне посвідчення тоді не потрібне. <i>Приклад:</i> продавець отримав гроші, покупець ухиляється від нотаріуса — суд може визнати договір дійсним.", "<b>▸ Нікчемні правочини</b> (приклади). Умова про відмову від правоздатності (ст. 27); малолітньої особи за межами дієздатності (ст. 221): може бути схвалений батьками чи опікуном; без дозволу органу опіки (ст. 224): нікчемний, але суд може визнати дійсним, якщо відповідає інтересам підопічного; недієздатної особи (ст. 226): дрібний побутовий опікун може схвалити, інакше нікчемний; порушує публічний порядок (ст. 228): спрямований на порушення конституційних прав, знищення чи пошкодження майна, незаконне заволодіння; при умислі обох сторін усе одержане — в дохід держави, при умислі однієї — повертається другій, а одержане нею — в дохід держави. <i>Приклад:</i> купівля-продаж квартири без нотаріуса; договір із замовленням на підпал.", "<b>▸ Оспорювані правочини</b> (приклади). Неповнолітньої особи за межами дієздатності без згоди батьків/піклувальника (ст. 222) і особи з обмеженою дієздатністю без згоди піклувальника (ст. 223) — можуть бути схвалені; дієздатної особи, що не усвідомлювала значення дій (ст. 225) — за позовом цієї особи, а в разі смерті — інших осіб, чиї права порушено; юридичної особи без ліцензії (ст. 227) — недійсним за позовом (за введення в оману — моральна шкода); помилка (ст. 229): щодо природи правочину, прав та обов’язків сторін, властивостей і якостей речі, що значно знижують цінність або можливість використання за призначенням; обман (ст. 230): навмисне введення в оману щодо істотних обставин; насильство (ст. 231): фізичний чи психічний тиск з боку другої сторони чи іншої особи; зловмисна домовленість представника з другою стороною (ст. 232); тяжкі обставини (ст. 233): правочин на вкрай невигідних умовах, незалежно від ініціатора. <i>Приклади:</i> купівля ланцюжка, що виявився позолоченим (помилка); авто продано з прихованим дефектом (обман); підписав договір під погрозою (насильство); продаж майна задешево через тяжку хворобу родича (тяжкі обставини).", "<b>▸ Фіктивний і удаваний</b> (ст. 234–235). <b>Фіктивний</b> — вчинений без наміру створення правових наслідків; визнається судом недійсним; наслідки — за ст. 216. <i>Приклад:</i> «продаж» майна близькому родичу для ухилення від стягнення боргів. <b>Удаваний</b> — вчинений для приховання іншого правочину; якщо встановлено, застосовуються правила щодо правочину, який сторони насправді вчинили. <i>Приклад:</i> договір дарування оформлено як купівлю-продаж.", "<b>▸ Правові наслідки недійсності</b> (ст. 216). Недійсний правочин не створює юридичних наслідків, крім пов’язаних з недійсністю. Кожна сторона зобов’язана повернути другій у натурі все, що одержала; якщо неможливо — відшкодувати вартість за цінами на момент відшкодування (двостороння реституція). Збитки та моральна шкода відшкодовуються стороною, винною у вчиненні недійсного правочину; за обману чи насильства — потерпілій стороні (ст. 230–231). <i>Приклад:</i> після визнання договору купівлі-продажу недійсним покупець повертає авто, продавець — гроші."], "5": ["⚠️ Статті 237–250 я не міг перевірити дослівно, тому цей розділ складено за змістом ЦК, його слід звіряти з текстом.", "<b>▸ Поняття та підстави</b> (ст. 237). Представництво — правовідношення, в якому одна сторона (представник) зобов’язана або має право вчинити правочин від імені другої сторони, яку вона представляє. Підстави: договір, закон, акт органу юридичної особи, акт органу влади чи місцевого самоврядування, інші підстави. Не є представником особа, яка діє від свого імені (хоч і в чужих інтересах), яка лише веде переговори про можливі в майбутньому правочини, посередник. <i>Приклад:</i> комісіонер продає річ від свого імені — не представник.", "<b>▸ Правочини, які може вчиняти представник</b> (ст. 238). Представник діє в межах повноважень; не може вчиняти правочини, що за змістом вчиняються лише особисто (наприклад, заповіт); не може вчиняти правочин щодо себе особисто, а також щодо іншої особи, представником якої одночасно є, крім комерційного представництва та випадків закону. Наслідки для представленого — ст. 239.", "<b>▸ Передоручення</b> (ст. 240). Представник зобов’язаний вчиняти правочин особисто; може передати повноваження повністю чи частково іншій особі, якщо це встановлено договором або законом чи якщо він змушений силою обставин для охорони інтересів довірителя; про це слід повідомити довірителя; представник відповідає за вибір заступника. <i>Приклад:</i> представник захворів і передоручив справу колезі.", "<b>▸ Перевищення повноважень</b> (ст. 241). Правочин, вчинений представником з перевищенням повноважень, створює права та обов’язки для особи, яку представляють, лише у разі наступного схвалення нею; якщо не схвалила — для самого представника.", "<b>▸ Законне та комерційне представництво</b> (ст. 242–243). Законні представники — батьки (усиновлювачі), опікуни, піклувальники та інші, визначені законом. Комерційний представник — особа, яка постійно та самостійно представляє підприємців при укладенні договорів у сфері підприємницької діяльності; діє за договором і довіреністю; може представляти різні сторони за згодою.", "<b>▸ Довіреність</b> (ст. 244–245). Письмовий документ, що видається однією особою іншій для представництва перед третіми особами. Форма має відповідати формі правочину (для нотаріальних — нотаріальна); довіреність у порядку передоручення — нотаріальна. Прирівнюються до нотаріальних довіреності, посвідчені: посадовими особами місцевого самоврядування (за відсутності нотаріуса), лікарем стаціонарного закладу, командиром військової частини, начальником установи виконання покарань, закладом соціального захисту — але не на розпорядження нерухомістю, корпоративними правами й транспортними засобами. <i>Приклад:</i> довіреність пацієнта лікарні на отримання пенсії посвідчує головлікар.", "<b>▸ Довіреність юридичної особи, строк, припинення</b> (ст. 246–250). Довіреність від юридичної особи видає її орган або уповноважена установчими документами особа. Строк визначається у довіреності; якщо не встановлений — діє до припинення; без дати — нікчемна; у порядку передоручення — не довша за основну. Припинення (ст. 248): закінчення строку, скасування довірителем, відмова представника, припинення юридичної особи чи смерть/недієздатність/безвісна відсутність довірителя або представника. Довіритель може скасувати довіреність у будь-який час, відмова від цього права нікчемна (ст. 249); представник може відмовитися від вчинення дій (ст. 250). <i>Приклад:</i> довіреність без дати на отримання посилки — нікчемна."]};

const sel=new Set();const pool=()=>{const r=sel.size?[...sel]:[1,2,3,4,5];return D.filter(d=>r.some(n=>d.id>=TP[n][1]&&d.id<=TP[n][2]))};
const shuf=a=>{a=a.slice();for(let j=a.length-1;j>0;j--){const k=Math.random()*(j+1)|0;[a[j],a[k]]=[a[k],a[j]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const short=a=>{a=a.replace(/^⚠️\s*/,"");let m=a.search(/\.\s/);if(m<40||m>170)m=-1;let s=m>0?a.slice(0,m+1):a;if(s.length>170)s=s.slice(0,167).replace(/\s\S*$/,"")+"…";return s};

 const d=deck[i],kn=Object.values(K).filter(v=>v===1).length;

 $("#c").onclick=()=>{flip=!flip;cards()};

function quiz(n){const p=pool();let qs=shuf(p).slice(0,Math.min(n,p.length)),q=0,sc=0,miss=[];
 const show=()=>{const d=qs[q];let cs=short(d.a),op;

  app.innerHTML='<div class="info">'+(q+1)+' / '+qs.length+' · правильних: '+sc+'</div><div class="bar"><i style="width:'+(q/qs.length*100)+'%"></i></div><p><b>'+esc(d.q)+'</b></p><div id="o"></div><div id="f"></div>';
  op.forEach(t=>{const b=document.createElement("button");b.className="opt";b.textContent=t;b.onclick=()=>{const r=t===cs;if(r){sc++;K[d.id]=1}else{miss.push(d);K[d.id]=0}sv();
   document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.textContent===cs)x.classList.add("ok")});if(!r)b.classList.add("no");
   $("#f").innerHTML='<div class="full">'+esc(d.a)+'</div><div class="row"><button class="p" id="nx">'+(q<qs.length-1?"Далі":"Результат")+'</button></div>';
   $("#nx").onclick=()=>{q++;q<qs.length?show():end()}};$("#o").append(b)})};
 const end=()=>{app.innerHTML='<h2>Результат: '+sc+' з '+qs.length+'</h2><div class="bar"><i style="width:'+(sc/qs.length*100)+'%"></i></div><div class="row"><button id="rt" class="p">Новий тест</button></div>'+(miss.length?'<p class="info">Повторіть:</p>'+miss.map(d=>'<div class="rev"><b>'+esc(d.q)+'</b><br>'+esc(d.a)+'</div>').join(""):'');$("#rt").onclick=menu};
 show()}
