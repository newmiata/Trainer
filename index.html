говір простого товариства"]}, {"id": 141, "q": "Виберіть з переліку односторонні правочини:", "a": "Заповіт, довіреність, прийняття спадщини, відмова від спадщини, відмова від права власності, публічна обіцянка винагороди, відкликання довіреності. Двосторонні й багатосторонні — це договори.", "o": ["Заповіт, довіреність, прийняття спадщини, відмова від права власності", "Купівля-продаж, оренда, позика, дарування між фізичними особами", "Дарування, міна, підряд, договір зберігання майна на складі", "Договір поруки, застави, іпотеки та договір простого товариства"]}, {"id": 142, "q": "Назвіть правильні твердження щодо співвідношення понять «правочин» і «договір»:", "a": "Правочин — родове (ширше) поняття; договір — двосторонній або багатосторонній правочин (ст. 202 ч. 3, ст. 626). Кожен договір є правочином, але не кожен правочин є договором, бо існують односторонні правочини.", "o": ["Договір — різновид правочину; правочин ширший за договір", "Правочин і договір є повністю тотожними поняттями у ЦК", "Договір ширший за правочин, оскільки охоплює односторонні акти", "Правочин — це лише односторонній акт, а договір — інший вид"]}, {"id": 143, "q": "Оберіть правильні твердження щодо дрібного побутового правочину:", "a": "Дрібний побутовий правочин задовольняє побутові потреби особи, відповідає її фізичному, духовному чи соціальному розвитку та стосується предмета невисокої вартості (ст. 31 ч. 1 п. 1). Його самостійно може вчиняти малолітня особа та особа з обмеженою дієздатністю (ст. 37 ч. 2); помічник — в інтересах підопічного (ст. 78 ч. 3). Недієздатна особа не має права вчиняти жодних правочинів.", "o": ["Задовольняє побутові потреби, відповідає розвитку, предмет невисокої вартості", "Будь-який правочин на суму до 20 НМДГ, що виконується у момент вчинення", "Правочин, що вчиняється виключно між родичами в побутових цілях", "Лише безоплатний правочин, що виконується у момент його вчинення"]}, {"id": 144, "q": "Виберіть види правочинів залежно від моменту вчинення:", "a": "Консенсуальні (вважаються вчиненими з моменту досягнення згоди) та реальні (з моменту передання речі), а для тих, що потребують нотаріального посвідчення чи реєстрації, — з моменту посвідчення чи реєстрації (ст. 210, 640).", "o": ["Консенсуальні та реальні", "Оплатні та безоплатні", "Строкові та безстрокові", "Односторонні та двосторонні"]}, {"id": 145, "q": "Виберіть правильні твердження щодо форми правочину та способів волевиявлення осіб:", "a": "Форма — усна або письмова (проста чи нотаріальна), сторони вільні обирати форму, якщо закон не встановлює іншого (ст. 205 ч. 1). Волевиявлення — словами, письмово, конклюдентними діями (поведінка засвідчує волю до настання правових наслідків), а мовчанням — лише у випадках, встановлених договором чи законом (ст. 205 ч. 2).", "o": ["Усна й письмова (проста чи нотаріальна); словами, діями, мовчанням у випадках закону", "Лише письмова й нотаріальна; волевиявлення лише словами чи письмово, без дій", "Усна, письмова, електронна, нотаріальна та реєстраційна; лише словами та діями", "Лише усна та письмова; волевиявлення словами, діями, мовчанням у будь-яких випадках"]}, {"id": 146, "q": "Виберіть правильні твердження щодо вимог, додержання яких є необхідним для чинності правочину:", "a": "Вимоги ст. 203: законність змісту, необхідний обсяг дієздатності, вільне волевиявлення, що відповідає внутрішній волі, дотримання форми, спрямованість на реальне настання наслідків, а також відповідність інтересам дітей, якщо правочин вчиняють батьки (усиновлювачі).", "o": ["Законність змісту, дієздатність, вільна воля, форма, реальні наслідки, інтереси дітей", "Законність змісту, оплатність, письмова форма, нотаріальне посвідчення, державна реєстрація", "Дієздатність, письмова форма, наявність свідків, сплата державного мита, реєстрація", "Вільна воля, нотаріус, печатка, оплатність, наявність доказів, державна реєстрація"]}, {"id": 147, "q": "Виберіть правильні твердження щодо правочинів, які можуть вчинятися усно?", "a": "Усно може вчинятися правочин, який повністю виконується сторонами у момент його вчинення, крім тих, що підлягають нотаріальному посвідченню та (або) державній реєстрації (ст. 206 ч. 1); також усно можна вчиняти інші правочини, для яких закон не вимагає письмової форми (ст. 206 ч. 2; ст. 208).", "o": ["Ті, що повністю виконуються у момент вчинення, крім нотаріальних та підлягаючих реєстрації", "Усі договори до 20 НМДГ, незалежно від моменту їх виконання та форми, за винятком нотаріальних", "Лише договори між фізичними особами, що виконуються за місцем проживання однієї зі сторін", "Усі договори купівлі-продажу майна, у тому числі нерухомого, якщо сторони згодні"]}, {"id": 148, "q": "Виберіть правильні твердження щодо можливості підписати текст правочину іншою особою:", "a": "Якщо особа через хворобу чи фізичну ваду не може підписати правочин, його підписує інша особа за її дорученням; її підпис посвідчує нотаріус або інша особа, яка має право вчиняти нотаріальні дії, із зазначенням причин (ст. 207 ч. 3). Для правочинів без обов’язкового нотаріального посвідчення підпис іншої особи може засвідчити посадова особа за місцем роботи, навчання, проживання чи лікування. Підпис може бути також факсимільним чи електронним у випадках, встановлених законом.", "o": ["Інша особа за дорученням, підпис посвідчує нотаріус або посадова особа", "Будь-який свідок, присутній під час вчинення правочину, без посвідчення", "Лише представник за довіреністю, підпис якого не потребує посвідчення", "Допускається лише факсимільний підпис, інші способи підписання заборонені"]}, {"id": 149, "q": "Виберіть правильні твердження щодо нотаріального посвідчення правочину:", "a": "Нотаріальне посвідчення обов’язкове лише у випадках, встановлених законом або домовленістю сторін (ст. 209 ч. 1); здійснюється нотаріусом чи іншою уповноваженою посадовою особою через посвідчувальний напис (ч. 2); за бажанням особи нотаріально може бути посвідчений будь-який правочин (ч. 4). Недодержання вимоги про нотаріальне посвідчення робить правочин нікчемним (ст. 219 ч. 1, ст. 220 ч. 1).", "o": ["Обов’язкове за законом чи домовленістю; за бажанням — будь-який; недодержання — нікчемність", "Обов’язкове для всіх письмових правочинів; недодержання тягне оспорюваність", "Обов’язкове лише для нерухомості; за бажанням — лише договори; недодержання — оспорюваність", "Ніколи не є обов’язковим; за бажанням — будь-який правочин; недодержання — дійсний"]}, {"id": 150, "q": "Який спосіб (способи) захисту може бути застосовано у разі нікчемності правочину?:", "a": "Нікчемний правочин недійсний за законом і визнання його недійсним судом не вимагається (ст. 215 ч. 2). Застосовуються наслідки недійсності: двостороння реституція та відшкодування збитків і моральної шкоди (ст. 216), позов про повернення майна, визнання права. Також суд може визнати правочин дійсним, якщо це прямо допускається законом (наприклад, ст. 220 ч. 2, ст. 224 ч. 2).", "o": ["Двостороння реституція та відшкодування збитків; суд може визнати дійсним у випадках закону", "Лише визнання недійсним судом за позовом заінтересованої особи; реституція не застосовується", "Лише відшкодування моральної шкоди; суд ніколи не може визнати такий правочин дійсним", "Штраф у дохід держави та конфіскація всього одержаного за таким правочином"]}, {"id": 151, "q": "Який із наведених правочинів НЕ може бути визнаний судом недійсним?:", "a": "Нікчемний правочин, бо його недійсність встановлена законом і визнання судом не вимагається (ст. 215 ч. 2). Судом визнається недійсним лише оспорюваний правочин (ст. 215 ч. 3).", "o": ["Нікчемний правочин", "Оспорюваний правочин", "Фіктивний правочин", "Удаваний правочин"]}, {"id": 152, "q": "Як називається вид недійсного правочину, недійсність якого прямо встановлена законом, і визнання його недійсним судом не вимагається?:", "a": "Нікчемний правочин (ст. 215 ч. 2).", "o": ["Нікчемний", "Оспорюваний", "Фіктивний", "Удаваний"]}, {"id": 153, "q": "Як називається вид недійсного правочину, недійсність якого прямо не встановлена законом, але який може бути визнаний судом недійсним за позовом однієї із сторін або іншої заінтересованої особи на підставах, встановлених законом?:", "a": "Оспорюваний правочин (ст. 215 ч. 3).", "o": ["Оспорюваний", "Нікчемний", "Фіктивний", "Удаваний"]}, {"id": 154, "q": "Як називається правочин, який вчинено без наміру створення правових наслідків, які обумовлювалися цим правочином?:", "a": "Фіктивний правочин (ст. 234).", "o": ["Фіктивний", "Удаваний", "Нікчемний", "Оспорюваний"]}, {"id": 155, "q": "Як називається правочин, який вчинено сторонами для приховання іншого правочину, який вони насправді вчинили?:", "a": "Удаваний правочин (ст. 235).", "o": ["Удаваний", "Фіктивний", "Нікчемний", "Оспорюваний"]}, {"id": 156, "q": "Як називається неправильне сприйняття стороною правочину предмета чи інших істотних умов останнього, що вплинуло на її волевиявлення, за відсутності якого можна вважати, що правочин не було б вчинено?:", "a": "Помилка (ст. 229). Істотне значення має помилка щодо природи правочину, прав та обов’язків сторін, таких властивостей предмета, які значно знижують його цінність або можливість використання за призначенням.", "o": ["Помилка", "Обман", "Насильство", "Тяжкі обставини"]}, {"id": 157, "q": "Який правовий наслідок правочину, вчиненого під впливом обману?:", "a": "Правочин визнається судом недійсним за позовом потерпілої сторони (ст. 230 ч. 1). Потерпіла сторона має право на відшкодування збитків та моральної шкоди (ч. 2); застосовується реституція (ст. 216).", "o": ["Недійсний судом за позовом потерпілої сторони; збитки та моральна шкода", "Нікчемний автоматично; потерпіла сторона може лише повернути майно", "Дійсний, якщо договір виконано; збитки відшкодовуються лише за згодою", "Недійсний лише за позовом прокурора; моральна шкода не відшкодовується"]}, {"id": 158, "q": "Який правовий наслідок недодержання сторонами вимоги закону про нотаріальне посвідчення правочину?:", "a": "Правочин є нікчемним: односторонній правочин — ст. 219 ч. 1; договір — ст. 220 ч. 1. Суд може визнати такий правочин дійсним, якщо сторони домовилися щодо всіх істотних умов, є письмові докази, одна сторона повністю або частково виконала, а друга ухиляється від нотаріального посвідчення (ст. 220 ч. 2).", "o": ["Нікчемний; суд може визнати дійсним, якщо одна сторона виконала, а інша ухиляється", "Оспорюваний; суд визнає недійсним лише за позовом сторони, яка не виконала", "Дійсний, якщо сторони домовилися про всі істотні умови та підписали його", "Недійсний без жодних винятків; суд не може визнати його дійсним ніколи"]}, {"id": 159, "q": "Який загальний правовий наслідок недодержання сторонами письмової форми правочину, яка встановлена законом?:", "a": "Недодержання письмової форми не робить правочин недійсним, якщо закон прямо цього не встановлює; у разі спору сторони не мають права посилатися на свідчення свідків для підтвердження правочину та його умов, але можуть наводити письмові та інші докази (ст. 218).", "o": ["Не має наслідком недійсність; у спорі не можна посилатися на свідків", "Правочин нікчемний і не створює жодних наслідків для сторін", "Правочин оспорюваний; сторони не можуть наводити жодні докази", "Правочин не вважається вчиненим; докази свідків допускаються"]}, {"id": 160, "q": "Як називається правовий наслідок недійсності правочину, який полягає у поверненні кожною із сторін другій стороні у натурі всього, що вона одержала на виконання цього правочину, а в разі неможливості такого повернення – у відшкодуванні вартості одержаного, за цінами, які існують на момент відшкодування?:", "a": "Реституція (двостороння реституція) (ст. 216 ч. 1).", "o": ["Реституція", "Віндикація", "Конфіскація", "Новація"]}, {"id": 161, "q": "Який правочин може бути визнаний судом дійсним?:", "a": "Правочин, вчинений без нотаріального посвідчення, може бути визнаний судом дійсним за умов ст. 220 ч. 2. Також судом дійсним може бути визнаний правочин, вчинений без дозволу органу опіки, якщо він відповідає інтересам підопічного (ст. 224 ч. 2).", "o": ["Договір без нотаріуса за умов закону або без дозволу опіки в інтересах підопічного", "Договір, що порушує публічний порядок, якщо його виконали обидві сторони", "Фіктивний правочин, якщо сторони виконали його частково чи повністю", "Правочин, що обмежує правоздатність фізичної особи, якщо вона його схвалила"]}, {"id": 162, "q": "Який правовий наслідок правочину, вчиненого юридичною особою без відповідного дозволу (ліцензії)?:", "a": "Правочин юридичної особи, вчинений без відповідного дозволу (ліцензії), може бути визнаний судом недійсним (оспорюваний) (ст. 227 ч. 1). Якщо юридична особа ввела другу сторону в оману щодо свого права на вчинення такого правочину, вона зобов’язана відшкодувати їй моральну шкоду (ч. 2).", "o": ["Оспорюваний: може бути визнаний судом недійсним", "Нікчемний: недійсний без визнання судом", "Дійсний: недійсність закон не передбачає", "Фіктивний: вчинений без наміру створення наслідків"]}, {"id": 163, "q": "Який правовий наслідок вчинення правочину без дозволу органу опіки і піклування?:", "a": "Правочин є нікчемним (ст. 224 ч. 1), але суд на вимогу заінтересованої особи може визнати його дійсним, якщо він відповідає інтересам підопічного (ч. 2).", "o": ["Нікчемний; суд може визнати дійсним, якщо відповідає інтересам підопічного", "Оспорюваний; визнається недійсним за позовом органу опіки та піклування", "Дійсний, якщо опікун пізніше самостійно схвалить такий правочин", "Нікчемний; суд за жодних обставин не може визнати його дійсним"]}, {"id": 164, "q": "Який спеціальний правовий наслідок вчинення правочину під впливом обману?:", "a": "Відшкодування потерпілій стороні збитків та моральної шкоди (ст. 230 ч. 2) — на додаток до реституції.", "o": ["Відшкодування збитків і моральної шкоди потерпілій стороні", "Конфіскація одержаного за правочином в дохід держави повністю", "Лише реституція без права на відшкодування будь-яких збитків", "Штраф у дохід державного бюджету та стягнення судового збору"]}, {"id": 165, "q": "Який спеціальний правовий наслідок правочину, вчиненого у результаті зловмисної домовленості представника однієї сторони з другою стороною?:", "a": "Правочин визнається судом недійсним за позовом потерпілої сторони (ст. 232 ч. 1); потерпіла сторона має право на відшкодування збитків і моральної шкоди, які вона зазнала внаслідок зловмисної домовленості представника однієї сторони з другою стороною (ч. 2).", "o": ["Недійсний судом; збитки та моральна шкода потерпілій стороні", "Нікчемний автоматично; шкода потерпілій стороні не відшкодовується", "Дійсний, якщо представник діяв у межах наданих йому повноважень", "Фіктивний; наслідком є лише конфіскація одержаного в дохід держави"]}, {"id": 166, "q": "Які правові наслідки фіктивного правочину?:", "a": "Фіктивний правочин визнається судом недійсним (ст. 234), застосовується двостороння реституція (ст. 216).", "o": ["Визнається судом недійсним; двостороння реституція", "Нікчемний, наслідків не створює, реституція не застосовується", "Дійсний, якщо сторони виконали його добровільно й повністю", "Перекваліфіковується в удаваний правочин за рішенням суду"]}, {"id": 167, "q": "З якого моменту настає недійсність правочину?:", "a": "З моменту його вчинення (ст. 236 ч. 1). Якщо за правочином, недійсним з певних підстав, його недійсність настає з моменту визнання судом, — це прямо вказується в законі.", "o": ["З моменту його вчинення", "З моменту визнання судом", "З моменту виконання", "З моменту набрання чинності рішенням"]}, {"id": 168, "q": "Який орган (органи) може (можуть) визнати правочин недійсним?:", "a": "Суд (ст. 215 ч. 3). Недійсність нікчемних правочинів встановлена самим законом.", "o": ["Суд за позовом заінтересованої особи", "Нотаріус за заявою однієї зі сторін", "Орган опіки та піклування за поданням", "Державний реєстратор за зверненням"]}, {"id": 169, "q": "Який правовий наслідок правочину, який порушує публічний порядок?:", "a": "Правочин, що порушує публічний порядок, є нікчемним (ст. 228 ч. 1). Якщо обидві сторони діяли умисно, усе одержане ними в дохід держави; якщо умисел лише в однієї сторони — друга сторона повертає своє, а одержане від неї — в дохід держави (ст. 228 ч. 3).", "o": ["Нікчемний; при умислі обох сторін усе одержане — в дохід держави", "Оспорюваний; недійсним визнається судом за позовом прокурора", "Дійсний, якщо сторони виконали його добровільно та повністю", "Нікчемний; усе одержане за правочином повертається сторонам"]}, {"id": 170, "q": "Які із наведених правочинів є нікчемними?:", "a": "Нікчемні правочини (недійсні за законом): що обмежують правоздатність фізичної особи (ст. 27 ч. 1); без нотаріального посвідчення (ст. 219–220); вчинені малолітньою особою за межами дієздатності (ст. 221 ч. 1); без дозволу органу опіки та піклування (ст. 224 ч. 1); вчинені недієздатною фізичною особою (ст. 226 ч. 1); що порушують публічний порядок (ст. 228).", "o": ["Малолітньої за межами дієздатності; недієздатної; без дозволу опіки; без нотаріальної форми", "Неповнолітньої за межами дієздатності; з обмеженою дієздатністю; під впливом помилки", "Вчинені під впливом обману, насильства, помилки, тяжких обставин чи зловмисної домовленості", "Юридичної особи без ліцензії; фіктивні; вчинені під впливом помилки; удавані"]}, {"id": 171, "q": "Які із наведених правочинів є нікчемними?:", "a": "Нікчемні правочини (недійсні за законом): що обмежують правоздатність фізичної особи (ст. 27 ч. 1); без нотаріального посвідчення (ст. 219–220); вчинені малолітньою особою за межами дієздатності (ст. 221 ч. 1); без дозволу органу опіки та піклування (ст. 224 ч. 1); вчинені недієздатною фізичною особою (ст. 226 ч. 1); що порушують публічний порядок (ст. 228).", "o": ["Малолітньої за межами дієздатності; недієздатної; без дозволу опіки; без нотаріальної форми", "Неповнолітньої за межами дієздатності; з обмеженою дієздатністю; під впливом помилки", "Вчинені під впливом обману, насильства, помилки, тяжких обставин чи зловмисної домовленості", "Юридичної особи без ліцензії; фіктивні; вчинені під впливом помилки; удавані"]}, {"id": 172, "q": "Які із наведених правочинів є нікчемними?:", "a": "Нікчемні правочини (недійсні за законом): що обмежують правоздатність фізичної особи (ст. 27 ч. 1); без нотаріального посвідчення (ст. 219–220); вчинені малолітньою особою за межами дієздатності (ст. 221 ч. 1); без дозволу органу опіки та піклування (ст. 224 ч. 1); вчинені недієздатною фізичною особою (ст. 226 ч. 1); що порушують публічний порядок (ст. 228).", "o": ["Малолітньої за межами дієздатності; недієздатної; без дозволу опіки; без нотаріальної форми", "Неповнолітньої за межами дієздатності; з обмеженою дієздатністю; під впливом помилки", "Вчинені під впливом обману, насильства, помилки, тяжких обставин чи зловмисної домовленості", "Юридичної особи без ліцензії; фіктивні; вчинені під впливом помилки; удавані"]}, {"id": 173, "q": "Які із наведених правочинів є оспорюваними?:", "a": "Оспорювані правочини (визнаються судом недійсними): вчинені неповнолітньою особою за межами її дієздатності (ст. 222), особою з обмеженою дієздатністю (ст. 223), дієздатною особою, яка не усвідомлювала значення своїх дій (ст. 225), юридичною особою без ліцензії (ст. 227), під впливом помилки (ст. 229), обману (ст. 230), насильства (ст. 231), зловмисної домовленості представника (ст. 232), тяжких обставин (ст. 233), фіктивні (ст. 234).", "o": ["Помилка, обман, насильство, зловмисна домовленість, тяжкі обставини", "Нотаріальна форма, публічний порядок, недієздатність, відсутність опіки", "Малолітня особа, недієздатна особа, відсутність нотаріуса, публічний порядок", "Без дозволу опіки, без нотаріуса, недієздатної особи, публічний порядок"]}, {"id": 174, "q": "Які із наведених правочинів є оспорюваними?:", "a": "Оспорювані правочини (визнаються судом недійсними): вчинені неповнолітньою особою за межами її дієздатності (ст. 222), особою з обмеженою дієздатністю (ст. 223), дієздатною особою, яка не усвідомлювала значення своїх дій (ст. 225), юридичною особою без ліцензії (ст. 227), під впливом помилки (ст. 229), обману (ст. 230), насильства (ст. 231), зловмисної домовленості представника (ст. 232), тяжких обставин (ст. 233), фіктивні (ст. 234).", "o": ["Помилка, обман, насильство, зловмисна домовленість, тяжкі обставини", "Нотаріальна форма, публічний порядок, недієздатність, відсутність опіки", "Малолітня особа, недієздатна особа, відсутність нотаріуса, публічний порядок", "Без дозволу опіки, без нотаріуса, недієздатної особи, публічний порядок"]}, {"id": 175, "q": "Які із наведених правочинів є оспорюваними?:", "a": "Оспорювані правочини (визнаються судом недійсними): вчинені неповнолітньою особою за межами її дієздатності (ст. 222), особою з обмеженою дієздатністю (ст. 223), дієздатною особою, яка не усвідомлювала значення своїх дій (ст. 225), юридичною особою без ліцензії (ст. 227), під впливом помилки (ст. 229), обману (ст. 230), насильства (ст. 231), зловмисної домовленості представника (ст. 232), тяжких обставин (ст. 233), фіктивні (ст. 234).", "o": ["Помилка, обман, насильство, зловмисна домовленість, тяжкі обставини", "Нотаріальна форма, публічний порядок, недієздатність, відсутність опіки", "Малолітня особа, недієздатна особа, відсутність нотаріуса, публічний порядок", "Без дозволу опіки, без нотаріуса, недієздатної особи, публічний порядок"]}, {"id": 176, "q": "Що із наведеного належить до загальних правових наслідків недійсності правочину?:", "a": "Двостороння реституція: кожна сторона зобов’язана повернути другій у натурі все, що отримала за правочином, а якщо це неможливо — відшкодувати вартість за цінами на момент відшкодування (ст. 216 ч. 1–2). Також відшкодування збитків і моральної шкоди винною стороною (ч. 3). Недійсний правочин не створює юридичних наслідків, крім пов’язаних із його недійсністю.", "o": ["Двостороння реституція, збитки і моральна шкода", "Лише повернення речі продавцю без відшкодування", "Лише відшкодування збитків та штрафні санкції", "Конфіскація одержаного в дохід держави"]}, {"id": 177, "q": "Які правочини НЕ вважаються такими, що порушують публічний порядок?:", "a": "Не порушують публічний порядок звичайні цивільні правочини (купівля-продаж, оренда тощо), які не спрямовані на порушення конституційних прав і свобод людини, знищення чи пошкодження майна або незаконне заволодіння ним. Порушує — правочин, спрямований на такі цілі (ст. 228 ч. 1).", "o": ["Той, що не спрямований на порушення прав людини чи знищення майна", "Спрямований на порушення конституційних прав і свобод людини", "Спрямований на знищення чи пошкодження чужого майна", "Спрямований на незаконне заволодіння майном держави"]}, {"id": 178, "q": "Яка помилка може бути підставою для визнання вчиненого під її впливом правочину недійсним?:", "a": "Істотна помилка: щодо природи правочину, прав та обов’язків сторін, властивостей або якостей предмета, які значно знижують його цінність або можливість використання за призначенням (ст. 229 ч. 1–2). Помилка щодо мотивів правочину істотного значення не має, крім випадків, встановлених законом (ч. 3).", "o": ["Помилка щодо природи правочину, прав та обов’язків, властивостей речі", "Помилка щодо мотивів, з яких особа вчинила правочин, у будь-якому разі", "Помилка щодо вартості речі, яка не впливає на її використання", "Помилка щодо наміру іншої сторони використати річ у майбутньому"]}, {"id": 179, "q": "Виберіть правильні положення що правових наслідків правочину, вчиненого з недодержанням письмової форми, встановленої законом:", "a": "Недодержання письмової форми не робить правочин недійсним, якщо закон прямо цього не встановлює; у разі спору сторони не мають права посилатися на свідчення свідків для підтвердження правочину та його умов, але можуть наводити письмові та інші докази (ст. 218).", "o": ["Не має наслідком недійсність; у спорі не можна посилатися на свідків", "Правочин нікчемний і не створює жодних наслідків для сторін", "Правочин оспорюваний; сторони не можуть наводити жодні докази", "Правочин не вважається вчиненим; докази свідків допускаються"]}, {"id": 180, "q": "Хто може звернутися до суду зі позовом про визнання недійсним правочину, вчиненого дієздатною фізичною особою, яка в момент його вчинення не усвідомлювала значення своїх дій та/або не могла керувати ними?:", "a": "Позов про визнання недійсним правочину, вчиненого дієздатною особою, яка не усвідомлювала значення своїх дій та (або) не могла керувати ними, може подати ця особа, а в разі її смерті — інші особи, чиї цивільні права чи інтереси порушені (ст. 225 ч. 1).", "o": ["Ця особа, а після її смерті — інші особи, чиї права порушені", "Лише орган опіки та піклування за місцем проживання особи", "Лише спадкоємці особи після відкриття спадщини за заповітом", "Лише прокурор в інтересах держави за місцем вчинення правочину"]}, {"id": 181, "q": "Виберіть правильні положення щодо фіктивного правочину:", "a": "Фіктивним є правочин, вчинений без наміру створення правових наслідків, обумовлених ним; визнається судом недійсним (ст. 234); наслідок — двостороння реституція (ст. 216). Намір сторін формально оформити правочин без реальних наслідків — його ознака.", "o": ["Вчинений без наміру створення правових наслідків; недійсний судом", "Вчинений для приховання іншого правочину; недійсний за законом", "Вчинений під тиском; недійсний автоматично без рішення суду", "Вчинений без нотаріуса; недійсний за рішенням органу опіки"]}, {"id": 182, "q": "Виберіть правильні положення щодо удаваного правочину:", "a": "Удаваним є правочин, вчинений сторонами для приховання іншого правочину, який вони насправді вчинили (ст. 235 ч. 1). Він недійсний; до відносин сторін застосовуються правила того правочину, який вони насправді вчинили (ч. 2), якщо той не суперечить закону.", "o": ["Вчинений для приховання іншого; діють правила щодо прихованого правочину", "Вчинений без наміру створення наслідків; недійсний без реституції", "Нікчемний без жодних наслідків; прихований правочин не діє", "Оспорюваний, якщо відсутній прихований правочин між сторонами"]}, {"id": 183, "q": "Виберіть правильні твердження щодо правочину, вчиненого під впливом обману:", "a": "Обман — умисне введення в оману щодо обставин, які мають істотне значення (ст. 230 ч. 1); умисним обманом є й замовчування обставин, про які сторона повинна була повідомити. Правочин визнається судом недійсним за позовом потерпілої сторони; вона має право на відшкодування збитків і моральної шкоди (ч. 2). Обман з боку третьої особи теж може бути підставою.", "o": ["Умисне введення в оману щодо істотних обставин", "Помилка однієї сторони щодо предмета правочину", "Тиск третьої особи на волевиявлення сторони", "Невідомість сторонам істотних обставин правочину"]}, {"id": 184, "q": "Як називається правовідношення, в якому одна сторона зобов’язана або має право вчинити правочин від імені другої сторони, яку вона представляє?", "a": "Представництво — правовідношення, в якому одна сторона (представник) зобов’язана або має право вчинити правочин від імені другої сторони, яку вона представляє (ст. 237 ч. 1).", "o": ["Правовідношення, де представник вчиняє правочин від імені представленого", "Дія особи від свого імені, але в чужих інтересах і за чужий рахунок", "Договір доручення, за яким повірений діє від свого імені", "Передача повноважень іншій особі без права вчиняти правочини"]}, {"id": 185, "q": "Як називається особа, яка постійно та самостійно виступає представником підприємців при укладенні ними договорів у сфері підприємницької діяльності?", "a": "Комерційний представник — особа, яка постійно та самостійно представляє підприємців при укладенні ними договорів у сфері підприємницької діяльності (ст. 243 ч. 1).", "o": ["Особа, що постійно та самостійно представляє підприємців при укладенні договорів", "Особа, що постійно та самостійно представляє фізичних осіб при укладенні договорів", "Особа, що діє від свого імені в інтересах підприємців за їх доручення", "Посередник без повноважень, що лише веде переговори про майбутні договори"]}, {"id": 186, "q": "Які є підстави виникнення представництва?", "a": "Договір, закон, акт органу юридичної особи, акт органу державної влади чи місцевого самоврядування; також інші підстави (ст. 237 ч. 2).", "o": ["Договір, закон, акт органу юридичної особи, акт органу влади", "Лише договір між довірителем і представником та акт суду", "Закон, рішення суду, акт прокурора та акт нотаріуса", "Тільки закон та рішення суду, що набрало законної сили"]}, {"id": 187, "q": "Які правові наслідки вчинення правочину представником?", "a": "Правочин, вчинений представником, створює, змінює, припиняє цивільні права та обов’язки для особи, яку він представляє (довірителя), а не для самого представника (ст. 237 ч. 1).", "o": ["У особи, яку представляють", "У самого представника", "У третьої особи", "Не виникають взагалі"]}, {"id": 188, "q": "Фізична особа А. уклала договір з ТзОВ «Б», згідно якого Фізична особа А. зобов’язувалася вести переговори з партнерами ТзОВ «Б» про укладення в майбутньому договору підряду. Який правовий статус Фізичної особи А.?", "a": "Вона не є представником: особа, яка лише веде переговори про можливі в майбутньому правочини і не уповноважена вчиняти правочин від імені ТОВ «Б», представником не вважається (ст. 237 ч. 3). Її статус — особа, що виконує посередницькі (організаційні) дії за договором, без повноважень укладати договір підряду.", "o": ["Не є представником: лише веде переговори без повноважень на правочин", "Є комерційним представником товариства «Б» у сфері підрядів", "Є законним представником товариства «Б» перед партнерами", "Є представником за довіреністю з правом укладати договори"]}, {"id": 189, "q": "Як називається документ, що видається однією особою іншій особі для представництва перед третіми особами?", "a": "Довіреність — письмовий документ, що видається однією особою іншій особі для представництва перед третіми особами (ст. 244 ч. 1).", "o": ["Письмовий документ для представництва перед третіми особами", "Договір доручення, укладений у простій письмовій формі", "Нотаріальний акт про надання повноважень будь-якій особі", "Усне уповноваження представника перед третіми особами"]}, {"id": 190, "q": "У довіреності, яка була видана юридичною особою на представництво в державних органах, НЕ були вказані строк довіреності та дата її видачі, а також не було відбитку печатки юридичної особи. Які правові наслідки видачі такої довіреності?", "a": "Довіреність без вказаної дати є нікчемною (ст. 247). Відсутність строку не є підставою недійсності — довіреність зберігає чинність до припинення її дії (ст. 247 ч. 1). Відсутність печатки на довіреності від юридичної особи сама по собі підставою недійсності не є; довіреність видає орган або особа, уповноважена установчими документами (ст. 246). ⚠️ Звіряйте номер частини ст. 247 з чинним текстом.", "o": ["Нікчемна через відсутність дати", "Оспорювана через відсутність печатки", "Дійсна, строк її дії — один рік", "Дійсна, якщо є підпис керівника"]}, {"id": 191, "q": "Які правові наслідки видачі довіреності, строк якої не встановлений?", "a": "Довіреність зберігає чинність до припинення її дії (ст. 247 ч. 1), тобто діє безстроково, доки не припиниться з підстав ст. 248 або не буде скасована.", "o": ["Діє, доки не припиниться", "Діє один рік з дня видачі", "Діє три роки з дня видачі", "Є нікчемною за законом"]}, {"id": 192, "q": "Фізична особа «М» уповноважила Фізичну особу «Ф» на укладення договору купівлі-продажу квартири (згідно ЦК України договір купівлі-продажу нерухомого майна потребує нотаріального посвідчення). Яким вимогам має відповідати довіреність?", "a": "Довіреність на укладення договору купівлі-продажу квартири має відповідати формі самого правочину (ст. 245 ч. 1), тобто бути нотаріально посвідченою. Вона має бути письмовою, містити дату, відомості про довірителя та представника, обсяг повноважень.", "o": ["Нотаріальна форма", "Проста письмова", "Усна", "Посвідчена керівником"]}, {"id": 193, "q": "Дружина військовослужбовця вирішила видати довіреність на укладення договору купівлі-продажу, перебуваючи на лікуванні в санаторії. До кого їй слід звернутися для посвідчення?", "a": "До нотаріуса. Довіреність на розпорядження нерухомим майном (купівля-продаж квартири) має бути нотаріально посвідчена; довіреності, прирівняні до нотаріальних, які посвідчує головний лікар закладу охорони здоров’я чи санаторію, на такі правочини не видаються (ст. 245 ч. 3–4). ⚠️ Якщо йдеться про правочин, що не потребує нотаріальної форми, довіреність може посвідчити головний лікар, його заступник з медичної частини або черговий лікар.", "o": ["До будь-якого нотаріуса", "До лікаря санаторію", "До командира частини", "До голови сільради"]}, {"id": 194, "q": "Фізична особа Р., яка є представником Фізичної особи Д., через тяжку хворобу не мала можливості укласти договір на виконання своїх повноважень. Тоді Р. видала довіреність у порядку передоручення без згоди та наступного повідомлення Д. Фізичній особі З. Остання уклала договір з перевищенням повноважень. Хто буде суб’єктом відповідальності?", "a": "За ст. 240: представник Р. передала повноваження без згоди довірителя та не повідомила його, тому відповідає за дії заступника (З.) як за свої (хоча передоручення могло бути вимушене обставинами). Оскільки З. перевищила повноваження, правочин створює права та обов’язки для Д. лише в разі наступного схвалення (ст. 241); без схвалення — для самої З. Отже, суб’єкти відповідальності: З. (перед контрагентом) та Р. (перед Д.) ⚠️ Звіряйте з варіантами.", "o": ["Р. відповідає за З. як за себе; для Д. правочин створює права лише після схвалення", "Лише З., оскільки саме вона перевищила повноваження, а Р. за неї не відповідає", "Лише Д., оскільки довіритель відповідає за всі дії представників та їх заступників", "Ніхто, оскільки передоручення було вимушеним через тяжку хворобу представника"]}, {"id": 195, "q": "Фізична особа «Л» видала довіреність Фізичній особі «З» 02.01.2020 р., строком на 5 років, однак без поважних причин скасувала власною заявою від 10.02.2021 р. Яке має правове значення довіреність за даних обставин?", "a": "Довірителю надано право скасувати довіреність у будь-який час, незалежно від причин (ст. 249 ч. 1). Тому довіреність втратила чинність з моменту скасування (повідомлення представника та відомих третіх осіб, ч. 2–3); вказаний у ній строк (5 років) на цей момент уже не має значення. Правочини, вчинені до того, як представник і треті особи дізналися про скасування, зберігають силу.", "o": ["Припинилася з моменту скасування", "Діє весь строк, вказаний у ній", "Недійсна з моменту її видачі", "Діє, доки представник її не поверне"]}, {"id": 196, "q": "Які правові наслідки у випадку вчинення представником правочину з перевищенням повноважень?", "a": "Правочин створює, змінює, припиняє права та обов’язки особи, яку представляють, лише в разі її наступного схвалення (ст. 241). Без схвалення права та обов’язки виникають у самого представника (особи, яка перевищила повноваження).", "o": ["Створює права для довірителя лише після схвалення; інакше для представника", "Нікчемний; жодних наслідків ні для представника, ні для довірителя не створює", "Дійсний для довірителя без схвалення, якщо контрагент діяв сумлінно", "Оспорюваний; недійсний лише за позовом довірителя до суду"]}, {"id": 197, "q": "Хто може бути законним представником фізичної особи, яка досягла 16 років та позбавлена батьківського піклування (батьки позбавлені батьківських прав)?", "a": "Піклувальник, призначений судом або органом опіки та піклування (неповнолітня особа, позбавлена батьківського піклування, — ст. 60 ч. 4, ст. 61, 63; законне представництво — ст. 242).", "o": ["Піклувальник", "Батьки особи", "Опікун особи", "Орган опіки"]}, {"id": 198, "q": "За якої умови допускається представництво одночасно кількох сторін правочину?", "a": "Це допускається лише у випадках комерційного представництва та в інших випадках, прямо встановлених законом (ст. 238 ч. 3 — заборона для представника вчиняти правочини щодо особи, представником якої він одночасно є; ст. 243 — комерційний представник може представляти кількох сторін за їхньою згодою). ⚠️ Звіряйте номери частин із чинним текстом.", "o": ["Лише комерційне представництво та випадки закону", "Завжди, якщо на це дали згоду обидві сторони", "Завжди заборонено без жодних винятків за законом", "За рішенням суду, ухваленим на вимогу довірителя"]}, {"id": 199, "q": "Яке правове значення має умова договору про відмову від права на скасування довіреності?", "a": "Така умова є нікчемною (ст. 249 ч. 1). Довіритель може скасувати довіреність у будь-який час, за винятком безвідкличної довіреності.", "o": ["Нікчемна", "Дійсна", "Оспорювана", "Умовна"]}, {"id": 200, "q": "Що є ознакою представництва?", "a": "Ознака представництва: представник діє від імені довірителя, в його інтересах і в межах повноважень; правові наслідки виникають у довірителя (ст. 237).", "o": ["Діє від імені довірителя в межах повноважень; наслідки для довірителя", "Діє від свого імені в чужих інтересах; наслідки для себе", "Діє на власну користь, а наслідки виникають у третьої особи", "Діє без повноважень; наслідки виникають для нього та довірителя"]}, {"id": 201, "q": "До якого виду представництва слід відносити комерційне представництво?", "a": "До договірного (добровільного) представництва: комерційне представництво ґрунтується на договорі з підприємцем та довіреності (ст. 243).", "o": ["До договірного", "До законного", "До примусового", "До судового"]}, {"id": 202, "q": "Які довіреності НЕ прирівнюються до нотаріально посвідчених?", "a": "Не прирівнюються до нотаріально посвідчених довіреності на розпорядження нерухомістю й іншим майном, що підлягає нотаріальній формі; на управління та розпорядження корпоративними правами; на користування та розпорядження транспортними засобами; довіреності, посвідчені особами, не названими в ст. 245 ч. 3 (ст. 245). ⚠️ Звіряйте з варіантами.", "o": ["Довіреності на нерухомість, корпоративні права, транспортні засоби", "Довіреності на отримання пенсії, заробітку, стипендії", "Довіреності військовослужбовців, посвідчені командиром частини", "Довіреності пацієнтів лікарні, посвідчені головним лікарем"]}, {"id": 203, "q": "Представництво - це:", "a": "Представництво — правовідношення, в якому одна особа (представник) вчиняє правочин від імені та в інтересах іншої особи (ст. 237 ч. 1).", "o": ["Правовідношення, де представник діє від імені довірителя", "Дія особи від свого імені в інтересах іншої особи", "Передача прав довірителя третім особам без згоди", "Односторонній правочин довірителя про видачу повноважень"]}, {"id": 204, "q": "Представником є особа, яка:", "a": "Представником є особа, яка вчиняє правочин від імені іншої особи (довірителя) та в її інтересах на підставі наданих повноважень — договору, закону, акта органу (ст. 237).", "o": ["Особа, що вчиняє правочин від імені іншої на підставі повноважень", "Особа, що діє від свого імені, але в інтересах іншої", "Той, хто лише веде переговори про майбутні правочини", "Посередник, що зводить сторін без права вчиняти правочини"]}, {"id": 205, "q": "НЕ є представником особа, яка:", "a": "Не є представником особа: що вчиняє правочин від свого імені, хоча й в інтересах іншої особи; що не уповноважена вчиняти правочини, а лише веде переговори про можливі в майбутньому правочини; посередник (ст. 237 ч. 3).", "o": ["Діє від свого імені; лише веде переговори; посередник", "Діє за довіреністю та в межах наданих повноважень", "Є законним представником малолітньої особи", "Є комерційним агентом, який діє від імені підприємця"]}, {"id": 206, "q": "НЕ є представником особа, яка:", "a": "Не є представником особа: що вчиняє правочин від свого імені, хоча й в інтересах іншої особи; що не уповноважена вчиняти правочини, а лише веде переговори про можливі в майбутньому правочини; посередник (ст. 237 ч. 3).", "o": ["Діє від свого імені; лише веде переговори; посередник", "Діє за довіреністю та в межах наданих повноважень", "Є законним представником малолітньої особи", "Є комерційним агентом, який діє від імені підприємця"]}, {"id": 207, "q": "НЕ є представником особа, яка:", "a": "Не є представником особа: що вчиняє правочин від свого імені, хоча й в інтересах іншої особи; що не уповноважена вчиняти правочини, а лише веде переговори про можливі в майбутньому правочини; посередник (ст. 237 ч. 3).", "o": ["Діє від свого імені; лише веде переговори; посередник", "Діє за довіреністю та в межах наданих повноважень", "Є законним представником малолітньої особи", "Є комерційним агентом, який діє від імені підприємця"]}, {"id": 208, "q": "На вчинення яких правочинів може бути уповноважений представник?:", "a": "Будь-яких правочинів, які особа вправі вчиняти сама, крім тих, що за змістом можуть бути вчинені лише особисто (наприклад, складення заповіту), та з урахуванням заборон ст. 238.", "o": ["Будь-які, крім тих, що вчиняються лише особисто", "Лише письмові, якщо вони мають нотаріальну форму", "Лише безоплатні та дрібні побутові правочини", "Лише договори, але не односторонні правочини"]}, {"id": 209, "q": "Представник НЕ може вчиняти такі правочини:", "a": "Правочини, що за своїм змістом можуть вчинятися лише особисто (заповіт, шлюб); правочин від імені довірителя щодо себе особисто; правочини щодо іншої особи, представником якої він одночасно є (крім комерційного представництва та випадків, встановлених законом) (ст. 238).", "o": ["Лише особисто (заповіт); щодо себе; щодо іншої особи, яку одночасно представляє", "Купівля-продаж майна довірителя, оренду та дарування майна довірителя", "Усі правочини, що потребують нотаріального посвідчення чи реєстрації", "Правочини, спрямовані на розпорядження майном довірителя за його довіреністю"]}, {"id": 210, "q": "Представництво виникає на підставі:", "a": "Договору, закону, акта органу юридичної особи, акта органу державної влади чи місцевого самоврядування, інших підстав (ст. 237 ч. 2).", "o": ["Договір, закон, акт органу юридичної особи, акт органу влади", "Лише договір між довірителем і представником та акт суду", "Закон, рішення суду, акт прокурора та акт нотаріуса", "Тільки закон та рішення суду, що набрало законної сили"]}, {"id": 211, "q": "Представництво виникає на підставі:", "a": "Договору, закону, акта органу юридичної особи, акта органу державної влади чи місцевого самоврядування, інших підстав (ст. 237 ч. 2).", "o": ["Договір, закон, акт органу юридичної особи, акт органу влади", "Лише договір між довірителем і представником та акт суду", "Закон, рішення суду, акт прокурора та акт нотаріуса", "Тільки закон та рішення суду, що набрало законної сили"]}, {"id": 212, "q": "Представництво виникає на підставі:", "a": "Договору, закону, акта органу юридичної особи, акта органу державної влади чи місцевого самоврядування, інших підстав (ст. 237 ч. 2).", "o": ["Договір, закон, акт органу юридичної особи, акт органу влади", "Лише договір між довірителем і представником та акт суду", "Закон, рішення суду, акт прокурора та акт нотаріуса", "Тільки закон та рішення суду, що набрало законної сили"]}, {"id": 213, "q": "Правовим наслідком вчинення правочину представником є:", "a": "Виникнення, зміна, припинення прав та обов’язків для особи, яку представляють (довірителя) (ст. 237 ч. 1).", "o": ["Права й обов’язки для довірителя", "Права й обов’язки для представника", "Права й обов’язки для третіх осіб", "Нікчемність правочину в цілому"]}, {"id": 214, "q": "Довіреність, у якій не вказана дата її вчинення, є:", "a": "Нікчемною (ст. 247).", "o": ["Нікчемна", "Дійсна", "Оспорювана", "Умовна"]}, {"id": 215, "q": "Оберіть правильне законодавче положення щодо строку довіреності, виданої в порядку передоручення:", "a": "Строк довіреності, виданої в порядку передоручення, не може перевищувати строку довіреності, на підставі якої вона видана (ст. 247 ч. 3).", "o": ["Не довший за основну довіреність", "Не довший за один рік з видачі", "Не довший за три роки з видачі", "Строк не обмежується законом"]}, {"id": 216, "q": "Законним представником є:", "a": "Законними представниками є батьки (усиновлювачі), опікуни, піклувальники та інші особи, визначені законом (ст. 242): за законом батьки представляють малолітніх, опікуни — підопічних, піклувальники надають згоду неповнолітнім та особам з обмеженою дієздатністю.", "o": ["Батьки, усиновлювачі, опікуни, піклувальники", "Лише представники за довіреністю та повірені", "Адвокати та інші особи за договором доручення", "Орган опіки та піклування і нотаріус на місці"]}, {"id": 217, "q": "Законним представником є:", "a": "Законними представниками є батьки (усиновлювачі), опікуни, піклувальники та інші особи, визначені законом (ст. 242): за законом батьки представляють малолітніх, опікуни — підопічних, піклувальники надають згоду неповнолітнім та особам з обмеженою дієздатністю.", "o": ["Батьки, усиновлювачі, опікуни, піклувальники", "Лише представники за довіреністю та повірені", "Адвокати та інші особи за договором доручення", "Орган опіки та піклування і нотаріус на місці"]}, {"id": 218, "q": "Законним представником є:", "a": "Законними представниками є батьки (усиновлювачі), опікуни, піклувальники та інші особи, визначені законом (ст. 242): за законом батьки представляють малолітніх, опікуни — підопічних, піклувальники надають згоду неповнолітнім та особам з обмеженою дієздатністю.", "o": ["Батьки, усиновлювачі, опікуни, піклувальники", "Лише представники за довіреністю та повірені", "Адвокати та інші особи за договором доручення", "Орган опіки та піклування і нотаріус на місці"]}, {"id": 219, "q": "Довіреність - це:", "a": "Довіреність — письмовий документ, що видається однією особою іншій особі для представництва перед третіми особами (ст. 244 ч. 1).", "o": ["Письмовий документ для представництва перед третіми особами", "Договір доручення, укладений у простій письмовій формі", "Нотаріальний акт про надання повноважень будь-якій особі", "Усне уповноваження представника перед третіми особами"]}, {"id": 220, "q": "Довіреність, що видається у порядку передоручення:", "a": "Довіреність, що видається у порядку передоручення, підлягає нотаріальному посвідченню (ст. 245 ч. 2), крім випадків, встановлених ч. 4 цієї статті. Її строк не може перевищувати строку основної довіреності (ст. 247 ч. 3). Передоручення допустиме за умов ст. 240.", "o": ["Підлягає нотаріальному посвідченню", "Простою письмовою формою без посвідчення", "Усно, за домовленістю довірителя й представника", "Не потребує посвідчення, якщо є строк"]}, {"id": 221, "q": "За яких умов представник може передати своє повноваження частково або в повному обсязі іншій особі?", "a": "Якщо це встановлено договором або законом, або якщо представник був вимушений до цього силою обставин для охорони інтересів довірителя (ст. 240 ч. 1).", "o": ["Якщо встановлено договором чи законом або вимушений обставинами", "Завжди, коли довіритель про це не знає і не заперечує", "Лише за попередньою згодою суду на вимогу представника", "Ніколи, оскільки представник зобов’язаний діяти особисто"]}, {"id": 222, "q": "Що є підставами припинення представництва за довіреністю?", "a": "Підстави припинення представництва за довіреністю (ст. 248): 1) закінчення строку; 2) скасування довіреності особою, яка її видала; 3) відмова представника; 4) припинення юридичної особи, яка видала довіреність; 5) припинення юридичної особи, якій видано довіреність; 6) смерть, оголошення померлою, визнання недієздатною, безвісно відсутньою або обмеження дієздатності особи, яка видала довіреність; 7) те саме щодо представника.", "o": ["Закінчення строку, скасування, відмова, припинення чи смерть сторін", "Лише закінчення строку та скасування довіреності довірителем", "Зміна місця проживання, шлюб довірителя, зміна керівника", "Закінчення правочину, реорганізація довірителя, смерть третіх осіб"]}, {"id": 223, "q": "Хто може бути законним представником фізичної особи, яка досягла 13 років?", "a": "Піклувальник (ст. 59, 63, 242) — особа, призначена судом чи органом опіки та піклування; для особи віком від 14 до 18 років, яка не має повної дієздатності, законними представниками, що дають згоду на правочини, є батьки (усиновлювачі) або піклувальник (ст. 32).", "o": ["Піклувальник", "Опікун", "Батьки", "Орган опіки"]}, {"id": 224, "q": "Які довіреності НЕ можуть бути посвідчені уповноваженою особою органу місцевого самоврядування?", "a": "Довіреності на розпорядження нерухомим майном (правочини, що підлягають нотаріальному посвідченню), на управління та розпорядження корпоративними правами, на користування та розпорядження транспортними засобами (ст. 245). ⚠️ Звіряйте з варіантами.", "o": ["Довіреності на нерухомість, корпоративні права, транспортні засоби", "Довіреності на отримання пенсії, заробітку, стипендії", "Довіреності військовослужбовців на отримання грошового забезпечення", "Довіреності пацієнтів на отримання виплат і медичних документів"]}, {"id": 225, "q": "Які правочини НЕ може вчиняти представник?", "a": "Правочини, що за своїм змістом можуть вчинятися лише особисто (заповіт, шлюб); правочин від імені довірителя щодо себе особисто; правочини щодо іншої особи, представником якої він одночасно є (крім комерційного представництва та випадків, встановлених законом) (ст. 238).", "o": ["Лише особисто (заповіт); щодо себе; щодо іншої особи, яку одночасно представляє", "Купівля-продаж майна довірителя, оренду та дарування майна довірителя", "Усі правочини, що потребують нотаріального посвідчення чи реєстрації", "Правочини, спрямовані на розпорядження майном довірителя за його довіреністю"]}, {"id": 226, "q": "Що є підставами припинення представництва за довіреністю?", "a": "Підстави припинення представництва за довіреністю (ст. 248): 1) закінчення строку; 2) скасування довіреності особою, яка її видала; 3) відмова представника; 4) припинення юридичної особи, яка видала довіреність; 5) припинення юридичної особи, якій видано довіреність; 6) смерть, оголошення померлою, визнання недієздатною, безвісно відсутньою або обмеження дієздатності особи, яка видала довіреність; 7) те саме щодо представника.", "o": ["Закінчення строку, скасування, відмова, припинення чи смерть сторін", "Лише закінчення строку та скасування довіреності довірителем", "Зміна місця проживання, шлюб довірителя, зміна керівника", "Закінчення правочину, реорганізація довірителя, смерть третіх осіб"]}, {"id": 227, "q": "Що НЕ є підставами припинення представництва за довіреністю", "a": "Не є підставою: усе, чого немає у переліку ст. 248 (наприклад, зміна місця проживання довірителя, його одруження, зміна керівника юридичної особи, реорганізація довірителя-юридичної особи, смерть третьої особи, за замовчуванням закінчення правочину). ⚠️ Дивіться перелік ст. 248 і виключайте варіанти, що в ньому є.", "o": ["Зміна місця проживання довірителя", "Закінчення строку довіреності", "Скасування довіреності довірителем", "Смерть представника"]}, {"id": 228, "q": "Повноваження комерційного представника можуть бути підтверджені", "a": "Повноваження комерційного представника можуть підтверджуватися договором та (або) довіреністю (ст. 243 ч. 2). ⚠️ Звіряйте з варіантами.", "o": ["Договір та (або) довіреність", "Лише усна домовленість сторін", "Рішення суду про повноваження", "Лише довіреність без договору"]}, {"id": 229, "q": "Якими посадовими особами може бути посвідчена довіреність?", "a": "За ст. 245 ч. 3 прирівнюються до нотаріально посвідчених довіреності, посвідчені: посадовими особами органів місцевого самоврядування (у населених пунктах без нотаріуса); головним лікарем, його заступником з медичної частини або черговим лікарем — для осіб, що перебувають на стаціонарному лікуванні; командиром військової частини — для військовослужбовців (а там, де немає нотаріуса, — також для працівників, членів їхніх сімей і членів сімей військовослужбовців); начальником установи виконання покарань чи СІЗО — для ув’язнених; керівником стаціонарного закладу соціального захисту — для осіб, що в ньому перебувають. Довіреність на отримання заробітної плати, пенсії, стипендії тощо посвідчується також організацією, де особа працює, навчається чи лікується, або житлово-експлуатаційною організацією за місцем проживання (ст. 245 ч. 4). ⚠️ Звіряйте перелік з чинним текстом статті.", "o": ["Нотаріус, органи місцевого самоврядування, лікар, командир, начальник установи", "Лише нотаріус, а в населених пунктах без нотаріуса — державний реєстратор", "Директор школи, голова ЖЕК і керівник підприємства для будь-яких довіреностей", "Голова ЖЕК для нерухомості, директор школи та керівник торгового закладу"]}, {"id": 230, "q": "Які особливості комерційного представництва як різновиду договірного представництва?", "a": "Комерційний представник діє постійно та самостійно, представляє підприємців, діє на підставі договору та довіреності, може представляти кількох сторін за їх згодою, діє у сфері підприємницької діяльності, його повноваження підтверджуються договором чи довіреністю (ст. 243).", "o": ["Постійно та самостійно представляє підприємців; договір і довіреність", "Діє разово за дорученням, без договору та довіреності", "Представляє лише фізичних осіб; діє від свого імені", "Діє без повноважень; наслідки виникають лише для нього"]}, {"id": 231, "q": "В яких випадках передбачена видача безвідкличної довіреності?", "a": "Безвідклична довіреність — лише у випадках, встановлених законом (ст. 249 ч. 4), наприклад щодо корпоративних прав чи розпорядження певним майном за законами про іпотеку, нотаріат тощо. ⚠️ Звіряйте з варіантами.", "o": ["Лише у випадках, встановлених законом", "Завжди, коли про це просить довіритель", "Ніколи, закон її не допускає взагалі", "За рішенням суду на вимогу представника"]}, {"id": 232, "q": "Які підстави припинення представництва за довіреністю?", "a": "Підстави припинення представництва за довіреністю (ст. 248): 1) закінчення строку; 2) скасування довіреності особою, яка її видала; 3) відмова представника; 4) припинення юридичної особи, яка видала довіреність; 5) припинення юридичної особи, якій видано довіреність; 6) смерть, оголошення померлою, визнання недієздатною, безвісно відсутньою або обмеження дієздатності особи, яка видала довіреність; 7) те саме щодо представника.", "o": ["Закінчення строку, скасування, відмова, припинення чи смерть сторін", "Лише закінчення строку та скасування довіреності довірителем", "Зміна місця проживання, шлюб довірителя, зміна керівника", "Закінчення правочину, реорганізація довірителя, смерть третіх осіб"]}, {"id": 233, "q": "Які підстави припинення представництва за законом?", "a": "⚠️ ЦК не має окремої статті з вичерпним переліком. Представництво за законом припиняється у разі: досягнення підопічним повноліття; надання повної дієздатності; реєстрації шлюбу неповнолітньої особи; поновлення цивільної дієздатності; передання малолітньої особи батькам; досягнення підопічним 14 років (опікун стає піклувальником); звільнення опікуна чи піклувальника; смерті представника чи підопічного (ст. 75–77).", "o": ["Повноліття, надання дієздатності, шлюб, поновлення дієздатності, звільнення, смерть", "Лише смерть довірителя або представника та закінчення строку повноважень", "Лише досягнення повноліття та зміна місця проживання підопічного опікуном", "Закінчення строку, скасування довіреності, відмова представника та припинення особи"]}, {"id": 234, "q": "Представник зобовʼязаний вчиняти правочин за наданими йому повноваженнями особисто, крім випадків:", "a": "Якщо це встановлено договором або законом, або якщо представник був вимушений до цього силою обставин для охорони інтересів довірителя (ст. 240 ч. 1).", "o": ["Якщо встановлено договором чи законом або вимушений обставинами", "Завжди, коли довіритель про це не знає і не заперечує", "Лише за попередньою згодою суду на вимогу представника", "Ніколи, оскільки представник зобов’язаний діяти особисто"]}, {"id": 235, "q": "Законними представниками є:", "a": "Законними представниками є батьки (усиновлювачі), опікуни, піклувальники та інші особи, визначені законом (ст. 242): за законом батьки представляють малолітніх, опікуни — підопічних, піклувальники надають згоду неповнолітнім та особам з обмеженою дієздатністю.", "o": ["Батьки, усиновлювачі, опікуни, піклувальники", "Лише представники за довіреністю та повірені", "Адвокати та інші особи за договором доручення", "Орган опіки та піклування і нотаріус на місці"]}, {"id": 236, "q": "Довіреність від імені юридичної особи видається:", "a": "Довіреність від імені юридичної особи видається її органом або іншою особою, уповноваженою на це установчими документами (ст. 246 ч. 1).", "o": ["Орган юридичної особи або уповноважена особа", "Лише засновник юридичної особи, особисто", "Лише нотаріус за заявою засновника", "Лише директор, без права інших осіб"]}, {"id": 237, "q": "Представництво виникає на підставі:", "a": "Договору, закону, акта органу юридичної особи, акта органу державної влади чи місцевого самоврядування, інших підстав (ст. 237 ч. 2).", "o": ["Договір, закон, акт органу юридичної особи, акт органу влади", "Лише договір між довірителем і представником та акт суду", "Закон, рішення суду, акт прокурора та акт нотаріуса", "Тільки закон та рішення суду, що набрало законної сили"]}, {"id": 238, "q": "Представництво виникає на підставі:", "a": "Договору, закону, акта органу юридичної особи, акта органу державної влади чи місцевого самоврядування, інших підстав (ст. 237 ч. 2).", "o": ["Договір, закон, акт органу юридичної особи, акт органу влади", "Лише договір між довірителем і представником та акт суду", "Закон, рішення суду, акт прокурора та акт нотаріуса", "Тільки закон та рішення суду, що набрало законної сили"]}, {"id": 239, "q": "Представництво за довіреністю припиняється у разі:", "a": "Підстави припинення представництва за довіреністю (ст. 248): 1) закінчення строку; 2) скасування довіреності особою, яка її видала; 3) відмова представника; 4) припинення юридичної особи, яка видала довіреність; 5) припинення юридичної особи, якій видано довіреність; 6) смерть, оголошення померлою, визнання недієздатною, безвісно відсутньою або обмеження дієздатності особи, яка видала довіреність; 7) те саме щодо представника.", "o": ["Закінчення строку, скасування, відмова, припинення чи смерть сторін", "Лише закінчення строку та скасування довіреності довірителем", "Зміна місця проживання, шлюб довірителя, зміна керівника", "Закінчення правочину, реорганізація довірителя, смерть третіх осіб"]}, {"id": 240, "q": "Представництво за довіреністю припиняється у разі:", "a": "Підстави припинення представництва за довіреністю (ст. 248): 1) закінчення строку; 2) скасування довіреності особою, яка її видала; 3) відмова представника; 4) припинення юридичної особи, яка видала довіреність; 5) припинення юридичної особи, якій видано довіреність; 6) смерть, оголошення померлою, визнання недієздатною, безвісно відсутньою або обмеження дієздатності особи, яка видала довіреність; 7) те саме щодо представника.", "o": ["Закінчення строку, скасування, відмова, припинення чи смерть сторін", "Лише закінчення строку та скасування довіреності довірителем", "Зміна місця проживання, шлюб довірителя, зміна керівника", "Закінчення правочину, реорганізація довірителя, смерть третіх осіб"]}, {"id": 241, "q": "Представництво за довіреністю припиняється у разі:", "a": "Підстави припинення представництва за довіреністю (ст. 248): 1) закінчення строку; 2) скасування довіреності особою, яка її видала; 3) відмова представника; 4) припинення юридичної особи, яка видала довіреність; 5) припинення юридичної особи, якій видано довіреність; 6) смерть, оголошення померлою, визнання недієздатною, безвісно відсутньою або обмеження дієздатності особи, яка видала довіреність; 7) те саме щодо представника.", "o": ["Закінчення строку, скасування, відмова, припинення чи смерть сторін", "Лише закінчення строку та скасування довіреності довірителем", "Зміна місця проживання, шлюб довірителя, зміна керівника", "Закінчення правочину, реорганізація довірителя, смерть третіх осіб"]}, {"id": 242, "q": "Представництво за довіреністю припиняється у разі:", "a": "Підстави припинення представництва за довіреністю (ст. 248): 1) закінчення строку; 2) скасування довіреності особою, яка її видала; 3) відмова представника; 4) припинення юридичної особи, яка видала довіреність; 5) припинення юридичної особи, якій видано довіреність; 6) смерть, оголошення померлою, визнання недієздатною, безвісно відсутньою або обмеження дієздатності особи, яка видала довіреність; 7) те саме щодо представника.", "o": ["Закінчення строку, скасування, відмова, припинення чи смерть сторін", "Лише закінчення строку та скасування довіреності довірителем", "Зміна місця проживання, шлюб довірителя, зміна керівника", "Закінчення правочину, реорганізація довірителя, смерть третіх осіб"]}];
const MQ=[{"id": 1000, "r": 12, "q": "Кому може бути надана повна цивільна дієздатність?", "a": "Особі, яка досягла 16 років і працює за трудовим договором; неповнолітній особі, яка записана матір’ю або батьком дитини; особі, яка досягла 16 років і бажає займатися підприємницькою діяльністю (ст. 35 ч. 1, 3).", "m": 1, "c": ["Особі, яка досягла 16 років і працює за трудовим договором", "Неповнолітній особі, яка записана матір’ю або батьком дитини"], "o": ["Особі, яка досягла 16 років і працює за трудовим договором", "Неповнолітній особі, яка записана матір’ю або батьком дитини", "Особі, яка досягла 14 років і навчається у закладі освіти", "Особі, яка досягла 17 років за згодою одного з батьків", "Особі, яка досягла 15 років і має власне майно"]}, {"id": 1001, "r": 26, "q": "Піклування припиняється у разі:", "a": "Досягнення фізичною особою повноліття; реєстрація шлюбу неповнолітньої особи; надання неповнолітній особі повної цивільної дієздатності; поновлення цивільної дієздатності особи, дієздатність якої була обмежена (ст. 77).", "m": 1, "c": ["Досягнення підопічним повноліття", "Реєстрації шлюбу неповнолітньої особи"], "o": ["Досягнення підопічним повноліття", "Реєстрації шлюбу неповнолітньої особи", "Зміни підопічним місця проживання", "Закінчення підопічним навчального року", "Подання піклувальником заяви про відпустку"]}, {"id": 1002, "r": 13, "q": "Які підстави оголошення фізичної особи померлою передбачені ЦК?", "a": "Від дня набрання законної сили рішенням суду про це (ст. 46 ч. 3). Підстави: відсутність відомостей про місце перебування протягом трьох років; шести місяців, якщо особа зникла за обставин, що загрожували смертю; одного місяця після завершення роботи спеціальної комісії у разі надзвичайної ситуації техногенного чи природного характеру. Якщо особа пропала безвісти у зв’язку з воєнними діями — після спливу двох років від дня закінчення воєнних дій (суд може й раніше, але не раніше ніж через шість місяців) (ст. 46 ч. 1–2).", "m": 1, "c": ["Відсутність відомостей про місце перебування протягом трьох років", "Зникнення за обставин, що загрожували смертю, і відсутність відомостей шість місяців"], "o": ["Відсутність відомостей про місце перебування протягом трьох років", "Зникнення за обставин, що загрожували смертю, і відсутність відомостей шість місяців", "Відсутність відомостей протягом одного року за місцем проживання", "Відсутність відомостей протягом п’яти років у будь-якому випадку", "Відсутність відомостей протягом двох місяців після пожежі"]}, {"id": 1003, "r": 17, "q": "Опікун не може здійснювати від імені підопічного:", "a": "Дарування від імені підопічного та зобов’язуватися від його імені порукою (ст. 68 ч. 2). Також опікун, його дружина (чоловік) та близькі родичі не можуть укладати з підопічним договорів, крім дарування йому майна або безоплатного користування за договором позички (ст. 68 ч. 1).", "m": 1, "c": ["Дарування майна підопічного", "Зобов’язування від імені підопічного порукою"], "o": ["Дарування майна підопічного", "Зобов’язування від імені підопічного порукою", "Прийняття спадщини, що належить підопічному", "Отримання пенсії підопічного для його потреб", "Відкриття банківського рахунку підопічного"]}, {"id": 1004, "r": 34, "q": "За яких умов суд може обмежити цивільну дієздатність фізичної особи?", "a": "Якщо вона страждає на психічний розлад, що істотно впливає на її здатність усвідомлювати значення своїх дій та (або) керувати ними; або якщо зловживає спиртними напоями, наркотичними засобами, токсичними речовинами, азартними іграми тощо і тим ставить себе чи свою сім’ю (осіб, яких вона за законом зобов’язана утримувати) у скрутне матеріальне становище (ст. 36 ч. 1–2). Дієздатність є обмеженою з моменту набрання законної сили рішенням суду (ч. 4).", "m": 1, "c": ["Психічний розлад істотно впливає на здатність усвідомлювати значення своїх дій", "Зловживання азартними іграми ставить сім’ю у скрутне матеріальне становище"], "o": ["Психічний розлад істотно впливає на здатність усвідомлювати значення своїх дій", "Зловживання азартними іграми ставить сім’ю у скрутне матеріальне становище", "Хронічна хвороба не впливає на здатність керувати своїми діями", "Одноразова програна невелика сума в азартну гру", "Тривала відсутність особи за місцем проживання"]}, {"id": 1005, "r": 20, "q": "Які правові наслідки визнання фізичної особи недієздатною?", "a": "Над особою встановлюється опіка; вона не має права вчиняти жодного правочину; правочини від її імені та в її інтересах вчиняє опікун; відповідальність за шкоду, завдану недієздатною особою, несе опікун (ст. 41; ст. 1184).", "m": 1, "c": ["Над особою встановлюється опіка", "Правочини від її імені вчиняє опікун"], "o": ["Над особою встановлюється опіка", "Правочини від її імені вчиняє опікун", "Над особою встановлюється піклування", "Особа сама вчиняє дрібні побутові правочини", "Особа сама розпоряджається пенсією й заробітком"]}, {"id": 1006, "r": 28, "q": "Які правові наслідки обмеження цивільної дієздатності фізичної особи?", "a": "Над особою встановлюється піклування; вона може самостійно вчиняти лише дрібні побутові правочини; інші правочини (зокрема щодо розпорядження майном) — за згодою піклувальника; одержання та розпорядження заробітком, пенсією, стипендією здійснює піклувальник (він може письмово дозволити це робити самостійно); особа самостійно відповідає за порушення договору, укладеного за згодою піклувальника, та за завдану шкоду (ст. 37).", "m": 1, "c": ["Над особою встановлюється піклування", "Особа сама вчиняє лише дрібні побутові правочини"], "o": ["Над особою встановлюється піклування", "Особа сама вчиняє лише дрібні побутові правочини", "Над особою встановлюється опіка", "Особа не має права вчиняти жодних правочинів", "Особа не відповідає за завдану нею шкоду"]}, {"id": 1007, "r": 23, "q": "Малолітня особа (до 14 років) має право самостійно:", "a": "Малолітня особа має право самостійно вчиняти дрібні побутові правочини та здійснювати особисті немайнові права на результати інтелектуальної, творчої діяльності, що охороняються законом (ст. 31 ч. 1). Інші правочини від її імені вчиняють батьки (усиновлювачі) або опікун. Малолітня особа не несе відповідальності за завдану шкоду (ч. 5).", "m": 1, "c": ["Вчиняти дрібні побутові правочини самостійно", "Здійснювати особисті немайнові права на результати творчості"], "o": ["Вчиняти дрібні побутові правочини самостійно", "Здійснювати особисті немайнові права на результати творчості", "Розпоряджатися заробітком, стипендією та іншими доходами", "Укладати договір банківського вкладу й розпоряджатися ним", "Бути учасником юридичних осіб, якщо це не заборонено"]}, {"id": 1008, "r": 32, "q": "Суд встановлює опіку над:", "a": "Суд встановлює опіку над фізичною особою, визнаною недієздатною, та над малолітньою особою, яка позбавлена батьківського піклування (ст. 60 ч. 1, 3). Опікуна призначає суд за поданням органу опіки та піклування.", "m": 1, "c": ["Фізичною особою, визнаною недієздатною", "Малолітньою особою, позбавленою батьківського піклування"], "o": ["Фізичною особою, визнаною недієздатною", "Малолітньою особою, позбавленою батьківського піклування", "Особою з обмеженою дієздатністю", "Неповнолітньою особою, позбавленою батьківського піклування", "Особою, оголошеною померлою"]}, {"id": 1009, "r": 39, "q": "До підприємницьких товариств належать:", "a": "До підприємницьких товариств (ст. 84 ч. 1). Господарські товариства та виробничі (сільськогосподарські) кооперативи, що діють з метою одержання прибутку, — це підприємницькі товариства.", "m": 1, "c": ["Повне товариство", "Виробничий кооператив"], "o": ["Повне товариство", "Виробничий кооператив", "Об’єднання громадян", "Благодійна організація", "Комунальне некомерційне товариство"]}, {"id": 1010, "r": 67, "q": "До непідприємницьких товариств належать:", "a": "Непідприємницькі товариства: сільськогосподарські кооперативи та кооперативні об’єднання, що діють без мети прибутку, інші кооперативи (крім виробничих), об’єднання громадян, державні та комунальні некомерційні товариства тощо (ст. 85, 86).", "m": 1, "c": ["Об’єднання громадян", "Державне некомерційне товариство"], "o": ["Об’єднання громадян", "Державне некомерційне товариство", "Командитне товариство", "Товариство з обмеженою відповідальністю", "Виробничий кооператив"]}, {"id": 1011, "r": 79, "q": "Якими способами юридична особа припиняється в результаті реорганізації?", "a": "Злиття, приєднання, поділ, перетворення (ст. 104 ч. 1). Виділ (ст. 109) не є припиненням юридичної особи.", "m": 1, "c": ["Злиття", "Перетворення"], "o": ["Злиття", "Перетворення", "Ліквідація", "Виділ", "Припинення за рішенням суду"]}, {"id": 1012, "r": 64, "q": "Для яких юридичних осіб засновницький договір є установчим документом?", "a": "Засновницький договір є установчим документом повного та командитного товариств. Загальне правило ст. 87 ч. 2: установчим документом товариства є статут або засновницький договір між учасниками, якщо інше не встановлено законом (товариство, створене однією особою, діє на підставі статуту).", "m": 1, "c": ["Для повного товариства", "Для командитного товариства"], "o": ["Для повного товариства", "Для командитного товариства", "Для товариства з обмеженою відповідальністю", "Для акціонерного товариства", "Для установи"]}, {"id": 1013, "r": 81, "q": "Які вимоги кредиторів задовольняються у першу чергу в разі ліквідації платоспроможної юридичної особи?", "a": "Вимоги щодо відшкодування шкоди, завданої каліцтвом, іншим ушкодженням здоров’я або смертю, та вимоги кредиторів, забезпечені заставою чи іншим способом (ст. 112 ч. 1 п. 1).", "m": 1, "c": ["Вимоги про відшкодування шкоди, завданої каліцтвом чи смертю", "Вимоги кредиторів, забезпечені заставою"], "o": ["Вимоги про відшкодування шкоди, завданої каліцтвом чи смертю", "Вимоги кредиторів, забезпечені заставою", "Вимоги працівників щодо оплати праці", "Вимоги щодо податків і зборів", "Вимоги авторів про плату за використання творів"]}, {"id": 1014, "r": 65, "q": "Оберіть установчі документи юридичних осіб:", "a": "Статут і засновницький договір — для товариств (ст. 87 ч. 2); установчий акт — для установ (ст. 87 ч. 3); модельний статут, який після прийняття учасниками стає установчим документом (ст. 87 ч. 1). Положення про філію чи представництво не є установчим документом юридичної особи.", "m": 1, "c": ["Статут товариства", "Установчий акт установи"], "o": ["Статут товариства", "Установчий акт установи", "Положення про філію", "Довіреність керівника", "Протокол загальних зборів"]}, {"id": 1015, "r": 66, "q": "Хто може прийняти рішення про ліквідацію юридичної особи?", "a": "Учасники юридичної особи, суб’єкт управління державної чи комунальної власності або орган юридичної особи, уповноважений установчими документами (ст. 110 ч. 1 п. 1); також суд — через допущені при створенні порушення, які не можна усунути, чи в інших випадках, встановлених законом (п. 2–3).", "m": 1, "c": ["Учасники юридичної особи", "Суд у випадках, встановлених законом"], "o": ["Учасники юридичної особи", "Суд у випадках, встановлених законом", "Державний реєстратор за власною ініціативою", "Нотаріус за місцезнаходженням особи", "Орган опіки та піклування"]}, {"id": 1016, "r": 75, "q": "Як ЦК іменує відокремлені структурні підрозділи юридичної особи?", "a": "Філії та представництва (ст. 95).", "m": 1, "c": ["Філії", "Представництва"], "o": ["Філії", "Представництва", "Дочірні компанії", "Відділи апарату", "Об’єднання"]}, {"id": 1017, "r": 78, "q": "Які органи, якщо інше не встановлено законом, вважаються органами управління товариством?", "a": "Загальні збори учасників і виконавчий орган, якщо інше не встановлено законом або установчими документами (ст. 97 ч. 2). Єдиний учасник — фізична особа може управляти товариством безпосередньо (ч. 1).", "m": 1, "c": ["Загальні збори учасників", "Виконавчий орган"], "o": ["Загальні збори учасників", "Виконавчий орган", "Ревізійна комісія", "Нотаріус", "Орган опіки та піклування"]}, {"id": 1018, "r": 85, "q": "Які цінні папери належать до групи пайових?", "a": "До пайових належать: акції (у т. ч. корпоративних інвестиційних фондів), сертифікати фонду операцій з нерухомістю, інвестиційні сертифікати. НЕ пайові: облігації, векселі, ощадні й депозитні сертифікати, казначейські зобов’язання (боргові); опціонні сертифікати, фондові варанти, кредитні ноти, депозитарні розписки (деривативні); коносамент, складські свідоцтва, товарні аграрні ноти (товаророзпорядчі).", "m": 1, "c": ["Акції акціонерних товариств", "Інвестиційні сертифікати"], "o": ["Акції акціонерних товариств", "Інвестиційні сертифікати", "Облігації місцевих позик", "Векселі прості й переказні", "Коносамент і складські свідоцтва"]}, {"id": 1019, "r": 86, "q": "Які цінні папери належать до групи боргових?", "a": "До боргових належать: корпоративні й державні облігації, облігації місцевих позик, облігації міжнародних фінансових організацій, казначейські зобов’язання, депозитні та ощадні сертифікати, векселі, фінансові аграрні ноти. НЕ боргові: акції, сертифікати ФОН, інвестиційні сертифікати (пайові); опціонні сертифікати, фондові варанти, кредитні ноти, депозитарні розписки (деривативні); коносамент, складські свідоцтва (товаророзпорядчі).", "m": 1, "c": ["Векселі", "Казначейські зобов’язання"], "o": ["Векселі", "Казначейські зобов’язання", "Акції", "Складські свідоцтва", "Опціонні сертифікати"]}, {"id": 1020, "r": 95, "q": "Оберіть майно, яке є вилученим з цивільного обороту:", "a": "Вилучені з цивільного обороту об’єкти можуть перебувати лише у власності держави або Українського народу: надра, природні заповідники, біосфери, землі оборони та інші за переліком постанови ВРУ від 17.06.1992. Мисливська зброя — обмежена в обороті, не вилучена.", "m": 1, "c": ["Надра з корисними копалинами", "Природні заповідники"], "o": ["Надра з корисними копалинами", "Природні заповідники", "Мисливська вогнепальна зброя", "Квартира громадянина", "Транспортний засіб"]}, {"id": 1021, "r": 112, "q": "Що належить до нерухомих речей?", "a": "Земельні ділянки, а також об’єкти, розташовані на них, переміщення яких неможливе без їх знецінення та зміни призначення: будівлі, споруди, квартири, об’єкти незавершеного будівництва (ст. 181 ч. 1). Режим нерухомості закон може поширити на судна, літаки тощо (ч. 2).", "m": 1, "c": ["Земельна ділянка", "Квартира в житловому будинку"], "o": ["Земельна ділянка", "Квартира в житловому будинку", "Легковий автомобіль", "Смартфон останньої моделі", "Побутові меблі та техніка"]}, {"id": 1022, "r": 109, "q": "На які об’єкти законом може бути поширений режим нерухомої речі?", "a": "На повітряні та морські судна, судна внутрішнього плавання, космічні об’єкти та інші речі, права на які підлягають державній реєстрації (ст. 181 ч. 2).", "m": 1, "c": ["Повітряні судна", "Космічні об’єкти"], "o": ["Повітряні судна", "Космічні об’єкти", "Побутова техніка", "Меблі", "Гроші"]}, {"id": 1023, "r": 104, "q": "Що належить до цифрового контенту?", "a": "Цифровий контент — дані, що створюються й подаються в цифровій формі: комп’ютерні програми, застосунки, відео-, аудіо- та музичні файли, цифрові ігри, цифрові книги. Криптовалюта — це віртуальний актив, а не цифровий контент.", "m": 1, "c": ["Комп’ютерні програми й застосунки", "Цифрові книги та відеофайли"], "o": ["Комп’ютерні програми й застосунки", "Цифрові книги та відеофайли", "Криптовалюта та віртуальні активи", "Електронні гроші на рахунках", "Банківські метали в зливках"]}, {"id": 1024, "r": 114, "q": "Що з наведеного належить до цінних паперів?", "a": "До цінних паперів належать: акції, облігації, інвестиційні сертифікати, векселі, ощадні (депозитні) сертифікати, деривативи, коносамент, складські свідоцтва, аграрні ноти (Закон «Про ринки капіталу…», Закон «Про аграрні ноти»). Не є цінними паперами: гроші, чеки та інші платіжні документи.", "m": 1, "c": ["Вексель", "Облігація"], "o": ["Вексель", "Облігація", "Чек", "Платіжна картка", "Ощадна книжка"]}, {"id": 1025, "r": 111, "q": "Що становить національну валюту (гривню)?", "a": "Національна валюта — гривня: готівка (банкноти й монети) та безготівкові кошти.", "m": 1, "c": ["Банкноти й монети гривні", "Безготівкові кошти в гривні"], "o": ["Банкноти й монети гривні", "Безготівкові кошти в гривні", "Іноземна валюта на рахунку", "Банківські метали", "Облігації внутрішньої позики"]}, {"id": 1026, "r": 105, "q": "Які групи цінних паперів існують в Україні в цивільному обороті?", "a": "П’ять груп: пайові, боргові, деривативні (похідні), товаророзпорядчі (ЦК, ст. 195) та іпотечні (Закон «Про ринки капіталу та організовані товарні ринки», ст. 8 ч. 7).", "m": 1, "c": ["Пайові", "Боргові"], "o": ["Пайові", "Боргові", "Емісійні", "Іменні", "Ордерні"]}, {"id": 1027, "r": 124, "q": "Оберіть односторонні правочини:", "a": "Односторонній правочин — це дія однієї сторони (ст. 202 ч. 3): заповіт, довіреність, відмова від права власності, прийняття спадщини чи відмова від неї, публічна обіцянка винагороди, відкликання довіреності.", "m": 1, "c": ["Заповіт", "Довіреність"], "o": ["Заповіт", "Довіреність", "Купівля-продаж", "Дарування", "Оренда"]}, {"id": 1028, "r": 126, "q": "Які правочини можуть вчинятися усно?", "a": "Усно може вчинятися правочин, який повністю виконується сторонами у момент його вчинення, крім тих, що підлягають нотаріальному посвідченню та (або) державній реєстрації (ст. 206 ч. 1); також усно можна вчиняти інші правочини, для яких закон не вимагає письмової форми (ст. 206 ч. 2; ст. 208).", "m": 1, "c": ["Купівля продуктів у магазині з негайною оплатою", "Оплата проїзду в маршрутці під час поїздки"], "o": ["Купівля продуктів у магазині з негайною оплатою", "Оплата проїзду в маршрутці під час поїздки", "Договір оренди між двома ТОВ", "Продаж квартири за готівку, що передана одразу", "Договір на суму понад 20 НМДГ, що не виконується одразу"]}, {"id": 1029, "r": 170, "q": "Які із наведених правочинів є нікчемними?", "a": "Нікчемні правочини (недійсні за законом): що обмежують правоздатність фізичної особи (ст. 27 ч. 1); без нотаріального посвідчення (ст. 219–220); вчинені малолітньою особою з
