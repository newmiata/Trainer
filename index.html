<script>
const D=[{"id": 1, "q": "Яке визначення фізичної особи з наведених нижче є правильним?:", "a": "Людина як учасник цивільних відносин вважається фізичною особою (ст. 24).", "o": ["Людина як учасник цивільних відносин", "Громадянин України, що досяг 18 років", "Дієздатна особа з повною дієздатністю", "Особа, зареєстрована як ФОП"]}, {"id": 2, "q": "Коли фізична особа визнається недієздатною?:", "a": "З моменту набрання законної сили рішенням суду, якщо внаслідок хронічного, стійкого психічного розладу вона не здатна усвідомлювати значення своїх дій та (або) керувати ними (ст. 39, 40).", "o": ["Рішенням суду, що набрало законної сили, за хронічного стійкого психічного розладу", "Рішенням органу опіки та піклування", "Рішенням суду за зловживання алкоголем чи азартними іграми", "Висновком лікарсько-консультативної комісії"]}, {"id": 3, "q": "Правочин, що задовольняє побутові потреби особи, відповідає її фізичному, духовному чи соціальному розвитку та стосується предмета, який має невисоку вартість, є?:", "a": "Дрібний побутовий правочин (ст. 31 ч. 1 п. 1).", "o": ["Дрібний побутовий правочин", "Правочин щодо рухомого майна будь-якої вартості", "Правочин, що не потребує нотаріальної форми", "Правочин на суму до 20 НМДГ"]}, {"id": 4, "q": "Здатність своїми діями набувати для себе цивільних прав і самостійно їх здійснювати, а також здатність своїми діями створювати для себе цивільні обов’язки, самостійно їх виконувати та нести відповідальність у разі їх невиконання, це?:", "a": "Цивільна дієздатність (ст. 30 ч. 1).", "o": ["Цивільна дієздатність", "Цивільна правоздатність", "Правосуб’єктність", "Деліктоздатність"]}, {"id": 5, "q": "Що може вчиняти самостійно фізична особа, цивільна дієздатність якої обмежена?:", "a": "Лише дрібні побутові правочини. Інші правочини, зокрема щодо розпорядження майном, — за згодою піклувальника (ст. 37 ч. 2–3).", "o": ["Лише дрібні побутові; решта — за згодою піклувальника", "Лише дрібні побутові; решта — за дозволом суду", "Будь-які правочини за згодою батьків", "Жодних правочинів, їх вчиняє опікун"]}, {"id": 6, "q": "Чи може фізична особа, яка визнана судом недієздатною, вчиняти самостійно які-небудь правочини?:", "a": "Ні. Недієздатна особа не має права вчиняти жодного правочину; їх від її імені та в її інтересах вчиняє опікун (ст. 41 ч. 2–3).", "o": ["Ні, жодного правочину; вчиняє опікун", "Так, дрібні побутові правочини", "Так, за згодою опікуна", "Так, лише безоплатні правочини"]}, {"id": 7, "q": "Правоздатність – це … :", "a": "Правоздатність — це здатність мати цивільні права та обов’язки (ст. 25 ч. 1).", "o": ["Здатність мати цивільні права та обов’язки", "Здатність своїми діями набувати прав та обов’язків", "Здатність нести відповідальність за шкоду", "Здатність бути стороною в суді"]}, {"id": 8, "q": "Дієздатність – це … :", "a": "Дієздатність — це здатність своїми діями набувати для себе цивільних прав і самостійно їх здійснювати, а також створювати для себе цивільні обов’язки, самостійно їх виконувати та нести відповідальність за невиконання (ст. 30 ч. 1).", "o": ["Здатність своїми діями набувати й здійснювати права, створювати обов’язки, виконувати їх і нести відповідальність", "Здатність мати цивільні права та обов’язки", "Здатність самостійно вчиняти лише дрібні побутові правочини", "Здатність бути учасником цивільного процесу"]}, {"id": 9, "q": "Коли виникає цивільна правоздатність фізичної особи?:", "a": "З моменту народження (ст. 25 ч. 2). У випадках, встановлених законом, охороняються інтереси зачатої, але ще не народженої дитини.", "o": ["З моменту народження", "З моменту зачаття", "З досягнення 14 років", "З моменту реєстрації народження"]}, {"id": 10, "q": "Які є види цивільної дієздатності фізичної особи залежно від віку?:", "a": "Часткова (до 14 років, малолітні особи, ст. 31); неповна (від 14 до 18 років, неповнолітні особи, ст. 32); повна (з 18 років, ст. 34). Повна може виникнути й раніше: у разі реєстрації шлюбу (ст. 34 ч. 2) або за рішенням про надання повної дієздатності (ст. 35).", "o": ["Часткова, неповна, повна", "Часткова, обмежена, повна", "Мала, неповна, повна", "Неповна, обмежена, абсолютна"]}, {"id": 11, "q": "Що встановлюється над недієздатною фізичною особою?:", "a": "Опіка (ст. 41 ч. 1; ст. 58).", "o": ["Опіка", "Піклування", "Патронаж", "Управління майном"]}, {"id": 12, "q": "Кому може бути надана повна цивільна дієздатність?:", "a": "Особі, яка досягла 16 років і працює за трудовим договором; неповнолітній особі, яка записана матір’ю або батьком дитини; особі, яка досягла 16 років і бажає займатися підприємницькою діяльністю (ст. 35 ч. 1, 3).", "o": ["З 16 років: працює за трудовим договором; записана матір’ю чи батьком дитини; підприємництво", "З 14 років: працює за трудовим договором", "З 18 років за рішенням суду", "З 16 років лише при реєстрації шлюбу"]}, {"id": 13, "q": "Коли фізична особа оголошується померлою?:", "a": "Від дня набрання законної сили рішенням суду про це (ст. 46 ч. 3). Підстави: відсутність відомостей про місце перебування протягом трьох років; шести місяців, якщо особа зникла за обставин, що загрожували смертю; одного місяця після завершення роботи спеціальної комісії у разі надзвичайної ситуації техногенного чи природного характеру. Якщо особа пропала безвісти у зв’язку з воєнними діями — після спливу двох років від дня закінчення воєнних дій (суд може й раніше, але не раніше ніж через шість місяців) (ст. 46 ч. 1–2).", "o": ["Від дня набрання законної сили рішенням суду", "З дня зникнення особи", "З дня подання заяви до суду", "З дня державної реєстрації смерті"]}, {"id": 14, "q": "Спадкоємці фізичної особи, яка оголошена померлою, не мають права відчужувати протягом _____ року(ів) нерухоме майно, що перейшло до них у зв’язку з відкриттям спадщини (ВСТАВИТИ ПРОПУЩЕНЕ):", "a": "П’яти років (ст. 47 ч. 2). Нотаріус накладає на таке нерухоме майно заборону відчуження.", "o": ["П’яти років", "Трьох років", "Десяти років", "Одного року"]}, {"id": 15, "q": "Фізична особа може бути визнана судом безвісно відсутньою якщо:", "a": "Якщо протягом одного року в місці її постійного проживання немає відомостей про місце її перебування (ст. 43 ч. 1).", "o": ["Один рік", "Три роки", "Шість місяців", "Два роки"]}, {"id": 16, "q": "Опікуном або піклувальником може бути лише:", "a": "Фізична особа з повною цивільною дієздатністю (ст. 63 ч. 2), за її письмовою заявою (ч. 3). Не може бути опікуном чи піклувальником особа, позбавлена батьківських прав (якщо вони не поновлені), або та, чия поведінка та інтереси суперечать інтересам підопічного (ст. 64).", "o": ["Особа з повною цивільною дієздатністю", "Будь-яка дієздатна особа від 16 років", "Лише близький родич підопічного", "Особа, призначена органом опіки без її згоди"]}, {"id": 17, "q": "Опікун не може здійснювати від імені підопічного:", "a": "Дарування від імені підопічного та зобов’язуватися від його імені порукою (ст. 68 ч. 2). Також опікун, його дружина (чоловік) та близькі родичі не можуть укладати з підопічним договорів, крім дарування йому майна або безоплатного користування за договором позички (ст. 68 ч. 1).", "o": ["Дарувати від імені підопічного та давати поруку", "Укладати договори купівлі-продажу майна підопічного", "Приймати спадщину за підопічного", "Відкривати рахунок у банку"]}, {"id": 18, "q": "Помічником може бути:", "a": "Дієздатна фізична особа (ст. 78 ч. 1). Помічника обирає дієздатна особа, яка за станом здоров’я не може самостійно здійснювати права та виконувати обов’язки.", "o": ["Дієздатна фізична особа", "Особа з обмеженою дієздатністю", "Орган опіки та піклування", "Родич до третього ступеня"]}, {"id": 19, "q": "Фізична особа може бути оголошена судом померлою:", "a": "Якщо у місці її постійного проживання немає відомостей про місце перебування протягом трьох років; шести місяців — якщо вона пропала безвісти за обставин, що загрожували смертю або дають підставу припускати загибель від певного нещасного випадку; одного місяця після завершення роботи спеціальної комісії — у разі надзвичайних ситуацій техногенного та природного характеру; двох років від дня закінчення воєнних дій — якщо пропала безвісти у зв’язку з воєнними діями чи збройним конфліктом (суд може й раніше, але не раніше шести місяців) (ст. 46 ч. 1–2).", "o": ["Три роки; шість місяців при загрозі смерті; один місяць після роботи комісії; два роки після воєнних дій", "Один рік; три місяці при загрозі смерті; один місяць; п’ять років після воєнних дій", "Три роки в усіх випадках", "П’ять років; один рік; шість місяців; три роки після воєнних дій"]}, {"id": 20, "q": "Які правові наслідки визнання фізичної особи недієздатною?:", "a": "Над особою встановлюється опіка; вона не має права вчиняти жодного правочину; правочини від її імені та в її інтересах вчиняє опікун; відповідальність за шкоду, завдану недієздатною особою, несе опікун (ст. 41; ст. 1184).", "o": ["Опіка; жодних правочинів сама; вчиняє опікун", "Піклування; дрібні побутові самостійно", "Піклування; правочини за згодою піклувальника", "Опіка; дрібні побутові самостійно"]}, {"id": 21, "q": "Правоздатність – це … :", "a": "Правоздатність — це здатність мати цивільні права та обов’язки (ст. 25 ч. 1).", "o": ["Здатність мати цивільні права та обов’язки", "Здатність своїми діями набувати прав та обов’язків", "Здатність нести відповідальність за шкоду", "Здатність бути стороною в суді"]}, {"id": 22, "q": "Дієздатність – це … :", "a": "Дієздатність — це здатність своїми діями набувати для себе цивільних прав і самостійно їх здійснювати, а також створювати для себе цивільні обов’язки, самостійно їх виконувати та нести відповідальність за невиконання (ст. 30 ч. 1).", "o": ["Здатність своїми діями набувати й здійснювати права, створювати обов’язки, виконувати їх і нести відповідальність", "Здатність мати цивільні права та обов’язки", "Здатність самостійно вчиняти лише дрібні побутові правочини", "Здатність бути учасником цивільного процесу"]}, {"id": 23, "q": "Фізична особа, яка не досягла чотирнадцяти років (малолітня особа), має право:", "a": "Малолітня особа має право самостійно вчиняти дрібні побутові правочини та здійснювати особисті немайнові права на результати інтелектуальної, творчої діяльності, що охороняються законом (ст. 31 ч. 1). Інші правочини від її імені вчиняють батьки (усиновлювачі) або опікун. Малолітня особа не несе відповідальності за завдану шкоду (ч. 5).", "o": ["Дрібні побутові правочини й особисті немайнові права на результати творчості", "Дрібні побутові та розпорядження заробітком", "Будь-які правочини за згодою батьків", "Лише правочини безоплатного набуття"]}, {"id": 24, "q": "Які правові наслідки визнання фізичної особи недієздатною?:", "a": "Над особою встановлюється опіка; вона не має права вчиняти жодного правочину; правочини від її імені та в її інтересах вчиняє опікун; відповідальність за шкоду, завдану недієздатною особою, несе опікун (ст. 41; ст. 1184).", "o": ["Опіка; жодних правочинів сама; вчиняє опікун", "Піклування; дрібні побутові самостійно", "Піклування; правочини за згодою піклувальника", "Опіка; дрібні побутові самостійно"]}, {"id": 25, "q": "Які правові наслідки визнання фізичної особи недієздатною?:", "a": "Над особою встановлюється опіка; вона не має права вчиняти жодного правочину; правочини від її імені та в її інтересах вчиняє опікун; відповідальність за шкоду, завдану недієздатною особою, несе опікун (ст. 41; ст. 1184).", "o": ["Опіка; жодних правочинів сама; вчиняє опікун", "Піклування; дрібні побутові самостійно", "Піклування; правочини за згодою піклувальника", "Опіка; дрібні побутові самостійно"]}, {"id": 26, "q": "Піклування припиняється у разі:", "a": "Досягнення фізичною особою повноліття; реєстрація шлюбу неповнолітньої особи; надання неповнолітній особі повної цивільної дієздатності; поновлення цивільної дієздатності особи, дієздатність якої була обмежена (ст. 77).", "o": ["Повноліття, шлюб, надання повної дієздатності, поновлення дієздатності", "Лише повноліття", "Повноліття та зміна місця проживання", "Смерть піклувальника"]}, {"id": 27, "q": "Піклування припиняється у разі:", "a": "Досягнення фізичною особою повноліття; реєстрація шлюбу неповнолітньої особи; надання неповнолітній особі повної цивільної дієздатності; поновлення цивільної дієздатності особи, дієздатність якої була обмежена (ст. 77).", "o": ["Повноліття, шлюб, надання повної дієздатності, поновлення дієздатності", "Лише повноліття", "Повноліття та зміна місця проживання", "Смерть піклувальника"]}, {"id": 28, "q": "Які правові наслідки обмеження цивільної дієздатності фізичної особи?:", "a": "Над особою встановлюється піклування; вона може самостійно вчиняти лише дрібні побутові правочини; інші правочини (зокрема щодо розпорядження майном) — за згодою піклувальника; одержання та розпорядження заробітком, пенсією, стипендією здійснює піклувальник (він може письмово дозволити це робити самостійно); особа самостійно відповідає за порушення договору, укладеного за згодою піклувальника, та за завдану шкоду (ст. 37).", "o": ["Піклування; дрібні побутові самостійно; решта за згодою піклувальника", "Опіка; жодних правочинів", "Піклування; усі правочини за дозволом суду", "Опіка; дрібні побутові самостійно"]}, {"id": 29, "q": "Які правові наслідки обмеження цивільної дієздатності фізичної особи?:", "a": "Над особою встановлюється піклування; вона може самостійно вчиняти лише дрібні побутові правочини; інші правочини (зокрема щодо розпорядження майном) — за згодою піклувальника; одержання та розпорядження заробітком, пенсією, стипендією здійснює піклувальник (він може письмово дозволити це робити самостійно); особа самостійно відповідає за порушення договору, укладеного за згодою піклувальника, та за завдану шкоду (ст. 37).", "o": ["Піклування; дрібні побутові самостійно; решта за згодою піклувальника", "Опіка; жодних правочинів", "Піклування; усі правочини за дозволом суду", "Опіка; дрібні побутові самостійно"]}, {"id": 30, "q": "Які правові наслідки обмеження цивільної дієздатності фізичної особи?:", "a": "Над особою встановлюється піклування; вона може самостійно вчиняти лише дрібні побутові правочини; інші правочини (зокрема щодо розпорядження майном) — за згодою піклувальника; одержання та розпорядження заробітком, пенсією, стипендією здійснює піклувальник (він може письмово дозволити це робити самостійно); особа самостійно відповідає за порушення договору, укладеного за згодою піклувальника, та за завдану шкоду (ст. 37).", "o": ["Піклування; дрібні побутові самостійно; решта за згодою піклувальника", "Опіка; жодних правочинів", "Піклування; усі правочини за дозволом суду", "Опіка; дрібні побутові самостійно"]}, {"id": 31, "q": "Фізична особа може бути оголошена судом померлою:", "a": "Якщо у місці її постійного проживання немає відомостей про місце перебування протягом трьох років; шести місяців — якщо вона пропала безвісти за обставин, що загрожували смертю або дають підставу припускати загибель від певного нещасного випадку; одного місяця після завершення роботи спеціальної комісії — у разі надзвичайних ситуацій техногенного та природного характеру; двох років від дня закінчення воєнних дій — якщо пропала безвісти у зв’язку з воєнними діями чи збройним конфліктом (суд може й раніше, але не раніше шести місяців) (ст. 46 ч. 1–2).", "o": ["Три роки; шість місяців при загрозі смерті; один місяць після роботи комісії; два роки після воєнних дій", "Один рік; три місяці при загрозі смерті; один місяць; п’ять років після воєнних дій", "Три роки в усіх випадках", "П’ять років; один рік; шість місяців; три роки після воєнних дій"]}, {"id": 32, "q": "Суд встановлює опіку над:", "a": "Суд встановлює опіку над фізичною особою, визнаною недієздатною, та над малолітньою особою, яка позбавлена батьківського піклування (ст. 60 ч. 1, 3). Опікуна призначає суд за поданням органу опіки та піклування.", "o": ["Недієздатна особа; малолітня без батьківського піклування", "Особа з обмеженою дієздатністю; неповнолітня без піклування", "Недієздатна особа; неповнолітня без піклування", "Лише малолітня без батьківського піклування"]}, {"id": 33, "q": "Суд встановлює піклування над:", "a": "Суд встановлює піклування над фізичною особою, цивільна дієздатність якої обмежена, та над неповнолітньою особою, яка позбавлена батьківського піклування (ст. 60 ч. 2, 4).", "o": ["Обмежено дієздатна особа; неповнолітня без батьківського піклування", "Недієздатна особа; малолітня без піклування", "Обмежено дієздатна особа; малолітня без піклування", "Лише неповнолітня без піклування"]}, {"id": 34, "q": "За яких умов суд може обмежити цивільну дієздатність фізичної особи?:", "a": "Якщо вона страждає на психічний розлад, що істотно впливає на її здатність усвідомлювати значення своїх дій та (або) керувати ними; або якщо зловживає спиртними напоями, наркотичними засобами, токсичними речовинами, азартними іграми тощо і тим ставить себе чи свою сім’ю (осіб, яких вона за законом зобов’язана утримувати) у скрутне матеріальне становище (ст. 36 ч. 1–2). Дієздатність є обмеженою з моменту набрання законної сили рішенням суду (ч. 4).", "o": ["Психічний розлад або зловживання алкоголем, наркотиками, азартом, що ставить сім’ю у скрутне становище", "Лише психічний розлад", "Хронічний психічний розлад, що унеможливлює усвідомлення дій", "Лише зловживання алкоголем"]}, {"id": 35, "q": "У якому випадку відбувається поновлення цивільної дієздатності фізичної особи, цивільна дієздатність якої була обмежена?:", "a": "Суд поновлює цивільну дієздатність у разі видужання або такого поліпшення психічного стану, що відновило у повному обсязі здатність усвідомлювати значення своїх дій та (або) керувати ними, а також у разі припинення зловживання спиртними напоями, наркотичними засобами, токсичними речовинами, азартними іграми тощо (ст. 38 ч. 1–2). Піклування припиняється на підставі рішення суду (ч. 3).", "o": ["Видужання чи покращення стану або припинення зловживання; рішення суду", "Рішення органу опіки та піклування", "Спливу трьох років", "Заява піклувальника без суду"]}, {"id": 36, "q": "Яке поняття розкривається з допомогою визначення «Організація, створена і зареєстрована у встановленому законом порядку»?", "a": "Юридична особа (ст. 80 ч. 1).", "o": ["Юридична особа", "Підприємство", "Господарська організація", "Установа"]}, {"id": 37, "q": "Яке поняття розкривається з допомогою визначення «Організація, створена шляхом об’єднання осіб (учасників), які мають право участі у цій організації»?", "a": "Товариство (ст. 83 ч. 2).", "o": ["Товариство", "Установа", "Об’єднання без прав юридичної особи", "Кооператив"]}, {"id": 38, "q": "Яке поняття розкривається з допомогою визначення «Організація, створена однією або кількома особами (засновниками), які не беруть участі в управлінні нею, шляхом об’єднання (виділення) їхнього майна для досягнення мети, визначеної засновниками, за рахунок цього майна»?", "a": "Установа (ст. 83 ч. 3).", "o": ["Установа", "Товариство", "Підприємство", "Філія"]}, {"id": 39, "q": "До якого виду товариств належать господарські товариства, виробничі кооперативи чи сільськогосподарські кооперативи?", "a": "До підприємницьких товариств (ст. 84 ч. 1). Господарські товариства та виробничі (сільськогосподарські) кооперативи, що діють з метою одержання прибутку, — це підприємницькі товариства.", "o": ["Підприємницькі товариства", "Непідприємницькі товариства", "Установи", "Об’єднання громадян"]}, {"id": 40, "q": "З якого моменту виникає цивільна право-, дієздатність юридичної особи?", "a": "З моменту створення юридичної особи (ст. 91 ч. 4), тобто з дня її державної реєстрації (ст. 87 ч. 4). Припиняється з дня внесення до реєстру запису про припинення.", "o": ["З дня державної реєстрації", "З дня прийняття рішення засновників", "З дня подання документів", "З дня отримання печатки"]}, {"id": 41, "q": "Чи може бути обмежена цивільна правоздатність юридичної особи?", "a": "Так, але лише за рішенням суду (ст. 91 ч. 2).", "o": ["Так, лише за рішенням суду", "Так, за рішенням засновників", "Так, за рішенням органу влади", "Ні, ніколи"]}, {"id": 42, "q": "До якого виду товариств належать акціонерні товариства, товариства з обмеженою та додатковою відповідальністю, повні та командитні товариства?", "a": "До господарських товариств, які є підприємницькими товариствами (ст. 84 ч. 1): повне та командитне товариства, товариства з обмеженою або додатковою відповідальністю, акціонерне товариство.", "o": ["Господарські товариства", "Непідприємницькі товариства", "Установи", "Громадські організації"]}, {"id": 43, "q": "Які із перелічених юридичних осіб належать до юридичних осіб публічного права?", "a": "Юридичні особи публічного права — ті, що створюються розпорядчим актом Президента України, органу державної влади, органу влади АР Крим або органу місцевого самоврядування (ст. 81 ч. 2 абз. 3), наприклад органи державної влади й місцевого самоврядування та державні установи. Юридичні особи приватного права (ТОВ, АТ, кооперативи тощо) створюються на підставі установчих документів (ст. 87). Конкретний варіант відповіді визначайте за цим критерієм.", "o": ["Створені розпорядчим актом органу влади чи місцевого самоврядування", "Створені на підставі установчих документів засновників", "Усі некомерційні організації", "Усі, що мають державне майно"]}, {"id": 44, "q": "Які із перелічених юридичних осіб належать юридичних осіб публічного права?", "a": "Юридичні особи публічного права — ті, що створюються розпорядчим актом Президента України, органу державної влади, органу влади АР Крим або органу місцевого самоврядування (ст. 81 ч. 2 абз. 3), наприклад органи державної влади й місцевого самоврядування та державні установи. Юридичні особи приватного права (ТОВ, АТ, кооперативи тощо) створюються на підставі установчих документів (ст. 87). Конкретний варіант відповіді визначайте за цим критерієм.", "o": ["Створені розпорядчим актом органу влади чи місцевого самоврядування", "Створені на підставі установчих документів засновників", "Усі некомерційні організації", "Усі, що мають державне майно"]}, {"id": 45, "q": "Які із перелічених юридичних осіб належать юридичних осіб публічного права?", "a": "Юридичні особи публічного права — ті, що створюються розпорядчим актом Президента України, органу державної влади, органу влади АР Крим або органу місцевого самоврядування (ст. 81 ч. 2 абз. 3), наприклад органи державної влади й місцевого самоврядування та державні установи. Юридичні особи приватного права (ТОВ, АТ, кооперативи тощо) створюються на підставі установчих документів (ст. 87). Конкретний варіант відповіді визначайте за цим критерієм.", "o": ["Створені розпорядчим актом органу влади чи місцевого самоврядування", "Створені на підставі установчих документів засновників", "Усі некомерційні організації", "Усі, що мають державне майно"]}, {"id": 46, "q": "Яке поняття розкривається з допомогою визначення «Відокремлений підрозділ юридичної особи, що розташований поза її місцезнаходженням та здійснює представництво і захист інтересів юридичної особи»?", "a": "Представництво (ст. 95 ч. 2).", "o": ["Представництво", "Філія", "Відокремлений підрозділ з правами юридичної особи", "Установа"]}, {"id": 47, "q": "Яке поняття розкривається з допомогою визначення «Відокремлений підрозділ юридичної особи, що розташований поза її місцезнаходженням та здійснює всі або частину її функцій»?", "a": "Філія (ст. 95 ч. 1).", "o": ["Філія", "Представництво", "Структурна одиниця", "Установа"]}, {"id": 48, "q": "На підставі чого діють відокремлені структурні підрозділи?", "a": "На підставі положення, затвердженого юридичною особою, яка їх утворила (ст. 95 ч. 3). Вони не є юридичними особами й наділяються майном юридичної особи. Їхні керівники діють на підставі довіреності (ч. 4).", "o": ["Положення, затверджене юридичною особою", "Статут юридичної особи", "Рішення суду", "Установчий акт"]}, {"id": 49, "q": "Зміна організаційно-правової форми юридичної особи є?", "a": "Перетворення юридичної особи (ст. 108 ч. 1) — один зі способів реорганізації. Усе майно, права та обов’язки переходять до нової юридичної особи (ч. 2).", "o": ["Перетворення", "Злиття", "Виділ", "Поділ"]}, {"id": 50, "q": "Яку відповідальність несе юридична особа – правонаступник, що утворилася внаслідок поділу, за зобов’язаннями юридичної особи, що припинилася, які згідно з розподільчим балансом перейшли до іншої юридичної особи – правонаступника?", "a": "Субсидіарну (ст. 107 ч. 5). Якщо правонаступників, що утворилися внаслідок поділу, більше двох, — вони несуть субсидіарну відповідальність солідарно.", "o": ["Субсидіарну", "Солідарну", "Часткову", "Додаткову до всіх учасників"]}, {"id": 51, "q": "У яку чергу відповідно до ЦК України задовольняються вимоги працівників, пов’язані з трудовими відносинами, вимоги автора про плату за використання результату його інтелектуальної, творчої діяльності?", "a": "У другу чергу (ст. 112 ч. 1 п. 2).", "o": ["У другу чергу", "У першу чергу", "У третю чергу", "У четверту чергу"]}, {"id": 52, "q": "У яку чергу відповідно до ЦК України задовольняються вимоги щодо податків, зборів (обов’язкових платежів)?", "a": "У третю чергу (ст. 112 ч. 1 п. 3).", "o": ["У третю чергу", "У другу чергу", "У четверту чергу", "У першу чергу"]}, {"id": 53, "q": "У яку чергу відповідно до ЦК України задовольняються вимоги кредиторів, забезпечені заставою чи іншим способом?", "a": "У першу чергу (ст. 112 ч. 1 п. 1) — разом із вимогами про відшкодування шкоди, завданої каліцтвом, іншим ушкодженням здоров’я або смертю.", "o": ["У першу чергу", "У другу чергу", "У третю чергу", "У четверту чергу"]}, {"id": 54, "q": "Протягом якого строку повинна бути проведена державна реєстрація?", "a": "⚠️ ЦК строку державної реєстрації не встановлює — ст. 89 ч. 1 відсилає до закону. Якщо питання стосується рішення про припинення, то учасники/суд/орган зобов’язані протягом трьох робочих днів з дати прийняття рішення письмово повідомити орган реєстрації (ст. 105 ч. 1). Для філії іноземної особи таке повідомлення — протягом десяти робочих днів (ст. 105-1 ч. 3). Строки самої реєстрації — у Законі «Про державну реєстрацію юридичних осіб, фізичних осіб — підприємців та громадських формувань», тобто поза ЦК. Звіряйтеся з варіантами відповіді.", "o": ["24 години", "12 годин", "48 годин", "72 години"]}, {"id": 55, "q": "Установчим документом повного товариства є?", "a": "Засновницький договір (ст. 120 ЦК: повне товариство створюється і діє на підставі засновницького договору, який підписують усі учасники).", "o": ["Засновницький договір", "Статут", "Положення", "Установчий акт"]}, {"id": 56, "q": "Установчим документом товариства з додатковою відповідальністю є?", "a": "Статут. ЦК закріплює загальне правило: установчим документом товариства є статут або засновницький договір (ст. 87 ч. 2); для ТОВ і ТДВ — статут (Закон «Про товариства з обмеженою та додатковою відповідальністю»).", "o": ["Статут", "Засновницький договір", "Положення", "Модельний договір"]}, {"id": 57, "q": "Для якого із видів господарських товариств Кабінет Міністрів України затвердив модельний статут?", "a": "Для товариства з обмеженою відповідальністю (постанова КМУ від 16.11.2011 № 1182 «Про затвердження модельного статуту товариства з обмеженою відповідальністю»). ЦК лише передбачає саму можливість діяти на підставі модельного статуту, затвердженого КМУ (ст. 81 ч. 2, ст. 87 ч. 1).", "o": ["Товариства з обмеженою відповідальністю", "Акціонерні товариства", "Командитні товариства", "Виробничі кооперативи"]}, {"id": 58, "q": "Яку відповідальність несуть правонаступники юридичної особи, якщо правонаступниками юридичної особи є декілька юридичних осіб і точно визначити правонаступника щодо конкретних обов’язків юридичної особи, що припинилася, неможливо?", "a": "Солідарну (ст. 107 ч. 6).", "o": ["Солідарну", "Субсидіарну", "Часткову", "Додаткову"]}, {"id": 59, "q": "З якого моменту до комісії з припинення юридичної особи (комісії з реорганізації, ліквідаційної комісії) або ліквідатора переходять повноваження щодо управління справами юридичної особи?", "a": "З моменту призначення (ст. 105 ч. 4).", "o": ["З моменту призначення", "З моменту реєстрації запису", "З моменту завершення ліквідації", "З дня складення балансу"]}, {"id": 60, "q": "Чи може непідприємницьке товариство бути реорганізоване у підприємницьке товариство?", "a": "Ні. Юридична особа, яка не вправі розподіляти прибуток між учасниками, не може бути реорганізована, якщо серед правонаступників є юридична особа, наділена таким правом (ст. 104 ч. 2–3). Виняток — державні установи; крім того, для зворотної ситуації потрібне одностайне рішення загальних зборів.", "o": ["Ні: особа, що не розподіляє прибуток, не реорганізується в особу, що розподіляє", "Так, завжди", "Так, за згодою держави", "Так, за рішенням суду"]}, {"id": 61, "q": "Строк заявлення кредиторами своїх вимог до юридичної особи, що припиняється, не може становити?", "a": "Не може становити менше двох і більше шести місяців з дня оприлюднення повідомлення про рішення щодо припинення юридичної особи (ст. 105 ч. 5).", "o": ["Не менше двох і не більше шести місяців", "Не менше одного і не більше трьох місяців", "Не менше трьох і не більше дванадцяти місяців", "Рівно два місяці"]}, {"id": 62, "q": "Яке положення розкриває зміст цивільної правоздатності юридичної особи відповідно до ЦК України?", "a": "Юридична особа здатна мати такі ж цивільні права та обов’язки (цивільну правоздатність), як і фізична особа, крім тих, які за своєю природою можуть належати лише людині (ст. 91 ч. 1).", "o": ["Такі ж права та обов’язки, як у фізичної, крім тих, що за природою належать людині", "Лише майнові права", "Лише права, передбачені статутом", "Права, як у фізичної особи, без винятків"]}, {"id": 63, "q": "Які організаційно-правові форми юридичних осіб передбачено у ЦК України?", "a": "Юридичні особи можуть створюватися у формі товариств, установ та в інших формах, встановлених законом (ст. 83 ч. 1). Товариства поділяються на підприємницькі та непідприємницькі.", "o": ["Товариства, установи та інші форми, встановлені законом", "Товариства та підприємства", "Підприємства, установи, організації", "Товариства та кооперативи"]}, {"id": 64, "q": "Для яких юридичних осіб засновницький договір є установчим документом?", "a": "Засновницький договір є установчим документом повного та командитного товариств. Загальне правило ст. 87 ч. 2: установчим документом товариства є статут або засновницький договір між учасниками, якщо інше не встановлено законом (товариство, створене однією особою, діє на підставі статуту).", "o": ["Для повного та командитного товариств", "Для ТОВ і АТ", "Для всіх установ", "Для кооперативів"]}, {"id": 65, "q": "Виберіть з переліку установчі документи юридичних осіб?", "a": "Статут і засновницький договір — для товариств (ст. 87 ч. 2); установчий акт — для установ (ст. 87 ч. 3); модельний статут, який після прийняття учасниками стає установчим документом (ст. 87 ч. 1). Положення про філію чи представництво не є установчим документом юридичної особи.", "o": ["Статут і засновницький договір (товариство); установчий акт (установа)", "Положення і довіреність", "Лише статут для всіх", "Рішення загальних зборів"]}, {"id": 66, "q": "Хто може прийняти рішення про ліквідацію юридичної особи?", "a": "Учасники юридичної особи, суб’єкт управління державної чи комунальної власності або орган юридичної особи, уповноважений установчими документами (ст. 110 ч. 1 п. 1); також суд — через допущені при створенні порушення, які не можна усунути, чи в інших випадках, встановлених законом (п. 2–3).", "o": ["Учасники, суб’єкт управління майном або орган, уповноважений установчими документами", "Лише суд", "Лише державний реєстратор", "Лише ліквідаційна комісія"]}, {"id": 67, "q": "До непідприємницьких товариств належать?", "a": "Непідприємницькі товариства: сільськогосподарські кооперативи та кооперативні об’єднання, що діють без мети прибутку, інші кооперативи (крім виробничих), об’єднання громадян, державні та комунальні некомерційні товариства тощо (ст. 85, 86).", "o": ["Об’єднання громадян, обслуговуючі кооперативи, державні й комунальні некомерційні товариства", "ТОВ, АТ", "Виробничі кооперативи, повні товариства", "Командитні товариства"]}, {"id": 68, "q": "Якою має стати організація, щоб бути юридичною особою?:", "a": "Створеною і зареєстрованою у встановленому законом порядку (ст. 80 ч. 1).", "o": ["Створена і зареєстрована у встановленому законом порядку", "Створена за рішенням засновників", "Зареєстрована в податковому органі", "Така, що має статут і печатку"]}, {"id": 69, "q": "Шляхом об’єднання кого/чого може бути створена юридична особа?:", "a": "Осіб та (або) майна (ст. 81 ч. 1).", "o": ["Осіб та (або) майна", "Лише осіб", "Лише майна", "Осіб і державного майна"]}, {"id": 70, "q": "На які види поділяються юридичні особи залежно від порядку їх створення?:", "a": "На юридичних осіб приватного права та юридичних осіб публічного права (ст. 81 ч. 2).", "o": ["Приватного та публічного права", "Комерційні та некомерційні", "Державні та приватні", "Основні та допоміжні"]}, {"id": 71, "q": "На які види поділяються товариства згідно із Цивільним кодексом України?:", "a": "На підприємницькі та непідприємницькі (ст. 83 ч. 2).", "o": ["Підприємницькі та непідприємницькі", "Господарські та негосподарські", "Комерційні та неприбуткові", "Корпоративні та унітарні"]}, {"id": 72, "q": "У яких організаційно-правових формах можуть бути створені підприємницькі товариства?:", "a": "Лише як господарські товариства (повне, командитне, ТОВ, ТДВ, акціонерне) або як виробничі чи сільськогосподарські кооперативи, сільськогосподарські кооперативні об’єднання, що діють з метою одержання прибутку (ст. 84 ч. 1).", "o": ["Господарські товариства та виробничі й сільськогосподарські кооперативи", "Лише господарські товариства", "Господарські товариства й установи", "Кооперативи й об’єднання громадян"]}, {"id": 73, "q": "Яку інформацію має містити найменування юридичної особи?:", "a": "Інформацію про організаційно-правову форму та назву (ст. 90 ч. 1). Найменування установи має містити інформацію про характер її діяльності.", "o": ["Організаційно-правову форму та назву", "Лише назву", "Назву та місцезнаходження", "Прізвище засновника"]}, {"id": 74, "q": "Як зобов’язані діяти в інтересах юридичної особи орган або особа, яка відповідно до установчих документів юридичної особи чи закону виступає від її імені?:", "a": "Добросовісно і розумно, у межах повноважень, наданих статутом і законодавством, у спосіб, який сприятиме досягненню мети діяльності юридичної особи, уникаючи конфлікту інтересів (ст. 92 ч. 3).", "o": ["Добросовісно і розумно, в межах повноважень, уникаючи конфлікту інтересів", "Лише в межах повноважень", "В інтересах засновників будь-якими засобами", "За вказівками учасників"]}, {"id": 75, "q": "Як відповідно до Цивільного кодексу України іменуються відокремлені структурні підрозділи юридичної особи?:", "a": "Філії та представництва (ст. 95).", "o": ["Філії та представництва", "Структурні підрозділи", "Дочірні підприємства", "Відділення"]}, {"id": 76, "q": "У яких випадках учасники (засновники) відповідають за зобов’язаннями створеної ними юридичної особи?:", "a": "У випадках, встановлених установчими документами та законом (ст. 96 ч. 3). Особи, які створюють юридичну особу, також несуть солідарну відповідальність за зобов’язаннями, що виникли до її державної реєстрації (ч. 4).", "o": ["У випадках, встановлених установчими документами та законом", "Завжди солідарно", "Ніколи", "Лише за рішенням суду"]}, {"id": 77, "q": "Яким особам за змістом Цивільного кодексу України належать корпоративні права щодо юридичних осіб?:", "a": "Учасникам (засновникам, акціонерам, пайовикам) юридичних осіб (ст. 96-1).", "o": ["Учасникам (засновникам, акціонерам, пайовикам)", "Лише акціонерам", "Лише засновникам установи", "Керівнику"]}, {"id": 78, "q": "Якщо інше не встановлено законом, які органи вважаються органами управління товариством?:", "a": "Загальні збори учасників і виконавчий орган, якщо інше не встановлено законом або установчими документами (ст. 97 ч. 2). Єдиний учасник — фізична особа може управляти товариством безпосередньо (ч. 1).", "o": ["Загальні збори учасників і виконавчий орган", "Наглядова рада й ревізійна комісія", "Директор і бухгалтер", "Лише збори"]}, {"id": 79, "q": "Якими способами припиняється юридична особа в результаті реорганізації?:", "a": "Злиття, приєднання, поділ, перетворення (ст. 104 ч. 1). Виділ (ст. 109) не є припиненням юридичної особи.", "o": ["Злиття, приєднання, поділ, перетворення", "Злиття, приєднання, поділ, виділ", "Злиття, ліквідація, поділ, перетворення", "Приєднання, виділ, перетворення"]}, {"id": 80, "q": "Як називається комісія з припинення юридичної особи згідно із ст. 105 Цивільного кодексу України?:", "a": "Комісія з припинення юридичної особи (комісія з реорганізації, ліквідаційна комісія) (ст. 105 ч. 3).", "o": ["Комісія з припинення (комісія з реорганізації, ліквідаційна комісія)", "Ревізійна комісія", "Наглядова рада", "Арбітражна комісія"]}, {"id": 81, "q": "Які вимоги кредиторів задовольняються у першу чергу у разі ліквідації платоспроможної юридичної особи?:", "a": "Вимоги щодо відшкодування шкоди, завданої каліцтвом, іншим ушкодженням здоров’я або смертю, та вимоги кредиторів, забезпечені заставою чи іншим способом (ст. 112 ч. 1 п. 1).", "o": ["Шкода здоров’ю та життю; вимоги, забезпечені заставою", "Оплата праці", "Податки й збори", "Вимоги інших кредиторів"]}, {"id": 82, "q": "На які типи поділяються акціонерні товариства відповідно до Закону України «Про акціонерні товариства»?:", "a": "Публічні та приватні акціонерні товариства (Закон «Про акціонерні товариства», ст. 3). ЦК такого поділу вже не містить: статті про акціонерне товариство виключено Законом № 2275-VIII від 06.02.2018.", "o": ["Публічні та приватні акціонерні товариства", "Відкриті та закриті", "Публічні та закриті", "Прості та привілейовані"]}, {"id": 83, "q": "Які обʼєкти цивільних прав НЕ належать до немайнових благ?", "a": "Ті, що не є особистими немайновими благами (ст. 201): майнові об’єкти — речі, гроші, цінні папери, цифрові речі, майнові права. До немайнових благ належать, зокрема, здоров’я, життя, честь, гідність, ділова репутація, ім’я, авторство, особисте життя.", "o": ["Майнові об’єкти: речі, гроші, цінні папери, майнові права", "Здоров’я і життя", "Честь і гідність", "Ділова репутація та ім’я"]}, {"id": 84, "q": "Яка група цінних паперів НЕ передбачена Цивільним кодексом України?", "a": "Ст. 195 передбачає чотири групи: пайові, боргові, похідні, товаророзпорядчі. Будь-яка інша група (наприклад, «інвестиційні», «іпотечні») ЦК не передбачена.", "o": ["Пайові, боргові, похідні, товаророзпорядчі", "Пайові, боргові, похідні, іпотечні", "Пайові, боргові, інвестиційні, товаророзпорядчі", "Корпоративні, боргові, похідні, товаророзпорядчі"]}, {"id": 85, "q": "Оберіть цінні папери, які НЕ належать до групи пайових", "a": "Пайові — це акції та інші цінні папери, що засвідчують участь у статутному капіталі та/або активах емітента (ст. 195 п. 1). Не пайові: облігації, векселі, ощадні сертифікати (боргові), деривативи (похідні), коносамент, складське свідоцтво (товаророзпорядчі).", "o": ["Акції та інвестиційні сертифікати", "Облігації та векселі", "Опціони та ф’ючерси", "Коносамент та складські свідоцтва"]}, {"id": 86, "q": "Оберіть цінні папери, які НЕ належать до групи боргових", "a": "Боргові — облігації, векселі, ощадні (депозитні) сертифікати та інші, що засвідчують відносини позики (ст. 195 п. 2). Не боргові: акції та інші пайові, деривативи (опціони, ф’ючерси), товаророзпорядчі (коносамент, складські свідоцтва).", "o": ["Облігації, векселі, ощадні сертифікати", "Акції, інвестиційні сертифікати", "Опціонні сертифікати, варанти", "Коносамент, складські свідоцтва"]}, {"id": 87, "q": "Оберіть обʼєкт, який НЕ належить до валютних цінностей", "a": "⚠️ Це питання не з ЦК, а з Закону «Про валюту і валютні операції». Валютні цінності — іноземна валюта, платіжні документи та цінні папери в іноземній валюті, банківські метали. Не належать: національна валюта (гривня, ст. 192 ЦК), нерухомість та інші речі. Звіряйте з варіантами.", "o": ["Іноземна валюта, платіжні документи та цінні папери в іноземній валюті, банківські метали", "Лише іноземна валюта", "Гривня та іноземна валюта без металів", "Нерухомість за кордоном"]}, {"id": 88, "q": "Оберіть обʼєкт, який є річчю з індивідуальними ознаками", "a": "Річ, визначена індивідуальними ознаками, — така, що має лише їй властиві ознаки, які вирізняють її з-поміж інших однорідних речей (ст. 184): квартира, автомобіль, картина, земельна ділянка. Не індивідуальна — річ, визначена родовими ознаками (кількість, вага, міра): зерно, гроші, цегла.", "o": ["Річ, що має лише їй властиві ознаки (квартира, автомобіль)", "Річ, визначена числом, вагою, мірою", "Річ, що знищується при використанні", "Річ, що складається з частин"]}, {"id": 89, "q": "Який поділ речей НЕ передбачено у Цивільному кодексі України?", "a": "ЦК передбачає поділ речей на: рухомі й нерухомі (ст. 181); подільні й неподільні (ст. 183); визначені індивідуальними чи родовими ознаками, споживні й неспоживні (ст. 184); прості й складні (ст. 188); головна річ і приналежність (ст. 186). Будь-який поділ поза цим переліком у ЦК не передбачений.", "o": ["Рухомі/нерухомі, подільні/неподільні, споживні/неспоживні, прості/складні", "Рухомі/нерухомі, основні/допоміжні", "Подільні/неподільні, цінні/нецінні", "Прості/складні, матеріальні/нематеріальні"]}, {"id": 90, "q": "Які речі НЕ належать до нерухомих?", "a": "Нерухомі — земельні ділянки та об’єкти на них, переміщення яких неможливе без знецінення та зміни призначення (ст. 181 ч. 1). Не нерухомі — рухомі речі, які можна вільно переміщувати без втрати чи пошкодження (ч. 2), а також гроші, цінні папери. Закон може поширити режим нерухомості на речі, права на які підлягають держреєстрації (літаки, судна), але самі вони за природою рухомі.", "o": ["Земельні ділянки та об’єкти, переміщення яких неможливе без знецінення і зміни призначення", "Усі речі, що не можна перенести вручну", "Лише земельні ділянки", "Будь-які споруди, включно з тимчасовими"]}, {"id": 91, "q": "Яким законом регулюється здійснення державної реєстрації прав на нерухомість?", "a": "Законом «Про державну реєстрацію речових прав на нерухоме майно та їх обтяжень» (ст. 182 ЦК відсилає до закону). Також виникнення, перехід і припинення прав на нерухомість підлягають державній реєстрації (ст. 182).", "o": ["Закон «Про державну реєстрацію речових прав на нерухоме майно та їх обтяжень»", "Земельний кодекс", "Закон «Про нотаріат»", "Закон «Про іпотеку»"]}, {"id": 92, "q": "Правовий режим яких обʼєктів цивільних прав регламентовано у Законі України «Про гарантування прав на обʼєкти нерухомого майна, які будуть споруджені в майбутньому»?", "a": "⚠️ Закон «Про гарантування прав на об’єкти нерухомого майна, які будуть споруджені в майбутньому» регулює правовий режим майбутніх об’єктів нерухомості (які ще не споруджені) та пов’язаних із ними прав інвесторів і набувачів. ЦК у ст. 181 згадує об’єкти незавершеного будівництва та майбутні об’єкти нерухомості. Точне формулювання перевіряйте за текстом закону, бо він поза ЦК.", "o": ["Закон про гарантування прав на майбутні об’єкти нерухомості", "Закон про іпотеку", "Закон про оренду землі", "Закон про державну реєстрацію речових прав"]}, {"id": 93, "q": "Правовий режим яких обʼєктів цивільних прав регламентовано у Законі України «Про гарантування прав на обʼєкти нерухомого майна, які будуть споруджені в майбутньому»?", "a": "⚠️ Закон «Про гарантування прав на об’єкти нерухомого майна, які будуть споруджені в майбутньому» регулює правовий режим майбутніх об’єктів нерухомості (які ще не споруджені) та пов’язаних із ними прав інвесторів і набувачів. ЦК у ст. 181 згадує об’єкти незавершеного будівництва та майбутні об’єкти нерухомості. Точне формулювання перевіряйте за текстом закону, бо він поза ЦК.", "o": ["Закон про гарантування прав на майбутні об’єкти нерухомості", "Закон про іпотеку", "Закон про оренду землі", "Закон про державну реєстрацію речових прав"]}, {"id": 94, "q": "Яким актом передбачено перелік майна, яке є обмеженим в цивільному обороті або вилученим з нього?", "a": "Законом: ст. 178 ЦК встановлює, що види об’єктів, обіг яких не допускається (вилучені з обороту), які можуть належати лише певним учасникам або потребують особливого дозволу (обмежені в обороті), визначаються законом. ⚠️ Окремого переліку в самому ЦК немає.", "o": ["Законом", "Постановою Кабінету Міністрів", "Указом Президента", "Рішенням суду"]}, {"id": 95, "q": "Оберіть майно, яке є вилученим з цивільного обороту", "a": "Вилученими з цивільного обороту є об’єкти, обіг яких за законом не допускається (ст. 178), наприклад зброя масового ураження, ядерні матеріали поза режимом спеціальних дозволів, заборонені до обігу речовини. ⚠️ Конкретний перелік — у спеціальних законах; обирайте варіант, що за законом заборонений до обігу взагалі.", "o": ["Об’єкти, обіг яких заборонений законом", "Об’єкти, що потребують ліцензії", "Об’єкти, що належать лише певним особам", "Усі об’єкти державної власності"]}, {"id": 96, "q": "Оберіть майно, яке є обмеженим в цивільному обороті", "a": "Обмеженими в обороті є об’єкти, які можуть належати лише певним учасникам або придбання яких потребує особливого дозволу (ст. 178), наприклад вогнепальна мисливська зброя, наркотичні засоби та прекурсори за ліцензією, окремі культурні цінності. ⚠️ Конкретний перелік — у спеціальних законах.", "o": ["Об’єкти, що можуть належати лише певним особам або потребують дозволу", "Об’єкти, обіг яких заборонений", "Усі вільно обертаються", "Лише нерухомість"]}, {"id": 97, "q": "Оберіть твердження, яке НЕправильно характеризує тварин як обʼєкт цивільних прав", "a": "Правильно за ст. 180: тварина — особливий об’єкт цивільних прав; на неї поширюється режим речі, крім випадків, встановлених законом; жорстоке поводження з тваринами, що суперечить принципам гуманності, не допускається. Неправильні твердження: що тварина є звичайною річчю без особливостей, що право на неї можна здійснювати з жорстокістю, що тварина не може бути об’єктом права власності.", "o": ["Особливий об’єкт; режим речі, крім випадків закону; жорстоке поводження заборонене", "Звичайна річ", "Суб’єкт права", "Не може бути об’єктом власності"]}, {"id": 98, "q": "Оберіть обʼєкт із переліку, який є складною річчю.", "a": "Складна річ — дві або більше речей, які утворюють єдине ціле, що призводить до використання їх за загальним призначенням (ст. 188): наприклад, комп’ютер у комплекті, сервіз, набір меблів, верстат з обладнанням. Правочин щодо складної речі поширюється на всі її складові частини, якщо договором не встановлено інше.", "o": ["Дві або більше речей, що утворюють єдине ціле для використання за загальним призначенням", "Річ, яку можна поділити без втрати призначення", "Річ з кількох однорідних частин", "Основна річ із приналежністю"]}, {"id": 99, "q": "Який закон регулює правовідносини, що виникають щодо цінних паперів?", "a": "Закон «Про ринки капіталу та організовані товарні ринки» (від 19.06.2020 № 738-IX). Ст. 195 ЦК відсилає до закону щодо груп, видів цінних паперів та порядку їх обігу.", "o": ["Закон «Про ринки капіталу та організовані товарні ринки»", "Закон «Про цінні папери та фондовий ринок»", "Закон «Про акціонерні товариства»", "Закон «Про банки і банківську діяльність»"]}, {"id": 100, "q": "Який закон регулює правовідносини, що виникають щодо цифрового контенту?", "a": "Закон «Про цифровий контент та цифрові послуги» (прийнятий разом зі змінами до ЦК щодо цифрових речей — ст. 177, 179-1 ЦК).", "o": ["Закон «Про цифровий контент та цифрові послуги»", "Закон «Про віртуальні активи»", "Закон «Про електронні комунікації»", "Закон «Про захист персональних даних»"]}, {"id": 101, "q": "Оберіть варіант відповіді, де НЕправильно прокласифіковано цінні папери", "a": "Правильна класифікація: пайові — акції, інвестиційні сертифікати; боргові — облігації, векселі, ощадні сертифікати; похідні — деривативи (опціони, ф’ючерси); товаророзпорядчі — коносамент, складські свідоцтва. Неправильна та, де цінний папір віднесено не до своєї групи (наприклад, акцію — до боргових чи облігацію — до пайових).", "o": ["Акція — пайовий; облігація — боргова; опціон — похідний; коносамент — товаророзпорядчий", "Акція — боргова; облігація — пайова", "Опціон — товаророзпорядчий; коносамент — похідний", "Вексель — пайовий; облігація — похідна"]}, {"id": 102, "q": "На які обʼєкти законом НЕ може поширюватися правовий режим нерухомої речі?", "a": "Режим нерухомої речі не може бути поширений на рухомі речі, права на які не підлягають державній реєстрації. Закон може поширити його лише на речі, права на які підлягають держреєстрації: повітряні та морські судна, судна внутрішнього плавання, космічні об’єкти тощо (ст. 181 ч. 2).", "o": ["Рухомі речі, права на які не підлягають державній реєстрації", "Судна внутрішнього плавання", "Повітряні судна", "Космічні об’єкти"]}, {"id": 103, "q": "У яких з наведених варіантів відповідей зазначені правильні положення про цифрову річ? :", "a": "Цифрова річ — благо, що створюється та існує виключно у цифровому середовищі та має майнову цінність (ст. 179-1 ч. 1). Цифровою річчю є віртуальні активи, цифровий контент та інші блага (ч. 2). Особливості режиму визначає закон; до цифрових речей застосовуються положення ЦК про речі, якщо інше не встановлено ЦК, законом або не випливає із сутності цифрової речі (ч. 3). Об’єкти цивільних прав можуть існувати в матеріальному світі та/або цифровому середовищі (ст. 177 ч. 2).", "o": ["Благо, що існує виключно в цифровому середовищі й має майнову цінність", "Будь-який електронний документ", "Річ, оцифрована з матеріального світу", "Цифровий підпис"]}, {"id": 104, "q": "Що належить до цифрового контенту? :", "a": "Цифровий контент — дані, що створюються та надаються у цифровій формі: комп’ютерні програми, застосунки, ігри, відео-, аудіо-, музичні файли, електронні книги, цифрові зображення (Закон «Про цифровий контент та цифрові послуги»). Згідно зі ст. 179-1 ч. 2 ЦК, він є різновидом цифрових речей.", "o": ["Комп’ютерні програми, застосунки, відео-, аудіофайли, ігри, електронні книги", "Лише програмне забезпечення", "Лише криптовалюта", "Електронні гроші"]}, {"id": 105, "q": "Які в Україні можуть бути групи цінних паперів в цивільному обороті ? :", "a": "Пайові, боргові, похідні, товаророзпорядчі (ст. 195).", "o": ["Пайові, боргові, похідні, товаророзпорядчі", "Пайові, боргові, похідні, іпотечні", "Пайові, боргові, товаророзпорядчі", "Емісійні, неемісійні"]}, {"id": 106, "q": "Які в Україні можуть бути групи цінних паперів в цивільному обороті ? :", "a": "Пайові, боргові, похідні, товаророзпорядчі (ст. 195).", "o": ["Пайові, боргові, похідні, товаророзпорядчі", "Пайові, боргові, похідні, іпотечні", "Пайові, боргові, товаророзпорядчі", "Емісійні, неемісійні"]}, {"id": 107, "q": "Кому належать права на цінний папір та права за цінним папером, що існують у паперовій формі?:", "a": "⚠️ Власнику цінного папера (особі, яка на законних підставах володіє документом і названа в ньому чи є його пред’явником). У ЦК ст. 194–198 були суттєво змінені 2024–2025 роками (Закони № 3585-IX і № 3586-IX, ст. 196 виключено), тому точне формулювання звіряйте з чинним текстом ст. 197–198.", "o": ["Власнику цінного паперу", "Емітенту", "Депозитарію", "Особі, яка його видала"]}, {"id": 108, "q": "Кому належать права на цінний папір та права за цінним папером, що існують у паперовій формі?:", "a": "⚠️ Власнику цінного папера (особі, яка на законних підставах володіє документом і названа в ньому чи є його пред’явником). У ЦК ст. 194–198 були суттєво змінені 2024–2025 роками (Закони № 3585-IX і № 3586-IX, ст. 196 виключено), тому точне формулювання звіряйте з чинним текстом ст. 197–198.", "o": ["Власнику цінного паперу", "Емітенту", "Депозитарію", "Особі, яка його видала"]}, {"id": 109, "q": "На які об’єкти може бути поширений законом режим нерухомої речі ?:", "a": "На повітряні та морські судна, судна внутрішнього плавання, космічні об’єкти та інші речі, права на які підлягають державній реєстрації (ст. 181 ч. 2).", "o": ["Повітряні, морські судна, судна внутрішнього плавання, космічні об’єкти", "Автомобілі та залізничні вагони", "Будь-які великі машини", "Лише літаки"]}, {"id": 110, "q": "Які види майна НЕ можуть перебувати у власності громадян, громадських об’єднань, міжнародних організацій та юридичних осіб інших держав на території України?:", "a": "⚠️ За ЦК це об’єкти, що перебувають у виключній власності Українського народу та держави, зокрема земля, надра, атмосферне повітря, водні та інші природні ресурси (ст. 324; Конституція, ст. 13, 14), а також об’єкти, вилучені з обороту (ст. 178). Це питання з Закону чи Конституції; звіряйте з варіантами.", "o": ["Земля, надра, атмосферне повітря, водні та інші природні ресурси", "Житлові будинки", "Підприємства", "Транспортні засоби"]}, {"id": 111, "q": "Що із наведеного становить національну валюту (гривню) ?:", "a": "Гривня — національна валюта, законний платіжний засіб на всій території України у готівковій формі (банкноти, монети) та безготівковій формі (ст. 192 ЦК).", "o": ["Гривня", "Долар США", "Євро", "Електронні гроші"]}, {"id": 112, "q": "Що належить до нерухомих речей ?:", "a": "Земельні ділянки, а також об’єкти, розташовані на них, переміщення яких неможливе без їх знецінення та зміни призначення: будівлі, споруди, квартири, об’єкти незавершеного будівництва (ст. 181 ч. 1). Режим нерухомості закон може поширити на судна, літаки тощо (ч. 2).", "o": ["Земельні ділянки та об’єкти на них, переміщення яких неможливе без знецінення", "Будь-які будівлі, зокрема тимчасові", "Лише квартири", "Транспортні засоби та судна"]}, {"id": 113, "q": "На які види залежно від особливостей правового режиму поділяються речі?:", "a": "⚠️ Залежно від правового режиму: оборотоздатні, обмежені в обороті та вилучені з обороту (ст. 178); окремо за режимом — нерухомі й рухомі (ст. 181). Вибирайте варіант, що відповідає ст. 178.", "o": ["Оборотоздатні, обмежені в обороті, вилучені з обороту", "Рухомі та нерухомі", "Індивідуально та родово визначені", "Подільні та неподільні"]}, {"id": 114, "q": "Що із нижченаведеного належить до цінних паперів?:", "a": "До цінних паперів належать: акції, облігації, інвестиційні сертифікати, векселі, ощадні (депозитні) сертифікати, деривативи, коносамент, складські свідоцтва, аграрні ноти (Закон «Про ринки капіталу…», Закон «Про аграрні ноти»). Не є цінними паперами: гроші, чеки та інші платіжні документи.", "o": ["Акція, облігація, вексель, інвестиційний сертифікат", "Чек, акредитив", "Гроші, платіжні картки", "Ощадна книжка"]}, {"id": 115, "q": "За формою випуску емісійні цінні папери можуть бути виключно:", "a": "⚠️ Бездокументарними (електронними) — за Законом «Про ринки капіталу та організовані товарні ринки» емісійні цінні папери існують у бездокументарній формі. Загалом ЦК визнає документарну та бездокументарну форми існування цінних паперів (ст. 197).", "o": ["Бездокументарними (електронними)", "Паперовими", "Змішаними", "Документарними на пред’явника"]}, {"id": 116, "q": "В яких формах можуть існувати цінні папери?:", "a": "У документарній (на папері) та бездокументарній (електронній) формах (ст. 197).", "o": ["Документарна та бездокументарна", "Паперова та змішана", "Лише документарна", "Іменна та пред’явницька"]}, {"id": 117, "q": "Які є види векселів?:", "a": "Прості та переказні (тратта) (Женевська конвенція про уніфікований закон про переказні векселі й прості векселі, Закон «Про обіг векселів в Україні»).", "o": ["Прості та переказні", "Іменні та ордерні", "Емісійні та неемісійні", "Короткострокові та довгострокові"]}, {"id": 118, "q": "Правочин – це:", "a": "Правочин — дія особи, спрямована на набуття, зміну або припинення цивільних прав та обов’язків (ст. 202 ч. 1).", "o": ["Дія особи, спрямована на набуття, зміну або припинення прав та обов’язків", "Погоджена дія двох сторін", "Будь-яка юридично значима дія", "Дія, що породжує обов’язки"]}, {"id": 119, "q": "Що з переліченого належить до передбачених законом загальних вимог, які необхідні для чинності правочину?", "a": "Загальні вимоги чинності правочину (ст. 203): 1) зміст не суперечить ЦК, іншим актам законодавства та моральним засадам суспільства; 2) особа має необхідний обсяг цивільної дієздатності; 3) волевиявлення вільне та відповідає внутрішній волі; 4) правочин відповідає вимогам щодо форми; 5) спрямований на реальне настання правових наслідків; 6) правочин, що вчиняється батьками (усиновлювачами), не може суперечити правам та інтересам їхніх малолітніх, неповнолітніх чи непрацездатних дітей.", "o": ["Законний зміст; дієздатність; вільна воля; форма; реальні наслідки; інтереси дітей", "Законний зміст; форма; нотаріальне посвідчення", "Дієздатність; письмова форма; реєстрація", "Законність; оплатність; письмова форма"]}, {"id": 120, "q": "Які правочини між фізичними особами, за загальним правилом, повинні вчинятися у письмовій формі?:", "a": "У письмовій формі вчиняються правочини фізичних осіб між собою на суму, що перевищує у двадцять і більше разів розмір неоподатковуваного мінімуму доходів громадян, крім тих, що повністю виконуються у момент вчинення, а також інші правочини, для яких закон встановлює письмову форму (ст. 208 ч. 1 п. 3–4).", "o": ["Між фізичними особами на суму понад 20 НМДГ (крім виконаних одразу) та інші за законом", "Між фізичними особами на суму понад 100 НМДГ", "Між фізичними особами на суму понад 50 НМДГ", "Усі правочини між фізичними особами"]}, {"id": 121, "q": "У якій формі вчиняється відмова від правочину?", "a": "Відмова від правочину вчиняється у такій самій формі, в якій було вчинено правочин (ст. 214 ч. 3). Особа, яка вчинила односторонній правочин, може відмовитися від нього, якщо закон не забороняє (ч. 1); сторони дво- чи багатостороннього правочину — за взаємною згодою або у випадках, передбачених законом (ч. 2). Наслідки відмови встановлюються законом або домовленістю сторін (ч. 4).", "o": ["У тій самій формі, що й правочин", "Завжди письмово", "Завжди нотаріально", "Усно"]}, {"id": 122, "q": "Правочини щодо розпорядження майном та інші правочини, що виходять за межі дрібних побутових, вчиняються особою, цивільна дієздатність якої обмежена, за згодою:", "a": "За згодою піклувальника (ст. 37 ч. 3).", "o": ["За згодою піклувальника", "За дозволом суду", "Самостійно", "За згодою органу опіки"]}, {"id": 123, "q": "Презумпція правомірності правочину означає, що:", "a": "Правочин вважається правомірним, поки його недійсність прямо не встановлена законом або він не визнаний судом недійсним (ст. 204).", "o": ["Правомірний, доки недійсність не встановлена законом чи судом", "Недійсний, доки не доведено правомірність", "Правомірний лише при нотаріальній формі", "Недійсний за відсутності реєстрації"]}, {"id": 124, "q": "Одностороннім правочином є:", "a": "Односторонній правочин — це дія однієї сторони (ст. 202 ч. 3): заповіт, довіреність, відмова від права власності, прийняття спадщини чи відмова від неї, публічна обіцянка винагороди, відкликання довіреності.", "o": ["Заповіт, довіреність, відмова від спадщини", "Купівля-продаж, оренда", "Дарування, позика", "Договір підряду"]}, {"id": 125, "q": "Правочин, вчинений без дозволу органу опіки і піклування, може бути визнаний дійсним:", "a": "Правочин без дозволу органу опіки та піклування є нікчемним (ст. 224 ч. 1), але на вимогу заінтересованої особи може бути визнаний судом дійсним, якщо буде встановлено, що він відповідає інтересам особи, над якою встановлено опіку чи піклування (ст. 224 ч. 2). Примітка: з 2026 р. безоплатне набуття майна малолітньою чи неповнолітньою особою дозволу не потребує (ст. 31 ч. 4, ст. 32 ч. 2, ст. 71 ч. 3 — Закон № 4824-IX).", "o": ["Нікчемний; суд може визнати дійсним, якщо відповідає інтересам підопічного", "Оспорюваний; визнається судом недійсним", "Дійсний, якщо схвалено пізніше", "Нікчемний без можливості визнання дійсним"]}, {"id": 126, "q": "Усно може вчинятися правочин:", "a": "Усно може вчинятися правочин, який повністю виконується сторонами у момент його вчинення, крім тих, що підлягають нотаріальному посвідченню та (або) державній реєстрації (ст. 206 ч. 1); також усно можна вчиняти інші правочини, для яких закон не вимагає письмової форми (ст. 206 ч. 2; ст. 208).", "o": ["Ті, що повністю виконуються у момент вчинення, крім нотаріальних та підлягаючих реєстрації", "Усі договори до 20 НМДГ", "Лише договори між фізичними особами", "Усі договори купівлі-продажу"]}, {"id": 127, "q": "Багатосторонній правочин – це:", "a": "Правочин, в якому беруть участь три або більше сторін (ст. 202 ч. 5).", "o": ["Три або більше сторін", "Дві сторони", "Одна сторона", "Дві сторони та третя особа"]}, {"id": 128, "q": "Чи може воля сторони до вчинення правочину виражатися її мовчанням?:", "a": "Так, але лише у випадках, прямо встановлених договором або актами цивільного законодавства (ст. 205 ч. 2).", "o": ["Так, у випадках, встановлених договором чи законом", "Ні, ніколи", "Так, завжди", "Так, за рішенням суду"]}, {"id": 129, "q": "Які правочини НЕ можуть вчинятись усно?", "a": "Не можуть вчинятися усно: правочини, що підлягають нотаріальному посвідченню та (або) державній реєстрації; правочини між юридичними особами; правочини між фізичною та юридичною особою (крім передбачених ст. 206); правочини між фізичними особами на суму понад двадцять НМДГ, якщо вони не виконуються одразу; інші, для яких закон встановлює письмову форму (ст. 206, 208).", "o": ["Підлягають нотаріальному посвідченню чи реєстрації; між юр. особами; понад 20 НМДГ між фізичними", "Купівля хліба в магазині", "Правочини до 20 НМДГ, що виконуються одразу", "Дрібні побутові"]}, {"id": 130, "q": "Договір – це:", "a": "Договір — домовленість двох або більше сторін, спрямована на встановлення, зміну або припинення цивільних прав та обов’язків (ст. 626 ч. 1).", "o": ["Домовленість двох або більше сторін щодо встановлення, зміни, припинення прав та обов’язків", "Одностороння дія особи", "Письмова угода", "Зобов’язання сплатити гроші"]}, {"id": 131, "q": "Тлумачення змісту правочину здійснюється:", "a": "Стороною (сторонами) правочину та судом (ст. 213 ч. 1). Суд тлумачить зміст правочину на вимогу сторони (сторін).", "o": ["Стороною (сторонами) та судом", "Лише судом", "Лише нотаріусом", "Лише стороною, яка вчинила"]}, {"id": 132, "q": "За бажанням фізичної або юридичної особи нотаріально посвідченим може бути:", "a": "Будь-який правочин з її участю (ст. 209 ч. 4).", "o": ["Будь-який правочин", "Лише договір купівлі-продажу", "Лише письмові правочини", "Правочини понад 20 НМДГ"]}, {"id": 133, "q": "Що є місцем вчинення одностороннього правочину, якщо у правочині не вказано місце його вчинення?", "a": "Місцем вчинення одностороннього правочину є місце вираження волі сторони (ст. 211 ч. 1 п. 1); місце вчинення дво- або багатостороннього правочину визначається за правилами ст. 211 та ст. 647 про місце укладення договору. Це застосовується, якщо в правочині місце вчинення не вказане.", "o": ["Місце вираження волі сторони", "Місце проживання сторони", "Місце реєстрації юридичної особи", "Місце нотаріуса"]}, {"id": 134, "q": "Позначте відповідь, у якій правильно вказано слово, що пропущене у наведеному положенні: “Правочин, що обмежує можливість фізичної особи мати не заборонені законом цивільні права та обов’язки, є ____________”?", "a": "Нікчемним (ст. 27 ч. 1).", "o": ["Нікчемним", "Оспорюваним", "Дійсним", "Недійсним з моменту визнання судом"]}, {"id": 135, "q": "Якщо фізична особа у зв’язку з хворобою або фізичною вадою не може підписати правочин власноручно, то:", "a": "За її дорученням правочин може підписати інша особа. Її підпис має бути посвідчений нотаріусом або іншою посадовою особою з правом вчиняти нотаріальні дії із зазначенням причин, з яких текст не може бути підписаний власноручно (ст. 207 ч. 3). Підпис іншої особи на тексті правочину, що не вимагає нотаріального посвідчення, може засвідчити відповідна посадова особа за місцем роботи, навчання, проживання або лікування особи.", "o": ["Інша особа за її дорученням; підпис посвідчує нотаріус", "Лікар чи свідок без посвідчення", "Нікому, правочин недійсний", "Представник за довіреністю без посвідчення"]}, {"id": 136, "q": "Особа, яка вчиняє правочин, повинна:", "a": "Мати необхідний обсяг цивільної дієздатності (ст. 203 ч. 2). Також її волевиявлення має бути вільним і відповідати внутрішній волі (ч. 3).", "o": ["Мати необхідний обсяг цивільної дієздатності", "Бути повнолітньою", "Мати освіту", "Бути зареєстрованою за місцем вчинення"]}, {"id": 137, "q": "Правочин вважається таким, що вчинений у письмовій формі, якщо:", "a": "Якщо його зміст зафіксований в одному або кількох документах, у листах чи телеграмах, якими обмінялися сторони, і він підписаний особою (особами), яка його вчиняє (ст. 207 ч. 1). Правочин також вважається письмовим, якщо воля сторін виражена за допомогою телетайпного, електронного чи іншого технічного засобу зв’язку (ч. 2).", "o": ["Зміст зафіксований у документах, листах, телеграмах і підписаний особою", "Лише нотаріально посвідчений", "Лише на бланку", "Достатньо усної домовленості та свідків"]}, {"id": 138, "q": "Правочин вважається таким, що вчинений у письмовій формі, якщо:", "a": "Якщо його зміст зафіксований в одному або кількох документах, у листах чи телеграмах, якими обмінялися сторони, і він підписаний особою (особами), яка його вчиняє (ст. 207 ч. 1). Правочин також вважається письмовим, якщо воля сторін виражена за допомогою телетайпного, електронного чи іншого технічного засобу зв’язку (ч. 2).", "o": ["Зміст зафіксований у документах, листах, телеграмах і підписаний особою", "Лише нотаріально посвідчений", "Лише на бланку", "Достатньо усної домовленості та свідків"]}, {"id": 139, "q": "Нотаріальне посвідчення правочину може здійснюватися:", "a": "Нотаріусом або іншою посадовою особою, яка має право на вчинення такої нотаріальної дії, шляхом вчинення посвідчувального напису (ст. 209 ч. 2). Обов’язкове — у випадках, встановлених законом або домовленістю сторін (ч. 1); за бажанням особи — будь-який правочин (ч. 4).", "o": ["Нотаріусом або іншою посадовою особою через посвідчувальний напис", "Лише нотаріусом", "Державним реєстратором", "Судом"]}, {"id": 140, "q": "Виберіть з переліку односторонні правочини:", "a": "Заповіт, довіреність, прийняття спадщини, відмова від спадщини, відмова від права власності, публічна обіцянка винагороди, відкликання довіреності. Двосторонні й багатосторонні — це договори.", "o": ["Заповіт, довіреність, прийняття спадщини, відмова від права власності", "Купівля-продаж, оренда, позика", "Дарування, міна", "Договір поруки"]}, {"id": 141, "q": "Виберіть з переліку односторонні правочини:", "a": "Заповіт, довіреність, прийняття спадщини, відмова від спадщини, відмова від права власності, публічна обіцянка винагороди, відкликання довіреності. Двосторонні й багатосторонні — це договори.", "o": ["Заповіт, довіреність, прийняття спадщини, відмова від права власності", "Купівля-продаж, оренда, позика", "Дарування, міна", "Договір поруки"]}, {"id": 142, "q": "Назвіть правильні твердження щодо співвідношення понять «правочин» і «договір»:", "a": "Правочин — родове (ширше) поняття; договір — двосторонній або багатосторонній правочин (ст. 202 ч. 3, ст. 626). Кожен договір є правочином, але не кожен правочин є договором, бо існують односторонні правочини.", "o": ["Договір — різновид правочину; правочин ширший за договір", "Правочин і договір тотожні", "Договір ширший за правочин", "Правочин — лише односторонній акт"]}, {"id": 143, "q": "Оберіть правильні твердження щодо дрібного побутового правочину:", "a": "Дрібний побутовий правочин задовольняє побутові потреби особи, відповідає її фізичному, духовному чи соціальному розвитку та стосується предмета невисокої вартості (ст. 31 ч. 1 п. 1). Його самостійно може вчиняти малолітня особа та особа з обмеженою дієздатністю (ст. 37 ч. 2); помічник — в інтересах підопічного (ст. 78 ч. 3). Недієздатна особа не має права вчиняти жодних правочинів.", "o": ["Задовольняє побутові потреби, відповідає розвитку, предмет невисокої вартості", "Будь-який правочин до 20 НМДГ", "Правочин, що виконується у момент вчинення", "Правочин лише між родичами"]}, {"id": 144, "q": "Виберіть види правочинів залежно від моменту вчинення:", "a": "Консенсуальні (вважаються вчиненими з моменту досягнення згоди) та реальні (з моменту передання речі), а для тих, що потребують нотаріального посвідчення чи реєстрації, — з моменту посвідчення чи реєстрації (ст. 210, 640).", "o": ["Консенсуальні та реальні", "Оплатні та безоплатні", "Строкові та безстрокові", "Односторонні та двосторонні"]}, {"id": 145, "q": "Виберіть правильні твердження щодо форми правочину та способів волевиявлення осіб:", "a": "Форма — усна або письмова (проста чи нотаріальна), сторони вільні обирати форму, якщо закон не встановлює іншого (ст. 205 ч. 1). Волевиявлення — словами, письмово, конклюдентними діями (поведінка засвідчує волю до настання правових наслідків), а мовчанням — лише у випадках, встановлених договором чи законом (ст. 205 ч. 2).", "o": ["Усна й письмова (проста чи нотаріальна); словами, діями, мовчанням у випадках закону", "Лише письмова і нотаріальна", "Усна, письмова, електронна, нотаріальна, реєстраційна", "Лише усна та письмова"]}, {"id": 146, "q": "Виберіть правильні твердження щодо вимог, додержання яких є необхідним для чинності правочину:", "a": "Вимоги ст. 203: законність змісту, необхідний обсяг дієздатності, вільне волевиявлення, що відповідає внутрішній волі, дотримання форми, спрямованість на реальне настання наслідків, а також відповідність інтересам дітей, якщо правочин вчиняють батьки (усиновлювачі).", "o": ["Законність змісту, дієздатність, вільна воля, форма, реальні наслідки, інтереси дітей", "Законність, оплатність, форма", "Дієздатність, письмова форма", "Воля, реєстрація, нотаріус"]}, {"id": 147, "q": "Виберіть правильні твердження щодо правочинів, які можуть вчинятися усно?", "a": "Усно може вчинятися правочин, який повністю виконується сторонами у момент його вчинення, крім тих, що підлягають нотаріальному посвідченню та (або) державній реєстрації (ст. 206 ч. 1); також усно можна вчиняти інші правочини, для яких закон не вимагає письмової форми (ст. 206 ч. 2; ст. 208).", "o": ["Ті, що повністю виконуються у момент вчинення, крім нотаріальних та підлягаючих реєстрації", "Усі договори до 20 НМДГ", "Лише договори між фізичними особами", "Усі договори купівлі-продажу"]}, {"id": 148, "q": "Виберіть правильні твердження щодо можливості підписати текст правочину іншою особою:", "a": "Якщо особа через хворобу чи фізичну ваду не може підписати правочин, його підписує інша особа за її дорученням; її підпис посвідчує нотаріус або інша особа, яка має право вчиняти нотаріальні дії, із зазначенням причин (ст. 207 ч. 3). Для правочинів без обов’язкового нотаріального посвідчення підпис іншої особи може засвідчити посадова особа за місцем роботи, навчання, проживання чи лікування. Підпис може бути також факсимільним чи електронним у випадках, встановлених законом.", "o": ["Інша особа за дорученням, підпис посвідчує нотаріус або посадова особа", "Підписує будь-який свідок", "Підписує лише представник", "Допускається лише факсимільний підпис"]}, {"id": 149, "q": "Виберіть правильні твердження щодо нотаріального посвідчення правочину:", "a": "Нотаріальне посвідчення обов’язкове лише у випадках, встановлених законом або домовленістю сторін (ст. 209 ч. 1); здійснюється нотаріусом чи іншою уповноваженою посадовою особою через посвідчувальний напис (ч. 2); за бажанням особи нотаріально може бути посвідчений будь-який правочин (ч. 4). Недодержання вимоги про нотаріальне посвідчення робить правочин нікчемним (ст. 219 ч. 1, ст. 220 ч. 1).", "o": ["Обов’язкове за законом чи домовленістю; за бажанням — будь-який; недодержання — нікчемність", "Обов’язкове для всіх письмових", "Лише для нерухомості", "Необов’язкове ніколи"]}, {"id": 150, "q": "Який спосіб (способи) захисту може бути застосовано у разі нікчемності правочину?:", "a": "Нікчемний правочин недійсний за законом і визнання його недійсним судом не вимагається (ст. 215 ч. 2). Застосовуються наслідки недійсності: двостороння реституція та відшкодування збитків і моральної шкоди (ст. 216), позов про повернення майна, визнання права. Також суд може визнати правочин дійсним, якщо це прямо допускається законом (наприклад, ст. 220 ч. 2, ст. 224 ч. 2).", "o": ["Двостороння реституція та відшкодування збитків; суд може визнати дійсним у випадках закону", "Лише визнання недійсним судом", "Лише відшкодування моральної шкоди", "Штраф у дохід держави"]}, {"id": 151, "q": "Який із наведених правочинів НЕ може бути визнаний судом недійсним?:", "a": "Нікчемний правочин, бо його недійсність встановлена законом і визнання судом не вимагається (ст. 215 ч. 2). Судом визнається недійсним лише оспорюваний правочин (ст. 215 ч. 3).", "o": ["Нікчемний правочин", "Оспорюваний правочин", "Фіктивний правочин", "Удаваний правочин"]}, {"id": 152, "q": "Як називається вид недійсного правочину, недійсність якого прямо встановлена законом, і визнання його недійсним судом не вимагається?:", "a": "Нікчемний правочин (ст. 215 ч. 2).", "o": ["Нікчемний", "Оспорюваний", "Фіктивний", "Удаваний"]}, {"id": 153, "q": "Як називається вид недійсного правочину, недійсність якого прямо не встановлена законом, але який може бути визнаний судом недійсним за позовом однієї із сторін або іншої заінтересованої особи на підставах, встановлених законом?:", "a": "Оспорюваний правочин (ст. 215 ч. 3).", "o": ["Оспорюваний", "Нікчемний", "Фіктивний", "Удаваний"]}, {"id": 154, "q": "Як називається правочин, який вчинено без наміру створення правових наслідків, які обумовлювалися цим правочином?:", "a": "Фіктивний правочин (ст. 234).", "o": ["Фіктивний", "Удаваний", "Нікчемний", "Оспорюваний"]}, {"id": 155, "q": "Як називається правочин, який вчинено сторонами для приховання іншого правочину, який вони насправді вчинили?:", "a": "Удаваний правочин (ст. 235).", "o": ["Удаваний", "Фіктивний", "Нікчемний", "Оспорюваний"]}, {"id": 156, "q": "Як називається неправильне сприйняття стороною правочину предмета чи інших істотних умов останнього, що вплинуло на її волевиявлення, за відсутності якого можна вважати, що правочин не було б вчинено?:", "a": "Помилка (ст. 229). Істотне значення має помилка щодо природи правочину, прав та обов’язків сторін, таких властивостей предмета, які значно знижують його цінність або можливість використання за призначенням.", "o": ["Помилка", "Обман", "Насильство", "Тяжкі обставини"]}, {"id": 157, "q": "Який правовий наслідок правочину, вчиненого під впливом обману?:", "a": "Правочин визнається судом недійсним за позовом потерпілої сторони (ст. 230 ч. 1). Потерпіла сторона має право на відшкодування збитків та моральної шкоди (ч. 2); застосовується реституція (ст. 216).", "o": ["Недійсний судом за позовом потерпілої сторони; збитки та моральна шкода", "Нікчемний автоматично", "Дійсний, якщо виконаний", "Недійсний лише за позовом прокурора"]}, {"id": 158, "q": "Який правовий наслідок недодержання сторонами вимоги закону про нотаріальне посвідчення правочину?:", "a": "Правочин є нікчемним: односторонній правочин — ст. 219 ч. 1; договір — ст. 220 ч. 1. Суд може визнати такий правочин дійсним, якщо сторони домовилися щодо всіх істотних умов, є письмові докази, одна сторона повністю або частково виконала, а друга ухиляється від нотаріального посвідчення (ст. 220 ч. 2).", "o": ["Нікчемний; суд може визнати дійсним, якщо одна сторона виконала, а інша ухиляється", "Оспорюваний", "Дійсний після повторного посвідчення", "Недійсний без винятків"]}, {"id": 159, "q": "Який загальний правовий наслідок недодержання сторонами письмової форми правочину, яка встановлена законом?:", "a": "Недодержання письмової форми не робить правочин недійсним, якщо закон прямо цього не встановлює; у разі спору сторони не мають права посилатися на свідчення свідків для підтвердження правочину та його умов, але можуть наводити письмові та інші докази (ст. 218).", "o": ["Не має наслідком недійсність; у спорі не можна посилатися на свідків", "Правочин нікчемний", "Правочин оспорюваний", "Правочин не вважається вчиненим"]}, {"id": 160, "q": "Як називається правовий наслідок недійсності правочину, який полягає у поверненні кожною із сторін другій стороні у натурі всього, що вона одержала на виконання цього правочину, а в разі неможливості такого повернення – у відшкодуванні вартості одержаного, за цінами, які існують на момент відшкодування?:", "a": "Реституція (двостороння реституція) (ст. 216 ч. 1).", "o": ["Реституція", "Реституція та конфіскація", "Відшкодування шкоди", "Стягнення штрафу"]}, {"id": 161, "q": "Який правочин може бути визнаний судом дійсним?:", "a": "Правочин, вчинений без нотаріального посвідчення, може бути визнаний судом дійсним за умов ст. 220 ч. 2. Також судом дійсним може бути визнаний правочин, вчинений без дозволу органу опіки, якщо він відповідає інтересам підопічного (ст. 224 ч. 2).", "o": ["Договір без нотаріуса (ст. 220 ч. 2) або без дозволу опіки в інтересах підопічного", "Договір, що порушує публічний порядок", "Договір недієздатної особи", "Фіктивний правочин"]}, {"id": 162, "q": "Який правовий наслідок правочину, вчиненого юридичною особою без відповідного дозволу (ліцензії)?:", "a": "Правочин юридичної особи, вчинений без відповідного дозволу (ліцензії), може бути визнаний судом недійсним (оспорюваний) (ст. 227 ч. 1). Якщо юридична особа ввела другу сторону в оману щодо свого права на вчинення такого правочину, вона зобов’язана відшкодувати їй моральну шкоду (ч. 2).", "o": ["Оспорюваний: може бути визнаний судом недійсним", "Нікчемний", "Дійсний", "Фіктивний"]}, {"id": 163, "q": "Який правовий наслідок вчинення правочину без дозволу органу опіки і піклування?:", "a": "Правочин є нікчемним (ст. 224 ч. 1), але суд на вимогу заінтересованої особи може визнати його дійсним, якщо він відповідає інтересам підопічного (ч. 2).", "o": ["Нікчемний; суд може визнати дійсним, якщо відповідає інтересам підопічного", "Оспорюваний", "Дійсний", "Оспорюваний без можливості схвалення"]}, {"id": 164, "q": "Який спеціальний правовий наслідок вчинення право
