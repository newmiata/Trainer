.bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.full h3{margin:0 0 6px;font-size:17px}.full ul{padding-left:18px;margin:0}.full li{margin:7px 0}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.chip{padding:7px 10px;font-size:14px;border-radius:16px}.chip.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}.w{padding-bottom:240px}.nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}.nav .in{max-width:640px;margin:0 auto}.nav .tabs{margin:0}.nav .chips{margin-bottom:8px}#tp.chips{display:block}.crow{display:flex;justify-content:center;gap:6px;margin-bottom:6px}.crow .chip{flex:1 1 0;min-width:0;font-size:13px;line-height:1.2;padding:8px 6px;text-align:center;border-radius:14px}.crow:first-child .chip{flex:0 1 55%}.cnt{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:18px 0}.cb{flex:0 0 calc(33.333% - 12px);padding:22px 0;font-size:22px;font-weight:600;border-radius:18px;text-align:center}.tg{display:block;width:100%;margin:0 0 8px;padding:7px;font-size:14px;border-radius:12px;color:var(--mut)}.nav.min #mn{display:none}.nav.min .tg{margin:0}body.minnav .w{padding-bottom:90px}html{background:var(--bg);overscroll-behavior:none}body{overscroll-behavior:none}

.btns{display:flex;flex-direction:column;gap:12px;width:min(420px,100%)}
.big{padding:16px 10px;font-size:19px;font-weight:600;border-radius:16px;text-align:center}

.w h1{padding-right:84px}
.rs{display:block;width:100%;margin:0 0 8px;padding:9px;font-size:15px;border-radius:12px;color:var(--no);border-color:var(--no)}.cf{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;align-items:center;justify-content:center;padding:20px}.cfb{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:22px;width:min(340px,100%);text-align:center}.cfb p{margin:0 0 16px;font-size:21px;font-weight:700}.pfb{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;z-index:20;width:42px;height:38px;padding:0;border-radius:12px;display:flex;align-items:center;justify-content:center}
.pfb svg{width:22px;height:22px;stroke:var(--tx);fill:none;stroke-width:2}
.w h1{padding-left:50px}
#profile{padding-top:70px;justify-content:flex-start;align-items:center}

.pbox h2{margin:0 0 6px;text-align:center;font-size:26px}

.pm{min-height:20px;font-size:14px;text-align:center}.pm.er{color:var(--no)}.pm.gd{color:var(--ok)}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;text-align:center}.sv{font-size:40px;font-weight:800}.stat small{display:block;color:var(--mut);margin-top:4px}
.exw{max-width:640px;margin:0 auto;padding:64px 14px 40px}
.exh{display:flex;justify-content:space-between;gap:8px;font-size:14px;margin-bottom:10px;flex-wrap:wrap}

.fail{color:#e53935;font-weight:800;font-size:clamp(30px,9vw,44px);line-height:1.15}
.okc{color:#2e9e44;font-weight:800;font-size:clamp(30px,9vw,44px);line-height:1.15}
.exs{color:var(--mut);font-size:16px}
.gbtn{width:min(420px,100%);padding:20px 10px;font-size:24px;font-weight:800;border-radius:18px;border:none;background:#2e9e44;color:#fff}
.grbtn{width:min(420px,100%);padding:14px 10px;font-size:16px;border-radius:14px;border:none;background:#6b6b70;color:#fff}
.acc{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.exr.s{min-height:0;padding:20px 0 10px}.mis{margin-top:14px;text-align:left}.mis h3{text-align:center;margin:0 0 6px}.opt.pick{border-color:var(--ac);background:var(--card);box-shadow:inset 0 0 0 2px var(--ac)}.nav2{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--bd);padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}.nav2 .in{max-width:640px;margin:0 auto}.nav2 .tabs{margin:0}.nav2.min #amn{display:none}.nav2.min .tg{margin:0}
.ahtml{font-size:15px;line-height:1.55;text-align:left}.ahtml p{margin:.55em 0}.ahtml ul,.ahtml ol{padding-left:20px;margin:.5em 0}.ahtml li{margin:.3em 0}.ahtml h4{margin:.8em 0 .3em;font-size:16px}
.tw{overflow-x:auto}.ahtml table{border-collapse:collapse;font-size:13px;min-width:100%}.ahtml td,.ahtml th{border:1px solid var(--bd);padding:6px;vertical-align:top}
.acard{justify-content:flex-start}.acard.front{justify-content:center}.acard.flip{max-height:calc(100dvh - 400px);min-height:200px;overflow:auto}
details.ad{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:8px 0}details.ad summary{padding:13px 14px;font-weight:600;cursor:pointer;line-height:1.35;list-style-position:inside}details.ad .ahtml{padding:0 14px 12px}
.rev{border-top:1px solid var(--bd);padding:10px 0;font-size:14px}
.cd{width:min(420px,100%);text-align:center;font-size:17px;font-weight:600;margin:0 0 18px;display:none}
.sq{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;margin-bottom:4px}
mark{background:#ffe066;color:#000;border-radius:3px;padding:0 1px}
</style></head><body>

</div>
<script>
const D=[{"id": 1, "q": "Яке визначення фізичної особи з наведених нижче є правильним?:", "a": "Людина як учасник цивільних відносин вважається фізичною особою (ст. 24).", "o": ["Людина як учасник цивільних відносин", "Громадянин України, що досяг 18 років", "Дієздатна особа з повною дієздатністю", "Особа, зареєстрована як ФОП"]}, {"id": 2, "q": "Коли фізична особа визнається недієздатною?:", "a": "З моменту набрання законної сили рішенням суду, якщо внаслідок хронічного, стійкого психічного розладу вона не здатна усвідомлювати значення своїх дій та (або) керувати ними (ст. 39, 40).", "o": ["Рішенням суду, що набрало законної сили, за хронічного стійкого психічного розладу", "Рішенням органу опіки та піклування за заявою близьких родичів особи", "Рішенням суду за зловживання алкоголем чи азартними іграми, що ставить сім’ю в скрутне становище", "Висновком лікарсько-консультативної комісії про наявність психічного захворювання"]}, {"id": 3, "q": "Правочин, що задовольняє побутові потреби особи, відповідає її фізичному, духовному чи соціальному розвитку та стосується предмета, який має невисоку вартість, є?:", "a": "Дрібний побутовий правочин (ст. 31 ч. 1 п. 1).", "o": ["Дрібний побутовий правочин", "Правочин на суму до 20 НМДГ", "Правочин у письмовій формі", "Правочин щодо рухомих речей"]}, {"id": 4, "q": "Здатність своїми діями набувати для себе цивільних прав і самостійно їх здійснювати, а також здатність своїми діями створювати для себе цивільні обов’язки, самостійно їх виконувати та нести відповідальність у разі їх невиконання, це?:", "a": "Цивільна дієздатність (ст. 30 ч. 1).", "o": ["Цивільна дієздатність", "Цивільна правоздатність", "Правосуб’єктність", "Деліктоздатність"]}, {"id": 5, "q": "Що може вчиняти самостійно фізична особа, цивільна дієздатність якої обмежена?:", "a": "Лише дрібні побутові правочини. Інші правочини, зокрема щодо розпорядження майном, — за згодою піклувальника (ст. 37 ч. 2–3).", "o": ["Лише дрібні побутові; решта — за згодою піклувальника", "Лише дрібні побутові; решта — за дозволом органу опіки", "Будь-які правочини, якщо їх схвалять батьки пізніше", "Жодних правочинів, усі вчиняє опікун замість особи"]}, {"id": 6, "q": "Чи може фізична особа, яка визнана судом недієздатною, вчиняти самостійно які-небудь правочини?:", "a": "Ні. Недієздатна особа не має права вчиняти жодного правочину; їх від її імені та в її інтересах вчиняє опікун (ст. 41 ч. 2–3).", "o": ["Ні, жодного правочину; вчиняє опікун", "Так, але лише дрібні побутові правочини", "Так, якщо опікун дасть письмову згоду", "Так, але лише безоплатні правочини"]}, {"id": 7, "q": "Правоздатність – це … :", "a": "Правоздатність — це здатність мати цивільні права та обов’язки (ст. 25 ч. 1).", "o": ["Здатність мати цивільні права та обов’язки", "Здатність своїми діями набувати прав та обов’язків", "Здатність нести відповідальність за шкоду", "Здатність бути стороною в суді"]}, {"id": 8, "q": "Дієздатність – це … :", "a": "Дієздатність — це здатність своїми діями набувати для себе цивільних прав і самостійно їх здійснювати, а також створювати для себе цивільні обов’язки, самостійно їх виконувати та нести відповідальність за невиконання (ст. 30 ч. 1).", "o": ["Здатність своїми діями набувати та здійснювати права, створювати обов’язки й нести відповідальність", "Здатність мати цивільні права та обов’язки, встановлені законом, з моменту народження", "Здатність самостійно вчиняти лише дрібні побутові правочини та розпоряджатися заробітком", "Здатність бути учасником цивільного процесу й самостійно захищати свої права в суді"]}, {"id": 9, "q": "Коли виникає цивільна правоздатність фізичної особи?:", "a": "З моменту народження (ст. 25 ч. 2). У випадках, встановлених законом, охороняються інтереси зачатої, але ще не народженої дитини.", "o": ["З моменту народження", "З моменту зачаття", "З досягнення 14 років", "З моменту реєстрації народження"]}, {"id": 10, "q": "Які є види цивільної дієздатності фізичної особи залежно від віку?:", "a": "Часткова (до 14 років, малолітні особи, ст. 31); неповна (від 14 до 18 років, неповнолітні особи, ст. 32); повна (з 18 років, ст. 34). Повна може виникнути й раніше: у разі реєстрації шлюбу (ст. 34 ч. 2) або за рішенням про надання повної дієздатності (ст. 35).", "o": ["Часткова, неповна, повна", "Часткова, обмежена, повна", "Мала, неповна, повна", "Неповна, обмежена, абсолютна"]}, {"id": 11, "q": "Що встановлюється над недієздатною фізичною особою?:", "a": "Опіка (ст. 41 ч. 1; ст. 58).", "o": ["Опіка", "Піклування", "Патронаж", "Нагляд"]}, {"id": 12, "q": "Кому може бути надана повна цивільна дієздатність?:", "a": "Особі, яка досягла 16 років і працює за трудовим договором; неповнолітній особі, яка записана матір’ю або батьком дитини; особі, яка досягла 16 років і бажає займатися підприємницькою діяльністю (ст. 35 ч. 1, 3).", "o": ["З 16 років: працює за трудовим договором; записана матір’ю чи батьком дитини; підприємництво", "З 14 років: працює за трудовим договором; записана матір’ю чи батьком дитини; підприємництво", "З 18 років: за рішенням суду, якщо особа працює за трудовим договором чи займається підприємництвом", "З 16 років: лише при реєстрації шлюбу або за рішенням суду про надання дієздатності"]}, {"id": 13, "q": "Коли фізична особа оголошується померлою?:", "a": "Від дня набрання законної сили рішенням суду про це (ст. 46 ч. 3). Підстави: відсутність відомостей про місце перебування протягом трьох років; шести місяців, якщо особа зникла за обставин, що загрожували смертю; одного місяця після завершення роботи спеціальної комісії у разі надзвичайної ситуації техногенного чи природного характеру. Якщо особа пропала безвісти у зв’язку з воєнними діями — після спливу двох років від дня закінчення воєнних дій (суд може й раніше, але не раніше ніж через шість місяців) (ст. 46 ч. 1–2).", "o": ["Від дня набрання законної сили рішенням суду", "З дня, коли особа востаннє була помічена живою", "З дня подання заяви про оголошення до суду", "З дня державної реєстрації смерті в органі РАЦС"]}, {"id": 14, "q": "Спадкоємці фізичної особи, яка оголошена померлою, не мають права відчужувати протягом _____ року(ів) нерухоме майно, що перейшло до них у зв’язку з відкриттям спадщини (ВСТАВИТИ ПРОПУЩЕНЕ):", "a": "П’яти років (ст. 47 ч. 2). Нотаріус накладає на таке нерухоме майно заборону відчуження.", "o": ["П’яти років", "Трьох років", "Десяти років", "Одного року"]}, {"id": 15, "q": "Фізична особа може бути визнана судом безвісно відсутньою якщо:", "a": "Якщо протягом одного року в місці її постійного проживання немає відомостей про місце її перебування (ст. 43 ч. 1).", "o": ["Один рік", "Три роки", "Шість місяців", "Два роки"]}, {"id": 16, "q": "Опікуном або піклувальником може бути лише:", "a": "Фізична особа з повною цивільною дієздатністю (ст. 63 ч. 2), за її письмовою заявою (ч. 3). Не може бути опікуном чи піклувальником особа, позбавлена батьківських прав (якщо вони не поновлені), або та, чия поведінка та інтереси суперечать інтересам підопічного (ст. 64).", "o": ["Особа з повною цивільною дієздатністю", "Будь-яка дієздатна особа від 16 років", "Лише близький родич підопічного", "Особа, призначена органом опіки без її згоди"]}, {"id": 17, "q": "Опікун не може здійснювати від імені підопічного:", "a": "Дарування від імені підопічного та зобов’язуватися від його імені порукою (ст. 68 ч. 2). Також опікун, його дружина (чоловік) та близькі родичі не можуть укладати з підопічним договорів, крім дарування йому майна або безоплатного користування за договором позички (ст. 68 ч. 1).", "o": ["Дарувати від імені підопічного та давати поруку", "Укладати договори купівлі-продажу майна підопічного", "Приймати спадщину за підопічного", "Відкривати рахунок у банку"]}, {"id": 18, "q": "Помічником може бути:", "a": "Дієздатна фізична особа (ст. 78 ч. 1). Помічника обирає дієздатна особа, яка за станом здоров’я не може самостійно здійснювати права та виконувати обов’язки.", "o": ["Дієздатна фізична особа", "Особа з обмеженою дієздатністю", "Орган опіки та піклування", "Родич до третього ступеня"]}, {"id": 19, "q": "Фізична особа може бути оголошена судом померлою:", "a": "Якщо у місці її постійного проживання немає відомостей про місце перебування протягом трьох років; шести місяців — якщо вона пропала безвісти за обставин, що загрожували смертю або дають підставу припускати загибель від певного нещасного випадку; одного місяця після завершення роботи спеціальної комісії — у разі надзвичайних ситуацій техногенного та природного характеру; двох років від дня закінчення воєнних дій — якщо пропала безвісти у зв’язку з воєнними діями чи збройним конфліктом (суд може й раніше, але не раніше шести місяців) (ст. 46 ч. 1–2).", "o": ["Три роки; шість місяців при загрозі смерті; один місяць після роботи комісії; два роки після воєнних дій", "Один рік; три місяці при загрозі смерті; один місяць після роботи комісії; п’ять років після воєнних дій", "Три роки в усіх випадках, незалежно від обставин зникнення особи та її місця проживання", "П’ять років; один рік при загрозі смерті; шість місяців після роботи комісії; три роки після воєнних дій"]}, {"id": 20, "q": "Які правові наслідки визнання фізичної особи недієздатною?:", "a": "Над особою встановлюється опіка; вона не має права вчиняти жодного правочину; правочини від її імені та в її інтересах вчиняє опікун; відповідальність за шкоду, завдану недієздатною особою, несе опікун (ст. 41; ст. 1184).", "o": ["Опіка; жодних правочинів сама; вчиняє опікун", "Піклування; дрібні побутові самостійно", "Піклування; правочини за згодою піклувальника", "Опіка; дрібні побутові самостійно"]}, {"id": 21, "q": "Правоздатність – це … :", "a": "Правоздатність — це здатність мати цивільні права та обов’язки (ст. 25 ч. 1).", "o": ["Здатність мати цивільні права та обов’язки", "Здатність своїми діями набувати прав та обов’язків", "Здатність нести відповідальність за шкоду", "Здатність бути стороною в суді"]}, {"id": 22, "q": "Дієздатність – це … :", "a": "Дієздатність — це здатність своїми діями набувати для себе цивільних прав і самостійно їх здійснювати, а також створювати для себе цивільні обов’язки, самостійно їх виконувати та нести відповідальність за невиконання (ст. 30 ч. 1).", "o": ["Здатність своїми діями набувати та здійснювати права, створювати обов’язки й нести відповідальність", "Здатність мати цивільні права та обов’язки, встановлені законом, з моменту народження", "Здатність самостійно вчиняти лише дрібні побутові правочини та розпоряджатися заробітком", "Здатність бути учасником цивільного процесу й самостійно захищати свої права в суді"]}, {"id": 23, "q": "Фізична особа, яка не досягла чотирнадцяти років (малолітня особа), має право:", "a": "Малолітня особа має право самостійно вчиняти дрібні побутові правочини та здійснювати особисті немайнові права на результати інтелектуальної, творчої діяльності, що охороняються законом (ст. 31 ч. 1). Інші правочини від її імені вчиняють батьки (усиновлювачі) або опікун. Малолітня особа не несе відповідальності за завдану шкоду (ч. 5).", "o": ["Дрібні побутові правочини й особисті немайнові права на результати творчості", "Дрібні побутові правочини та розпорядження власним заробітком, стипендією чи іншими доходами", "Будь-які правочини щодо майна, але лише за письмовою згодою обох батьків", "Лише правочини, що спрямовані на безоплатне набуття майна, без згоди батьків"]}, {"id": 24, "q": "Які правові наслідки визнання фізичної особи недієздатною?:", "a": "Над особою встановлюється опіка; вона не має права вчиняти жодного правочину; правочини від її імені та в її інтересах вчиняє опікун; відповідальність за шкоду, завдану недієздатною особою, несе опікун (ст. 41; ст. 1184).", "o": ["Опіка; жодних правочинів сама; вчиняє опікун", "Піклування; дрібні побутові самостійно", "Піклування; правочини за згодою піклувальника", "Опіка; дрібні побутові самостійно"]}, {"id": 25, "q": "Які правові наслідки визнання фізичної особи недієздатною?:", "a": "Над особою встановлюється опіка; вона не має права вчиняти жодного правочину; правочини від її імені та в її інтересах вчиняє опікун; відповідальність за шкоду, завдану недієздатною особою, несе опікун (ст. 41; ст. 1184).", "o": ["Опіка; жодних правочинів сама; вчиняє опікун", "Піклування; дрібні побутові самостійно", "Піклування; правочини за згодою піклувальника", "Опіка; дрібні побутові самостійно"]}, {"id": 26, "q": "Піклування припиняється у разі:", "a": "Досягнення фізичною особою повноліття; реєстрація шлюбу неповнолітньої особи; надання неповнолітній особі повної цивільної дієздатності; поновлення цивільної дієздатності особи, дієздатність якої була обмежена (ст. 77).", "o": ["Повноліття, шлюб, надання повної дієздатності, поновлення дієздатності", "Повноліття, зміна місця проживання, смерть піклувальника, звільнення піклувальника", "Повноліття підопічного та його вступ на навчання до закладу вищої освіти", "Припинення навчання підопічного та зміна його місця проживання"]}, {"id": 27, "q": "Піклування припиняється у разі:", "a": "Досягнення фізичною особою повноліття; реєстрація шлюбу неповнолітньої особи; надання неповнолітній особі повної цивільної дієздатності; поновлення цивільної дієздатності особи, дієздатність якої була обмежена (ст. 77).", "o": ["Повноліття, шлюб, надання повної дієздатності, поновлення дієздатності", "Повноліття, зміна місця проживання, смерть піклувальника, звільнення піклувальника", "Повноліття підопічного та його вступ на навчання до закладу вищої освіти", "Припинення навчання підопічного та зміна його місця проживання"]}, {"id": 28, "q": "Які правові наслідки обмеження цивільної дієздатності фізичної особи?:", "a": "Над особою встановлюється піклування; вона може самостійно вчиняти лише дрібні побутові правочини; інші правочини (зокрема щодо розпорядження майном) — за згодою піклувальника; одержання та розпорядження заробітком, пенсією, стипендією здійснює піклувальник (він може письмово дозволити це робити самостійно); особа самостійно відповідає за порушення договору, укладеного за згодою піклувальника, та за завдану шкоду (ст. 37).", "o": ["Піклування; дрібні побутові самостійно; решта за згодою піклувальника", "Опіка; жодних правочинів самостійно; усі вчиняє опікун замість особи", "Піклування; усі правочини лише за попереднім дозволом суду в кожному випадку", "Опіка; дрібні побутові самостійно; решта за згодою органу опіки та піклування"]}, {"id": 29, "q": "Які правові наслідки обмеження цивільної дієздатності фізичної особи?:", "a": "Над особою встановлюється піклування; вона може самостійно вчиняти лише дрібні побутові правочини; інші правочини (зокрема щодо розпорядження майном) — за згодою піклувальника; одержання та розпорядження заробітком, пенсією, стипендією здійснює піклувальник (він може письмово дозволити це робити самостійно); особа самостійно відповідає за порушення договору, укладеного за згодою піклувальника, та за завдану шкоду (ст. 37).", "o": ["Піклування; дрібні побутові самостійно; решта за згодою піклувальника", "Опіка; жодних правочинів самостійно; усі вчиняє опікун замість особи", "Піклування; усі правочини лише за попереднім дозволом суду в кожному випадку", "Опіка; дрібні побутові самостійно; решта за згодою органу опіки та піклування"]}, {"id": 30, "q": "Які правові наслідки обмеження цивільної дієздатності фізичної особи?:", "a": "Над особою встановлюється піклування; вона може самостійно вчиняти лише дрібні побутові правочини; інші правочини (зокрема щодо розпорядження майном) — за згодою піклувальника; одержання та розпорядження заробітком, пенсією, стипендією здійснює піклувальник (він може письмово дозволити це робити самостійно); особа самостійно відповідає за порушення договору, укладеного за згодою піклувальника, та за завдану шкоду (ст. 37).", "o": ["Піклування; дрібні побутові самостійно; решта за згодою піклувальника", "Опіка; жодних правочинів самостійно; усі вчиняє опікун замість особи", "Піклування; усі правочини лише за попереднім дозволом суду в кожному випадку", "Опіка; дрібні побутові самостійно; решта за згодою органу опіки та піклування"]}, {"id": 31, "q": "Фізична особа може бути оголошена судом померлою:", "a": "Якщо у місці її постійного проживання немає відомостей про місце перебування протягом трьох років; шести місяців — якщо вона пропала безвісти за обставин, що загрожували смертю або дають підставу припускати загибель від певного нещасного випадку; одного місяця після завершення роботи спеціальної комісії — у разі надзвичайних ситуацій техногенного та природного характеру; двох років від дня закінчення воєнних дій — якщо пропала безвісти у зв’язку з воєнними діями чи збройним конфліктом (суд може й раніше, але не раніше шести місяців) (ст. 46 ч. 1–2).", "o": ["Три роки; шість місяців при загрозі смерті; один місяць після роботи комісії; два роки після воєнних дій", "Один рік; три місяці при загрозі смерті; один місяць після роботи комісії; п’ять років після воєнних дій", "Три роки в усіх випадках, незалежно від обставин зникнення особи та її місця проживання", "П’ять років; один рік при загрозі смерті; шість місяців після роботи комісії; три роки після воєнних дій"]}, {"id": 32, "q": "Суд встановлює опіку над:", "a": "Суд встановлює опіку над фізичною особою, визнаною недієздатною, та над малолітньою особою, яка позбавлена батьківського піклування (ст. 60 ч. 1, 3). Опікуна призначає суд за поданням органу опіки та піклування.", "o": ["Недієздатна особа; малолітня без батьківського піклування", "Особа з обмеженою дієздатністю; неповнолітня без піклування", "Недієздатна особа; неповнолітня без піклування", "Лише малолітня без батьківського піклування"]}, {"id": 33, "q": "Суд встановлює піклування над:", "a": "Суд встановлює піклування над фізичною особою, цивільна дієздатність якої обмежена, та над неповнолітньою особою, яка позбавлена батьківського піклування (ст. 60 ч. 2, 4).", "o": ["Обмежено дієздатна особа; неповнолітня без батьківського піклування", "Недієздатна особа; малолітня особа без батьківського піклування", "Обмежено дієздатна особа; малолітня особа без батьківського піклування", "Недієздатна особа; неповнолітня особа без батьківського піклування"]}, {"id": 34, "q": "За яких умов суд може обмежити цивільну дієздатність фізичної особи?:", "a": "Якщо вона страждає на психічний розлад, що істотно впливає на її здатність усвідомлювати значення своїх дій та (або) керувати ними; або якщо зловживає спиртними напоями, наркотичними засобами, токсичними речовинами, азартними іграми тощо і тим ставить себе чи свою сім’ю (осіб, яких вона за законом зобов’язана утримувати) у скрутне матеріальне становище (ст. 36 ч. 1–2). Дієздатність є обмеженою з моменту набрання законної сили рішенням суду (ч. 4).", "o": ["Психічний розлад або зловживання алкоголем, наркотиками, азартом, що ставить сім’ю у скрутне становище", "Лише хронічний стійкий психічний розлад, що унеможливлює усвідомлення значення своїх дій особою", "Лише зловживання спиртними напоями, що ставить особу чи її сім’ю у скрутне матеріальне становище", "Будь-яке хронічне захворювання, яке перешкоджає особі самостійно здійснювати свої цивільні права"]}, {"id": 35, "q": "У якому випадку відбувається поновлення цивільної дієздатності фізичної особи, цивільна дієздатність якої була обмежена?:", "a": "Суд поновлює цивільну дієздатність у разі видужання або такого поліпшення психічного стану, що відновило у повному обсязі здатність усвідомлювати значення своїх дій та (або) керувати ними, а також у разі припинення зловживання спиртними напоями, наркотичними засобами, токсичними речовинами, азартними іграми тощо (ст. 38 ч. 1–2). Піклування припиняється на підставі рішення суду (ч. 3).", "o": ["Видужання чи покращення стану або припинення зловживання; рішення суду", "Рішення органу опіки та піклування за заявою піклувальника особи", "Спливу трьох років з моменту набрання рішенням законної сили", "Заява піклувальника до нотаріуса без звернення до суду, у будь-який час"]}, {"id": 36, "q": "Яке поняття розкривається з допомогою визначення «Організація, створена і зареєстрована у встановленому законом порядку»?", "a": "Юридична особа (ст. 80 ч. 1).", "o": ["Юридична особа", "Підприємство", "Господарська організація", "Установа"]}, {"id": 37, "q": "Яке поняття розкривається з допомогою визначення «Організація, створена шляхом об’єднання осіб (учасників), які мають право участі у цій організації»?", "a": "Товариство (ст. 83 ч. 2).", "o": ["Товариство", "Підприємство", "Установа", "Філія"]}, {"id": 38, "q": "Яке поняття розкривається з допомогою визначення «Організація, створена однією або кількома особами (засновниками), які не беруть участі в управлінні нею, шляхом об’єднання (виділення) їхнього майна для досягнення мети, визначеної засновниками, за рахунок цього майна»?", "a": "Установа (ст. 83 ч. 3).", "o": ["Установа", "Товариство", "Підприємство", "Філія"]}, {"id": 39, "q": "До якого виду товариств належать господарські товариства, виробничі кооперативи чи сільськогосподарські кооперативи?", "a": "До підприємницьких товариств (ст. 84 ч. 1). Господарські товариства та виробничі (сільськогосподарські) кооперативи, що діють з метою одержання прибутку, — це підприємницькі товариства.", "o": ["Підприємницькі товариства", "Непідприємницькі товариства", "Установи", "Об’єднання громадян"]}, {"id": 40, "q": "З якого моменту виникає цивільна право-, дієздатність юридичної особи?", "a": "З моменту створення юридичної особи (ст. 91 ч. 4), тобто з дня її державної реєстрації (ст. 87 ч. 4). Припиняється з дня внесення до реєстру запису про припинення.", "o": ["З дня державної реєстрації", "З дня прийняття рішення засновників", "З дня подання документів", "З дня отримання печатки"]}, {"id": 41, "q": "Чи може бути обмежена цивільна правоздатність юридичної особи?", "a": "Так, але лише за рішенням суду (ст. 91 ч. 2).", "o": ["Так, лише за рішенням суду", "Так, за рішенням засновників", "Так, за рішенням органу влади", "Ні, ніколи"]}, {"id": 42, "q": "До якого виду товариств належать акціонерні товариства, товариства з обмеженою та додатковою відповідальністю, повні та командитні товариства?", "a": "До господарських товариств, які є підприємницькими товариствами (ст. 84 ч. 1): повне та командитне товариства, товариства з обмеженою або додатковою відповідальністю, акціонерне товариство.", "o": ["Господарські товариства", "Непідприємницькі товариства", "Установи", "Громадські організації"]}, {"id": 43, "q": "Які із перелічених юридичних осіб належать до юридичних осіб публічного права?", "a": "Юридичні особи публічного права — ті, що створюються розпорядчим актом Президента України, органу державної влади, органу влади АР Крим або органу місцевого самоврядування (ст. 81 ч. 2 абз. 3), наприклад органи державної влади й місцевого самоврядування та державні установи. Юридичні особи приватного права (ТОВ, АТ, кооперативи тощо) створюються на підставі установчих документів (ст. 87). Конкретний варіант відповіді визначайте за цим критерієм.", "o": ["Створені розпорядчим актом органу влади чи місцевого самоврядування", "Створені на підставі установчих документів, підписаних усіма засновниками", "Усі некомерційні організації, що не розподіляють прибуток між учасниками", "Усі юридичні особи, що володіють державним майном на праві власності"]}, {"id": 44, "q": "Які із перелічених юридичних осіб належать юридичних осіб публічного права?", "a": "Юридичні особи публічного права — ті, що створюються розпорядчим актом Президента України, органу державної влади, органу влади АР Крим або органу місцевого самоврядування (ст. 81 ч. 2 абз. 3), наприклад органи державної влади й місцевого самоврядування та державні установи. Юридичні особи приватного права (ТОВ, АТ, кооперативи тощо) створюються на підставі установчих документів (ст. 87). Конкретний варіант відповіді визначайте за цим критерієм.", "o": ["Створені розпорядчим актом органу влади чи місцевого самоврядування", "Створені на підставі установчих документів засновників", "Усі некомерційні організації", "Усі, що мають державне майно"]}, {"id": 45, "q": "Які із перелічених юридичних осіб належать юридичних осіб публічного права?", "a": "Юридичні особи публічного права — ті, що створюються розпорядчим актом Президента України, органу державної влади, органу влади АР Крим або органу місцевого самоврядування (ст. 81 ч. 2 абз. 3), наприклад органи державної влади й місцевого самоврядування та державні установи. Юридичні особи приватного права (ТОВ, АТ, кооперативи тощо) створюються на підставі установчих документів (ст. 87). Конкретний варіант відповіді визначайте за цим критерієм.", "o": ["Створені розпорядчим актом органу влади чи місцевого самоврядування", "Створені на підставі установчих документів засновників", "Усі некомерційні організації", "Усі, що мають державне майно"]}, {"id": 46, "q": "Яке поняття розкривається з допомогою визначення «Відокремлений підрозділ юридичної особи, що розташований поза її місцезнаходженням та здійснює представництво і захист інтересів юридичної особи»?", "a": "Представництво (ст. 95 ч. 2).", "o": ["Представництво", "Філія", "Установа", "Підприємство"]}, {"id": 47, "q": "Яке поняття розкривається з допомогою визначення «Відокремлений підрозділ юридичної особи, що розташований поза її місцезнаходженням та здійснює всі або частину її функцій»?", "a": "Філія (ст. 95 ч. 1).", "o": ["Філія", "Установа", "Об’єднання", "Агентство"]}, {"id": 48, "q": "На підставі чого діють відокремлені структурні підрозділи?", "a": "На підставі положення, затвердженого юридичною особою, яка їх утворила (ст. 95 ч. 3). Вони не є юридичними особами й наділяються майном юридичної особи. Їхні керівники діють на підставі довіреності (ч. 4).", "o": ["Положення, затверджене юридичною особою", "Статут юридичної особи, що їх утворила", "Рішення суду про створення підрозділу", "Установчий акт, затверджений засновниками"]}, {"id": 49, "q": "Зміна організаційно-правової форми юридичної особи є?", "a": "Перетворення юридичної особи (ст. 108 ч. 1) — один зі способів реорганізації. Усе майно, права та обов’язки переходять до нової юридичної особи (ч. 2).", "o": ["Перетворення", "Злиття", "Виділ", "Приєднання"]}, {"id": 50, "q": "Яку відповідальність несе юридична особа – правонаступник, що утворилася внаслідок поділу, за зобов’язаннями юридичної особи, що припинилася, які згідно з розподільчим балансом перейшли до іншої юридичної особи – правонаступника?", "a": "Субсидіарну (ст. 107 ч. 5). Якщо правонаступників, що утворилися внаслідок поділу, більше двох, — вони несуть субсидіарну відповідальність солідарно.", "o": ["Субсидіарну", "Солідарну", "Часткову", "Додаткову до всіх учасників"]}, {"id": 51, "q": "У яку чергу відповідно до ЦК України задовольняються вимоги працівників, пов’язані з трудовими відносинами, вимоги автора про плату за використання результату його інтелектуальної, творчої діяльності?", "a": "У другу чергу (ст. 112 ч. 1 п. 2).", "o": ["У другу чергу", "У першу чергу", "У третю чергу", "У четверту чергу"]}, {"id": 52, "q": "У яку чергу відповідно до ЦК України задовольняються вимоги щодо податків, зборів (обов’язкових платежів)?", "a": "У третю чергу (ст. 112 ч. 1 п. 3).", "o": ["У третю чергу", "У другу чергу", "У четверту чергу", "У першу чергу"]}, {"id": 53, "q": "У яку чергу відповідно до ЦК України задовольняються вимоги кредиторів, забезпечені заставою чи іншим способом?", "a": "У першу чергу (ст. 112 ч. 1 п. 1) — разом із вимогами про відшкодування шкоди, завданої каліцтвом, іншим ушкодженням здоров’я або смертю.", "o": ["У першу чергу", "У другу чергу", "У третю чергу", "У четверту чергу"]}, {"id": 54, "q": "Протягом якого строку повинна бути проведена державна реєстрація?", "a": "⚠️ ЦК строку державної реєстрації не встановлює — ст. 89 ч. 1 відсилає до закону. Якщо питання стосується рішення про припинення, то учасники/суд/орган зобов’язані протягом трьох робочих днів з дати прийняття рішення письмово повідомити орган реєстрації (ст. 105 ч. 1). Для філії іноземної особи таке повідомлення — протягом десяти робочих днів (ст. 105-1 ч. 3). Строки самої реєстрації — у Законі «Про державну реєстрацію юридичних осіб, фізичних осіб — підприємців та громадських формувань», тобто поза ЦК. Звіряйтеся з варіантами відповіді.", "o": ["24 години", "12 годин", "48 годин", "72 години"]}, {"id": 55, "q": "Установчим документом повного товариства є?", "a": "Засновницький договір (ст. 120 ЦК: повне товариство створюється і діє на підставі засновницького договору, який підписують усі учасники).", "o": ["Засновницький договір", "Статут товариства", "Положення про товариство", "Установчий акт"]}, {"id": 56, "q": "Установчим документом товариства з додатковою відповідальністю є?", "a": "Статут. ЦК закріплює загальне правило: установчим документом товариства є статут або засновницький договір (ст. 87 ч. 2); для ТОВ і ТДВ — статут (Закон «Про товариства з обмеженою та додатковою відповідальністю»).", "o": ["Статут", "Меморандум", "Протокол", "Регламент"]}, {"id": 57, "q": "Для якого із видів господарських товариств Кабінет Міністрів України затвердив модельний статут?", "a": "Для товариства з обмеженою відповідальністю (постанова КМУ від 16.11.2011 № 1182 «Про затвердження модельного статуту товариства з обмеженою відповідальністю»). ЦК лише передбачає саму можливість діяти на підставі модельного статуту, затвердженого КМУ (ст. 81 ч. 2, ст. 87 ч. 1).", "o": ["Товариства з обмеженою відповідальністю", "Акціонерні товариства публічного типу", "Командитні товариства та повні товариства", "Виробничі та сільськогосподарські кооперативи"]}, {"id": 58, "q": "Яку відповідальність несуть правонаступники юридичної особи, якщо правонаступниками юридичної особи є декілька юридичних осіб і точно визначити правонаступника щодо конкретних обов’язків юридичної особи, що припинилася, неможливо?", "a": "Солідарну (ст. 107 ч. 6).", "o": ["Солідарну", "Субсидіарну", "Часткову", "Додаткову"]}, {"id": 59, "q": "З якого моменту до комісії з припинення юридичної особи (комісії з реорганізації, ліквідаційної комісії) або ліквідатора переходять повноваження щодо управління справами юридичної особи?", "a": "З моменту призначення (ст. 105 ч. 4).", "o": ["З моменту призначення", "З моменту реєстрації запису", "З моменту завершення ліквідації", "З дня складення балансу"]}, {"id": 60, "q": "Чи може непідприємницьке товариство бути реорганізоване у підприємницьке товариство?", "a": "Ні. Юридична особа, яка не вправі розподіляти прибуток між учасниками, не може бути реорганізована, якщо серед правонаступників є юридична особа, наділена таким правом (ст. 104 ч. 2–3). Виняток — державні установи; крім того, для зворотної ситуації потрібне одностайне рішення загальних зборів.", "o": ["Ні: особа, що не розподіляє прибуток, не реорганізується в особу, що розподіляє", "Так, завжди, якщо таке рішення прийняли загальні збори учасників більшістю голосів", "Так, але лише за попередньою згодою держави в особі центрального органу влади", "Так, якщо про це прийме рішення суд за позовом кредиторів товариства"]}, {"id": 61, "q": "Строк заявлення кредиторами своїх вимог до юридичної особи, що припиняється, не може становити?", "a": "Не може становити менше двох і більше шести місяців з дня оприлюднення повідомлення про рішення щодо припинення юридичної особи (ст. 105 ч. 5).", "o": ["Не менше двох і не більше шести місяців", "Не менше одного і не більше трьох місяців", "Не менше трьох і не більше дванадцяти місяців", "Рівно два місяці"]}, {"id": 62, "q": "Яке положення розкриває зміст цивільної правоздатності юридичної особи відповідно до ЦК України?", "a": "Юридична особа здатна мати такі ж цивільні права та обов’язки (цивільну правоздатність), як і фізична особа, крім тих, які за своєю природою можуть належати лише людині (ст. 91 ч. 1).", "o": ["Такі ж права та обов’язки, як у фізичної, крім тих, що за природою належать людині", "Лише майнові права та обов’язки, що прямо передбачені її установчими документами", "Права та обов’язки, як у фізичної особи, без будь-яких винятків і обмежень", "Лише ті права, що визначені законом для відповідного виду юридичних осіб"]}, {"id": 63, "q": "Які організаційно-правові форми юридичних осіб передбачено у ЦК України?", "a": "Юридичні особи можуть створюватися у формі товариств, установ та в інших формах, встановлених законом (ст. 83 ч. 1). Товариства поділяються на підприємницькі та непідприємницькі.", "o": ["Товариства, установи та інші форми, встановлені законом", "Товариства, підприємства та інші форми, встановлені законом", "Підприємства, установи, організації та об’єднання громадян", "Товариства, філії та представництва, об’єднання без статусу особи"]}, {"id": 64, "q": "Для яких юридичних осіб засновницький договір є установчим документом?", "a": "Засновницький договір є установчим документом повного та командитного товариств. Загальне правило ст. 87 ч. 2: установчим документом товариства є статут або засновницький договір між учасниками, якщо інше не встановлено законом (товариство, створене однією особою, діє на підставі статуту).", "o": ["Для повного та командитного товариств", "Для ТОВ та акціонерних товариств", "Для виробничих кооперативів та установ", "Для всіх державних підприємств і установ"]}, {"id": 65, "q": "Виберіть з переліку установчі документи юридичних осіб?", "a": "Статут і засновницький договір — для товариств (ст. 87 ч. 2); установчий акт — для установ (ст. 87 ч. 3); модельний статут, який після прийняття учасниками стає установчим документом (ст. 87 ч. 1). Положення про філію чи представництво не є установчим документом юридичної особи.", "o": ["Статут і засновницький договір (товариство); установчий акт (установа)", "Положення та довіреність (філія, представництво); установчий акт (установа)", "Лише статут, затверджений загальними зборами, для всіх видів юридичних осіб", "Рішення загальних зборів та протокол про створення юридичної особи (товариство)"]}, {"id": 66, "q": "Хто може прийняти рішення про ліквідацію юридичної особи?", "a": "Учасники юридичної особи, суб’єкт управління державної чи комунальної власності або орган юридичної особи, уповноважений установчими документами (ст. 110 ч. 1 п. 1); також суд — через допущені при створенні порушення, які не можна усунути, чи в інших випадках, встановлених законом (п. 2–3).", "o": ["Учасники, суб’єкт управління майном або орган, уповноважений установчими документами", "Лише державний реєстратор за заявою засновників або на підставі рішення суду", "Лише ліквідаційна комісія, яку призначає суд за позовом кредиторів юридичної особи", "Тільки суд, за позовом учасника або органу виконавчої влади про припинення особи"]}, {"id": 67, "q": "До непідприємницьких товариств належать?", "a": "Непідприємницькі товариства: сільськогосподарські кооперативи та кооперативні об’єднання, що діють без мети прибутку, інші кооперативи (крім виробничих), об’єднання громадян, державні та комунальні некомерційні товариства тощо (ст. 85, 86).", "o": ["Об’єднання громадян, обслуговуючі кооперативи, державні й комунальні некомерційні товариства", "Товариства з обмеженою відповідальністю, акціонерні товариства та командитні товариства", "Виробничі кооперативи, повні товариства та сільськогосподарські кооперативні об’єднання", "Командитні та повні товариства, товариства з додатковою відповідальністю і виробничі кооперативи"]}, {"id": 68, "q": "Якою має стати організація, щоб бути юридичною особою?:", "a": "Створеною і зареєстрованою у встановленому законом порядку (ст. 80 ч. 1).", "o": ["Створена і зареєстрована у встановленому законом порядку", "Створена за рішенням засновників та має власну печатку", "Зареєстрована в податковому органі як платник податків", "Така, що має статут і розрахунковий рахунок у банку"]}, {"id": 69, "q": "Шляхом об’єднання кого/чого може бути створена юридична особа?:", "a": "Осіб та (або) майна (ст. 81 ч. 1).", "o": ["Осіб та (або) майна", "Лише осіб", "Лише майна", "Осіб і державного майна"]}, {"id": 70, "q": "На які види поділяються юридичні особи залежно від порядку їх створення?:", "a": "На юридичних осіб приватного права та юридичних осіб публічного права (ст. 81 ч. 2).", "o": ["Приватного та публічного права", "Комерційні та некомерційні", "Державні та комунальні", "Основні та допоміжні"]}, {"id": 71, "q": "На які види поділяються товариства згідно із Цивільним кодексом України?:", "a": "На підприємницькі та непідприємницькі (ст. 83 ч. 2).", "o": ["Підприємницькі та непідприємницькі", "Господарські та негосподарські", "Комерційні та неприбуткові", "Корпоративні та унітарні"]}, {"id": 72, "q": "У яких організаційно-правових формах можуть бути створені підприємницькі товариства?:", "a": "Лише як господарські товариства (повне, командитне, ТОВ, ТДВ, акціонерне) або як виробничі чи сільськогосподарські кооперативи, сільськогосподарські кооперативні об’єднання, що діють з метою одержання прибутку (ст. 84 ч. 1).", "o": ["Господарські товариства та виробничі й сільськогосподарські кооперативи", "Господарські товариства, виробничі кооперативи та громадські об’єднання за законом", "Лише господарські товариства та установи, створені засновниками майна", "Кооперативи, об’єднання громадян та благодійні організації без мети прибутку"]}, {"id": 73, "q": "Яку інформацію має містити найменування юридичної особи?:", "a": "Інформацію про організаційно-правову форму та назву (ст. 90 ч. 1). Найменування установи має містити інформацію про характер її діяльності.", "o": ["Організаційно-правову форму та назву", "Назву та місцезнаходження особи", "Прізвище засновника та назву", "Мету діяльності та її назву"]}, {"id": 74, "q": "Як зобов’язані діяти в інтересах юридичної особи орган або особа, яка відповідно до установчих документів юридичної особи чи закону виступає від її імені?:", "a": "Добросовісно і розумно, у межах повноважень, наданих статутом і законодавством, у спосіб, який сприятиме досягненню мети діяльності юридичної особи, уникаючи конфлікту інтересів (ст. 92 ч. 3).", "o": ["Добросовісно і розумно, в межах повноважень, уникаючи конфлікту інтересів", "В інтересах засновників і учасників, із застосуванням будь-яких доступних засобів", "Лише в межах повноважень, за вказівками учасників та у їхніх приватних інтересах", "Розумно та у межах повноважень, у першу чергу в особистих інтересах керівника"]}, {"id": 75, "q": "Як відповідно до Цивільного кодексу України іменуються відокремлені структурні підрозділи юридичної особи?:", "a": "Філії та представництва (ст. 95).", "o": ["Філії та представництва", "Структурні підрозділи", "Дочірні підприємства", "Відділення"]}, {"id": 76, "q": "У яких випадках учасники (засновники) відповідають за зобов’язаннями створеної ними юридичної особи?:", "a": "У випадках, встановлених установчими документами та законом (ст. 96 ч. 3). Особи, які створюють юридичну особу, також несуть солідарну відповідальність за зобов’язаннями, що виникли до її державної реєстрації (ч. 4).", "o": ["У випадках, встановлених установчими документами та законом", "Завжди, солідарно та усім своїм майном без жодних обмежень", "Ніколи, оскільки юридична особа сама відповідає за свої борги", "Лише за рішенням суду, ухваленим за позовом кредитора особи"]}, {"id": 77, "q": "Яким особам за змістом Цивільного кодексу України належать корпоративні права щодо юридичних осіб?:", "a": "Учасникам (засновникам, акціонерам, пайовикам) юридичних осіб (ст. 96-1).", "o": ["Учасникам (засновникам, акціонерам, пайовикам)", "Лише акціонерам акціонерних товариств і їх кредиторам", "Лише засновникам установи та керівнику установи", "Керівнику та членам виконавчого органу юридичної особи"]}, {"id": 78, "q": "Якщо інше не встановлено законом, які органи вважаються органами управління товариством?:", "a": "Загальні збори учасників і виконавчий орган, якщо інше не встановлено законом або установчими документами (ст. 97 ч. 2). Єдиний учасник — фізична особа може управляти товариством безпосередньо (ч. 1).", "o": ["Загальні збори учасників і виконавчий орган", "Наглядова рада та ревізійна комісія товариства", "Директор та головний бухгалтер товариства", "Лише загальні збори, як єдиний орган управління"]}, {"id": 79, "q": "Якими способами припиняється юридична особа в результаті реорганізації?:", "a": "Злиття, приєднання, поділ, перетворення (ст. 104 ч. 1). Виділ (ст. 109) не є припиненням юридичної особи.", "o": ["Злиття, приєднання, поділ, перетворення", "Злиття, приєднання, поділ, виділ", "Злиття, ліквідація, поділ, перетворення", "Приєднання, виділ, перетворення"]}, {"id": 80, "q": "Як називається комісія з припинення юридичної особи згідно із ст. 105 Цивільного кодексу України?:", "a": "Комісія з припинення юридичної особи (комісія з реорганізації, ліквідаційна комісія) (ст. 105 ч. 3).", "o": ["Комісія з припинення (комісія з реорганізації, ліквідаційна комісія)", "Комісія з перевірки (ревізійна комісія, наглядова рада товариства)", "Арбітражна комісія (третейський суд, примирна комісія сторін)", "Комісія з управління майном (інвентаризаційна, оціночна комісія)"]}, {"id": 81, "q": "Які вимоги кредиторів задовольняються у першу чергу у разі ліквідації платоспроможної юридичної особи?:", "a": "Вимоги щодо відшкодування шкоди, завданої каліцтвом, іншим ушкодженням здоров’я або смертю, та вимоги кредиторів, забезпечені заставою чи іншим способом (ст. 112 ч. 1 п. 1).", "o": ["Шкода здоров’ю та життю; вимоги, забезпечені заставою", "Вимоги працівників щодо оплати праці та виплат авторам", "Вимоги щодо сплати податків, зборів і обов’язкових платежів", "Вимоги інших кредиторів, що не забезпечені заставою майна"]}, {"id": 82, "q": "На які типи поділяються акціонерні товариства відповідно до Закону України «Про акціонерні товариства»?:", "a": "Публічні та приватні акціонерні товариства (Закон «Про акціонерні товариства», ст. 3). ЦК такого поділу вже не містить: статті про акціонерне товариство виключено Законом № 2275-VIII від 06.02.2018.", "o": ["Публічні та приватні акціонерні товариства", "Відкриті та закриті акціонерні товариства", "Публічні та закриті акціонерні товариства", "Прості та привілейовані акціонерні товариства"]}, {"id": 83, "q": "Які обʼєкти цивільних прав НЕ належать до немайнових благ?", "a": "До немайнових благ належать блага, тісно пов’язані з особою: життя, здоров’я, честь, гідність, право на сім’ю тощо. НЕ належать до них майнові об’єкти: речі, гроші, цінні папери, майнові права.", "o": ["Речі, гроші, цінні папери, майнові права", "Життя і здоров’я, честь і гідність особи", "Ділова репутація та право на сім’ю", "Особисте життя, ім’я та авторство"]}, {"id": 84, "q": "Яка група цінних паперів НЕ передбачена Цивільним кодексом України?", "a": "ЦК передбачає чотири групи цінних паперів: пайові, боргові, деривативні (похідні) та товаророзпорядчі. П’ята група — іпотечні цінні папери — передбачена не ЦК, а Законом «Про ринки капіталу та організовані товарні ринки».", "o": ["Іпотечні", "Пайові", "Боргові", "Товаророзпорядчі"]}, {"id": 85, "q": "Оберіть цінні папери, які НЕ належать до групи пайових", "a": "До пайових належать: акції (у т. ч. корпоративних інвестиційних фондів), сертифікати фонду операцій з нерухомістю, інвестиційні сертифікати. НЕ пайові: облігації, векселі, ощадні й депозитні сертифікати, казначейські зобов’язання (боргові); опціонні сертифікати, фондові варанти, кредитні ноти, депозитарні розписки (деривативні); коносамент, складські свідоцтва, товарні аграрні ноти (товаророзпорядчі).", "o": ["Опціонні сертифікати та фондові варанти", "Акції акціонерного товариства", "Інвестиційні сертифікати", "Сертифікати фонду операцій з нерухомістю"]}, {"id": 86, "q": "Оберіть цінні папери, які НЕ належать до групи боргових", "a": "До боргових належать: корпоративні й державні облігації, облігації місцевих позик, облігації міжнародних фінансових організацій, казначейські зобов’язання, депозитні та ощадні сертифікати, векселі, фінансові аграрні ноти. НЕ боргові: акції, сертифікати ФОН, інвестиційні сертифікати (пайові); опціонні сертифікати, фондові варанти, кредитні ноти, депозитарні розписки (деривативні); коносамент, складські свідоцтва (товаророзпорядчі).", "o": ["Фондові варанти та кредитні ноти", "Депозитні та ощадні сертифікати", "Казначейські зобов’язання України", "Векселі та облігації місцевих позик"]}, {"id": 87, "q": "Оберіть обʼєкт, який НЕ належить до валютних цінностей", "a": "Валютні цінності (Закон «Про валюту і валютні операції» 2018 р.): національна валюта, іноземна валюта, дорогоцінні (банківські) метали. НЕ належать до них речі та майно, що не є валютою чи банківськими металами, наприклад нерухомість, цінні папери, транспортні засоби.", "o": ["Нерухоме майно", "Національна валюта", "Іноземна валюта", "Банківські метали"]}, {"id": 88, "q": "Оберіть обʼєкт, який є річчю з індивідуальними ознаками", "a": "Індивідуально визначена річ має лише їй властиві ознаки, що виокремлюють її з-поміж однорідних: телефон, квартира, земельна ділянка. Родово визначені речі мають ознаки всього роду й вимірюються числом, вагою, мірою (зерно, цегла).", "o": ["Земельна ділянка", "Тонна пшениці", "Сто літрів бензину", "Партія однакових цеглин"]}, {"id": 89, "q": "Який поділ речей НЕ передбачено у Цивільному кодексі України?", "a": "Передбачено поділ на: рухомі й нерухомі; подільні й неподільні; індивідуально й родово визначені; споживні й неспоживні; прості й складні; головні речі й приналежності. НЕ передбачено будь-який інший поділ, наприклад на матеріальні й нематеріальні речі чи основні й оборотні.", "o": ["Матеріальні й нематеріальні", "Подільні й неподільні речі", "Споживні й неспоживні речі", "Прості й складні речі"]}, {"id": 90, "q": "Які речі НЕ належать до нерухомих?", "a": "Нерухомі — речі, переміщення яких неможливе без пошкодження (знецінення) та зміни призначення: земельні ділянки, квартири, будинки. НЕ нерухомі — рухомі речі, які можна переміщувати без пошкодження: телефон, автомобіль, меблі. Правовий режим нерухомості поширюється на повітряні й морські судна та космічні об’єкти, хоча вони за природою рухомі.", "o": ["Автомобіль", "Земельна ділянка", "Квартира", "Житловий будинок"]}, {"id": 91, "q": "Яким законом регулюється здійснення державної реєстрації прав на нерухомість?", "a": "Законом «Про державну реєстрацію речових прав на нерухоме майно та їх обтяжень» (ст. 182 ЦК відсилає до закону). Також виникнення, перехід і припинення прав на нерухомість підлягають державній реєстрації (ст. 182).", "o": ["Закон «Про державну реєстрацію речових прав на нерухоме майно та їх обтяжень»", "Закон «Про іпотеку» та Закон «Про нотаріат» у їх чинній редакції", "Земельний кодекс України та Закон «Про землеустрій»", "Закон «Про оцінку майна, майнових прав та професійну оціночну діяльність»"]}, {"id": 92, "q": "Правовий режим яких обʼєктів цивільних прав регламентовано у Законі України «Про гарантування прав на обʼєкти нерухомого майна, які будуть споруджені в майбутньому»?", "a": "Закон регулює правовий режим об’єктів нерухомого майна, які будуть споруджені в майбутньому (майбутніх об’єктів нерухомості), та права на них. ⚠️ Це закон поза ЦК, звіряйте з його текстом.", "o": ["Майбутніх об’єктів нерухомості, які будуть споруджені", "Об’єктів, уже введених в експлуатацію", "Земельних ділянок сільськогосподарського призначення", "Рухомих речей, права на які підлягають реєстрації"]}, {"id": 93, "q": "Правовий режим яких обʼєктів цивільних прав регламентовано у Законі України «Про гарантування прав на обʼєкти нерухомого майна, які будуть споруджені в майбутньому»?", "a": "Закон регулює правовий режим об’єктів нерухомого майна, які будуть споруджені в майбутньому (майбутніх об’єктів нерухомості), та права на них. ⚠️ Це закон поза ЦК, звіряйте з його текстом.", "o": ["Майбутніх об’єктів нерухомості, які будуть споруджені", "Об’єктів, уже введених в експлуатацію", "Земельних ділянок сільськогосподарського призначення", "Рухомих речей, права на які підлягають реєстрації"]}, {"id": 94, "q": "Яким актом передбачено перелік майна, яке є обмеженим в цивільному обороті або вилученим з нього?", "a": "Постановою Верховної Ради України від 17.06.1992 «Про право власності на окремі види майна». Вона містить перелік майна, що не може перебувати у власності громадян, громадських об’єднань, міжнародних організацій та юридичних осіб інших держав (вилучене з обороту), і порядок набуття громадянами права власності на окремі види майна (обмежене в обороті).", "o": ["Постановою Верховної Ради України від 17.06.1992", "Постановою Кабінету Міністрів України", "Указом Президента України", "Законом «Про ринки капіталу та організовані товарні ринки»"]}, {"id": 95, "q": "Оберіть майно, яке є вилученим з цивільного обороту", "a": "Вилучені з цивільного обороту об’єкти можуть перебувати лише у власності держави або Українського народу: надра, природні заповідники, біосфери, землі оборони та інші за переліком постанови ВРУ від 17.06.1992. Мисливська зброя — обмежена в обороті, не вилучена.", "o": ["Надра (корисні копалини)", "Мисливська вогнепальна зброя", "Житловий будинок громадянина", "Транспортний засіб у власності"]}, {"id": 96, "q": "Оберіть майно, яке є обмеженим в цивільному обороті", "a": "Обмежені в обороті — об’єкти, право власності на які набувається лише за певних умов (дозволи, ліцензії) за порядком, затвердженим постановою ВРУ від 17.06.1992: наприклад мисливська вогнепальна зброя, наркотичні засоби за ліцензією.", "o": ["Мисливська вогнепальна зброя", "Надра та їх корисні копалини", "Землі оборони та біосфери", "Природні заповідники держави"]}, {"id": 97, "q": "Оберіть твердження, яке НЕправильно характеризує тварин як обʼєкт цивільних прав", "a": "Правильно: тварини не є речами, але правовий режим речі на них поширюється, право власності на тварину набувається відповідно до ст. 12 Закону про захист тварин від жорстокого поводження. НЕправильно: що тварина є звичайною річчю, до якої правовий режим речей застосовується без жодних особливостей.", "o": ["Тварина є звичайною річчю, до якої режим речей застосовується без особливостей", "Тварина не є річчю, але на неї поширюється правовий режим речі", "Право власності на тварину набувається за законом про захист тварин від жорстокого поводження", "Жорстоке поводження з тваринами не допускається"]}, {"id": 98, "q": "Оберіть обʼєкт із переліку, який є складною річчю.", "a": "Складна річ — кілька речей, що утворюють єдине ціле й використовуються як єдиний об’єкт; кожна складова може використовуватися як проста: підприємство як єдиний майновий комплекс. Прості речі — цегла, аркуш паперу.", "o": ["Підприємство як єдиний майновий комплекс", "Партія цегли на будівельному складі", "Аркуш паперу формату А4 для друку", "Склянка зі скла для напоїв"]}, {"id": 99, "q": "Який закон регулює правовідносини, що виникають щодо цінних паперів?", "a": "Закон «Про ринки капіталу та організовані товарні ринки» (від 19.06.2020 № 738-IX). Ст. 195 ЦК відсилає до закону щодо груп, видів цінних паперів та порядку їх обігу.", "o": ["Закон «Про ринки капіталу та організовані товарні ринки»", "Закон «Про цінні папери та фондовий ринок» в чинній редакції", "Закон «Про акціонерні товариства» та Закон «Про банки»", "Закон «Про обіг векселів в Україні» у чинній редакції"]}, {"id": 100, "q": "Який закон регулює правовідносини, що виникають щодо цифрового контенту?", "a": "Закон «Про цифровий контент та цифрові послуги» (прийнятий разом зі змінами до ЦК щодо цифрових речей — ст. 177, 179-1 ЦК).", "o": ["Закон «Про цифровий контент та цифрові послуги»", "Закон «Про віртуальні активи та криптовалюти»", "Закон «Про електронні комунікації та цифровий зв’язок»", "Закон «Про захист персональних даних у цифровій формі»"]}, {"id": 101, "q": "Оберіть варіант відповіді, де НЕправильно прокласифіковано цінні папери", "a": "Правильна класифікація: пайові — акції, сертифікати ФОН, інвестиційні сертифікати; боргові — облігації, казначейські зобов’язання, депозитні й ощадні сертифікати, векселі, фінансові аграрні ноти; деривативні — опціонні сертифікати, фондові варанти, кредитні ноти, депозитарні розписки, державні деривативи; товаророзпорядчі — коносамент, складські свідоцтва, товарні аграрні ноти. Неправильно — коли цінний папір віднесено не до своєї групи.", "o": ["Вексель — пайовий цінний папір", "Акція — пайовий цінний папір", "Облігація місцевих позик — боргові цінні папери", "Коносамент — товаророзпорядчі цінні папери"]}, {"id": 102, "q": "На які обʼєкти законом НЕ може поширюватися правовий режим нерухомої речі?", "a": "Правовий режим нерухомої речі поширюється на повітряні й морські судна, судна внутрішнього плавання, космічні об’єкти. НЕ поширюється на звичайні рухомі речі, права на які не підлягають державній реєстрації (побутова техніка, меблі, гроші).", "o": ["Побутова техніка та меблі", "Морські та повітряні судна", "Судна внутрішнього плавання", "Космічні об’єкти (супутники)"]}, {"id": 103, "q": "У яких з наведених варіантів відповідей зазначені правильні положення про цифрову річ? :", "a": "Цифрова річ — благо, що створюється та існує виключно у цифровому середовищі та має майнову цінність (ст. 179-1 ч. 1). Цифровою річчю є віртуальні активи, цифровий контент та інші блага (ч. 2). Особливості режиму визначає закон; до цифрових речей застосовуються положення ЦК про речі, якщо інше не встановлено ЦК, законом або не випливає із сутності цифрової речі (ч. 3). Об’єкти цивільних прав можуть існувати в матеріальному світі та/або цифровому середовищі (ст. 177 ч. 2).", "o": ["Благо, що існує виключно в цифровому середовищі й має майнову цінність", "Будь-який електронний документ, створений у цифровому форматі файлу", "Річ, оцифрована з матеріального світу та збережена на електронному носії", "Цифровий підпис або електронна печатка, що посвідчують особу власника"]}, {"id": 104, "q": "Що належить до цифрового контенту? :", "a": "Цифровий контент — дані, що створюються й подаються в цифровій формі: комп’ютерні програми, застосунки, відео-, аудіо- та музичні файли, цифрові ігри, цифрові книги. Криптовалюта — це віртуальний актив, а не цифровий контент.", "o": ["Комп’ютерні програми, застосунки, відео- й аудіофайли, цифрові ігри, цифрові книги", "Криптовалюта та інші віртуальні активи, що існують у цифровому середовищі", "Електронні гроші та безготівкові кошти на рахунках у платіжних системах", "Банківські метали та інша валюта, облікована в електронній формі у банках"]}, {"id": 105, "q": "Які в Україні можуть бути групи цінних паперів в цивільному обороті ? :", "a": "П’ять груп: пайові, боргові, деривативні (похідні), товаророзпорядчі (ЦК, ст. 195) та іпотечні (Закон «Про ринки капіталу та організовані товарні ринки», ст. 8 ч. 7).", "o": ["Пайові, боргові, деривативні, товаророзпорядчі та іпотечні", "Пайові, боргові, деривативні та товаророзпорядчі, без іпотечних", "Пайові, боргові та товаророзпорядчі, за винятком похідних і іпотечних", "Емісійні та неемісійні, іменні, ордерні та на пред’явника"]}, {"id": 106, "q": "Які в Україні можуть бути групи цінних паперів в цивільному обороті ? :", "a": "П’ять груп: пайові, боргові, деривативні (похідні), товаророзпорядчі (ЦК, ст. 195) та іпотечні (Закон «Про ринки капіталу та організовані товарні ринки», ст. 8 ч. 7).", "o": ["Пайові, боргові, деривативні, товаророзпорядчі та іпотечні", "Пайові, боргові, деривативні та товаророзпорядчі, без іпотечних", "Пайові, боргові та товаророзпорядчі, за винятком похідних і іпотечних", "Емісійні та неемісійні, іменні, ордерні та на пред’явника"]}, {"id": 107, "q": "Кому належать права на цінний папір та права за цінним папером, що існують у паперовій формі?:", "a": "Залежить від форми випуску (Закон «Про ринки капіталу…», ст. 8): на пред’явника — особі, яка фактично тримає папір; іменний — особі, зазначеній у папері; ордерний — особі, зазначеній у папері, або тій, кого вона уповноважила передавальним написом (індосаментом). ⚠️ Точне формулювання ч. 4 ст. 8 звіряйте із законом.", "o": ["Пред’явнику; зазначеній в іменному папері особі; в ордерному — зазначеній особі або її уповноваженому", "Лише емітенту, який випустив цінний папір, незалежно від форми його випуску та держателя", "Депозитарію, що веде облік таких паперів, а власнику — лише після реєстрації", "Лише першому власнику, зазначеному у цінному папері, без права передання іншим"]}, {"id": 108, "q": "Кому належать права на цінний папір та права за цінним папером, що існують у паперовій формі?:", "a": "Залежить від форми випуску (Закон «Про ринки капіталу…», ст. 8): на пред’явника — особі, яка фактично тримає папір; іменний — особі, зазначеній у папері; ордерний — особі, зазначеній у папері, або тій, кого вона уповноважила передавальним написом (індосаментом). ⚠️ Точне формулювання ч. 4 ст. 8 звіряйте із законом.", "o": ["Пред’явнику; зазначеній в іменному папері особі; в ордерному — зазначеній особі або її уповноваженому", "Лише емітенту, який випустив цінний папір, незалежно від форми його випуску та держателя", "Депозитарію, що веде облік таких паперів, а власнику — лише після реєстрації", "Лише першому власнику, зазначеному у цінному папері, без права передання іншим"]}, {"id": 109, "q": "На які об’єкти може бути поширений законом режим нерухомої речі ?:", "a": "На повітряні та морські судна, судна внутрішнього плавання, космічні об’єкти та інші речі, права на які підлягають державній реєстрації (ст. 181 ч. 2).", "o": ["Повітряні, морські судна, судна внутрішнього плавання, космічні об’єкти", "Автомобілі, залізничні вагони та інші транспортні засоби, що реєструються", "Будь-які великі машини, верстати та устаткування промислових підприємств", "Лише літаки та вертольоти, що належать державним авіакомпаніям"]}, {"id": 110, "q": "Які види майна НЕ можуть перебувати у власності громадян, громадських об’єднань, міжнародних організацій та юридичних осіб інших держав на території України?:", "a": "Надра, природні заповідники, біосфери, землі оборони та інші об’єкти за переліком постанови ВРУ від 17.06.1992 (вилучені з обороту: належать лише державі чи Українському народу).", "o": ["Надра, природні заповідники, землі оборони", "Житлові будинки та квартири громадян", "Підприємства як майнові комплекси", "Транспортні засоби й мисливська зброя"]}, {"id": 111, "q": "Що із наведеного становить національну валюту (гривню) ?:", "a": "Національна валюта — гривня: готівка (банкноти й монети) та безготівкові кошти.", "o": ["Банкноти й монети, а також безготівкові кошти", "Лише банкноти й монети, без безготівкових коштів", "Банкноти, монети та банківські метали в зливках", "Іноземна валюта та банкноти інших держав світу"]}, {"id": 112, "q": "Що належить до нерухомих речей ?:", "a": "Земельні ділянки, а також об’єкти, розташовані на них, переміщення яких неможливе без їх знецінення та зміни призначення: будівлі, споруди, квартири, об’єкти незавершеного будівництва (ст. 181 ч. 1). Режим нерухомості закон може поширити на судна, літаки тощо (ч. 2).", "o": ["Земельні ділянки та об’єкти на них, переміщення яких неможливе без знецінення", "Будь-які будівлі, зокрема тимчасові, що можна перемістити без шкоди", "Транспортні засоби, судна та літаки, що підлягають реєстрації", "Лише житлові квартири та будинки, у яких постійно проживають особи"]}, {"id": 113, "q": "На які види залежно від особливостей правового режиму поділяються речі?:", "a": "⚠️ Залежно від особливостей правового режиму — рухомі й нерухомі речі (різний режим: нотаріальне посвідчення правочинів, державна реєстрація прав, особливі способи набуття). Окремо об’єкти за оборотоздатністю: вільні, обмежені в обороті, вилучені з обороту. Звіряйте з варіантами.", "o": ["Рухомі та нерухомі", "Оборотоздатні та вилучені з обороту", "Подільні та неподільні", "Прості та складні"]}, {"id": 114, "q": "Що із нижченаведеного належить до цінних паперів?:", "a": "До цінних паперів належать: акції, облігації, інвестиційні сертифікати, векселі, ощадні (депозитні) сертифікати, деривативи, коносамент, складські свідоцтва, аграрні ноти (Закон «Про ринки капіталу…», Закон «Про аграрні ноти»). Не є цінними паперами: гроші, чеки та інші платіжні документи.", "o": ["Акція, облігація, вексель, інвестиційний сертифікат", "Чек, акредитив, платіжна картка та ощадна книжка", "Гроші, банківські метали та платіжні доручення", "Ощадна книжка, чек, квитанція та касовий ордер"]}, {"id": 115, "q": "За формою випуску емісійні цінні папери можуть бути виключно:", "a": "⚠️ За матеріалами викладача емісійні цінні папери існують лише в електронній (бездокументарній) формі. Закон «Про ринки капіталу…» (ст. 8) розрізняє форми існування (електронна, паперова) і форми випуску (на пред’явника, іменні, ордерні): звіряйте варіанти зі ст. 8.", "o": ["Електронними (бездокументарними)", "Паперовими (документарними)", "Ордерними та іменними", "Змішаними (паперово-електронними)"]}, {"id": 116, "q": "В яких формах можуть існувати цінні папери?:", "a": "В електронній (записи на рахунках у депозитарних установах) та паперовій (бланки з реквізитами) формах; раніше їх називали бездокументарною й документарною.", "o": ["В електронній та паперовій", "Лише в паперовій", "У паперовій та змішаній", "На пред’явника, іменній та ордерній"]}, {"id": 117, "q": "Які є види векселів?:", "a": "Прості та переказні (тратта) (Женевська конвенція про уніфікований закон про переказні векселі й прості векселі, Закон «Про обіг векселів в Україні»).", "o": ["Прості та переказні", "Іменні та ордерні", "Емісійні та неемісійні", "Короткострокові та довгострокові"]}, {"id": 118, "q": "Правочин – це:", "a": "Правочин — дія особи, спрямована на набуття, зміну або припинення цивільних прав та обов’язків (ст. 202 ч. 1).", "o": ["Дія особи, спрямована на набуття, зміну або припинення прав та обов’язків", "Погоджена дія двох або більше сторін, спрямована на настання правових наслідків", "Будь-яка юридично значима дія особи, з якою пов’язане настання наслідків", "Дія особи, що породжує для неї лише обов’язки перед іншими особами"]}, {"id": 119, "q": "Що з переліченого належить до передбачених законом загальних вимог, які необхідні для чинності правочину?", "a": "Загальні вимоги чинності правочину (ст. 203): 1) зміст не суперечить ЦК, іншим актам законодавства та моральним засадам суспільства; 2) особа має необхідний обсяг цивільної дієздатності; 3) волевиявлення вільне та відповідає внутрішній волі; 4) правочин відповідає вимогам щодо форми; 5) спрямований на реальне настання правових наслідків; 6) правочин, що вчиняється батьками (усиновлювачами), не може суперечити правам та інтересам їхніх малолітніх, неповнолітніх чи непрацездатних дітей.", "o": ["Законний зміст; дієздатність; вільна воля; форма; реальні наслідки; інтереси дітей", "Законний зміст; форма; нотаріальне посвідчення; державна реєстрація; оплатність", "Дієздатність; письмова форма; реєстрація; наявність свідків; сплата мита", "Законність; оплатність; письмова форма; присутність нотаріуса; наявність печатки"]}, {"id": 120, "q": "Які правочини між фізичними особами, за загальним правилом, повинні вчинятися у письмовій формі?:", "a": "У письмовій формі вчиняються правочини фізичних осіб між собою на суму, що перевищує у двадцять і більше разів розмір неоподатковуваного мінімуму доходів громадян, крім тих, що повністю виконуються у момент вчинення, а також інші правочини, для яких закон встановлює письмову форму (ст. 208 ч. 1 п. 3–4).", "o": ["Між фізичними особами на суму понад 20 НМДГ (крім виконаних одразу) та інші за законом", "Між фізичними особами на суму понад 100 НМДГ (крім виконаних одразу) та інші за законом", "Між фізичними особами на суму понад 50 НМДГ, якщо вони не виконуються одразу", "Усі правочини між фізичними особами, незалежно від їх суми та моменту виконання"]}, {"id": 121, "q": "У якій формі вчиняється відмова від правочину?", "a": "Відмова від правочину вчиняється у такій самій формі, в якій було вчинено правочин (ст. 214 ч. 3). Особа, яка вчинила односторонній правочин, може відмовитися від нього, якщо закон не забороняє (ч. 1); сторони дво- чи багатостороннього правочину — за взаємною згодою або у випадках, передбачених законом (ч. 2). Наслідки відмови встановлюються законом або домовленістю сторін (ч. 4).", "o": ["У тій самій формі, що й правочин", "Завжди у письмовій формі", "Завжди у нотаріальній формі", "Усно, незалежно від форми правочину"]}, {"id": 122, "q": "Правочини щодо розпорядження майном та інші правочини, що виходять за межі дрібних побутових, вчиняються особою, цивільна дієздатність якої обмежена, за згодою:", "a": "За згодою піклувальника (ст. 37 ч. 3).", "o": ["За згодою піклувальника", "За дозволом органу опіки", "За згодою батьків особи", "За рішенням суду"]}, {"id": 123, "q": "Презумпція правомірності правочину означає, що:", "a": "Правочин вважається правомірним, поки його недійсність прямо не встановлена законом або він не визнаний судом недійсним (ст. 204).", "o": ["Правомірний, доки недійсність не встановлена законом чи судом", "Недійсний, доки сторони не доведуть його правомірність у суді", "Правомірний лише за умови його нотаріального посвідчення", "Недійсний за відсутності його державної реєстрації в органі"]}, {"id": 124, "q": "Одностороннім правочином є:", "a": "Односторонній правочин — це дія однієї сторони (ст. 202 ч. 3): заповіт, довіреність, відмова від права власності, прийняття спадщини чи відмова від неї, публічна обіцянка винагороди, відкликання довіреності.", "o": ["Заповіт, довіреність, відмова від спадщини", "Купівля-продаж, оренда, позичка майна", "Дарування, міна, договір підряду", "Договір поруки, застави та іпотеки"]}, {"id": 125, "q": "Правочин, вчинений без дозволу органу опіки і піклування, може бути визнаний дійсним:", "a": "Правочин без дозволу органу опіки та піклування є нікчемним (ст. 224 ч. 1), але на вимогу заінтересованої особи може бути визнаний судом дійсним, якщо буде встановлено, що він відповідає інтересам особи, над якою встановлено опіку чи піклування (ст. 224 ч. 2). Примітка: з 2026 р. безоплатне набуття майна малолітньою чи неповнолітньою особою дозволу не потребує (ст. 31 ч. 4, ст. 32 ч. 2, ст. 71 ч. 3 — Закон № 4824-IX).", "o": ["Нікчемний; суд може визнати дійсним, якщо відповідає інтересам підопічного", "Оспорюваний; визнається недійсним лише за позовом органу опіки та піклування", "Дійсний, якщо орган опіки схвалить його пізніше без звернення до суду", "Нікчемний; жодних підстав визнати дійсним закон у цьому випадку не передбачає"]}, {"id": 126, "q": "Усно може вчинятися правочин:", "a": "Усно може вчинятися правочин, який повністю виконується сторонами у момент його вчинення, крім тих, що підлягають нотаріальному посвідченню та (або) державній реєстрації (ст. 206 ч. 1); також усно можна вчиняти інші правочини, для яких закон не вимагає письмової форми (ст. 206 ч. 2; ст. 208).", "o": ["Ті, що повністю виконуються у момент вчинення, крім нотаріальних та підлягаючих реєстрації", "Усі договори до 20 НМДГ, незалежно від моменту їх виконання та форми, за винятком нотаріальних", "Лише договори між фізичними особами, що виконуються за місцем проживання однієї зі сторін", "Усі договори купівлі-продажу майна, у тому числі нерухомого, якщо сторони згодні"]}, {"id": 127, "q": "Багатосторонній правочин – це:", "a": "Правочин, в якому беруть участь три або більше сторін (ст. 202 ч. 5).", "o": ["Три або більше сторін", "Дві сторони", "Одна сторона", "Дві сторони та третя особа"]}, {"id": 128, "q": "Чи може воля сторони до вчинення правочину виражатися її мовчанням?:", "a": "Так, але лише у випадках, прямо встановлених договором або актами цивільного законодавства (ст. 205 ч. 2).", "o": ["Так, у випадках, встановлених договором чи законом", "Ні, воля завжди має бути виражена словами чи письмово", "Так, у будь-якому випадку, якщо інша сторона не заперечує", "Так, але лише за рішенням суду на вимогу однієї сторони"]}, {"id": 129, "q": "Які правочини НЕ можуть вчинятись усно?", "a": "Не можуть вчинятися усно: правочини, що підлягають нотаріальному посвідченню та (або) державній реєстрації; правочини між юридичними особами; правочини між фізичною та юридичною особою (крім передбачених ст. 206); правочини між фізичними особами на суму понад двадцять НМДГ, якщо вони не виконуються одразу; інші, для яких закон встановлює письмову форму (ст. 206, 208).", "o": ["Підлягають нотаріальному посвідченню чи реєстрації; між юр. особами; понад 20 НМДГ між фізичними", "Купівля хліба в магазині; правочини до 20 НМДГ, що виконуються одразу; дрібні побутові", "Дрібні побутові; між фізичними особами до 20 НМДГ; що виконуються у момент вчинення", "Підлягають лише нотаріальному посвідченню; між фізичними особами понад 100 НМДГ; усі договори оренди"]}, {"id": 130, "q": "Договір – це:", "a": "Договір — домовленість двох або більше сторін, спрямована на встановлення, зміну або припинення цивільних прав та обов’язків (ст. 626 ч. 1).", "o": ["Домовленість двох або більше сторін щодо встановлення, зміни, припинення прав та обов’язків", "Одностороння дія особи, спрямована на набуття, зміну або припинення цивільних прав та обов’язків", "Письмова угода сторін, укладена в нотаріальній формі та зареєстрована в державному реєстрі", "Зобов’язання однієї особи сплатити гроші або передати майно іншій особі за вимогою"]}, {"id": 131, "q": "Тлумачення змісту правочину здійснюється:", "a": "Стороною (сторонами) правочину та судом (ст. 213 ч. 1). Суд тлумачить зміст правочину на вимогу сторони (сторін).", "o": ["Стороною (сторонами) та судом", "Лише нотаріусом, що посвідчив його", "Лише стороною, яка вчинила його", "Лише судом на вимогу сторін"]}, {"id": 132, "q": "За бажанням фізичної або юридичної особи нотаріально посвідченим може бути:", "a": "Будь-який правочин з її участю (ст. 209 ч. 4).", "o": ["Будь-який правочин з її участю", "Лише договір купівлі-продажу", "Лише письмові правочини", "Правочини понад 20 НМДГ"]}, {"id": 133, "q": "Що є місцем вчинення одностороннього правочину, якщо у правочині не вказано місце його вчинення?", "a": "Місцем вчинення одностороннього правочину є місце вираження волі сторони (ст. 211 ч. 1 п. 1); місце вчинення дво- або багатостороннього правочину визначається за правилами ст. 211 та ст. 647 про місце укладення договору. Це застосовується, якщо в правочині місце вчинення не вказане.", "o": ["Місце вираження волі сторони", "Місце проживання сторони", "Місце реєстрації юридичної особи", "Місце нотаріуса"]}, {"id": 134, "q": "Позначте відповідь, у якій правильно вказано слово, що пропущене у наведеному положенні: “Правочин, що обмежує можливість фізичної особи мати не заборонені законом цивільні права та обов’язки, є ____________”?", "a": "Нікчемним (ст. 27 ч. 1).", "o": ["Нікчемним", "Оспорюваним", "Фіктивним", "Удаваним"]}, {"id": 135, "q": "Якщо фізична особа у зв’язку з хворобою або фізичною вадою не може підписати правочин власноручно, то:", "a": "За її дорученням правочин може підписати інша особа. Її підпис має бути посвідчений нотаріусом або іншою посадовою особою з правом вчиняти нотаріальні дії із зазначенням причин, з яких текст не може бути підписаний власноручно (ст. 207 ч. 3). Підпис іншої особи на тексті правочину, що не вимагає нотаріального посвідчення, може засвідчити відповідна посадова особа за місцем роботи, навчання, проживання або лікування особи.", "o": ["Інша особа за її дорученням; підпис посвідчує нотаріус", "Лікар або свідок, чий підпис не потребує посвідчення", "Ніхто, правочин у такому разі вважається недійсним", "Представник за довіреністю без посвідчення підпису"]}, {"id": 136, "q": "Особа, яка вчиняє правочин, повинна:", "a": "Мати необхідний обсяг цивільної дієздатності (ст. 203 ч. 2). Також її волевиявлення має бути вільним і відповідати внутрішній волі (ч. 3).", "o": ["Мати необхідний обсяг цивільної дієздатності", "Бути повнолітньою та мати вищу юридичну освіту", "Бути зареєстрованою за місцем вчинення правочину", "Мати майно на суму понад 20 НМДГ у власності"]}, {"id": 137, "q": "Правочин вважається таким, що вчинений у письмовій формі, якщо:", "a": "Якщо його зміст зафіксований в одному або кількох документах, у листах чи телеграмах, якими обмінялися сторони, і він підписаний особою (особами), яка його вчиняє (ст. 207 ч. 1). Правочин також вважається письмовим, якщо воля сторін виражена за допомогою телетайпного, електронного чи іншого технічного засобу зв’язку (ч. 2).", "o": ["Зміст зафіксований у документах, листах, телеграмах і підписаний особою", "Достатньо усної домовленості сторін у присутності двох свідків", "Він посвідчений нотаріусом і зареєстрований в державному реєстрі", "Він складений на бланку установи й скріплений печаткою сторони"]}, {"id": 138, "q": "Правочин вважається таким, що вчинений у письмовій формі, якщо:", "a": "Якщо його зміст зафіксований в одному або кількох документах, у листах чи телеграмах, якими обмінялися сторони, і він підписаний особою (особами), яка його вчиняє (ст. 207 ч. 1). Правочин також вважається письмовим, якщо воля сторін виражена за допомогою телетайпного, електронного чи іншого технічного засобу зв’язку (ч. 2).", "o": ["Зміст зафіксований у документах, листах, телеграмах і підписаний особою", "Достатньо усної домовленості сторін у присутності двох свідків", "Він посвідчений нотаріусом і зареєстрований в державному реєстрі", "Він складений на бланку установи й скріплений печаткою сторони"]}, {"id": 139, "q": "Нотаріальне посвідчення правочину може здійснюватися:", "a": "Нотаріусом або іншою посадовою особою, яка має право на вчинення такої нотаріальної дії, шляхом вчинення посвідчувального напису (ст. 209 ч. 2). Обов’язкове — у випадках, встановлених законом або домовленістю сторін (ч. 1); за бажанням особи — будь-який правочин (ч. 4).", "o": ["Нотаріусом або іншою посадовою особою через посвідчувальний напис", "Лише нотаріусом, що має право на вчинення нотаріальних дій", "Державним реєстратором у порядку реєстрації прав на майно", "Судом під час розгляду справи про визнання правочину дійсним"]}, {"id": 140, "q": "Виберіть з переліку односторонні правочини:", "a": "Заповіт, довіреність, прийняття спадщини, відмова від спадщини, відмова від права власності, публічна обіцянка винагороди, відкликання довіреності. Двосторонні й багатосторонні — це договори.", "o": ["Заповіт, довіреність, прийняття спадщини, відмова від права власності", "Купівля-продаж, оренда, позика, дарування між фізичними особами", "Дарування, міна, підряд, договір зберігання майна на складі", "Договір поруки, застави, іпотеки та до
